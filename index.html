<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>OVERDUEL</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
}

body{
  font-family:Arial,sans-serif;
}

button{
  font:inherit;
  touch-action:none;
  -webkit-appearance:none;
}

.screen{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

/* ================= START ================= */

#start{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at center,#fff09b 0,#f0ce69 55%,#b77c2d 100%);
}

.logo{
  font-size:clamp(55px,10vw,120px);
  font-weight:1000;
  color:#ffdf27;
  -webkit-text-stroke:5px #241a0d;
  text-shadow:0 8px 0 #866318;
}

.startBtn{
  margin-top:35px;
  padding:16px 65px;
  border:5px solid #2a1c0b;
  border-radius:18px;
  background:linear-gradient(#fff56c,#eebc00);
  box-shadow:0 7px 0 #76540a;
  font-size:30px;
  font-weight:1000;
}

/* ================= PICK ================= */

#pick{
  display:none;
  padding:18px;
  background:
    radial-gradient(circle,#fff09b,#dfb651);
}

.pickTitle{
  text-align:center;
  color:#fff;
  font-size:clamp(30px,5vw,55px);
  font-weight:1000;
  -webkit-text-stroke:3px #281c0c;
}

.pickInfo{
  display:flex;
  justify-content:space-between;
  padding:0 8%;
  font-size:clamp(17px,2.5vw,27px);
  font-weight:1000;
}

.p1name{color:#237cff}
.p2name{color:#ef3047}

.cards{
  height:65%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:25px;
}

.card{
  width:27%;
  height:90%;
  max-width:300px;
  border:5px solid #30200d;
  border-radius:22px;
  background:#f5d36b;
  box-shadow:0 8px 0 #78551b;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:10px;
}

.card.selected1{
  outline:6px solid #2686ff;
}

.card.selected2{
  outline:6px solid #ef3349;
}

.card.selected1.selected2{
  outline:6px solid #9e45ff;
}

.preview{
  width:75%;
  height:65%;
}

.cardName{
  font-size:clamp(18px,3vw,30px);
  font-weight:1000;
}

.cardDesc{
  margin-top:5px;
  opacity:.65;
}

.pickBtn{
  display:block;
  margin:auto;
  padding:13px 50px;
  border:4px solid #2b1c0c;
  border-radius:15px;
  background:#ffdf25;
  font-size:23px;
  font-weight:1000;
}

/* ================= GAME ================= */

#game{
  display:none;
  background:#f6d36c;
}

#canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

/* stone borders */

.stone{
  position:absolute;
  left:0;
  width:100%;
  height:11%;
  z-index:5;
  pointer-events:none;
  background:
    repeating-linear-gradient(
      90deg,
      #f7d97b 0 80px,
      #332515 80px 84px,
      #e5bd60 84px 155px,
      #382719 155px 159px
    );
}

.stone.top{
  top:0;
  border-bottom:5px solid #17120d;
}

.stone.bottom{
  bottom:0;
  border-top:5px solid #17120d;
}

/* HUD */

#hud{
  position:absolute;
  z-index:10;
  top:1.3%;
  left:50%;
  transform:translateX(-50%);
  width:min(56%,780px);
  min-width:430px;
  height:8%;
  display:flex;
  align-items:center;
}

.hpSide{
  flex:1;
}

.hpNumber{
  height:21px;
  padding:1px 7px;
  color:white;
  background:#ed2b25;
  border:2px solid #24170c;
  font-size:13px;
  font-weight:1000;
}

.hpBar{
  height:14px;
  background:#292722;
  border:3px solid #211a12;
}

.hpFill{
  width:100%;
  height:100%;
  background:#ffe020;
}

.ultBar{
  margin-top:3px;
  height:7px;
  background:#292722;
  border:2px solid #211a12;
}

.ultFill{
  width:0%;
  height:100%;
  background:#ffd21a;
}

#timer{
  flex:none;
  width:58px;
  height:58px;
  margin:0 8px;
  border:5px solid #292319;
  border-radius:50%;
  background:#4b4942;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:21px;
  font-weight:1000;
}

#title{
  position:absolute;
  z-index:10;
  right:10%;
  top:2%;
  color:#ffdf30;
  -webkit-text-stroke:3px #271b0b;
  font-size:clamp(20px,3vw,38px);
  font-weight:1000;
}

#menu{
  position:absolute;
  z-index:20;
  top:1.5%;
  right:2%;
  width:58px;
  height:58px;
  border:4px solid #2d261d;
  border-radius:12px;
  background:#a9a9a9;
  font-size:28px;
}

/* ammo */

.ammo{
  position:absolute;
  z-index:25;
  bottom:15.5%;
  width:110px;
  height:39px;
  border:3px solid white;
  border-radius:12px;
  background:#242424;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:1000;
}

#ammo1{left:2%}
#ammo2{right:2%}

/* buttons */

.controls{
  position:absolute;
  z-index:30;
  bottom:1.5%;
  display:flex;
  gap:7px;
}

#controls1{left:2%}
#controls2{right:2%}

.action{
  width:76px;
  height:78px;
  border:4px solid #282018;
  border-radius:14px;
  box-shadow:
    inset 0 0 0 3px #ffffffaa,
    0 5px 0 #5d4324;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-weight:1000;
}

.action:active{
  transform:translateY(4px);
}

.icon{
  font-size:28px;
  height:31px;
}

.label{
  font-size:12px;
}

.normal{
  background:linear-gradient(#fff,#c5c8cb);
}

.skill1{
  background:linear-gradient(#63ff7d,#0eab42);
}

.skill2{
  background:linear-gradient(#63cbff,#147ed2);
}

.ult{
  background:linear-gradient(#fff44d,#ffc300);
}

.disabled{
  opacity:.38;
}

.ready{
  animation:glow .7s infinite alternate;
}

@keyframes glow{
  from{filter:brightness(1)}
  to{filter:brightness(1.35)}
}

#centerText{
  position:absolute;
  z-index:50;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%);
  color:white;
  font-size:clamp(28px,5vw,65px);
  font-weight:1000;
  text-align:center;
  -webkit-text-stroke:4px #24170c;
  pointer-events:none;
}

/* ================= RESULT ================= */

#resultScreen{
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:
    radial-gradient(circle,#fff09b,#d7a947);
}

#resultTitle{
  font-size:clamp(50px,9vw,100px);
  font-weight:1000;
  color:#ffdf2b;
  -webkit-text-stroke:5px #24180c;
}

#resultSub{
  font-size:25px;
  font-weight:bold;
  margin:20px;
}

.restart{
  padding:15px 55px;
  border:4px solid #291b0b;
  border-radius:15px;
  background:#ffdf2b;
  font-size:25px;
  font-weight:1000;
}

/* small screen */

@media(max-height:620px){

  .action{
    width:68px;
    height:68px;
  }

  .ammo{
    bottom:16%;
  }

  #hud{
    min-width:380px;
  }
}
</style>
</head>

<body>

<div id="start" class="screen">

  <div class="logo">OVERDUEL</div>

  <button class="startBtn" id="startBtn">
    게임 시작
  </button>

</div>


<div id="pick" class="screen">

  <div class="pickTitle">
    영웅 선택
  </div>

  <div class="pickInfo">
    <div class="p1name">
      P1 : <span id="p1name">선택 안 함</span>
    </div>

    <div class="p2name">
      P2 : <span id="p2name">선택 안 함</span>
    </div>
  </div>

  <div class="cards">

    <button class="card" data-hero="lucio">

      <canvas class="preview" data-type="lucio"></canvas>

      <div class="cardName">루시우</div>
      <div class="cardDesc">음파 / 지원</div>

    </button>


    <button class="card" data-hero="bastion">

      <canvas class="preview" data-type="bastion"></canvas>

      <div class="cardName">바스티온</div>
      <div class="cardDesc">강습 / 포격</div>

    </button>


    <button class="card" data-hero="dva">

      <canvas class="preview" data-type="dva"></canvas>

      <div class="cardName">D.Va</div>
      <div class="cardDesc">메카 / 방어</div>

    </button>

  </div>

  <button class="pickBtn" id="pickBtn">
    전투 시작
  </button>

</div>


<div id="game" class="screen">

  <canvas id="canvas"></canvas>

  <div class="stone top"></div>
  <div class="stone bottom"></div>


  <div id="hud">

    <div class="hpSide">

      <div class="hpNumber" id="hp1">100</div>

      <div class="hpBar">
        <div class="hpFill" id="hpFill1"></div>
      </div>

      <div class="ultBar">
        <div class="ultFill" id="ultFill1"></div>
      </div>

    </div>


    <div id="timer">
      180
    </div>


    <div class="hpSide">

      <div class="hpNumber" id="hp2">
        100
      </div>

      <div class="hpBar">
        <div class="hpFill" id="hpFill2"></div>
      </div>

      <div class="ultBar">
        <div class="ultFill" id="ultFill2"></div>
      </div>

    </div>

  </div>


  <div id="title">
    OVERDUEL
  </div>

  <button id="menu">
    ☰
  </button>


  <div class="ammo" id="ammo1">
    ● 18 / 18
  </div>

  <div class="ammo" id="ammo2">
    ● 18 / 18
  </div>


  <!-- P1 -->

  <div class="controls" id="controls1">

    <button class="action normal"
            data-player="1"
            data-action="normal">

      <div class="icon">➤</div>
      <div class="label">평타</div>

    </button>

    <button class="action skill1"
            data-player="1"
            data-action="skill1">

      <div class="icon">◉</div>
      <div class="label">스킬 1</div>

    </button>

    <button class="action skill2"
            data-player="1"
            data-action="skill2">

      <div class="icon">◆</div>
      <div class="label">스킬 2</div>

    </button>

    <button class="action ult"
            data-player="1"
            data-action="ult">

      <div class="icon">★</div>
      <div class="label">궁극기</div>

    </button>

  </div>


  <!-- P2 -->

  <div class="controls" id="controls2">

    <button class="action normal"
            data-player="2"
            data-action="normal">

      <div class="icon">➤</div>
      <div class="label">평타</div>

    </button>

    <button class="action skill1"
            data-player="2"
            data-action="skill1">

      <div class="icon">◉</div>
      <div class="label">스킬 1</div>

    </button>

    <button class="action skill2"
            data-player="2"
            data-action="skill2">

      <div class="icon">◆</div>
      <div class="label">스킬 2</div>

    </button>

    <button class="action ult"
            data-player="2"
            data-action="ult">

      <div class="icon">★</div>
      <div class="label">궁극기</div>

    </button>

  </div>


  <div id="centerText"></div>

</div>


<div id="resultScreen" class="screen">

  <div id="resultTitle">
    P1 WIN
  </div>

  <div id="resultSub">
    전투 종료
  </div>

  <button class="restart" id="restart">
    다시하기
  </button>

</div>


<script>

/* =========================================================
   기본 설정
   ========================================================= */

const start=document.getElementById("start");
const pick=document.getElementById("pick");
const game=document.getElementById("game");
const resultScreen=document.getElementById("resultScreen");

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=1280;
let H=720;

let animationId=0;

let running=false;

let lastTime=0;
let secondTimer=0;

let timeLeft=180;

let players=[];

let bullets=[];
let effects=[];


/* =========================================================
   캔버스 크기
   ========================================================= */

function resize(){

  const rect=canvas.getBoundingClientRect();

  const dpr=Math.min(
    window.devicePixelRatio||1,
    2
  );

  canvas.width=Math.max(
    1,
    Math.floor(rect.width*dpr)
  );

  canvas.height=Math.max(
    1,
    Math.floor(rect.height*dpr)
  );

  W=rect.width;
  H=rect.height;

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resize
);


/* =========================================================
   영웅
   ========================================================= */

const HERO={

  lucio:{
    name:"루시우",
    hp:100,
    ammo:18,
    damage:7,
    speed:680,
    fireDelay:210,
    reload:850,
    s1:6000,
    s2:3200,
    color:"#40ef70"
  },

  bastion:{
    name:"바스티온",
    hp:115,
    ammo:24,
    damage:8,
    speed:760,
    fireDelay:155,
    reload:1000,
    s1:5000,
    s2:4000,
    color:"#6eaa79"
  },

  dva:{
    name:"D.Va",
    hp:105,
    ammo:18,
    damage:5,
    speed:650,
    fireDelay:190,
    reload:900,
    s1:5000,
    s2:4200,
    color:"#ff61c9"
  }

};


let selected1="lucio";
let selected2="dva";

let selecting=1;


/* =========================================================
   선택창
   ========================================================= */

document
.querySelectorAll(".card")
.forEach(card=>{

  card.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      const hero=card.dataset.hero;

      if(selecting===1){

        selected1=hero;

        document
        .getElementById("p1name")
        .textContent=HERO[hero].name;

      }else{

        selected2=hero;

        document
        .getElementById("p2name")
        .textContent=HERO[hero].name;

      }

      document
      .querySelectorAll(".card")
      .forEach(c=>{
        c.classList.remove(
          "selected1",
          "selected2"
        );
      });

      document
      .querySelectorAll(
        `[data-hero="${selected1}"]`
      )
      .forEach(c=>{
        c.classList.add("selected1");
      });

      document
      .querySelectorAll(
        `[data-hero="${selected2}"]`
      )
      .forEach(c=>{
        c.classList.add("selected2");
      });

      selecting=selecting===1?2:1;

    },
    {passive:false}
  );

});


document
.getElementById("startBtn")
.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    start.style.display="none";
    pick.style.display="block";

    setTimeout(
      drawPreviews,
      30
    );

  },
  {passive:false}
);


document
.getElementById("pickBtn")
.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    pick.style.display="none";
    game.style.display="block";

    resize();

    startGame();

  },
  {passive:false}
);


/* =========================================================
   플레이어 생성
   ========================================================= */

function makePlayer(id,heroName){

  const h=HERO[heroName];

  return{

    id:id,
    hero:heroName,

    x:id===1 ? W*.20 : W*.80,
    y:id===1 ? H*.58 : H*.42,

    vy:id===1 ? 48:-48,

    hp:h.hp,
    maxHp:h.hp,

    ult:0,

    ammo:h.ammo,
    maxAmmo:h.ammo,

    reloading:false,

    lastShot:0,

    skill1At:0,
    skill2At:0,

    blocking:false,

    boosted:0,

    heavy:false,

    dead:false

  };
}


/* =========================================================
   게임 시작
   ========================================================= */

function startGame(){

  resize();

  players=[
    makePlayer(1,selected1),
    makePlayer(2,selected2)
  ];

  bullets=[];
  effects=[];

  timeLeft=180;
  secondTimer=0;

  running=true;

  lastTime=performance.now();

  cancelAnimationFrame(animationId);

  updateUI();

  animationId=
    requestAnimationFrame(loop);
}


/* =========================================================
   게임 루프
   ========================================================= */

function loop(now){

  if(!running)return;

  const dt=Math.min(
    (now-lastTime)/1000,
    .04
  );

  lastTime=now;

  secondTimer+=dt;

  if(secondTimer>=1){

    secondTimer-=1;

    timeLeft--;

    if(timeLeft<=0){

      finishByTime();

      return;

    }
  }

  updatePlayers(dt);
  updateBullets(dt);
  updateEffects(dt);

  draw();

  updateUI();

  animationId=
    requestAnimationFrame(loop);
}


/* =========================================================
   자동 이동
   ========================================================= */

function updatePlayers(dt){

  const top=H*.20;
  const bottom=H*.79;

  players.forEach(p=>{

    if(p.dead)return;

    let speed=1;

    if(p.boosted>0){

      speed=2.3;
      p.boosted-=dt;

    }

    p.y+=p.vy*speed*dt;

    if(p.y<=top){

      p.y=top;
      p.vy=Math.abs(p.vy);

    }

    if(p.y>=bottom){

      p.y=bottom;
      p.vy=-Math.abs(p.vy);

    }

    if(p.boosted<0)
      p.boosted=0;

  });
}


/* =========================================================
   평타
   ========================================================= */

function normalAttack(id){

  if(!running)return;

  const p=players[id-1];

  if(p.dead)return;

  if(p.reloading)return;

  const h=HERO[p.hero];

  const now=performance.now();

  if(now-p.lastShot<h.fireDelay)
    return;

  if(p.ammo<=0){

    reload(id);
    return;

  }

  p.lastShot=now;
  p.ammo--;

  const target=
    players[id===1?1:0];

  const baseAngle=Math.atan2(
    target.y-p.y,
    target.x-p.x
  );

  let count=1;
  let spread=0;
  let damage=h.damage;

  if(p.hero==="lucio"){

    count=3;
    spread=.09;

  }

  if(p.hero==="dva"){

    count=4;
    spread=.13;

  }

  if(p.hero==="bastion" && p.heavy){

    count=2;
    damage=12;
    spread=.05;

  }

  for(let i=0;i<count;i++){

    const angle=
      baseAngle+
      (Math.random()-.5)*spread;

    bullets.push({

      owner:id,

      x:p.x+(id===1?28:-28),
      y:p.y,

      vx:Math.cos(angle)*h.speed,
      vy:Math.sin(angle)*h.speed,

      damage:damage,

      radius:p.hero==="lucio"?8:6,

      life:2,

      color:h.color,

      kind:"normal"

    });

  }

  createBurst(
    p.x+(id===1?28:-28),
    p.y,
    h.color,
    16
  );

  if(p.ammo<=0)
    reload(id);
}


/* =========================================================
   재장전
   ========================================================= */

function reload(id){

  const p=players[id-1];

  if(p.reloading)return;

  if(p.ammo>=p.maxAmmo)return;

  p.reloading=true;

  setTimeout(()=>{

    if(!p.dead){

      p.ammo=p.maxAmmo;
      p.reloading=false;

    }

  },HERO[p.hero].reload);
}


/* =========================================================
   스킬 1
   ========================================================= */

function skill1(id){

  if(!running)return;

  const p=players[id-1];

  if(p.dead)return;

  const h=HERO[p.hero];

  const now=performance.now();

  if(now<p.skill1At)return;

  p.skill1At=
    now+h.s1;


  if(p.hero==="lucio"){

    p.boosted=2.3;

    ring(
      p.x,
      p.y,
      "#42ff76",
      80
    );

    text(
      p.x,
      p.y-45,
      "SPEED!"
    );

  }


  else if(p.hero==="bastion"){

    p.heavy=!p.heavy;

    ring(
      p.x,
      p.y,
      "#8cff92",
      65
    );

    text(
      p.x,
      p.y-45,
      p.heavy?"강습":"수색"
    );

  }


  else if(p.hero==="dva"){

    const enemy=
      players[id===1?1:0];

    const dir=
      enemy.x>p.x?1:-1;

    p.x+=dir*100;

    p.x=Math.max(
      W*.13,
      Math.min(
        W*.87,
        p.x
      )
    );

    p.boosted=.8;

    ring(
      p.x,
      p.y,
      "#ff66dc",
      75
    );

  }

}


/* =========================================================
   스킬 2
   ========================================================= */

function skill2(id){

  if(!running)return;

  const p=players[id-1];

  if(p.dead)return;

  const h=HERO[p.hero];

  const now=performance.now();

  if(now<p.skill2At)return;

  p.skill2At=
    now+h.s2;

  const enemy=
    players[id===1?1:0];


  /* 루시우 - 원거리 파동 */

  if(p.hero==="lucio"){

    fireSpecial(
      id,
      enemy,
      19,
      570,
      25,
      "#5cff8a",
      "wave"
    );

  }


  /* 바스티온 - 큰 에너지 탄 */

  else if(p.hero==="bastion"){

    fireSpecial(
      id,
      enemy,
      28,
      470,
      17,
      "#ffb638",
      "shell"
    );

  }


  /* D.Va - 방어 */

  else if(p.hero==="dva"){

    p.blocking=true;

    ring(
      p.x,
      p.y,
      "#56cfff",
      70
    );

    setTimeout(()=>{

      p.blocking=false;

    },1300);

/* =========================================================
   특수 탄환
   ========================================================= */

function fireSpecial(
  id,
  enemy,
  damage,
  speed,
  radius,
  color,
  kind
){

  const p=players[id-1];

  const angle=Math.atan2(
    enemy.y-p.y,
    enemy.x-p.x
  );

  bullets.push({

    owner:id,

    x:p.x+(id===1?28:-28),
    y:p.y,

    vx:Math.cos(angle)*speed,
    vy:Math.sin(angle)*speed,

    damage:damage,

    radius:radius,

    life:2,

    color:color,

    kind:kind

  });

  ring(
    p.x,
    p.y,
    color,
    40
  );
}


/* =========================================================
   궁극기
   ========================================================= */

function ultimate(id){

  if(!running)return;

  const p=players[id-1];

  if(p.dead)return;

  if(p.ult<100)return;

  p.ult=0;

  const enemy=
    players[id===1?1:0];


  /* 루시우 */

  if(p.hero==="lucio"){

    p.hp=Math.min(
      p.maxHp+40,
      p.hp+40
    );

    ring(
      p.x,
      p.y,
      "#48ff7b",
      130
    );

    text(
      p.x,
      p.y-70,
      "소리 방벽!"
    );

  }


  /* 바스티온 */

  else if(p.hero==="bastion"){

    text(
      p.x,
      p.y-70,
      "포격!"
    );

    for(let i=0;i<3;i++){

      const tx=
        enemy.x+
        (Math.random()-.5)*110;

      const ty=
        enemy.y+
        (Math.random()-.5)*130;

      setTimeout(()=>{

        if(!running)return;

        explosion(
          tx,
          ty,
          "#ff9f3d",
          75
        );

        const distance=
          Math.hypot(
            enemy.x-tx,
            enemy.y-ty
          );

        if(distance<100){

          damage(
            enemy.id,
            20,
            id,
            false
          );

        }

      },i*260);
    }

  }


  /* D.Va */

  else if(p.hero==="dva"){

    const tx=enemy.x;
    const ty=enemy.y;

    text(
      p.x,
      p.y-70,
      "자폭!"
    );

    ring(
      p.x,
      p.y,
      "#ff53da",
      100
    );

    setTimeout(()=>{

      if(!running)return;

      explosion(
        tx,
        ty,
        "#ff50dc",
        125
      );

      const d=
        Math.hypot(
          enemy.x-tx,
          enemy.y-ty
        );

      if(d<170){

        damage(
          enemy.id,
          42,
          id,
          false
        );

      }

    },600);

  }

}


/* =========================================================
   탄환 업데이트
   ========================================================= */

function updateBullets(dt){

  for(
    let i=bullets.length-1;
    i>=0;
    i--
  ){

    const b=bullets[i];

    b.x+=b.vx*dt;
    b.y+=b.vy*dt;

    b.life-=dt;

    const target=
      players[b.owner===1?1:0];

    if(
      !target.dead &&
      Math.hypot(
        b.x-target.x,
        b.y-target.y
      )<
      b.radius+28
    ){

      damage(
        target.id,
        b.damage,
        b.owner,
        true
      );

      if(b.kind==="wave"){

        target.vy+=
          target.y>b.y?-30:30;

      }

      explosion(
        b.x,
        b.y,
        b.color,
        b.kind==="shell"?50:24
      );

      bullets.splice(i,1);

      continue;

    }

    if(
      b.life<=0 ||
      b.x<-150 ||
      b.x>W+150 ||
      b.y<-150 ||
      b.y>H+150
    ){

      bullets.splice(i,1);

    }

  }
}


/* =========================================================
   데미지
   ========================================================= */

function damage(
  targetId,
  amount,
  attackerId,
  chargeUlt
){

  const target=
    players[targetId-1];

  if(target.dead)return;


  if(target.blocking){

    ring(
      target.x,
      target.y,
      "#59cfff",
      40
    );

    text(
      target.x,
      target.y-38,
      "BLOCK!"
    );

    return;

  }


  target.hp-=amount;


  if(chargeUlt){

    const attacker=
      players[attackerId-1];

    attacker.ult=
      Math.min(
        100,
        attacker.ult+
        amount*.9
      );

  }


  if(target.hp<=0){

    target.hp=0;
    target.dead=true;

    finish(
      target.id===1?2:1
    );

  }
}

/* =========================================================
   아레나
   ========================================================= */

function drawArena(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  const gradient=
    ctx.createLinearGradient(
      0,0,0,H
    );

  gradient.addColorStop(
    0,
    "#ffed9a"
  );

  gradient.addColorStop(
    .5,
    "#f8db78"
  );

  gradient.addColorStop(
    1,
    "#e9bd59"
  );

  ctx.fillStyle=gradient;

  ctx.fillRect(
    0,0,W,H
  );


  /* 내부 전투장 */

  ctx.fillStyle="#ffe38a";

  ctx.fillRect(
    W*.105,
    H*.105,
    W*.79,
    H*.79
  );


  /* 모래 점 */

  ctx.fillStyle="#cda74f";

  for(let i=0;i<90;i++){

    const x=
      W*.12+
      ((i*83)%1000)/1000*
      W*.75;

    const y=
      H*.13+
      ((i*47)%1000)/1000*
      H*.73;

    ctx.globalAlpha=.25;

    ctx.fillRect(
      x,y,
      3,3
    );

  }

  ctx.globalAlpha=1;


  /* 벽 */

  ctx.fillStyle="#c47e35";

  ctx.fillRect(
    0,
    H*.1,
    W*.105,
    H*.8
  );

  ctx.fillRect(
    W*.895,
    H*.1,
    W*.105,
    H*.8
  );


  ctx.strokeStyle="#332215";
  ctx.lineWidth=6;

  ctx.strokeRect(
    W*.105,
    H*.1,
    W*.79,
    H*.8
  );


  /* 중앙 장식 */

  ctx.strokeStyle="#dfbb62";
  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(
    W*.13,
    H*.5
  );

  ctx.lineTo(
    W*.87,
    H*.5
  );

  ctx.stroke();

}


/* =========================================================
   캐릭터
   ========================================================= */

function drawPlayers(){

  players.forEach(p=>{

    if(p.dead)return;

    ctx.save();

    ctx.translate(
      p.x,
      p.y
    );

    if(p.id===2)
      ctx.scale(-1,1);


    /* 그림자 */

    ctx.fillStyle="#856b3c55";

    ctx.beginPath();

    ctx.ellipse(
      0,
      29,
      31,
      9,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();


    if(p.hero==="lucio")
      drawLucio(ctx);

    if(p.hero==="bastion")
      drawBastion(ctx);

    if(p.hero==="dva")
      drawDva(ctx);


    if(p.blocking){

      ctx.strokeStyle="#5bd4ff";
      ctx.lineWidth=5;

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        40,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }

    ctx.restore();


    ctx.font="bold 15px Arial";
    ctx.textAlign="center";

    ctx.fillStyle=
      p.id===1?
      "#1878ff":
      "#ef3048";

    ctx.fillText(
      "P"+p.id,
      p.x,
      p.y-48
    );

  });

}

/* =========================================================
   탄환
   ========================================================= */

function drawBullets(){

  bullets.forEach(b=>{

    ctx.save();

    ctx.shadowBlur=16;
    ctx.shadowColor=b.color;

    ctx.fillStyle=b.color;


    if(b.kind==="wave"){

      ctx.beginPath();

      ctx.arc(
        b.x,
        b.y,
        b.radius,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.strokeStyle="#fff";
      ctx.lineWidth=3;

      ctx.beginPath();

      ctx.arc(
        b.x,
        b.y,
        b.radius+6,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }

    else if(b.kind==="shell"){

      ctx.beginPath();

      ctx.arc(
        b.x,
        b.y,
        b.radius,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.fillStyle="#fff2a0";

      ctx.beginPath();

      ctx.arc(
        b.x-4,
        b.y-4,
        4,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

    else{

      ctx.beginPath();

      ctx.arc(
        b.x,
        b.y,
        b.radius,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

    ctx.restore();

  });

}


/* =========================================================
   효과
   ========================================================= */

function ring(
  x,
  y,
  color,
  size
){

  effects.push({

    type:"ring",

    x:x,
    y:y,

    color:color,

    size:size,

    life:.45,
    max:.45

  });

}


function explosion(
  x,
  y,
  color,
  size
){

  effects.push({

    type:"explosion",

    x:x,
    y:y,

    color:color,

    size:size,

    life:.5,
    max:.5

  });

}


function createBurst(
  x,
  y,
  color,
  size
){

  effects.push({

    type:"burst",

    x:x,
    y:y,

    color:color,

    size:size,

    life:.25,
    max:.25

  });

}


function text(
  x,
  y,
  value
){

  effects.push({

    type:"text",

    x:x,
    y:y,

    value:value,

    life:.8,
    max:.8

  });

}


function updateEffects(dt){

  for(
    let i=effects.length-1;
    i>=0;
    i--
  ){

    const e=effects[i];

    e.life-=dt;

    if(e.type==="text")
      e.y-=25*dt;

    if(e.life<=0)
      effects.splice(i,1);

  }

}


function drawEffects(){

  effects.forEach(e=>{

    const alpha=
      Math.max(
        0,
        e.life/e.max
      );

    ctx.save();

    ctx.globalAlpha=alpha;


    if(e.type==="ring"){

      const progress=
        1-alpha;

      ctx.strokeStyle=e.color;
      ctx.lineWidth=6;

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        e.size*progress,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }


    else if(e.type==="explosion"){

      const progress=
        1-alpha;

      ctx.fillStyle=e.color;

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        e.size*(.25+progress),
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.fillStyle="#fff";

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        e.size*.3*(1-progress),
        0,
        Math.PI*2
      );

      ctx.fill();

    }


    else if(e.type==="burst"){

      ctx.fillStyle=e.color;

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        e.size*alpha,
        0,
        Math.PI*2
      );

      ctx.fill();

    }


    else if(e.type==="text"){

      ctx.font="bold 22px Arial";
      ctx.textAlign="center";

      ctx.lineWidth=5;
      ctx.strokeStyle="#25170c";
      ctx.fillStyle="#fff";

      ctx.strokeText(
        e.value,
        e.x,
        e.y
      );

      ctx.fillText(
        e.value,
        e.x,
        e.y
      );

    }

    ctx.restore();

  });

}


/* =========================================================
   UI
   ========================================================= */

function updateUI(){

  if(!players.length)return;

  players.forEach(p=>{

    const hp=
      document.getElementById(
        "hp"+p.id
      );

    const hpFill=
      document.getElementById(
        "hpFill"+p.id
      );

    const ultFill=
      document.getElementById(
        "ultFill"+p.id
      );

    const ammo=
      document.getElementById(
        "ammo"+p.id
      );


    hp.textContent=
      Math.ceil(
        Math.max(0,p.hp)
      );


    hpFill.style.width=
      Math.max(
        0,
        Math.min(
          100,
          p.hp/p.maxHp*100
        )
      )+"%";


    ultFill.style.width=
      Math.min(
        100,
        p.ult
      )+"%";


    ammo.textContent=
      p.reloading
      ?
      "↻ 재장전"
      :
      `● ${p.ammo} / ${p.maxAmmo}`;


    document
    .querySelectorAll(
      `.action[data-player="${p.id}"]`
    )
    .forEach(btn=>{

      btn.classList.remove(
        "disabled",
        "ready"
      );

      const action=
        btn.dataset.action;

      const now=
        performance.now();


      if(action==="skill1"){

        if(now<p.skill1At)
          btn.classList.add("disabled");

      }


      if(action==="skill2"){

        if(now<p.skill2At)
          btn.classList.add("disabled");

      }


      if(action==="ult"){

        if(p.ult>=100)
          btn.classList.add("ready");
        else
          btn.classList.add("disabled");

      }

    });

  });


  document.getElementById(
    "timer"
  ).textContent=
    String(
      Math.max(
        0,
        timeLeft
      )
    ).padStart(3,"0");

}

.forEach(btn=>{

  );

   ========================================================= */

function finish(winner){

  if(!running)return;

  running=false;

  cancelAnimationFrame(
    animationId
  );


  document.getElementById(
    "resultTitle"
  ).textContent=
    winner===1
    ?"P1 WIN"
    :"P2 WIN";


  document.getElementById(
    "resultSub"
  ).textContent=
    `P${winner} 승리`;


  setTimeout(()=>{

    game.style.display="none";
    resultScreen.style.display="flex";

  },500);

}


function finishByTime(){

  if(!running)return;

  if(players[0].hp===players[1].hp){

    running=false;

    document.getElementById(
      "resultTitle"
    ).textContent="DRAW";

    document.getElementById(
      "resultSub"
    ).textContent="시간 종료";

    resultScreen.style.display="flex";

    return;

  }

  finish(
    players[0].hp>
    players[1].hp
    ?1:2
  );

}

/* =========================================================
   선택창 미리보기
   ========================================================= */

function drawPreviews(){

  document
  .querySelectorAll(".preview")
  .forEach(canvas=>{

    const rect=
      canvas.getBoundingClientRect();

    if(
      rect.width<=0 ||
      rect.height<=0
    )return;

    const dpr=
      Math.min(
        window.devicePixelRatio||1,
        2
      );

    canvas.width=
      Math.floor(
        rect.width*dpr
      );

    canvas.height=
      Math.floor(
        rect.height*dpr
      );

    const c=
      canvas.getContext("2d");

    c.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );

    c.clearRect(
      0,
      0,
      rect.width,
      rect.height
    );

    c.save();

    c.translate(
      rect.width/2,
      rect.height/2
    );

    const type=
      canvas.dataset.type;

    if(type==="lucio")
      previewLucio(c);

    if(type==="bastion")
      previewBastion(c);

    if(type==="dva")
      previewDva(c);

    c.restore();

  });

}


function previewLucio(c){

  c.fillStyle="#39db6a";

  c.fillRect(
    -45,
    -5,
    90,

/* =========================================================
   Canvas 둥근 사각형
   ========================================================= */

function round(
  c,
  x,
  y,
  w,
  h,
  r
){

  c.beginPath();

  if(
    typeof c.roundRect==="function"
  ){

    c.roundRect(
      x,
      y,
      w,
      h,
      r
    );

    return;
  }

  /* roundRect 미지원 브라우저용 */

  const rr=Math.min(
    r,
    Math.abs(w)/2,
    Math.abs(h)/2
  );

  c.moveTo(
    x+rr,
    y
  );

  c.lineTo(
    x+w-rr,
    y
  );

  c.quadraticCurveTo(
    x+w,
    y,
    x+w,
    y+rr
  );

  c.lineTo(
    x+w,
    y+h-rr
  );

  c.quadraticCurveTo(
    x+w,
    y+h,
    x+w-rr,
    y+h
  );

  c.lineTo(
    x+rr,
    y+h
  );

  c.quadraticCurveTo(
    x,
    y+h,
    x,
    y+h-rr
  );

  c.lineTo(
    x,
    y+rr
  );

  c.quadraticCurveTo(
    x,
    y,
    x+rr,
    y
  );

  c.closePath();

}
