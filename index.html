<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>OVERDUEL</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#151515;
  font-family:Arial,system-ui,sans-serif;
}

button{
  font:inherit;
  border:0;
  outline:0;
  cursor:pointer;
}

#app{
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  max-width:1200px;
  max-height:760px;
  overflow:hidden;
  background:#d8b86b;
}

/* =========================
   ARENA
========================= */

#arena{
  position:absolute;
  left:0;
  right:0;
  top:0;
  bottom:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 18% 28%,#c9a55d 0 2px,transparent 3px),
    radial-gradient(circle at 74% 65%,#c3a05a 0 2px,transparent 3px),
    radial-gradient(circle at 44% 38%,#c5a45e 0 1px,transparent 2px),
    radial-gradient(circle at 82% 24%,#c6a45e 0 1px,transparent 2px),
    #dabb70;
}

#arena::before{
  content:"";
  position:absolute;
  inset:62px 0 0;
  background:
    radial-gradient(ellipse at center,#e1c77f22 0%,transparent 65%);
}

/* stone borders */
.wall{
  position:absolute;
  z-index:8;
  background:
    linear-gradient(135deg,#b87939 0 25%,#d39a50 25% 50%,#ad7135 50% 75%,#c68b46 75%);
  border:3px solid #815126;
}

.wall.top{
  top:0;
  left:0;
  right:0;
  height:66px;
}

.wall.bottom{
  bottom:0;
  left:0;
  right:0;
  height:67px;
}

.wall.left{
  top:62px;
  bottom:63px;
  left:0;
  width:25px;
}

.wall.right{
  top:62px;
  bottom:63px;
  right:0;
  width:25px;
}

.wall::after{
  content:"";
  position:absolute;
  inset:0;
  opacity:.35;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0 23px,
      #70431f 24px 27px,
      transparent 28px 47px
    );
}

/* =========================
   HUD
========================= */

#hud{
  position:absolute;
  z-index:30;
  top:7px;
  left:28px;
  right:28px;
  height:53px;
  display:flex;
  align-items:center;
  gap:10px;
}

.playerHUD{
  flex:1;
  height:47px;
  position:relative;
}

.playerHUD.right{
  transform:scaleX(-1);
}

.hpOuter{
  position:absolute;
  top:5px;
  left:0;
  right:0;
  height:20px;
  border:3px solid #49321e;
  background:#27231e;
  border-radius:5px;
  overflow:hidden;
}

.hp{
  height:100%;
  width:100%;
  background:linear-gradient(#ff6464,#d93636);
  transition:width .12s linear;
}

.playerHUD.right .hp{
  background:linear-gradient(#ff6464,#d93636);
}

.ultOuter{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:11px;
  border:2px solid #584222;
  background:#29241b;
  border-radius:4px;
  overflow:hidden;
}

.ult{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#f4bb25,#ffe878);
  transition:width .1s linear;
}

.hpText{
  position:absolute;
  top:5px;
  left:7px;
  z-index:2;
  font-size:13px;
  font-weight:900;
  color:#fff;
  text-shadow:1px 1px #542020;
}

.playerHUD.right .hpText{
  transform:scaleX(-1);
  left:auto;
  right:7px;
}

#timerBox{
  width:74px;
  height:45px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#252323;
  border:4px solid #826335;
  clip-path:polygon(
    16% 0,84% 0,
    100% 25%,100% 75%,
    84% 100%,16% 100%,
    0 75%,0 25%
  );
  color:white;
  font-size:25px;
  font-weight:900;
  text-shadow:2px 2px #000;
}

/* =========================
   MIDDLE RIVER
========================= */

#river{
  position:absolute;
  z-index:2;
  top:50%;
  left:25px;
  right:25px;
  height:7px;
  transform:translateY(-50%);
  background:#4ca7d8;
  box-shadow:
    0 2px #26769f,
    0 -1px #8bd2ee;
  opacity:.8;
}

/* =========================
   CHARACTERS
========================= */

.fighter{
  position:absolute;
  z-index:10;
  width:74px;
  height:88px;
  transform:translate(-50%,-50%);
  transition:filter .08s;
}

.shadow{
  position:absolute;
  left:50%;
  bottom:-4px;
  width:60px;
  height:13px;
  transform:translateX(-50%);
  background:#72532655;
  border-radius:50%;
}

.body{
  position:absolute;
  left:12px;
  top:22px;
  width:50px;
  height:48px;
  border:3px solid #202020;
  border-radius:14px 14px 10px 10px;
}

.head{
  position:absolute;
  z-index:4;
  left:9px;
  top:0;
  width:56px;
  height:40px;
  border:3px solid #202020;
  border-radius:18px 18px 12px 12px;
}

.visor{
  position:absolute;
  left:7px;
  top:9px;
  width:37px;
  height:13px;
  border:2px solid #111;
  border-radius:5px;
  background:#1a2427;
}

.eye{
  position:absolute;
  top:3px;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#fff;
}

.eye.a{left:9px}
.eye.b{right:9px}

.arm{
  position:absolute;
  top:29px;
  width:17px;
  height:29px;
  border:3px solid #202020;
  border-radius:9px;
}

.arm.left{left:-2px}
.arm.right{right:-2px}

.leg{
  position:absolute;
  top:62px;
  width:16px;
  height:23px;
  border:3px solid #202020;
  border-radius:7px;
}

.leg.left{left:18px}
.leg.right{right:18px}

/* Lucio */
.lucio .body{
  background:linear-gradient(135deg,#e9f3ed 0 35%,#42c76d 35% 75%,#1d7c4c 75%);
}

.lucio .head{
  background:#e7eee8;
}

.lucio .visor{
  background:#182427;
  box-shadow:inset 0 0 0 2px #49e381;
}

.lucio .arm,
.lucio .leg{
  background:#2da963;
}

.lucio .leg{
  transform:skew(-10deg);
}

/* Bastion */
.bastion .body{
  background:#697269;
  border-radius:8px;
}

.bastion .head{
  background:#7d877d;
  border-radius:8px;
}

.bastion .visor{
  background:#202522;
  width:29px;
  left:11px;
}

.bastion .arm,
.bastion .leg{
  background:#555e55;
  border-radius:5px;
}

/* D.Va */
.dva .body{
  background:linear-gradient(135deg,#edf4f6 0 42%,#ef78a8 42% 67%,#6e9ed4 67%);
}

.dva .head{
  background:#eef4f6;
}

.dva .visor{
  background:#26364a;
  box-shadow:inset 0 0 0 2px #ef78a8;
}

.dva .arm,
.dva .leg{
  background:#d9e7ef;
}

/* P tags */
.tag{
  position:absolute;
  z-index:20;
  left:50%;
  top:-26px;
  transform:translateX(-50%);
  padding:2px 7px;
  border-radius:4px;
  font-size:11px;
  font-weight:900;
  color:white;
  border:2px solid #222;
}

.p1 .tag{background:#3178d7}
.p2 .tag{background:#d74858}

/* =========================
   EFFECTS
========================= */

.aura{
  position:absolute;
  z-index:-1;
  width:170px;
  height:170px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:2px solid #46df83;
  background:radial-gradient(circle,#47e08318 0%,#47e0830b 45%,transparent 70%);
  box-shadow:0 0 18px #46df8355;
  pointer-events:none;
}

.aura.heal{
  border-color:#63e6a0;
  background:radial-gradient(circle,#63e6a020 0%,transparent 70%);
}

.aura.speed{
  border-color:#7df0d1;
  box-shadow:0 0 25px #7df0d155;
}

.projectile{
  position:absolute;
  z-index:7;
  width:18px;
  height:18px;
  border-radius:50%;
  pointer-events:none;
}

.projectile.normal{
  background:#f5f5f5;
  border:3px solid #555;
  box-shadow:0 0 8px #fff;
}

.projectile.lucio{
  width:25px;
  height:25px;
  background:transparent;
  border:4px solid #42e57e;
  box-shadow:0 0 13px #42e57e;
}

.projectile.skill{
  width:30px;
  height:30px;
  background:transparent;
  border:4px solid #52b8ff;
  box-shadow:0 0 15px #52b8ff;
}

.projectile.dva{
  background:#ed79a9;
  border:3px solid #fff;
  box-shadow:0 0 10px #ed79a9;
}

.hitEffect{
  position:absolute;
  z-index:25;
  width:35px;
  height:35px;
  border-radius:50%;
  border:4px solid #fff;
  animation:hit .22s ease-out forwards;
  pointer-events:none;
}

@keyframes hit{
  from{transform:scale(.3);opacity:1}
  to{transform:scale(1.7);opacity:0}
}

.explosion{
  position:absolute;
  z-index:25;
  width:100px;
  height:100px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,#fff 0 10%,#ffd43d 11% 32%,#ff7a30 33% 55%,transparent 56%);
  animation:boom .45s ease-out forwards;
}

@keyframes boom{
  from{transform:translate(-50%,-50%) scale(.25);opacity:1}
  to{transform:translate(-50%,-50%) scale(1.4);opacity:0}
}

.barrier{
  position:absolute;
  z-index:22;
  width:100px;
  height:100px;
  border-radius:50%;
  border:6px solid #71c8ff;
  box-shadow:0 0 25px #71c8ff;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

/* =========================
   BUTTON UI
========================= */

.controls{
  position:absolute;
  z-index:40;
  bottom:9px;
  display:flex;
  gap:8px;
  align-items:end;
}

.controls.left{left:34px}
.controls.right{
  right:34px;
  flex-direction:row-reverse;
}

.ammo{
  position:absolute;
  bottom:74px;
  width:84px;
  height:25px;
  background:#252525dd;
  border:2px solid #6b5738;
  border-radius:5px;
  color:#fff;
  font-size:12px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
}

.controls.left .ammo{left:0}
.controls.right .ammo{right:0}

.skillBtn{
  width:61px;
  height:61px;
  border-radius:13px;
  border:3px solid #493e2e;
  box-shadow:
    inset 0 3px 0 #ffffff88,
    0 3px 0 #372d20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  font-weight:900;
  color:#222;
}

.skillBtn:active{
  transform:translateY(3px);
  box-shadow:inset 0 2px 0 #ffffff55;
}

.skillBtn .icon{
  font-size:22px;
  line-height:20px;
}

.skillBtn .label{
  font-size:10px;
}

.basic{background:#eeeeeb}
.skill1{background:#55bd68}
.skill2{background:#4d9bd7}
.ultimate{background:#e8c34c}

.cooldown{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:#0009;
  color:#fff;
  font-size:19px;
}

.skillBtn.disabled{
  filter:grayscale(.7);
  opacity:.6;
}

/* =========================
   SCREENS
========================= */

.screen{
  position:absolute;
  z-index:100;
  inset:0;
  background:#1c1b19ee;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.screen.hidden{
  display:none;
}

.logo{
  font-size:50px;
  font-weight:1000;
  color:#f0c74f;
  text-shadow:
    4px 4px #5c351d,
    -2px -2px #fff3a4;
  letter-spacing:3px;
}

.subtitle{
  margin-top:7px;
  color:#eee;
  font-weight:700;
}

.bigButton{
  margin-top:35px;
  min-width:210px;
  padding:15px 25px;
  border-radius:10px;
  background:#e7bd48;
  border:4px solid #63451f;
  color:#382515;
  font-size:20px;
  font-weight:1000;
  box-shadow:0 5px #352516;
}

.bigButton:active{
  transform:translateY(4px);
  box-shadow:0 1px #352516;
}

/* hero select */

.selectTitle{
  font-size:34px;
  font-weight:1000;
  color:#fff;
  margin-bottom:25px;
  text-shadow:2px 2px #000;
}

.heroChoices{
  display:flex;
  gap:18px;
}

.heroCard{
  width:145px;
  height:190px;
  background:#d8bd77;
  border:4px solid #614522;
  border-radius:12px;
  padding:12px;
  text-align:center;
  box-shadow:0 5px #322316;
}

.heroCard:active{
  transform:translateY(3px);
}

.cardPreview{
  height:105px;
  position:relative;
  transform:scale(1.2);
  margin-bottom:5px;
}

.heroCard h3{
  margin:3px 0;
  font-size:18px;
}

.heroCard p{
  margin:0;
  font-size:11px;
  font-weight:700;
}

.preview{
  position:absolute;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%);
}

/* result */

.resultTitle{
  font-size:46px;
  color:#f5d15d;
  font-weight:1000;
  text-shadow:3px 3px #45291a;
}

.resultText{
  margin-top:10px;
  color:#fff;
  font-size:18px;
  font-weight:800;
}

/* D.Va pilot */

.pilot{
  position:absolute;
  z-index:12;
  width:40px;
  height:50px;
  transform:translate(-50%,-50%);
}

.pilotHead{
  position:absolute;
  left:11px;
  top:0;
  width:20px;
  height:20px;
  border-radius:50%;
  background:#f1c4a4;
  border:2px solid #252525;
}

.pilotBody{
  position:absolute;
  left:8px;
  top:17px;
  width:25px;
  height:28px;
  background:#586c98;
  border:2px solid #252525;
  border-radius:8px;
}

.pilotGun{
  position:absolute;
  top:22px;
  right:-5px;
  width:16px;
  height:6px;
  background:#333;
  border:1px solid #111;
}

/* mobile */

@media(max-width:800px){
  #hud{
    left:24px;
    right:24px;
  }

  .controls{
    bottom:7px;
    gap:5px;
  }

  .controls.left{left:28px}
  .controls.right{right:28px}

  .skillBtn{
    width:55px;
    height:55px;
  }

  .ammo{
    bottom:66px;
  }

  .logo{
    font-size:40px;
  }
}

@media(max-width:600px){
  .skillBtn{
    width:52px;
    height:52px;
  }

  .skillBtn .icon{
    font-size:18px;
  }

  .controls.left{left:27px}
  .controls.right{right:27px}

  #timerBox{
    width:62px;
    font-size:21px;
  }

  .heroChoices{
    gap:8px;
  }

  .heroCard{
    width:105px;
    height:165px;
  }

  .cardPreview{
    transform:scale(.9);
  }
}
</style>
</head>

<body>

<div id="app">
<div id="game">

  <div id="arena">
    <div class="wall top"></div>
    <div class="wall bottom"></div>
    <div class="wall left"></div>
    <div class="wall right"></div>
    <div id="river"></div>

    <!-- HUD -->
    <div id="hud">

      <div class="playerHUD">
        <div class="hpOuter">
          <div id="hp1" class="hp"></div>
          <div id="hpText1" class="hpText">100</div>
        </div>
        <div class="ultOuter">
          <div id="ult1" class="ult"></div>
        </div>
      </div>

      <div id="timerBox">90</div>

      <div class="playerHUD right">
        <div class="hpOuter">
          <div id="hp2" class="hp"></div>
          <div id="hpText2" class="hpText">100</div>
        </div>
        <div class="ultOuter">
          <div id="ult2" class="ult"></div>
        </div>
      </div>

    </div>

    <!-- characters are inserted by JS -->

    <!-- P1 controls -->
    <div class="controls left">
      <div class="ammo" id="ammo1">● 18 / 18</div>

      <button class="skillBtn basic" id="p1basic">
        <span class="icon">●</span>
        <span class="label">평타</span>
      </button>

      <button class="skillBtn skill1" id="p1skill1">
        <span class="icon">↯</span>
        <span class="label">스킬 1</span>
      </button>

      <button class="skillBtn skill2" id="p1skill2">
        <span class="icon">◉</span>
        <span class="label">스킬 2</span>
      </button>

      <button class="skillBtn ultimate" id="p1ult">
        <span class="icon">★</span>
        <span class="label">궁극기</span>
      </button>
    </div>

    <!-- P2 controls -->
    <div class="controls right">
      <div class="ammo" id="ammo2">● 18 / 18</div>

      <button class="skillBtn basic" id="p2basic">
        <span class="icon">●</span>
        <span class="label">평타</span>
      </button>

      <button class="skillBtn skill1" id="p2skill1">
        <span class="icon">⚡</span>
        <span class="label">스킬 1</span>
      </button>

      <button class="skillBtn skill2" id="p2skill2">
        <span class="icon">◆</span>
        <span class="label">스킬 2</span>
      </button>

      <button class="skillBtn ultimate" id="p2ult">
        <span class="icon">✦</span>
        <span class="label">궁극기</span>
      </button>
    </div>
  </div>

  <!-- START -->
  <div id="startScreen" class="screen">
    <div class="logo">OVERDUEL</div>
    <div class="subtitle">2D HERO BATTLE</div>
    <button id="startButton" class="bigButton">게임 시작</button>
  </div>

  <!-- HERO SELECT -->
  <div id="selectScreen" class="screen hidden">
    <div class="selectTitle">영웅 선택</div>

    <div class="heroChoices">

      <button class="heroCard" data-hero="lucio">
        <div class="cardPreview">
          <div class="fighter lucio preview">
            <div class="head">
              <div class="visor"></div>
              <div class="eye a"></div>
              <div class="eye b"></div>
            </div>
            <div class="body"></div>
            <div class="arm left"></div>
            <div class="arm right"></div>
            <div class="leg left"></div>
            <div class="leg right"></div>
          </div>
        </div>
        <h3>루시우</h3>
        <p>음파 · 오라</p>
      </button>

      <button class="heroCard" data-hero="bastion">
        <div class="cardPreview">
          <div class="fighter bastion preview">
            <div class="head">
              <div class="visor"></div>
            </div>
            <div class="body"></div>
            <div class="arm left"></div>
            <div class="arm right"></div>
            <div class="leg left"></div>
            <div class="leg right"></div>
          </div>
        </div>
        <h3>바스티온</h3>
        <p>회복 · 전차</p>
      </button>

      <button class="heroCard" data-hero="dva">
        <div class="cardPreview">
          <div class="fighter dva preview">
            <div class="head">
              <div class="visor"></div>
            </div>
            <div class="body"></div>
            <div class="arm left"></div>
            <div class="arm right"></div>
            <div class="leg left"></div>
            <div class="leg right"></div>
          </div>
        </div>
        <h3>D.Va</h3>
        <p>부스터 · 메카</p>
      </button>

    </div>
  </div>

  <!-- RESULT -->
  <div id="resultScreen" class="screen hidden">
    <div id="resultTitle" class="resultTitle">승리!</div>
    <div id="resultText" class="resultText"></div>
    <button id="restartButton" class="bigButton">다시하기</button>
  </div>

</div>
</div>

<script>
"use strict";

/* =========================================================
   GAME DATA
========================================================= */

const MAX_HP = 100;
const GAME_TIME = 90;
const BASIC_COOLDOWN = 0.5;

const HERO = {
  lucio:{
    hp:100,
    maxAmmo:18,
    damage:8,
    skill1Cooldown:7,
    skill2Cooldown:6,
    ultCost:100
  },

  bastion:{
    hp:120,
    maxAmmo:18,
    damage:11,
    skill1Cooldown:7,
    skill2Cooldown:9,
    ultCost:100
  },

  dva:{
    hp:110,
    maxAmmo:18,
    damage:8,
    skill1Cooldown:7,
    skill2Cooldown:8,
    ultCost:100
  }
};

/* =========================================================

/* =========================================================
   STATE
========================================================= */

let p2Hero = "dva";

/* =========================================================
   PLAYER CREATION
========================================================= */

function createPlayer(id, hero, x, y){

  const data = HERO[hero];

  return {
    id,
    hero,

    x,
    y,

    hp: data.hp,
    maxHp: data.hp,

    ult:0,

    ammo:data.maxAmmo,
    maxAmmo:data.maxAmmo,

    basicTimer:0,
    skill1Timer:0,
    skill2Timer:0,

    reloadTimer:0,

    blocking:false,
    healing:false,

    tank:false,

    auraMode:"speed",

    barrierTimer:0,

    dashTimer:0,
    dashVX:0,
    dashVY:0,

    mech:true,
    mechRecall:false,
    recallProgress:0,

    aiTimer:0,

    element:null,
    auraElement:null
  };
}

/* =========================================================
   START / SELECT
========================================================= */

document.getElementById("startButton").addEventListener("click",()=>{
  startScreen.classList.add("hidden");
  selectScreen.classList.remove("hidden");
});

document.querySelectorAll(".heroCard").forEach(card=>{
  card.addEventListener("click",()=>{
    p1Hero = card.dataset.hero;

    /*
      P2는 현재 선택한 P1과 겹치지 않도록
      기본적으로 다른 영웅을 선택.
    */
    const available = ["lucio","bastion","dva"]
      .filter(h=>h !== p1Hero);

    p2Hero = available[Math.floor(Math.random()*available.length)];

    selectScreen.classList.add("hidden");

    initGame();
  });
});

document.getElementById("restartButton").addEventListener("click",()=>{
  resultScreen.classList.add("hidden");

});

/* =========================================================
   GAME INIT
========================================================= */

function initGame(){

  players = [
    createPlayer(
      1,
      p1Hero,
      arena.clientWidth * .23,
      arena.clientHeight * .34
    ),

    createPlayer(
      2,
      p2Hero,
      arena.clientWidth * .77,
      arena.clientHeight * .66
    )
  ];

  projectiles = [];
  effects = [];

  remainingTime = GAME_TIME;

  gameRunning = true;
  gameEnded = false;

  createPlayerElement(players[0]);
  createPlayerElement(players[1]);

  updateHUD();

  lastFrame = performance.now();

  requestAnimationFrame(loop);
}

/* =========================================================
   PLAYER ELEMENT
========================================================= */

function createPlayerElement(p){

  const el = document.createElement("div");

  el.className =
    "fighter " +
    p.hero +
    (p.id===1 ? " p1" : " p2");

  el.innerHTML = `
    <div class="tag">P${p.id}</div>

    <div class="shadow"></div>

    ${
      p.hero==="lucio"
      ? `<div class="aura speed"></div>`
      : ""
    }

    <div class="head">
      <div class="visor"></div>
      ${
        p.hero==="lucio"
        ? `<div class="eye a"></div><div class="eye b"></div>`
        : ""
      }
    </div>

    <div class="body"></div>
    <div class="arm left"></div>
    <div class="arm right"></div>
    <div class="leg left"></div>
    <div class="leg right"></div>
  `;

  arena.appendChild(el);

  p.element = el;

  p.auraElement = el.querySelector(".aura");

  updatePlayerElement(p);
}

/* =========================================================
   UPDATE PLAYER
========================================================= */

function updatePlayerElement(p){

  if(!p.element) return;

  p.element.style.left = p.x + "px";
  p.element.style.top = p.y + "px";

  if(p.blocking){
    p.element.style.filter = "drop-shadow(0 0 10px #4db7ff)";
  }
  else if(p.healing){
    p.element.style.filter = "drop-shadow(0 0 10px #66e38d)";
  }
  else if(p.tank){
    p.element.style.filter = "drop-shadow(0 0 13px #f0a83a)";
  }
  else{
    p.element.style.filter = "";
  }

  if(p.auraElement){

    p.auraElement.classList.toggle(
      "heal",
      p.auraMode==="heal"
    );

    p.auraElement.classList.toggle(
      "speed",
      p.auraMode==="speed"
    );
  }
}

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  const p1 = players[0];
  const p2 = players[1];

  if(!p1 || !p2) return;

  hp1.style.width =
    Math.max(0,p1.hp/p1.maxHp*100) + "%";

  hp2.style.width =
    Math.max(0,p2.hp/p2.maxHp*100) + "%";

  hpText1.textContent =
    Math.ceil(Math.max(0,p1.hp));

  hpText2.textContent =
    Math.ceil(Math.max(0,p2.hp));

  ult1.style.width =
    Math.min(100,p1.ult) + "%";

  ult2.style.width =
    Math.min(100,p2.ult) + "%";

  ammo1.textContent =
    "● " + p1.ammo + " / " + p1.maxAmmo;

  ammo2.textContent =
    "● " + p2.ammo + " / " + p2.maxAmmo;

  timerBox.textContent =
    Math.max(0,Math.ceil(remainingTime));
}

/* =========================================================
   MAIN LOOP
========================================================= */

function loop(now){

  if(!gameRunning) return;

  const dt =
    Math.min(.05,(now-lastFrame)/1000);

  lastFrame = now;

  remainingTime -= dt;

  if(remainingTime <= 0){
    remainingTime = 0;
    finishByTime();
    return;
  }

  updatePlayers(dt);
  updateProjectiles(dt);
  updateEffects(dt);
  updateHUD();

  requestAnimationFrame(loop);
}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayers(dt){

  players.forEach(p=>{

    p.basicTimer =
      Math.max(0,p.basicTimer-dt);

    p.skill1Timer =
      Math.max(0,p.skill1Timer-dt);

    p.skill2Timer =
      Math.max(0,p.skill2Timer-dt);

    p.barrierTimer =
      Math.max(0,p.barrierTimer-dt);

    /* reload */
    if(p.reloadTimer > 0){

      p.reloadTimer -= dt;

      if(p.reloadTimer <= 0){
        p.ammo = p.maxAmmo;
      }
    }

    /* healing */
    if(p.healing){

      p.hp += 25 * dt;

      if(p.hp >= p.maxHp){
        p.hp = p.maxHp;
        p.healing = false;
      }
    }

    /* D.Va recall */
    if(p.hero==="dva" && !p.mech){

      p.ult += 100/12 * dt;

      if(p.ult >= 100){
        p.ult = 100;
        recallDva(p);
      }
    }

    automaticVerticalMovement(p,dt);

    updatePlayerElement(p);
  });

  /* collision between players */
  keepPlayersSeparated();
}

/* =========================================================
   AUTOMATIC VERTICAL MOVEMENT
========================================================= */

function automaticVerticalMovement(p,dt){

  if(p.dashTimer > 0){

    p.x += p.dashVX * dt;
    p.y += p.dashVY * dt;

    p.dashTimer -= dt;

    clampPlayer(p);

    return;
  }

  /*
    일반 이동은 플레이어가 직접 조종하지 않고
    위아래 방향으로 자동 이동.
  */

  const target =
    players[p.id===1 ? 1 : 0];

  const preferred =
    p.id===1
    ? arena.clientHeight*.35
    : arena.clientHeight*.65;

  let direction = 0;

  if(Math.abs(p.y-preferred)>25){
    direction =
      p.y<preferred ? 1 : -1;
  }

  /* 상대와 너무 가까우면 살짝 위치 조정 */
  if(target){

    const dy =
      target.y-p.y;

    if(Math.abs(dy)>120){
      direction =
        dy>0 ? 1 : -1;
    }
  }

  const speed =
    p.hero==="lucio"
      ? 48
      : 38;

  const auraSpeed =
    p.hero==="lucio" &&
    p.auraMode==="speed"
      ? 1.18
      : 1;

  p.y += direction*speed*auraSpeed*dt;

  /*
    약간의 좌우 움직임도 자동으로 넣어
    캐릭터가 한 위치에만 머무르지 않도록 함.
  */

  const wave =
    Math.sin(performance.now()/850 + p.id)*13;

  p.x += wave*dt*.25;

  clampPlayer(p);
}

/* =========================================================
   CLAMP
========================================================= */

function clampPlayer(p){

  p.x =
    Math.max(65,
      Math.min(
        arena.clientWidth-65,
        p.x
      )
    );

  p.y =
    Math.max(90,
      Math.min(
        arena.clientHeight-95,
        p.y
      )
    );
}

/* =========================================================
   PLAYER SEPARATION
========================================================= */

function keepPlayersSeparated(){

  const a = players[0];
  const b = players[1];

  if(!a || !b) return;

  const dx = b.x-a.x;
  const dy = b.y-a.y;

  const dist = Math.sqrt(dx*dx+dy*dy);

  if(dist < 60 && dist > 0){

    const push =
      (60-dist)/2;

    a.x -= dx/dist*push;
    a.y -= dy/dist*push;

    b.x += dx/dist*push;
    b.y += dy/dist*push;

    clampPlayer(a);
    clampPlayer(b);
  }
}

/* =========================================================
   BASIC ATTACK
========================================================= */

function basicAttack(p){

  if(!gameRunning || !p) return;

  if(p.basicTimer > 0) return;

  if(!p.mech && p.hero==="dva"){
    /* 메카가 없어도 파일럿 평타 사용 가능 */
  }

  if(p.ammo <= 0){
    startReload(p);
    return;
  }

  p.ammo--;

  p.basicTimer =
    p.tank
      ? .17
      : BASIC_COOLDOWN;

  const target =
    players[p.id===1 ? 1 : 0];

  if(!target) return;

  let damage =
    HERO[p.hero].damage;

  /* Bastion tank mode */
  if(p.hero==="bastion" && p.tank){
    damage = 5;
  }

  /* D.Va pilot */
  if(p.hero==="dva" && !p.mech){
    damage = 5;
  }

  fireProjectile(
    p,
    target,
    damage,
    "normal"
  );

  if(p.ammo <= 0){
    startReload(p);
  }
}

/* =========================================================
   RELOAD
========================================================= */

function startReload(p){

  if(p.reloadTimer>0) return;

  p.reloadTimer=1.1;
}

/* =========================================================
   SKILL 1
========================================================= */

function skill1(p){

  if(!gameRunning || !p) return;

  if(p.skill1Timer>0) return;

  /*
    D.Va 메카가 없을 때는 스킬 사용 불가
  */
  if(p.hero==="dva" && !p.mech) return;

  p.skill1Timer =
    HERO[p.hero].skill1Cooldown;

  /* LUCIO
     상시 장판은 항상 존재.
     스킬1은 장판을 켜고 끄는 토글이 아니라
     장판의 효과 모드를 변경.
  */
  if(p.hero==="lucio"){

    p.auraMode =
      p.auraMode==="speed"
        ? "heal"
        : "speed";

    updatePlayerElement(p);

    addFloatingText(
      p,
      p.auraMode==="heal"
        ? "회복 오라"
        : "속도 오라"
    );

    return;
  }

  /* BASTION */
  if(p.hero==="bastion"){

    if(p.healing) return;

    p.healing=true;

    addFloatingText(p,"+25 HP");

    return;
  }

  /* D.Va booster */
  if(p.hero==="dva"){

    const target =
      players[p.id===1 ? 1 : 0];

    const dx =
      target.x-p.x;

    const dy =
      target.y-p.y;

    const len =
      Math.sqrt(dx*dx+dy*dy)||1;

    p.dashVX =
      dx/len*430;

    p.dashVY =
      dy/len*430;

    p.dashTimer=.35;

    createDashEffect(p);
  }
}

/* =========================================================
   SKILL 2
========================================================= */

function skill2(p){

  if(!gameRunning || !p) return;

  if(p.skill2Timer>0) return;

  if(p.hero==="dva" && !p.mech) return;

  p.skill2Timer =
    HERO[p.hero].skill2Cooldown;

  /* Lucio sound wave */
  if(p.hero==="lucio"){

    const target =
      players[p.id===1 ? 1 : 0];

    fireProjectile(
      p,
      target,
      15,
      "skill",
      520
    );

    return;
  }

  /* Bastion tank */
  if(p.hero==="bastion"){

    if(p.reloadTimer>0){
      p.reloadTimer=0;
      p.ammo=p.maxAmmo;
    }

    p.tank=true;

    addFloatingText(p,"전차 모드");

    return;
  }

  /* D.Va defense */
  if(p.hero==="dva"){

    p.blocking=true;

    p.barrierTimer=1.2;

    createBarrier(p);

    return;
  }
}

/* =========================================================
   ULTIMATE
========================================================= */

function ultimate(p){

  if(!gameRunning || !p) return;

  if(p.ult < 100) return;

  /* D.Va 메카가 없을 때 궁은 사용 불가 */
  if(p.hero==="dva" && !p.mech) return;

  p.ult=0;

  /* Bastion artillery */
  if(p.hero==="bastion"){

    const target =
      players[p.id===1 ? 1 : 0];

    for(let i=0;i<3;i++){

      setTimeout(()=>{
        if(!gameRunning) return;

        const ox =
          target.x +
          (Math.random()-.5)*100;

        const oy =
          target.y +
          (Math.random()-.5)*100;

        createArtillery(
          ox,
          oy,
          p,
          22
        );
      },i*500);
    }

    return;
  }

  /* Lucio sound barrier */
  if(p.hero==="lucio"){

    p.hp =
      Math.min(
        p.maxHp,
        p.hp+35
      );

    p.barrierTimer=4;

    createBarrier(
      p,
      4
    );

    addFloatingText(
      p,
      "사운드 배리어"
    );

    return;
  }

  /* D.Va mech throw */
  if(p.hero==="dva"){

    throwDvaMech(p);

    return;
  }
}

/* =========================================================
   PROJECTILES
========================================================= */

function fireProjectile(
  p,
  target,
  damage,
  type="normal",
  speed=420
){

  const projectile = {
    owner:p,
    target,
    x:p.x,
    y:p.y,
    damage,
    type,
    speed,
    element:null,
    life:3
  };

  const el =
    document.createElement("div");

  el.className =
    "projectile " +
    (type==="normal"
      ? (p.hero==="lucio"
        ? "lucio"
        : p.hero==="dva"
          ? "dva"
          : "normal")
      : "skill");

  arena.appendChild(el);

  projectile.element=el;

  projectiles.push(projectile);
}

/* =========================================================
   PROJECTILE UPDATE
========================================================= */

function updateProjectiles(dt){

  for(let i=projectiles.length-1;i>=0;i--){

    const q = projectiles[i];

    q.life -= dt;

    if(!q.target || q.target.hp<=0){
      removeProjectile(i);
      continue;
    }

    const dx =
      q.target.x-q.x;

    const dy =
      q.target.y-q.y;

    const dist =
      Math.sqrt(dx*dx+dy*dy);

    if(dist < 22){

      damage(
        q.target,
        q.damage,
        q.owner
      );

      createHitEffect(
        q.target.x,
        q.target.y
      );

      removeProjectile(i);

      continue;
    }

    q.x +=
      dx/dist*q.speed*dt;

    q.y +=
      dy/dist*q.speed*dt;

    q.element.style.left =
      q.x-10+"px";

    q.element.style.top =
      q.y-10+"px";

    if(q.life<=0){
      removeProjectile(i);
    }
  }
}

function removeProjectile(i){

  const q =
    projectiles[i];

  if(q.element)
    q.element.remove();

  projectiles.splice(i,1);
}

/* =========================================================
   DAMAGE
========================================================= */

function damage(target,amount,attacker){

  if(!target || target.hp<=0) return;

  if(target.blocking){

    addFloatingText(
      target,
      "BLOCK"
    );

    return;
  }

  /*
    Lucio 오라 회복은 지속 효과.
    실제 피해량은 그대로 적용.
  */

  target.hp -= amount;

  target.hp =
    Math.max(0,target.hp);

  /*
    피해를 준 만큼 궁극기 충전.
    궁극기 자체 피해는 충전에 사용하지 않음.
  */
  if(attacker){

    const charge =
      amount * .9;

    attacker.ult =
      Math.min(
        100,
        attacker.ult+charge
      );
  }

  if(target.hp<=0){

    target.hp=0;

    checkWinner();
  }
}

/* =========================================================
   LUCIO PASSIVE AURA
========================================================= */

function updateLucioAura(){

  const lucio =
    players.find(
      p=>p.hero==="lucio"
    );

  if(!lucio) return;

  const auraRadius=85;

  players.forEach(target=>{

    if(target===lucio) return;

    const dx =
      target.x-lucio.x;

    const dy =
      target.y-lucio.y;

    const dist =
      Math.sqrt(dx*dx+dy*dy);

    if(dist<=auraRadius){

      if(lucio.auraMode==="heal"){

        target.hp +=
          5 * (1/60);

        target.hp =
          Math.min(
            target.maxHp,
            target.hp
          );
      }
    }
  });
}

/* =========================================================
   D.VA THROW MECH
========================================================= */

function throwDvaMech(p){

  if(!p.mech) return;

  const target =
    players[p.id===1 ? 1 : 0];

  if(!target) return;

  const startX=p.x;
  const startY=p.y;

  const endX=target.x;
  const endY=target.y;

  p.mech=false;

  /*
    궁극기 사용 직후 게이지는 0.
    이후 파일럿 상태에서 자동 충전.
  */
  p.ult=0;

  /*
    메카가 날아가는 동안
    D.Va는 파일럿 상태로 남는다.
  */
  const mechEl =
    document.createElement("div");

  mechEl.className =
    "fighter dva";

  mechEl.style.left =
    startX+"px";

  mechEl.style.top =
    startY+"px";

  mechEl.style.zIndex="24";

  mechEl.innerHTML=`
    <div class="head">
      <div class="visor"></div>
    </div>
    <div class="body"></div>
    <div class="arm left"></div>
    <div class="arm right"></div>
    <div class="leg left"></div>
    <div class="leg right"></div>
  `;

  arena.appendChild(mechEl);

  /*
    파일럿으로 교체
  */
  if(p.element){

    p.element.innerHTML=`
      <div class="tag">P${p.id}</div>
      <div class="shadow"></div>
      <div class="pilot">
        <div class="pilotHead"></div>
        <div class="pilotBody"></div>
        <div class="pilotGun"></div>
      </div>
    `;
  }

  let t=0;

  function animateMech(){

    if(!gameRunning){
      mechEl.remove();
      return;
    }

    t += .035;

    const x =
      startX+(endX-startX)*t;

    const y =
      startY+(endY-startY)*t -
      Math.sin(Math.min(1,t)*Math.PI)*70;

    mechEl.style.left=x+"px";
    mechEl.style.top=y+"px";

    if(t<1){
      requestAnimationFrame(animateMech);
    }
    else{

      mechEl.remove();

      createExplosion(
        endX,
        endY,
        115
      );

      /*
        메카 폭발 피해.
        이 피해로 궁극기 충전은 하지 않는다.
      */
      if(
        Math.hypot(
          target.x-endX,
          target.y-endY
        ) <= 115
      ){

        damage(
          target,
          40,
          null
        );
      }
    }
  }

  animateMech();
}

/* =========================================================
   D.VA RECALL
========================================================= */

function recallDva(p){

  if(p.mechRecall) return;

  p.mechRecall=true;

  p.recallProgress=0;

  addFloatingText(
    p,
    "메카 호출!"
  );

  const interval =
    setInterval(()=>{

      if(!gameRunning){
        clearInterval(interval);
        return;
      }

      p.recallProgress += .08;

      if(p.recallProgress>=1){

        clearInterval(interval);

        p.mech=true;
        p.mechRecall=false;
        p.ult=0;

        if(p.element){

          p.element.innerHTML=`
            <div class="tag">P${p.id}</div>
            <div class="shadow"></div>

            <div class="head">
              <div class="visor"></div>
            </div>

            <div class="body"></div>
            <div class="arm left"></div>
            <div class="arm right"></div>
            <div class="leg left"></div>
            <div class="leg right"></div>
          `;
        }

        addFloatingText(
          p,
          "메카 탑승"
        );
      }

    },100);
}

/* =========================================================
   BARRIER
========================================================= */

function createBarrier(p,duration=1.2){

  const el =
    document.createElement("div");

  el.className="barrier";

  arena.appendChild(el);

  function follow(){

    if(
      !gameRunning ||
      p.barrierTimer<=0
    ){
      el.remove();
      return;
    }

    el.style.left=p.x+"px";
    el.style.top=p.y+"px";

    requestAnimationFrame(follow);
  }

  follow();
}

/* =========================================================
   EFFECTS
========================================================= */

function createHitEffect(x,y){

  const el =
    document.createElement("div");

  el.className="hitEffect";

  el.style.left=
    (x-18)+"px";

  el.style.top=
    (y-18)+"px";

  arena.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },250);
}

function createExplosion(x,y,size){

  const el =
    document.createElement("div");

  el.className="explosion";

  el.style.width=size+"px";
  el.style.height=size+"px";

  el.style.left=x+"px";
  el.style.top=y+"px";

  arena.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },500);
}

function createDashEffect(p){

  const el =
    document.createElement("div");

  el.className="hitEffect";

  el.style.left=
    (p.x-18)+"px";

  el.style.top=
    (p.y-18)+"px";

  el.style.borderColor="#65d7ff";

  arena.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },220);
}

function createArtillery(x,y,p,damageAmount){

  const warning =
    document.createElement("div");

  warning.style.position="absolute";
  warning.style.zIndex="20";
  warning.style.left=(x-35)+"px";
  warning.style.top=(y-35)+"px";
  warning.style.width="70px";
  warning.style.height="70px";
  warning.style.border="4px solid #ffdb3d";
  warning.style.borderRadius="50%";
  warning.style.boxShadow="0 0 15px #ffb52e";
  warning.style.background="#ffdb3d22";

  arena.appendChild(warning);

  setTimeout(()=>{

    warning.remove();

    createExplosion(
      x,
      y,
      90
    );

    const target =
      players[p.id===1 ? 1 : 0];

    if(
      Math.hypot(
        target.x-x,
        target.y-y
      )<=75
    ){

      damage(
        target,
        damageAmount,
        null
      );
    }

  },650);
}

function addFloatingText(p,text){

  const el =
    document.createElement("div");

  el.textContent=text;

  el.style.position="absolute";
  el.style.zIndex="50";
  el.style.left=(p.x-40)+"px";
  el.style.top=(p.y-70)+"px";
  el.style.color="#fff";
  el.style.fontWeight="1000";
  el.style.fontSize="15px";
  el.style.textShadow="2px 2px #000";
  el.style.pointerEvents="none";

  arena.appendChild(el);

  let y=p.y-70;
  let alpha=1;

  const timer =
    setInterval(()=>{

      y-=1.5;
      alpha-=.035;

      el.style.top=y+"px";
      el.style.opacity=alpha;

      if(alpha<=0){

        clearInterval(timer);
        el.remove();
      }

    },30);
}

/* =========================================================
   EFFECT UPDATE
========================================================= */

function updateEffects(dt){

  updateLucioAura();

  players.forEach(p=>{

    /*
      오라 효과는 항상 존재.
      Skill 1은 mode만 변경한다.
    */

    if(
      p.hero==="lucio" &&
      p.auraMode==="heal"
    ){
      p.hp =
        Math.min(
          p.maxHp,
          p.hp+3*dt
        );
    }

    /*
      Bastion이 tank mode에서 재장전하면
      전차 모드 종료.
    */
    if(
      p.hero==="bastion" &&
      p.tank &&
      p.reloadTimer>0
    ){
      p.tank=false;
    }

    /*
      Defense 종료
    */
    if(
      p.hero==="dva" &&
      p.barrierTimer<=0
    ){
      p.blocking=false;
    }
  });
}

/* =========================================================
   WINNER
========================================================= */

function checkWinner(){

  if(!gameRunning) return;

  const p1=players[0];
  const p2=players[1];

  if(p1.hp<=0 && p2.hp<=0){

    finishGame(
      "무승부!",
      "두 플레이어가 동시에 쓰러졌습니다."
    );

    return;
  }

  if(p1.hp<=0){

    finishGame(
      "P2 승리!",
      "P2가 승리했습니다."
    );

    return;
  }

  if(p2.hp<=0){

    finishGame(
      "P1 승리!",
      "P1이 승리했습니다."
    );
  }
}

function finishByTime(){

  const p1=players[0];
  const p2=players[1];

  if(p1.hp===p2.hp){

    finishGame(
      "무승부!",
      "90초가 종료되었습니다."
    );

  }else if(p1.hp>p2.hp){

    finishGame(
      "P1 승리!",
      "시간 종료 · HP가 더 많습니다."
    );

  }else{

    finishGame(
      "P2 승리!",
      "시간 종료 · HP가 더 많습니다."
    );
  }
}

function finishGame(title,text){

  if(gameEnded) return;

  gameEnded=true;
  gameRunning=false;

  resultTitle.textContent=title;
  resultText.textContent=text;

  setTimeout(()=>{
    resultScreen.classList.remove("hidden");
  },400);
}

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener("resize",()=>{

  if(!players.length) return;

  players.forEach(p=>{
    clampPlayer(p);
    updatePlayerElement(p);
  });
});

/* =========================================================
   PREVENT IPAD ZOOM / DOUBLE TAP
========================================================= */

let lastTouchEnd=0;

document.addEventListener(
  "touchend",
  function(e){

    const now=Date.now();

    if(now-lastTouchEnd<=300){
      e.preventDefault();
    }

    lastTouchEnd=now;

  },
  {passive:false}
);

document.addEventListener(
  "gesturestart",
  e=>e.preventDefault()
);

document.addEventListener(
  "dblclick",
  e=>e.preventDefault()
);

/* =========================================================
   INITIAL
========================================================= */

timerBox.textContent=GAME_TIME;

</script>
