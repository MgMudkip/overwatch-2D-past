<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
minimum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>RIVER BATTLE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;

    user-select:none;
    -webkit-user-select:none;

    touch-action:none;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#111827;

    overscroll-behavior:none;
}

body{

    position:fixed;

    left:0;
    top:0;

    width:100%;
    height:100%;
}

#game{

    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;

    background:#cbb891;
}

canvas{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    display:block;
}


/* =================================================
   HP
================================================= */

.hp{

    position:absolute;

    width:30%;
    min-width:190px;

    height:52px;

    padding:6px 9px;

    background:#202b3d;

    border:3px solid #596b86;

    border-radius:10px;

    color:white;

    z-index:20;
}

#hp1{

    left:2%;
    top:2%;
}

#hp2{

    right:2%;
    bottom:2%;
}

.hp-name{

    display:flex;

    justify-content:space-between;

    font:bold 14px Arial;

    margin-bottom:4px;
}

.hp-bg{

    width:100%;

    height:16px;

    background:#343d4e;

    border-radius:4px;

    overflow:hidden;
}

.hp-value{

    width:100%;
    height:100%;

    transition:width .12s;
}

#hp1 .hp-value{

    background:#35d477;
}

#hp2 .hp-value{

    background:#ed5666;
}


/* =================================================
   조작 버튼
================================================= */

.controls{

    position:absolute;

    display:flex;

    gap:7px;

    z-index:30;
}

#controls1{

    left:2%;
    top:11%;
}

#controls2{

    right:2%;
    bottom:11%;
}

button{

    width:62px;
    height:48px;

    border:3px solid #64748b;

    border-radius:11px;

    background:#263248;

    color:white;

    font-size:13px;

    font-weight:bold;

    box-shadow:0 4px #111827;

    -webkit-tap-highlight-color:transparent;
}

button:active{

    transform:translateY(4px);

    box-shadow:0 0 #111827;
}

.attack{

    background:#35445d;
}

.skill{

    background:#583b73;

    border-color:#9870bd;
}

.skill.cooldown{

    background:#383d48;

    color:#aaa;
}


/* =================================================
   상태
================================================= */

#status{

    position:absolute;

    left:50%;
    top:47%;

    transform:translate(-50%,-50%);

    color:white;

    font:bold 23px Arial;

    text-shadow:
    2px 2px #172033,
    -1px -1px #172033;

    z-index:40;

    pointer-events:none;
}


/* =================================================
   다시하기
================================================= */

#restart{

    display:none;

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:150px;
    height:52px;

    background:#202c40;

    border:3px solid #73839c;

    border-radius:13px;

    color:white;

    font-size:17px;

    z-index:60;
}


/* =================================================
   시작 화면
================================================= */

#start{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    background:rgba(12,20,31,.82);

    z-index:100;
}

#start h1{

    color:white;

    font:bold 38px Arial;

    letter-spacing:4px;

    margin-bottom:25px;
}

#start button{

    width:180px;
    height:58px;

    background:#304d7c;

    font-size:18px;
}


/* =================================================
   180도 회전 시 2P UI
================================================= */

/*
   화면이 180도 돌아간 경우
   2P UI를 반대쪽으로 이동시키기 위한 클래스
*/

.rotate180 #controls2{

    left:2%;
    right:auto;

    top:11%;
    bottom:auto;

    flex-direction:row-reverse;
}

.rotate180 #hp2{

    left:2%;
    right:auto;

    top:2%;
    bottom:auto;
}


/* =================================================
   작은 화면
================================================= */

@media(max-width:700px){

    .hp{

        width:35%;

        min-width:140px;

        height:45px;

        padding:5px 7px;
    }

    .hp-name{

        font-size:11px;

        margin-bottom:3px;
    }

    .hp-bg{

        height:13px;
    }

    button{

        width:54px;

        height:44px;

        font-size:11px;
    }

    #status{

        font-size:18px;
    }

    #start h1{

        font-size:27px;
    }
}

</style>

</head>


<body>

<div id="game">

<canvas id="canvas"></canvas>


<!-- =================================================
     1P HP
================================================= -->

<div class="hp" id="hp1">

    <div class="hp-name">

        <span>1P</span>

        <span id="hpText1">
            100 / 100
        </span>

    </div>

    <div class="hp-bg">

        <div
            class="hp-value"
            id="bar1">
        </div>

    </div>

</div>


<!-- =================================================
     2P HP
================================================= -->

<div class="hp" id="hp2">

    <div class="hp-name">

        <span>2P</span>

        <span id="hpText2">
            100 / 100
        </span>

    </div>

    <div class="hp-bg">

        <div
            class="hp-value"
            id="bar2">
        </div>

    </div>

</div>


<!-- =================================================
     1P UI
================================================= -->

<div
    class="controls"
    id="controls1">

    <button
        data-player="1"
        data-key="left">
        ◀
    </button>

    <button
        data-player="1"
        data-key="right">
        ▶
    </button>

    <button
        class="attack"
        data-attack="1">
        평타
    </button>

    <button
        class="skill"
        id="skill1">
        스킬
    </button>

</div>


<!-- =================================================
     2P UI
================================================= -->

<div
    class="controls"
    id="controls2">

    <button
        data-player="2"
        data-key="left">
        ◀
    </button>

    <button
        data-player="2"
        data-key="right">
        ▶
    </button>

    <button
        class="attack"
        data-attack="2">
        평타
    </button>

    <button
        class="skill"
        id="skill2">
        스킬
    </button>

</div>


<div id="status">
    READY
</div>


<button id="restart">
    ↻ 다시하기
</button>


<!-- =================================================
     시작
================================================= -->

<div id="start">

    <h1>RIVER BATTLE</h1>

    <button id="startButton">
        GAME START
    </button>

</div>

</div>


<script>

/* =================================================
   확대 방지
================================================= */

/*
   더블클릭 확대 방지
*/

document.addEventListener(
    "dblclick",
    function(e){

        e.preventDefault();

    },
    {passive:false}
);


/*
   iOS Safari 제스처 확대 방지
*/

document.addEventListener(
    "gesturestart",
    function(e){

        e.preventDefault();

    },
    {passive:false}
);

document.addEventListener(
    "gesturechange",
    function(e){

        e.preventDefault();

    },
    {passive:false}
);

document.addEventListener(
    "gestureend",
    function(e){

        e.preventDefault();

    },
    {passive:false}
);


/* =================================================
   Canvas
================================================= */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let W=0;
let H=0;


function resize(){

    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        W*ratio;

    canvas.height =
        H*ratio;

    canvas.style.width =
        W+"px";

    canvas.style.height =
        H+"px";

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );
}

resize();


window.addEventListener(
    "resize",
    resize
);

window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            resize,
            150
        );

        setTimeout(
            checkOrientation,
            200
        );

    }
);


/* =================================================
   플레이어
================================================= */

const p1={

    x:0.50,
    y:0.30,

    hp:100,

    left:false,
    right:false,

    skillCooldown:0,

    normalCooldown:0
};


const p2={

    x:0.50,
    y:0.70,

    hp:100,

    left:false,
    right:false,

    skillCooldown:0,

    normalCooldown:0
};


let started=false;

let gameOver=false;


/* =================================================
   속도 설정
================================================= */

/*
   이전보다 느리게
*/

const MOVE_SPEED =
    0.00030;


/*
   평타 발사 간격
*/

const NORMAL_COOLDOWN =
    650;


/*
   스킬 쿨타임
*/

const SKILL_COOLDOWN =
    3;


/*
   데미지
*/

const NORMAL_DAMAGE=10;

const SKILL_DAMAGE=25;


/* =================================================
   투사체
================================================= */

const projectiles=[];


/* =================================================
   이펙트
================================================= */

const effects=[];


/* =================================================
   배경
================================================= */

function drawBackground(){

    ctx.fillStyle="#cbb891";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       풀
    */

    ctx.fillStyle="#a9bd8c";

    for(
        let i=0;
        i<35;
        i++
    ){

        const x =
            (i*173)%W;

        const y =
            60+
            (i*91)%(H*.38);


        ctx.fillRect(
            x,
            y,
            14,
            4
        );
    }


    for(
        let i=0;
        i<35;
        i++
    ){

        const x =
            (i*211)%W;

        const y =
            H*.59+
            (i*71)%(H*.33);


        ctx.fillRect(
            x,
            y,
            14,
            4
        );
    }


    /*
       돌
    */

    ctx.fillStyle="#818171";

    for(
        let i=0;
        i<12;
        i++
    ){

        const x =
            (i*257)%W;

        const y =
            90+
            (i*119)%(H-180);


        ctx.beginPath();

        ctx.ellipse(
            x,
            y,
            13,
            8,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /*
       =================================
       강
       =================================
    */

    const riverY =
        H*.495;

    const riverH =
        H*.045;


    /*
       강 자체
    */

    ctx.fillStyle="#4daee8";

    ctx.fillRect(
        0,
        riverY,
        W,
        riverH
    );


    /*
       위쪽 선
    */

    ctx.strokeStyle="#287fc1";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(
        0,
        riverY+2
    );

    ctx.lineTo(
        W,
        riverY+2
    );

    ctx.stroke();


    /*
       아래쪽 선
    */

    ctx.beginPath();

    ctx.moveTo(
        0,
        riverY+riverH-2
    );

    ctx.lineTo(
        W,
        riverY+riverH-2
    );

    ctx.stroke();


    /*
       물결
    */

    ctx.strokeStyle="#a4def8";

    ctx.lineWidth=2;

    for(
        let x=0;
        x<W;
        x+=90
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            riverY+riverH*.5
        );

        ctx.lineTo(
            x+35,
            riverY+riverH*.5
        );

        ctx.stroke();
    }

}


/* =================================================
   캐릭터
================================================= */

function drawPlayer(
    p,
    bodyColor,
    hairColor,
    number
){

    const x =
        p.x*W;

    const y =
        p.y*H;


    const s =
        Math.max(
            .7,
            Math.min(
                1.2,
                Math.min(W,H)/650
            )
        );


    /*
       그림자
    */

    ctx.fillStyle=
        "rgba(0,0,0,.20)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+31*s,
        23*s,
        8*s,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       다리
    */

    ctx.fillStyle="#30394e";

    ctx.fillRect(
        x-12*s,
        y+13*s,
        9*s,
        20*s
    );

    ctx.fillRect(
        x+3*s,
        y+13*s,
        9*s,
        20*s
    );


    /*
       몸
    */

    ctx.fillStyle=
        bodyColor;

    ctx.fillRect(
        x-16*s,
        y-16*s,
        32*s,
        34*s
    );


    ctx.strokeStyle=
        "#172033";

    ctx.lineWidth=
        4*s;

    ctx.strokeRect(
        x-16*s,
        y-16*s,
        32*s,
        34*s
    );


    /*
       머리
    */

    ctx.fillStyle="#ffd0a8";

    ctx.fillRect(
        x-17*s,
        y-42*s,
        34*s,
        27*s
    );


    ctx.strokeStyle=
        "#172033";

    ctx.strokeRect(
        x-17*s,
        y-42*s,
        34*s,
        27*s
    );


    /*
       머리카락
    */

    ctx.fillStyle=
        hairColor;

    ctx.fillRect(
        x-17*s,
        y-43*s,
        34*s,
        9*s
    );


    /*
       팔
    */

    ctx.fillStyle="#ffd0a8";

    ctx.fillRect(
        x-27*s,
        y-10*s,
        12*s,
        8*s
    );

    ctx.fillRect(
        x+15*s,
        y-10*s,
        12*s,
        8*s
    );


    /*
       1P / 2P
    */

    ctx.fillStyle=
        bodyColor;

    ctx.font=
        "bold "+
        Math.max(12,18*s)+
        "px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        number+"P",
        x,
        y-53*s
    );

}


/* =================================================
   발사
================================================= */

function shoot(
    player,
    skill
){

    const p =
        player===1
        ? p1
        : p2;


    projectiles.push({

        player:player,

        x:p.x,

        y:p.y,

        previousY:p.y,

        direction:
            player===1
            ?1
            :-1,

        /*
           이전보다 느린 속도
        */

        speed:
            skill
            ?0.00055
            :0.00042,

        damage:
            skill
            ?SKILL_DAMAGE
            :NORMAL_DAMAGE,

        skill:skill
    });

}


/* =================================================
   투사체 그리기
================================================= */

function drawProjectile(
    b
){

    const x =
        b.x*W;

    const y =
        b.y*H;


    ctx.save();


    ctx.shadowColor =
        b.player===1
        ?"#40b8ff"
        :"#ff5368";


    ctx.shadowBlur =
        b.skill
        ?18
        :10;


    ctx.fillStyle =
        b.player===1
        ?"#45b8ff"
        :"#ff5368";


    if(b.skill){

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            11,
            0,
            Math.PI*2
        );

        ctx.fill();

    }else{

        ctx.fillRect(
            x-4,
            y-12,
            8,
            24
        );

    }


    ctx.restore();

}


/* =================================================
   투사체 업데이트
================================================= */

function updateProjectiles(
    dt
){

    for(
        let i=
        projectiles.length-1;

        i>=0;

        i--
    ){

        const b =
            projectiles[i];


        /*
           이동 전 위치 저장
        */

        const oldY =
            b.y;


        /*
           이동
        */

        b.y +=
            b.direction *
            b.speed *
            dt;


        /*
           상대방
        */

        const target =
            b.player===1
            ?p2
            :p1;


        /*
           ======================================
           핵심 수정
           이전 위치와 현재 위치 사이를 확인
           ======================================
        */

        const minY =
            Math.min(
                oldY,
                b.y
            );

        const maxY =
            Math.max(
                oldY,
                b.y
            );


        const targetRadius=
            0.035;


        const crossedTarget =
            target.y>=minY-targetRadius &&
            target.y<=maxY+targetRadius;


        const horizontalHit =
            Math.abs(
                b.x-target.x
            )<=0.075;


        if(
            crossedTarget &&
            horizontalHit
        ){

            target.hp=
                Math.max(
                    0,
                    target.hp-b.damage
                );


            effects.push({

                x:target.x,

                y:target.y,

                life:1

            });


            projectiles.splice(
                i,
                1
            );


            if(
                target.hp<=0
            ){

                endGame(
                    b.player===1
                    ?"1P"
                    :"2P"
                );

            }


            continue;

        }


        /*
           화면 밖
        */

        if(
            b.y<-0.05 ||
            b.y>1.05
        ){

            projectiles.splice(
                i,
                1
            );

        }

    }

}


/* =================================================
   피격 이펙트
================================================= */

function updateEffects(
    dt
){

    for(
        let i=
        effects.length-1;

        i>=0;

        i--
    ){

        effects[i].life -=
            dt/250;


        if(
            effects[i].life<=0
        ){

            effects.splice(
                i,
                1
            );

        }

    }

}


function drawEffects(){

    for(
        const e of effects
    ){

        const x =
            e.x*W;

        const y =
            e.y*H;


        ctx.globalAlpha=
            e.life;

        ctx.strokeStyle=
            "#fff27b";

        ctx.lineWidth=4;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            10+
            30*(1-e.life),
            0,
            Math.PI*2
        );

        ctx.stroke();


        ctx.globalAlpha=1;
    }

}


/* =================================================
   이동
================================================= */

function updatePlayers(
    dt
){

    if(
        !started ||
        gameOver
    )
        return;


    /*
       1P
    */

    if(p1.left)
        p1.x -=
            MOVE_SPEED*dt;

    if(p1.right)
        p1.x +=
            MOVE_SPEED*dt;


    /*
       2P
    */

    if(p2.left)
        p2.x -=
            MOVE_SPEED*dt;

    if(p2.right)
        p2.x +=
            MOVE_SPEED*dt;


    /*
       좌우 제한
    */

    p1.x=
        Math.max(
            .20,
            Math.min(
                .80,
                p1.x
            )
        );


    p2.x=
        Math.max(
            .20,
            Math.min(
                .80,
                p2.x
            )
        );

}


/* =================================================
   쿨타임
================================================= */

function updateCooldown(
    dt
){

    if(p1.skillCooldown>0){

        p1.skillCooldown=
            Math.max(
                0,
                p1.skillCooldown-
                dt/1000
            );
    }


    if(p2.skillCooldown>0){

        p2.skillCooldown=
            Math.max(
                0,
                p2.skillCooldown-
                dt/1000
            );
    }


    updateSkillButton(
        "skill1",
        p1.skillCooldown
    );


    updateSkillButton(
        "skill2",
        p2.skillCooldown
    );

}


function updateSkillButton(
    id,
    time
){

    const button=
        document.getElementById(id);


    if(time>0){

        button.classList
            .add("cooldown");

        button.innerHTML=
            "스킬<br>"+
            time.toFixed(1);

    }else{

        button.classList
            .remove("cooldown");

        button.innerHTML=
            "스킬";

    }

}


/* =================================================
   평타 버튼
================================================= */

document
.querySelectorAll("[data-attack]")
.forEach(
    button=>{

        button.addEventListener(
            "pointerdown",
            function(e){

                e.preventDefault();

                if(
                    !started ||
                    gameOver
                )
                    return;


                const player=
                    Number(
                        button.dataset.attack
                    );


                const p=
                    player===1
                    ?p1
                    :p2;


                const now=
                    performance.now();


                /*
                   평타 발사 간격
                */

                if(
                    now-p.normalCooldown
                    <NORMAL_COOLDOWN
                ){

                    return;
                }


                p.normalCooldown=
                    now;


                shoot(
                    player,
                    false
                );

            }
        );

    }
);


/* =================================================
   스킬
================================================= */

document
.getElementById("skill1")
.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        if(
            !started ||
            gameOver ||
            p1.skillCooldown>0
        )
            return;


        p1.skillCooldown=
            SKILL_COOLDOWN;


        shoot(
            1,
            true
        );

    }
);


document
.getElementById("skill2")
.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        if(
            !started ||
            gameOver ||
            p2.skillCooldown>0
        )
            return;


        p2.skillCooldown=
            SKILL_COOLDOWN;


        shoot(
            2,
            true
        );

    }
);


/* =================================================
   이동 버튼
================================================= */

document
.querySelectorAll("[data-key]")
.forEach(
    button=>{

        const player=
            Number(
                button.dataset.player
            );

        const key=
            button.dataset.key;


        function startMove(e){

            e.preventDefault();

            if(
                !started ||
                gameOver
            )
                return;


            const p=
                player===1
                ?p1
                :p2;


            if(key==="left")
                p.left=true;

            if(key==="right")
                p.right=true;

        }


        function stopMove(e){

            e.preventDefault();

            const p=
                player===1
                ?p1
                :p2;


            if(key==="left")
                p.left=false;

            if(key==="right")
                p.right=false;

        }


        button.addEventListener(
            "pointerdown",
            startMove
        );

        button.addEventListener(
            "pointerup",
            stopMove
        );

        button.addEventListener(
            "pointercancel",
            stopMove
        );

        button.addEventListener(
            "pointerleave",
            stopMove
        );

    }
);


/* =================================================
   시작
================================================= */

document
.getElementById("startButton")
.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        document
        .getElementById("start")
        .style.display="none";


        started=true;

        gameOver=false;

        document
        .getElementById("status")
        .textContent=
        "FIGHT!";

    }
);


/* =================================================
   게임 종료
================================================= */

function endGame(
    winner
){

    gameOver=true;

    document
    .getElementById("status")
    .textContent=
        winner+" WIN!";


    document
    .getElementById("restart")
    .style.display=
        "block";

}


/* =================================================
   다시하기
================================================= */

document
.getElementById("restart")
.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        resetGame();

    }
);


function resetGame(){

    p1.x=.50;
    p1.y=.30;
    p1.hp=100;

    p1.left=false;
    p1.right=false;

    p1.skillCooldown=0;
    p1.normalCooldown=0;


    p2.x=.50;
    p2.y=.70;
    p2.hp=100;

    p2.left=false;
    p2.right=false;

    p2.skillCooldown=0;
    p2.normalCooldown=0;


    projectiles.length=0;

    effects.length=0;


    gameOver=false;

    started=true;


    document
    .getElementById("status")
    .textContent=
        "FIGHT!";


    document
    .getElementById("restart")
    .style.display=
        "none";


    updateHP();

}


/* =================================================
   HP
================================================= */

function updateHP(){

    document
    .getElementById("bar1")
    .style.width=
        p1.hp+"%";


    document
    .getElementById("bar2")
    .style.width=
        p2.hp+"%";


    document
    .getElementById("hpText1")
    .textContent=
        p1.hp+" / 100";


    document
    .getElementById("hpText2")
    .textContent=
        p2.hp+" / 100";

}


/* =================================================
   화면 회전
================================================= */

function checkOrientation(){

    let angle=0;


    if(
        screen.orientation &&
        typeof screen.orientation.angle
        ==="number"
    ){

        angle=
            screen.orientation.angle;

    }else if(
        typeof window.orientation
        ==="number"
    ){

        angle=
            window.orientation;

    }


    /*
       180도 회전
    */

    if(
        Math.abs(angle)===180
    ){

        document
        .getElementById("game")
        .classList
        .add("rotate180");

    }else{

        document
        .getElementById("game")
        .classList
        .remove("rotate180");

    }

}


checkOrientation();


if(screen.orientation){

    screen.orientation.addEventListener(
        "change",
        checkOrientation
    );

}


/* =================================================
   메인 루프
================================================= */

let lastTime=
    performance.now();


function loop(now){

    const dt=
        Math.min(
            32,
            now-lastTime
        );


    lastTime=now;


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawBackground();


    updatePlayers(dt);

    updateProjectiles(dt);

    updateEffects(dt);

    updateCooldown(dt);


    /*
       캐릭터
    */

    drawPlayer(
        p1,
        "#357bdd",
        "#2874dc",
        1
    );


    drawPlayer(
        p2,
        "#df465b",
        "#d84259",
        2
    );


    /*
       원거리 공격
    */

    for(
        const b of projectiles
    ){

        drawProjectile(b);

    }


    drawEffects();


    updateHP();


    requestAnimationFrame(
        loop
    );

}


updateHP();

requestAnimationFrame(
    loop
);

</script>
