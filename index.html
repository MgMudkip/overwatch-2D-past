<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
               user-scalable=no, viewport-fit=cover">

<title>OVERDUEL</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    touch-action:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

button{
    font:inherit;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#f5d56e;
}

/* =========================
   START
========================= */

.screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,#ffe88a 0%,#d59b35 100%);
    z-index:100;
}

.title{
    font-size:clamp(55px,10vw,110px);
    font-weight:1000;
    color:#171717;
    text-shadow:
        5px 5px 0 #fff0a0,
        8px 8px 0 #5b4017;
    margin-bottom:45px;
    letter-spacing:4px;
}

.startBtn{
    width:270px;
    height:90px;
    border-radius:22px;
    border:6px solid #3b2b15;
    background:linear-gradient(#ffe86c,#e7a900);
    color:#281c0d;
    font-size:32px;
    font-weight:900;
    box-shadow:0 8px 0 #6c4710;
}

.startBtn:active{
    transform:translateY(6px);
    box-shadow:0 2px 0 #6c4710;
}

/* =========================
   ARENA
========================= */

#arena{
    position:absolute;
    inset:0;
    display:none;
    overflow:hidden;
    background:#f6d878;
}

/* stone border */

#topWall,
#bottomWall{
    position:absolute;
    left:0;
    right:0;
    height:11%;
    min-height:70px;
    background:
        repeating-linear-gradient(
            90deg,
            #ffe69a 0px,
            #ffe69a 75px,
            #d7a94e 78px,
            #d7a94e 82px
        );
    border-bottom:7px solid #17120b;
    z-index:2;
}

#topWall{
    top:0;
}

#bottomWall{
    bottom:0;
    border-top:7px solid #17120b;
    border-bottom:0;
}

/* battle field */

#field{
    position:absolute;
    left:7%;
    right:7%;
    top:11%;
    bottom:11%;
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 20%,#f8dc7e 0 3px,transparent 4px),
        radial-gradient(circle at 80% 70%,#dfbd62 0 3px,transparent 4px),
        radial-gradient(circle at 50% 45%,#edca70 0 2px,transparent 3px),
        #f8dd82;
    background-size:150px 120px,190px 160px,110px 90px,auto;
    border-left:7px solid #17120b;
    border-right:7px solid #17120b;
}

/* center line */

#centerLine{
    position:absolute;
    left:0;
    right:0;
    top:50%;
    height:4px;
    background:#7d652c;
    opacity:.55;
}

/* =========================
   HUD
========================= */

#hud{
    position:absolute;
    top:1.5%;
    left:50%;
    transform:translateX(-50%);
    width:min(780px,72vw);
    height:9%;
    min-height:65px;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
}

.hpBox{
    position:relative;
    width:38%;
    height:55px;
    background:#292929;
    border:5px solid #151515;
    border-radius:13px;
    overflow:hidden;
    box-shadow:0 3px 0 #000;
}

.hpFill{
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:100%;
    background:#ed2020;
}

.hpFill.p2{
    left:auto;
    right:0;
}

.hpText{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:20px;
    font-weight:900;
    text-shadow:2px 2px #000;
}

#timer{
    width:78px;
    height:78px;
    margin:0 8px;
    border-radius:50%;
    background:#242424;
    border:7px solid #555;
    outline:4px solid #171717;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    font-weight:1000;
    z-index:3;
}

#logo{
    position:absolute;
    top:3%;
    right:12%;
    color:#171717;
    font-size:clamp(20px,3vw,42px);
    font-weight:1000;
    text-shadow:3px 3px #fff0a0;
    z-index:25;
}

/* =========================
   CHARACTERS
========================= */

.character{
    position:absolute;
    width:76px;
    height:92px;
    z-index:10;
    transition:transform .05s linear;
}

.body{
    position:absolute;
    width:50px;
    height:48px;
    left:13px;
    top:29px;
    border:4px solid #171717;
    border-radius:12px 12px 17px 17px;
    background:#ececec;
}

.head{
    position:absolute;
    width:52px;
    height:43px;
    left:12px;
    top:3px;
    border:4px solid #171717;
    border-radius:17px 17px 12px 12px;
    background:#f4f4f4;
    z-index:2;
}

.eye{
    position:absolute;
    left:9px;
    right:9px;
    top:18px;
    height:9px;
    border-radius:5px;
    background:#222;
}

#p1 .eye{
    box-shadow:0 0 0 3px #45c8ff;
}

#p2 .eye{
    box-shadow:0 0 0 3px #ff5b5b;
}

.arm{
    position:absolute;
    width:13px;
    height:31px;
    top:39px;
    background:#d8d8d8;
    border:3px solid #171717;
    border-radius:8px;
}

.arm.left{
    left:2px;
    transform:rotate(25deg);
}

.arm.right{
    right:2px;
    transform:rotate(-25deg);
}

.energy{
    position:absolute;
    width:48px;
    height:8px;
    left:14px;
    bottom:-7px;
    border-radius:50%;
    background:#e51d1d;
}

/* P1 / P2 colors */

#p1 .body{
    box-shadow:inset 0 -12px #43b7d7;
}

#p2 .body{
    box-shadow:inset 0 -12px #e36d54;
}

/* =========================
   PROJECTILES
========================= */

.projectile{
    position:absolute;
    width:24px;
    height:10px;
    border-radius:10px;
    z-index:8;
    box-shadow:0 0 10px currentColor;
}

.projectile.p1{
    background:#43c9ff;
    color:#43c9ff;
}

.projectile.p2{
    background:#ff5a42;
    color:#ff5a42;
}

/* =========================
   EFFECTS
========================= */

.effect{
    position:absolute;
    width:25px;
    height:25px;
    border-radius:50%;
    pointer-events:none;
    z-index:30;
    animation:explode .35s ease-out forwards;
}

@keyframes explode{
    0%{
        opacity:1;
        transform:scale(.3);
    }
    100%{
        opacity:0;
        transform:scale(3);
    }
}

.damage{
    position:absolute;
    color:#ff2828;
    font-size:24px;
    font-weight:1000;
    text-shadow:2px 2px #fff;
    z-index:40;
    animation:damageFloat .5s ease-out forwards;
}

@keyframes damageFloat{
    0%{
        opacity:1;
        transform:translateY(0) scale(1);
    }
    100%{
        opacity:0;
        transform:translateY(-45px) scale(1.2);
    }
}

/* =========================
   SKILL BUTTONS
========================= */

.controlPanel{
    position:absolute;
    bottom:2.5%;
    right:2.5%;
    display:flex;
    gap:10px;
    z-index:50;
}

.skillBtn{
    width:78px;
    height:78px;
    border-radius:17px;
    border:5px solid #171717;
    box-shadow:
        inset 0 0 0 3px rgba(255,255,255,.45),
        0 5px 0 rgba(0,0,0,.45);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:1000;
    color:white;
    text-shadow:2px 2px #000;
    position:relative;
}

.skillBtn:active{
    transform:translateY(5px);
    box-shadow:
        inset 0 0 0 3px rgba(255,255,255,.45),
        0 0 0 rgba(0,0,0,.45);
}

.normal{
    background:linear-gradient(#eeeeee,#777);
    color:#202020;
    text-shadow:1px 1px white;
}

.skill1{
    background:linear-gradient(#69e47a,#138d31);
}

.skill2{
    background:linear-gradient(#59c8ff,#1767bd);
}

.ultimate{
    background:linear-gradient(#fff45b,#f3a900);
    color:#fff;
}

.cooldown{
    position:absolute;
    inset:0;
    border-radius:12px;
    background:rgba(0,0,0,.65);
    display:none;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

/* second player's panel */

#p2Controls{
    left:2.5%;
    right:auto;
    transform:rotate(180deg);
}

#p1Controls{
    transform:none;
}

/* =========================
   MENU
========================= */

#menuBtn{
    position:absolute;
    top:3%;
    right:2%;
    width:58px;
    height:58px;
    border-radius:13px;
    border:4px solid #333;
    background:#d0d0d0;
    font-size:30px;
    z-index:60;
}

/* =========================
   END
========================= */

#endScreen{
    display:none;
    z-index:200;
}

#result{
    font-size:clamp(45px,8vw,90px);
    font-weight:1000;
    color:#171717;
    text-shadow:4px 4px #fff;
    margin-bottom:30px;
}

#subResult{
    font-size:25px;
    font-weight:900;
    margin-bottom:40px;
}

/* =========================
   ROTATE MODE
========================= */

.rotate180{
    transform:rotate(180deg);
}

/* =========================
   IPAD LANDSCAPE
========================= */

@media(max-width:900px){
    .skillBtn{
        width:72px;
        height:72px;
        font-size:27px;
    }

    #timer{
        width:65px;
        height:65px;
        font-size:23px;
    }

    .hpBox{
        height:48px;
    }
}
</style>
</head>

<body>

<div id="game">

    <!-- START -->
    <div id="startScreen" class="screen">
        <div class="title">OVERDUEL</div>
        <button class="startBtn" id="startBtn">게임 시작</button>
    </div>

    <!-- GAME -->
    <div id="arena">

        <div id="topWall"></div>
        <div id="bottomWall"></div>

        <div id="logo">OVERDUEL</div>

        <div id="hud">

            <div class="hpBox">
                <div id="hp1" class="hpFill"></div>
                <div id="hpText1" class="hpText">100</div>
            </div>

            <div id="timer">180</div>

            <div class="hpBox">
                <div id="hp2" class="hpFill p2"></div>
                <div id="hpText2" class="hpText">100</div>
            </div>

        </div>

        <button id="menuBtn">☰</button>

        <div id="field">
            <div id="centerLine"></div>

            <!-- PLAYER 1 -->
            <div id="p1" class="character">
                <div class="head">
                    <div class="eye"></div>
                </div>
                <div class="body"></div>
                <div class="arm left"></div>
                <div class="arm right"></div>
                <div class="energy"></div>
            </div>

            <!-- PLAYER 2 -->
            <div id="p2" class="character">
                <div class="head">
                    <div class="eye"></div>
                </div>
                <div class="body"></div>
                <div class="arm left"></div>
                <div class="arm right"></div>
                <div class="energy"></div>
            </div>

        </div>

        <!-- P1 ATTACK PANEL -->
        <div id="p1Controls" class="controlPanel">

            <!-- 평타 -->
            <button class="skillBtn normal" id="p1Attack">
                ⚔
            </button>

            <!-- 스킬 1 -->
            <button class="skillBtn skill1" id="p1Skill1">
                ➤
            </button>

            <!-- 스킬 2 -->
            <button class="skillBtn skill2" id="p1Skill2">
                ◉
            </button>

            <!-- 궁극기 -->
            <button class="skillBtn ultimate" id="p1Ult">
                ★
            </button>

        </div>

        <!-- P2 ATTACK PANEL -->
        <div id="p2Controls" class="controlPanel">

            <button class="skillBtn normal" id="p2Attack">
                ⚔
            </button>

            <button class="skillBtn skill1" id="p2Skill1">
                ➤
            </button>

            <button class="skillBtn skill2" id="p2Skill2">
                ◉
            </button>

            <button class="skillBtn ultimate" id="p2Ult">
                ★
            </button>

        </div>

    </div>

    <!-- END -->
    <div id="endScreen" class="screen">
        <div id="result">PLAYER 1 승리!</div>
        <div id="subResult">전투 종료</div>
        <button class="startBtn" id="restartBtn">다시하기</button>
    </div>

</div>

<script>

/* =========================================================
   GAME DATA
========================================================= */

const arena = document.getElementById("arena");
const field = document.getElementById("field");

const p1 = document.getElementById("p1");
const p2 = document.getElementById("p2");

const hp1Bar = document.getElementById("hp1");
const hp2Bar = document.getElementById("hp2");

const hp1Text = document.getElementById("hpText1");
const hp2Text = document.getElementById("hpText2");

const timerText = document.getElementById("timer");

let hp1 = 100;
let hp2 = 100;

let timeLeft = 180;

let gameRunning = false;
let gameOver = false;

let lastTime = 0;

/* =========================================================
   CHARACTER POSITION
   핵심:
   캐릭터는 좌우 조작 없이
   위 ↕ 아래 방향으로 자동 이동
========================================================= */

const player = {

    p1:{
        x:0,
        y:0,
        speed:95,
        direction:1,
        autoSpeed:95
    },

    p2:{
        x:0,
        y:0,
        speed:90,
        direction:-1,
        autoSpeed:90
    }

};

/* =========================================================
   SET INITIAL POSITION
========================================================= */

function setInitialPositions(){

    const w = field.clientWidth;
    const h = field.clientHeight;

    player.p1.x = w * 0.25;
    player.p1.y = h * 0.55;

    player.p2.x = w * 0.75;
    player.p2.y = h * 0.35;

    drawCharacters();
}

/* =========================================================
   DRAW
========================================================= */

function drawCharacters(){

    p1.style.left =
        (player.p1.x - p1.offsetWidth / 2) + "px";

    p1.style.top =
        (player.p1.y - p1.offsetHeight / 2) + "px";

    p2.style.left =
        (player.p2.x - p2.offsetWidth / 2) + "px";

    p2.style.top =
        (player.p2.y - p2.offsetHeight / 2) + "px";
}

/* =========================================================
   AUTOMATIC VERTICAL MOVEMENT
========================================================= */

function autoMove(playerData, character){

    const h = field.clientHeight;

    const topLimit = 80;
    const bottomLimit = h - 80;

    playerData.y +=
        playerData.direction *
        playerData.autoSpeed *
        deltaTime;

    if(playerData.y <= topLimit){

        playerData.y = topLimit;
        playerData.direction = 1;

        character.style.transform =
            "scaleX(1)";
    }

    if(playerData.y >= bottomLimit){

        playerData.y = bottomLimit;
        playerData.direction = -1;

        character.style.transform =
            "scaleX(-1)";
    }
}

/* =========================================================
   PROJECTILES
========================================================= */

let projectiles = [];

function shoot(owner, type){

    if(!gameRunning || gameOver) return;

    const shooter =
        owner === 1 ? player.p1 : player.p2;

    const target =
        owner === 1 ? player.p2 : player.p1;

    let damage = 8;
    let speed = 500;
    let size = 24;

    if(type === "skill1"){

        damage = 14;
        speed = 650;
        size = 30;
    }

    if(type === "skill2"){

        damage = 18;
        speed = 430;
        size = 38;
    }

    if(type === "ultimate"){

        ultimate(owner);
        return;
    }

    const projectile =
        document.createElement("div");

    projectile.className =
        "projectile p" + owner;

    projectile.style.width =
        size + "px";

    projectile.style.height =
        Math.max(8,size / 3) + "px";

    field.appendChild(projectile);

    const direction =
        target.x > shooter.x ? 1 : -1;

    projectiles.push({

        element:projectile,

        owner:owner,

        x:shooter.x,

        y:shooter.y,

        speed:speed * direction,

        damage:damage

    });

    projectile.style.left =
        shooter.x + "px";

    projectile.style.top =
        shooter.y + "px";
}

/* =========================================================
   PROJECTILE UPDATE
========================================================= */

function updateProjectiles(){

    for(let i=projectiles.length-1;i>=0;i--){

        const b = projectiles[i];

        b.x += b.speed * deltaTime;

        b.element.style.left =
            b.x + "px";

        b.element.style.top =
            b.y + "px";

        const target =
            b.owner === 1 ? player.p2 : player.p1;

        const dx = b.x - target.x;
        const dy = b.y - target.y;

        const distance =
            Math.sqrt(dx*dx + dy*dy);

        if(distance < 42){

            hitTarget(
                b.owner,
                b.damage,
                target.x,
                target.y
            );

            b.element.remove();

            projectiles.splice(i,1);

            continue;
        }

        if(
            b.x < -100 ||
            b.x > field.clientWidth + 100
        ){

            b.element.remove();

            projectiles.splice(i,1);
        }
    }
}

/* =========================================================
   DAMAGE
========================================================= */

function hitTarget(attacker,damage,x,y){

    if(attacker === 1){

        hp2 -= damage;

        hp2 = Math.max(0,hp2);

    }else{

        hp1 -= damage;

        hp1 = Math.max(0,hp1);
    }

    updateHP();

    createHitEffect(x,y);

    createDamageText(x,y,damage);

    if(hp1 <= 0){

        endGame(2);

    }else if(hp2 <= 0){

        endGame(1);
    }
}

/* =========================================================
   HIT EFFECT
========================================================= */

function createHitEffect(x,y){

    const e =
        document.createElement("div");

    e.className="effect";

    e.style.left =
        (x - 12) + "px";

    e.style.top =
        (y - 12) + "px";

    e.style.background =
        "white";

    field.appendChild(e);

    setTimeout(()=>{
        e.remove();
    },400);
}

function createDamageText(x,y,damage){

    const d =
        document.createElement("div");

    d.className="damage";

    d.textContent =
        "-" + damage;

    d.style.left =
        (x + 10) + "px";

    d.style.top =
        (y - 35) + "px";

    field.appendChild(d);

    setTimeout(()=>{
        d.remove();
    },550);
}

/* =========================================================
   ULTIMATE
========================================================= */

function ultimate(owner){

    if(!gameRunning || gameOver) return;

    const target =
        owner === 1 ? player.p2 : player.p1;

    const damage = 30;

    if(owner === 1){

        hp2 -= damage;

    }else{

        hp1 -= damage;
    }

    hp1 = Math.max(0,hp1);
    hp2 = Math.max(0,hp2);

    updateHP();

    /*
       여러 개의 충돌 객체를 생성하지 않고
       즉시 타격하는 방식이라
       궁극기 사용 중 게임이 멈추지 않음
    */

    for(let i=0;i<7;i++){

        setTimeout(()=>{

            if(!gameRunning) return;

            const effect =
                document.createElement("div");

            effect.className="effect";

            const offsetX =
                (Math.random()-0.5)*90;

            const offsetY =
                (Math.random()-0.5)*90;

            effect.style.left =
                (target.x + offsetX - 12) + "px";

            effect.style.top =
                (target.y + offsetY - 12) + "px";

            effect.style.background =
                "#fff23b";

            field.appendChild(effect);

            setTimeout(()=>{
                effect.remove();
            },400);

        },i*70);
    }

    createDamageText(
        target.x,
        target.y,
        damage
    );

    if(hp1 <= 0){

        endGame(2);

    }else if(hp2 <= 0){

        endGame(1);
    }
}

/* =========================================================
   HP
========================================================= */

function updateHP(){

    hp1Bar.style.width =
        hp1 + "%";

    hp2Bar.style.width =
        hp2 + "%";

    hp1Text.textContent =
        hp1;

    hp2Text.textContent =
        hp2;
}

/* =========================================================
   BUTTON COOLDOWN
========================================================= */

const cooldowns = {

    p1:{
        attack:0,
        skill1:0,
        skill2:0,
        ultimate:0
    },

    p2:{
        attack:0,
        skill1:0,
        skill2:0,
        ultimate:0
    }

};

function useSkill(playerNumber,type){

    if(!gameRunning || gameOver) return;

    if(cooldowns[playerNumber][type] > 0)
        return;

    let cooldown = 0.4;

    if(type === "skill1")
        cooldown = 2;

    if(type === "skill2")
        cooldown = 3;

    if(type === "ultimate")
        cooldown = 8;

    cooldowns[playerNumber][type] =
        cooldown;

    shoot(playerNumber,type);

    showCooldown(
        playerNumber,
        type,
        cooldown
    );
}

/* =========================================================
   COOLDOWN UI
========================================================= */

function showCooldown(playerNumber,type,time){

    const id =
        "p" + playerNumber +
        (
            type === "attack"
            ? "Attack"
            : type === "skill1"
            ? "Skill1"
            : type === "skill2"
            ? "Skill2"
            : "Ult"
        );

    const button =
        document.getElementById(id);

    const overlay =
        document.createElement("div");

    overlay.className="cooldown";

    overlay.textContent =
        time.toFixed(1);

    button.appendChild(overlay);

    overlay.style.display="flex";

    let remain=time;

    const interval =
        setInterval(()=>{

            remain -= 0.1;

            if(remain <= 0){

                clearInterval(interval);

                overlay.remove();

            }else{

                overlay.textContent =
                    remain.toFixed(1);
            }

        },100);
}

/* =========================================================
   TIMER
========================================================= */

let timerAccumulator = 0;

function updateTimer(){

    timerAccumulator += deltaTime;

    if(timerAccumulator >= 1){

        timerAccumulator = 0;

        timeLeft--;

        timeLeft =
            Math.max(0,timeLeft);

        timerText.textContent =
            timeLeft;

        if(timeLeft <= 0){

            if(hp1 > hp2){

                endGame(1);

            }else if(hp2 > hp1){

                endGame(2);

            }else{

                endGame(0);
            }
        }
    }
}

/* =========================================================
   GAME LOOP
========================================================= */

let deltaTime = 0;

function gameLoop(timestamp){

    if(!lastTime)
        lastTime=timestamp;

    deltaTime =
        Math.min(
            (timestamp-lastTime)/1000,
            0.05
        );

    lastTime=timestamp;

    if(gameRunning && !gameOver){

        autoMove(
            player.p1,
            p1
        );

        autoMove(
            player.p2,
            p2
        );

        updateProjectiles();

        updateTimer();

        drawCharacters();

    }

    requestAnimationFrame(gameLoop);
}

/* =========================================================
   START GAME
========================================================= */

function startGame(){

    hp1=100;
    hp2=100;

    timeLeft=180;

    gameOver=false;
    gameRunning=true;

    projectiles.forEach(p=>{
        p.element.remove();
    });

    projectiles=[];

    cooldowns.p1={
        attack:0,
        skill1:0,
        skill2:0,
        ultimate:0
    };

    cooldowns.p2={
        attack:0,
        skill1:0,
        skill2:0,
        ultimate:0
    };

    updateHP();

    timerText.textContent =
        timeLeft;

    document.getElementById("startScreen")
        .style.display="none";

    document.getElementById("endScreen")
        .style.display="none";

    arena.style.display="block";

    setTimeout(()=>{
        setInitialPositions();
    },50);
}

/* =========================================================
   END GAME
========================================================= */

function endGame(winner){

    if(gameOver) return;

    gameOver=true;
    gameRunning=false;

    if(winner===1){

        document.getElementById("result")
            .textContent="PLAYER 1 승리!";

    }else if(winner===2){

        document.getElementById("result")
            .textContent="PLAYER 2 승리!";

    }else{

        document.getElementById("result")
            .textContent="DRAW!";
    }

    document.getElementById("subResult")
        .textContent="전투 종료";

    setTimeout(()=>{

        arena.style.display="none";

        document.getElementById("endScreen")
            .style.display="flex";

    },500);
}

/* =========================================================
   MENU
========================================================= */

document.getElementById("menuBtn")
    .addEventListener("pointerdown",e=>{

        e.preventDefault();

        gameRunning=false;

        arena.style.display="none";

        document.getElementById("startScreen")
            .style.display="flex";
    });

/* =========================================================
   START / RESTART
========================================================= */

document.getElementById("startBtn")
    .addEventListener("pointerdown",e=>{
        e.preventDefault();
        startGame();
    });

document.getElementById("restartBtn")
    .addEventListener("pointerdown",e=>{
        e.preventDefault();
        startGame();
    });

/* =========================================================
   PREVENT IPAD DOUBLE TAP / ZOOM
========================================================= */

document.addEventListener(
    "touchstart",
    function(e){

        if(e.touches.length > 1){
            e.preventDefault();
        }

    },
    {passive:false}
);

document.addEventListener(
    "gesturestart",
    function(e){
        e.preventDefault();
    },
    {passive:false}
);

let lastTouchEnd=0;

document.addEventListener(
    "touchend",
    function(e){

        const now =
            Date.now();

        if(now-lastTouchEnd <= 300){

            e.preventDefault();

        }

        lastTouchEnd=now;

    },
    {passive:false}
);

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        if(gameRunning){

            setInitialPositions();

        }

    }
);

/* =========================================================
   START LOOP
========================================================= */

requestAnimationFrame(gameLoop);

</script>
