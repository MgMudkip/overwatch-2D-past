<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>RIVER BATTLE v2.1</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;

    touch-action:none;
}

html,body{
    width:100%;
    height:100%;

    overflow:hidden;

    position:fixed;
    inset:0;

    background:#101827;

    touch-action:none;
    overscroll-behavior:none;
}

button{
    font-family:Arial,sans-serif;
    touch-action:none;
    -webkit-tap-highlight-color:transparent;
}

#game{
    position:fixed;
    inset:0;

    overflow:hidden;

    background:#cbb891;

    touch-action:none;
}

#board{
    position:absolute;
    inset:0;

    transform-origin:center center;

    transition:transform .25s ease;
}

#board.rotate{
    transform:rotate(180deg);
}

canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    display:block;
}


/* =====================================
   SCREEN
===================================== */

.screen{
    position:absolute;
    inset:0;

    z-index:500;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at center,
            #263c58,
            #101827 70%
        );

    color:white;

    text-align:center;
}

.screen.hidden{
    display:none;
}

.gameTitle{
    font-size:
        clamp(38px,8vw,76px);

    font-weight:900;

    letter-spacing:5px;

    text-shadow:
        5px 5px #070b12;

    margin-bottom:10px;
}

.version{
    color:#9fb3cc;

    font-size:
        clamp(12px,2.5vw,18px);

    margin-bottom:35px;
}

.mainButton{
    width:
        clamp(190px,30vw,260px);

    height:
        clamp(60px,9vw,75px);

    border:3px solid #7690b2;

    border-radius:15px;

    background:#31527f;

    color:white;

    font-size:
        clamp(18px,3vw,25px);

    font-weight:bold;

    box-shadow:
        0 6px #090e18;
}

.mainButton:active{
    transform:translateY(6px);
    box-shadow:0 0 #090e18;
}


/* =====================================
   SELECT
===================================== */

.selectTitle{
    font-size:
        clamp(26px,5vw,45px);

    font-weight:900;

    margin-bottom:7px;
}

.selectInfo{
    color:#b7c6d9;

    font-size:
        clamp(12px,2.2vw,17px);

    margin-bottom:20px;
}

.playerSelectArea{
    width:min(920px,94vw);

    display:flex;

    gap:20px;

    justify-content:center;
}

.selectPlayer{
    flex:1;

    padding:14px;

    border:
        2px solid #53677f;

    border-radius:14px;

    background:#182438;
}

.selectPlayer h2{
    margin-bottom:10px;

    font-size:
        clamp(17px,3vw,25px);
}

.heroChoices{
    display:flex;

    gap:8px;
}

.heroCard{
    flex:1;

    border:
        2px solid #566b85;

    border-radius:10px;

    background:#26354b;

    color:white;

    padding:9px 4px;
}

.heroCard.selected{
    border-color:#ffe26b;

    box-shadow:
        0 0 0 2px #ffe26b inset;
}

.heroIcon{
    width:52px;
    height:52px;

    margin:auto;
    margin-bottom:6px;

    border-radius:10px;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:25px;
}

.heroName{
    font-weight:bold;

    font-size:14px;

    margin-bottom:4px;
}

.heroRole{
    color:#aebed1;

    font-size:10px;
}

.selectBottom{
    margin-top:18px;

    display:flex;
    flex-direction:column;

    align-items:center;

    gap:10px;
}

#selectionText{
    color:#d9e3ef;

    font-size:14px;
}


/* =====================================
   HP
===================================== */

.hpBox{
    position:absolute;

    width:30%;
    min-width:190px;

    padding:7px 10px;

    border:
        3px solid #53647c;

    border-radius:12px;

    background:#172235;

    color:white;

    z-index:60;
}

#hp1{
    left:2%;
    top:2%;
}

#hp2{
    right:2%;
    bottom:2%;
}

.hpHeader{
    display:flex;
    justify-content:space-between;

    font:bold 14px Arial;

    margin-bottom:5px;
}

.hpBackground{
    width:100%;
    height:18px;

    overflow:hidden;

    border-radius:5px;

    background:#343e50;
}

.hpBar{
    height:100%;
}

#hpBar1{
    background:#39d878;
}

#hpBar2{
    background:#ed5666;
}

.ultBox{
    margin-top:5px;

    height:8px;

    width:100%;

    overflow:hidden;

    border-radius:4px;

    background:#30394b;
}

.ultBar{
    height:100%;
    width:0%;

    background:#f4d65c;
}


/* =====================================
   CONTROLS
===================================== */

.controls{
    position:absolute;

    display:flex;

    gap:8px;

    z-index:80;
}

#controls1{
    left:2%;
    top:13%;
}

#controls2{
    right:2%;
    bottom:13%;
}

.gameButton{
    width:70px;
    height:60px;

    border:
        3px solid #62738c;

    border-radius:14px;

    background:#29374d;

    color:white;

    font-size:13px;

    font-weight:bold;

    box-shadow:
        0 5px #0d1420;
}

.gameButton:active{
    transform:translateY(5px);

    box-shadow:0 0 #0d1420;
}

.attackButton{
    background:#364860;
}

.skillButton{
    background:#55416c;

    border-color:#9272b0;
}

.skillButton2{
    background:#3c526d;

    border-color:#7797bb;
}

.ultButton{
    background:#665827;

    border-color:#d5bb55;
}

.cooldown{
    background:#343a46 !important;

    border-color:#5b6471 !important;

    color:#aab0ba;
}


/* =====================================
   CENTER
===================================== */

#centerStatus{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:70;

    pointer-events:none;

    color:white;

    font:bold 27px Arial;

    text-align:center;

    text-shadow:
        3px 3px #172033;
}

#timer{
    color:#f4e7a1;

    font-size:16px;

    margin-top:5px;
}


/* =====================================
   COUNTDOWN
===================================== */

#countdown{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:150;

    color:white;

    font-size:
        clamp(50px,12vw,110px);

    font-weight:900;

    text-shadow:
        6px 6px #101827;

    pointer-events:none;
}


/* =====================================
   ROTATE
===================================== */

#rotateButton{
    position:absolute;

    left:50%;
    top:54%;

    transform:
        translate(-50%,-50%);

    width:38px;
    height:38px;

    border:
        2px solid #64748b;

    border-radius:50%;

    background:#263248;

    color:#d8e0eb;

    font-size:20px;

    opacity:.55;

    z-index:90;
}

#rotateButton:active{
    opacity:1;
}


/* =====================================
   ROTATED UI
===================================== */

#board.rotate #controls1{
    left:auto;
    right:2%;
    top:auto;
    bottom:13%;
}

#board.rotate #controls2{
    right:auto;
    left:2%;
    bottom:auto;
    top:13%;
}

#board.rotate #hp1{
    left:auto;
    right:2%;
    top:auto;
    bottom:2%;
}

#board.rotate #hp2{
    right:auto;
    left:2%;
    bottom:auto;
    top:2%;
}


/* =====================================
   PORTRAIT
===================================== */

#portraitNotice{
    display:none;

    position:absolute;
    inset:0;

    z-index:1000;

    background:#101827;

    color:white;

    justify-content:center;
    align-items:center;

    text-align:center;

    font-size:22px;

    font-weight:bold;
}

@media(orientation:portrait){

    #portraitNotice{
        display:flex;
    }
}


/* =====================================
   MOBILE
===================================== */

@media(max-width:850px){

    .playerSelectArea{
        gap:8px;
    }

    .selectPlayer{
        padding:8px;
    }

    .heroIcon{
        width:42px;
        height:42px;
    }

    .gameButton{
        width:63px;
        height:55px;

        font-size:11px;
    }

    .hpBox{
        min-width:150px;
    }
}

</style>
</head>


<body>

<div id="game">

<div id="board">

<canvas id="canvas"></canvas>

     HP 1

            1P
        </span>

        <span id="hpText1">
            100 / 100
        </span>

    </div>

    <div class="hpBackground">

        <div
            class="hpBar"
            id="hpBar1">
        </div>

    </div>

    <div class="ultBox">

        <div
            class="ultBar"
            id="ultBar1">
        </div>

    </div>

</div>


<!-- =====================================
     HP 2
===================================== -->

<div class="hpBox" id="hp2">

    <div class="hpHeader">

        <span id="name2">
            2P
        </span>

        <span id="hpText2">
            100 / 100
        </span>

    </div>

    <div class="hpBackground">

        <div
            class="hpBar"
            id="hpBar2">
        </div>

    </div>

        <div
            class="ultBar"

<!-- =====================================

<!-- =====================================

===================================== -->

<div

    <button

        ◀

    <button
        class="gameButton"
        data-player="2"
        data-move="right">
        ▶
    </button>

    <button
        class="gameButton attackButton"
        data-player="2"
        data-action="attack">
        평타
    </button>

    <button

        id="skill2">
        스킬1
    </button>

    <button

        id="skill2_2">
        스킬2
    </button>

</div>

    <div id="statusText">

    </div>

        60
    </div>

</div>


<button id="rotateButton">
    ↻
</button>


<div id="countdown"></div>

</div>


<!-- =====================================
     START
===================================== -->

<div
    class="screen"
    id="startScreen">

    <div class="gameTitle">
        RIVER BATTLE
    </div>

    <div class="version">
        HERO ARENA v2.1
    </div>

    <button
        class="mainButton"
        id="startButton">
        게임 시작
    </button>

</div>


<!-- =====================================
     SELECT
===================================== -->

<div
    class="screen hidden"
    id="selectScreen">

    <div class="selectTitle">
        HERO SELECT
    </div>

    <div class="selectInfo">
        사용할 영웅을 선택하세요
    </div>


    <div class="playerSelectArea">

        <div class="selectPlayer">

            <h2>1P</h2>

            <div
                class="heroChoices"
                id="choices1">
            </div>

        </div>


        <div class="selectPlayer">

            <h2>2P</h2>

            <div
                class="heroChoices"
                id="choices2">
            </div>

        </div>

    </div>


    <div class="selectBottom">

        <div id="selectionText">
            영웅을 선택하세요
        </div>

        <button

            id="battleStartButton">
            전투 시작

</div>


<!-- =====================================
     END

    class="screen hidden"
    id="endScreen">

        class="gameTitle"

        class="version"

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas=
    document.getElementById("canvas");

const ctx=
    canvas.getContext("2d");

let W=0;
let H=0;

function resize(){

    W=window.innerWidth;
    H=window.innerHeight;

    const ratio=
        Math.min(
            window.devicePixelRatio||1,
            2
        );

    canvas.width=
        W*ratio;

    canvas.height=
        H*ratio;

    canvas.style.width=
        W+"px";

    canvas.style.height=
        H+"px";

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   HERO DATA
===================================================== */

const HEROES={

    LUCID:{

        name:"루시드",
        icon:"♫",

        role:"기동 / 지원",

        hp:100,

        speed:.00030,

        attackDamage:8,

        attackSpeed:420,

        projectileSpeed:.00045,

        skill1:"볼륨 업",
        skill1Cooldown:5,

        skill2:"음파 충격",
        skill2Cooldown:7,

        ult:"비트",

        color:"#36b6e8",
        dark:"#187da7",

        type:"lucid"
    },


    IRON:{

        name:"아이언",
        icon:"▣",

        role:"화력 / 중장갑",

        hp:125,

        speed:.00017,

        attackDamage:12,

        attackSpeed:850,

        projectileSpeed:.00030,

        skill1:"강습 모드",
        skill1Cooldown:6,

        skill2:"철벽",
        skill2Cooldown:8,

        ult:"포격",

        color:"#6d8f72",
        dark:"#405b46",

        type:"iron"
    },


    MECHA:{

        name:"메카",
        icon:"◆",

        role:"방어 / 돌진",

        hp:110,

        speed:.00024,

        attackDamage:7,

        attackSpeed:300,

        projectileSpeed:.00052,

        skill1:"부스터",
        skill1Cooldown:5,

        skill2:"방어막",
        skill2Cooldown:7,

        ult:"과부하",

        color:"#db71a8",
        dark:"#934c78",

        type:"mecha"
    }

};


/* =====================================================
   PLAYER
===================================================== */

function createPlayer(){

    return{

        x:.5,

        y:0,

        hp:100,
        maxHp:100,

        ult:0,

        hero:null,

        left:false,
        right:false,

        skill1Timer:0,
        skill2Timer:0,

        normalTimer:0,

        speedBoost:0,

        powerTimer:0,

        armorTimer:0,

        dashTimer:0,

        dashDirection:0,

        invincible:0,

        beatTimer:0
    };
}


const p1=createPlayer();
const p2=createPlayer();

p1.y=.29;
p2.y=.71;


/* =====================================================
   GAME STATE
===================================================== */

let selected1="LUCID";
let selected2="IRON";

let battleRunning=false;
let gameEnded=false;

let matchTime=60;

let projectiles=[];
let effects=[];
let bombardments=[];
let explosions=[];


/* =====================================================
   CHARACTER SELECT
===================================================== */

function createHeroCards(){

    const c1=
        document.getElementById("choices1");

    const c2=
        document.getElementById("choices2");

    c1.innerHTML="";
    c2.innerHTML="";


    Object.keys(HEROES)
    .forEach(key=>{

        c1.appendChild(
            createCard(
                key,
                1
            )
        );

        c2.appendChild(
            createCard(
                key,
                2
            )
        );

    });


    updateSelection();
}


function createCard(
    key,
    player
){

    const hero=
        HEROES[key];


    const card=
        document.createElement("button");

    card.className="heroCard";

    card.dataset.hero=key;


    card.innerHTML=`

        <div
            class="heroIcon"
            style="background:${hero.dark}">
            ${hero.icon}
        </div>

        <div class="heroName">
            ${hero.name}
        </div>

        <div class="heroRole">
            ${hero.role}
        </div>
    `;


    card.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();


            if(player===1)
                selected1=key;
            else
                selected2=key;


            updateSelection();
        }
    );


    card.dataset.player=
        player;


    return card;
}


function updateSelection(){

    document
    .querySelectorAll(".heroCard")
    .forEach(card=>{

        const player=
            Number(
                card.dataset.player
            );

        const selected=
            player===1
            ?selected1
            :selected2;


        card.classList.toggle(
            "selected",
            card.dataset.hero===selected
        );
    });


    document
    .getElementById("selectionText")
    .textContent=
        `${HEROES[selected1].name} VS ${HEROES[selected2].name}`;
}


createHeroCards();


/* =====================================================
   START
===================================================== */

document
.getElementById("startButton")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();


        document
        .getElementById("startScreen")
        .classList.add("hidden");


        document
        .getElementById("selectScreen")
        .classList.remove("hidden");
    }
);


/* =====================================================
   SETUP
===================================================== */

function setupBattle(){

    const h1=
        HEROES[selected1];

    const h2=
        HEROES[selected2];


    p1.hero=h1;
    p2.hero=h2;


    p1.x=.5;
    p2.x=.5;


    p1.hp=h1.hp;
    p1.maxHp=h1.hp;

    p2.hp=h2.hp;
    p2.maxHp=h2.hp;


    p1.ult=0;
    p2.ult=0;


    p1.skill1Timer=0;
    p1.skill2Timer=0;

    p2.skill1Timer=0;
    p2.skill2Timer=0;


    p1.normalTimer=0;
    p2.normalTimer=0;


    p1.speedBoost=0;
    p2.speedBoost=0;

    p1.powerTimer=0;
    p2.powerTimer=0;

    p1.armorTimer=0;
    p2.armorTimer=0;

    p1.dashTimer=0;
    p2.dashTimer=0;

    p1.invincible=0;
    p2.invincible=0;

    p1.beatTimer=0;
    p2.beatTimer=0;


    projectiles=[];
    effects=[];
    bombardments=[];
    explosions=[];


    matchTime=60;

    gameEnded=false;
    battleRunning=false;


    updateUI();
}


/* =====================================================
   BATTLE START
===================================================== */

document
.getElementById("battleStartButton")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();


        setupBattle();


        document
        .getElementById("selectScreen")
        .classList.add("hidden");


        startCountdown();
    }
);


function startCountdown(){

    const c=
        document.getElementById("countdown");

    let n=3;

    c.textContent=n;


    const interval=
        setInterval(()=>{

            n--;


            if(n>0){

                c.textContent=n;

            }else{

                clearInterval(interval);

                c.textContent=
                    "FIGHT!";

                battleRunning=true;


                setTimeout(
                    ()=>{
                        c.textContent="";
                    },
                    700
                );
            }

        },800);
}


/* =====================================================
   NORMAL ATTACK
===================================================== */

function attack(player){

    if(
        !battleRunning ||
        gameEnded
    ){
        return;
    }


    const p=
        player===1
        ?p1
        :p2;


    if(
        p.normalTimer>0
    ){
        return;
    }


    let cooldown=
        p.hero.attackSpeed;


    if(
        p.speedBoost>0
    ){
        cooldown*=.55;
    }


    p.normalTimer=
        cooldown;


    let damage=
        p.hero.attackDamage;


    if(
        p.powerTimer>0
    ){
        damage*=1.65;
    }


    projectiles.push({

        owner:player,

        x:p.x,

        y:p.y,

        oldY:p.y,

        direction:
            player===1
            ?1
            :-1,

        speed:
            p.hero.projectileSpeed,

        damage:damage,

        radius:
            p.hero.type==="iron"
            ?8
            :6,

        type:
            player===1
            ?"blue"
            :"red"
    });


    p.ult=
        Math.min(
            100,
            p.ult+4
        );
}


/* =====================================================
   SKILL 1
===================================================== */

function useSkill1(player){

    if(
        !battleRunning ||
        gameEnded
    ){
        return;
    }


    const p=
        player===1
        ?p1
        :p2;


    if(
        p.skill1Timer>0
    ){
        return;
    }


    p.skill1Timer=
        p.hero.skill1Cooldown;


    switch(
        p.hero.type
    ){

        case "lucid":

            /* 이동 + 공격속도 증가 */

            p.speedBoost=3.5;

            addEffect(
                p.x,
                p.y,
                "speed"
            );

            break;


        case "iron":

            /* 공격력 증가 */

            p.powerTimer=4;

            addEffect(
                p.x,
                p.y,
                "power"
            );

            break;


        case "mecha":

            /* 부스터 돌진 */

            p.dashTimer=.55;

            p.dashDirection=
                player===1
                ?1
                :-1;

            p.invincible=.55;

            addEffect(
                p.x,
                p.y,
                "dash"
            );

            break;
    }
}


/* =====================================================
   SKILL 2
===================================================== */

function useSkill2(player){

    if(
        !battleRunning ||
        gameEnded
    ){
        return;
    }


    const p=
        player===1
        ?p1
        :p2;


    if(
        p.skill2Timer>0
    ){
        return;
    }


    p.skill2Timer=
        p.hero.skill2Cooldown;


    switch(
        p.hero.type
    ){

        /* =========================
           루시드 - 음파 충격
        ========================= */

        case "lucid":

            projectiles.push({

                owner:player,

                x:p.x,

                y:p.y,

                oldY:p.y,

                direction:
                    player===1
                    ?1
                    :-1,

                speed:.00075,

                damage:22,

                radius:14,

                type:
                    player===1
                    ?"blue"
                    :"red",

                skill:true
            });

            addEffect(
                p.x,
                p.y,
                "wave"
            );

            break;


        /* =========================
           아이언 - 철벽
        ========================= */

        case "iron":

            p.armorTimer=3;

            addEffect(
                p.x,
                p.y,
                "armor"
            );

            break;


        /* =========================
           메카 - 방어막
        ========================= */

        case "mecha":

            p.armorTimer=2.5;

            p.invincible=.35;

            addEffect(
                p.x,
                p.y,
                "shield"
            );

            break;
    }
}


/* =====================================================
   ULTIMATE
===================================================== */

function useUltimate(player){

    if(
        !battleRunning ||
        gameEnded
    ){
        return;
    }


    const p=
        player===1
        ?p1
        :p2;


    if(
        p.ult<100
    ){
        return;
    }


    /* 궁극기 게이지 먼저 소모 */

    p.ult=0;


    switch(
        p.hero.type
    ){

        /* =========================
           루시드
        ========================= */

        case "lucid":

            p.beatTimer=5;

            p.hp=
                Math.min(
                    p.maxHp,
                    p.hp+30
                );

            addEffect(
                p.x,
                p.y,
                "beat"
            );

            break;


        /* =========================
           아이언
        ========================= */

        case "iron":

            /*
               기존 explosions와 분리.
               별도의 bombardments 배열을
               사용하기 때문에 게임 루프가
               멈추지 않는다.
            */

            createBombardment(
                player
            );

            break;


        /* =========================
           메카
        ========================= */

        case "mecha":

            createMechaExplosion(
                player
            );

            break;
    }
}


/* =====================================================
   PROJECTILE UPDATE
===================================================== */

function updateProjectiles(dt){

    for(
        let i=projectiles.length-1;
        i>=0;
        i--
    ){

        const b=
            projectiles[i];


        b.oldY=b.y;


        b.y+=
            b.direction*
            b.speed*
            dt;


        const target=
            b.owner===1
            ?p2
            :p1;


        const minY=
            Math.min(
                b.oldY,
                b.y
            );


        const maxY=
            Math.max(
                b.oldY,
                b.y
            );


        const verticalHit=
            target.y>=
                minY-.055 &&
            target.y<=
                maxY+.055;


        const horizontalHit=
            Math.abs(
                target.x-b.x
            )<=
            (
                b.skill
                ?.105
                :.08
            );


        if(
            verticalHit &&
            horizontalHit
        ){

            damagePlayer(
                target,
                b.damage
            );


            addHitEffect(
                target.x,
                target.y
            );


            projectiles.splice(
                i,
                1
            );

            continue;
        }


        if(
            b.y<-.1 ||
            b.y>1.1
        ){

            projectiles.splice(
                i,
                1
            );
        }
    }
}


/* =====================================================
   DAMAGE
===================================================== */

function damagePlayer(
    target,
    damage
){

    if(
        target.invincible>0
    ){
        return;
    }


    if(
        target.armorTimer>0
    ){

        damage*=.35;
    }


    if(
        target.beatTimer>0
    ){

        damage*=.65;
    }


    target.hp=
        Math.max(
            0,
            target.hp-damage
        );


    const attacker=
        target===p1
        ?p2
        :p1;


    attacker.ult=
        Math.min(
            100,
            attacker.ult+8
        );


    target.ult=
        Math.min(
            100,
            target.ult+5
        );


    if(
        target.hp<=0
    ){

        endBattle(
            target===p1
            ?"2P"
            :"1P"
        );
    }
}


/* =====================================================
   IRON ULT
===================================================== */

function createBombardment(player){

    const target=
        player===1
        ?p2
        :p1;


    bombardments.push({

        owner:player,

        x:target.x,

        y:target.y,

        timer:1.4,

        hit:false
    });
}


function updateBombardments(dt){

    /*
       중요:
       여기서는 배열을 안전하게 순회한다.
       한 번의 공격에서만 hit=true가 된다.
    */

    for(
        let i=bombardments.length-1;
        i>=0;
        i--
    ){

        const b=
            bombardments[i];


        b.timer-=dt/1000;


        if(
            b.timer<=.45 &&
            !b.hit
        ){

            b.hit=true;


            const target=
                b.owner===1
                ?p2
                :p1;


            const distance=
                Math.abs(
                    target.x-b.x
                );


            if(
                distance<=.20
            ){

                damagePlayer(
                    target,
                    42
                );


                addHitEffect(
                    target.x,
                    target.y
                );
            }
        }


        if(
            b.timer<=0
        ){

            bombardments.splice(
                i,
                1
            );
        }
    }
}


/* =====================================================
   MECHA ULT
===================================================== */

function createMechaExplosion(
    player
){

    const p=
        player===1
        ?p1
        :p2;


    explosions.push({

        owner:player,

        x:p.x,

        y:
            player===1
            ?.53
            :.47,

        timer:1,

        hit:false
    });
}


function updateExplosions(dt){

    for(
        let i=explosions.length-1;
        i>=0;
        i--
    ){

        const ex=
            explosions[i];


        ex.timer-=dt/1000;


        if(
            ex.timer<=.45 &&
            !ex.hit
        ){

            ex.hit=true;


            const target=
                ex.owner===1
                ?p2
                :p1;


            const distance=
                Math.abs(
                    target.x-ex.x
                );


            if(
                distance<=.25
            ){

                damagePlayer(
                    target,
                    48
                );


                addHitEffect(
                    target.x,
                    target.y
                );
            }
        }


        if(
            ex.timer<=0
        ){

            explosions.splice(
                i,
                1
            );
        }
    }
}


/* =====================================================
   PLAYER UPDATE
===================================================== */

function updatePlayer(
    p,
    dt
){

    if(
        !battleRunning
    ){
        return;
    }


    const direction=
        (p.right?1:0)-
        (p.left?1:0);


    let speed=
        p.hero.speed;


    if(
        p.speedBoost>0
    ){

        speed*=1.75;
    }


    p.x+=
        direction*
        speed*
        dt;


    /* 돌진 */

    if(
        p.dashTimer>0
    ){

        p.x+=
            p.dashDirection*
            .00065*
            dt;

        p.dashTimer-=
            dt/1000;
    }


    p.x=
        Math.max(
            .14,
            Math.min(
                .86,
                p.x
            )
        );


    /* 쿨타임 */

    if(p.skill1Timer>0)
        p.skill1Timer-=dt/1000;

    if(p.skill2Timer>0)
        p.skill2Timer-=dt/1000;

    if(p.speedBoost>0)
        p.speedBoost-=dt/1000;

    if(p.powerTimer>0)
        p.powerTimer-=dt/1000;

    if(p.armorTimer>0)
        p.armorTimer-=dt/1000;

    if(p.invincible>0)
        p.invincible-=dt/1000;

    if(p.beatTimer>0)
        p.beatTimer-=dt/1000;

    if(p.normalTimer>0)
        p.normalTimer-=dt;
}


/* =====================================================
   EFFECTS
===================================================== */

function addEffect(
    x,
    y,
    type
){

    effects.push({

        x:x,

        y:y,

        type:type,

        life:1
    });
}


function addHitEffect(
    x,
    y
){

    effects.push({

        x:x,

        y:y,

        type:"hit",

        life:.6
    });
}


function updateEffects(dt){

    for(
        let i=effects.length-1;
        i>=0;
        i--
    ){

        effects[i].life
            -=dt/700;


        if(
            effects[i].life<=0
        ){

            effects.splice(
                i,
                1
            );
        }
    }
}


/* =====================================================
   DRAW BACKGROUND
===================================================== */

function drawBackground(){

    ctx.fillStyle="#cbb891";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.fillStyle="#aabd8e";


    for(
        let i=0;
        i<45;
        i++
    ){

        const x=
            (i*173)%W;

        const y=
            50+
            (i*97)%(H*.38);


        ctx.fillRect(
            x,
            y,
            13,
            4
        );
    }


    for(
        let i=0;
        i<45;
        i++
    ){

        const x=
            (i*211)%W;

        const y=
            H*.60+
            (i*83)%(H*.32);


        ctx.fillRect(
            x,
            y,
            13,
            4
        );
    }


    /* 가운데 강 */

    const riverY=
        H*.495;


    ctx.strokeStyle="#287fc1";

    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(
        0,
        riverY
    );

    ctx.lineTo(
        W,
        riverY
    );

    ctx.stroke();


    ctx.strokeStyle="#75c7ef";

    ctx.lineWidth=2;


    for(
        let x=25;
        x<W;
        x+=100
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            riverY
        );

        ctx.lineTo(
            x+38,
            riverY
        );

        ctx.stroke();
    }
}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer(
    p,
    number
){

    const hero=
        p.hero;


    const x=
        p.x*W;

    const y=
        p.y*H;


    const s=
        Math.max(
            .7,
            Math.min(
                1.25,
                Math.min(W,H)/650
            )
        );


    /* shield */

    if(
        p.armorTimer>0 ||
        p.beatTimer>0
    ){

        ctx.strokeStyle=
            p.beatTimer>0
            ?" #f4d65c"
            :"#72d8ff";

        ctx.lineWidth=5;

        ctx.globalAlpha=.65;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            43*s,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.globalAlpha=1;
    }


    /* shadow */

    ctx.fillStyle=
        "rgba(0,0,0,.2)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+32*s,
        25*s,
        8*s,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* body */

    ctx.fillStyle=
        hero.color;

    ctx.fillRect(
        x-17*s,
        y-17*s,
        34*s,
        35*s
    );


    ctx.strokeStyle="#172033";

    ctx.lineWidth=4*s;

    ctx.strokeRect(
        x-17*s,
        y-17*s,
        34*s,
        35*s
    );


    /* head */

    ctx.fillStyle="#ffd0a8";

    ctx.fillRect(
        x-16*s,
        y-43*s,
        32*s,
        26*s
    );


    ctx.strokeStyle="#172033";

    ctx.strokeRect(
        x-16*s,
        y-43*s,
        32*s,
        26*s
    );


    /* character-specific */

    if(
        hero.type==="lucid"
    ){

        ctx.fillStyle="#27384d";

        ctx.fillRect(
            x-19*s,
            y-46*s,
            38*s,
            9*s
        );

        ctx.fillRect(
            x-22*s,
            y-39*s,
            5*s,
            13*s
        );
    }


    if(
        hero.type==="iron"
    ){

        ctx.fillStyle="#405b46";

        ctx.fillRect(
            x-19*s,
            y-48*s,
            38*s,
            15*s
        );
    }


    if(
        hero.type==="mecha"
    ){

        ctx.fillStyle="#f1a2ca";

        ctx.fillRect(
            x-19*s,
            y-47*s,
            38*s,
            10*s
        );
    }


    /* legs */

    ctx.fillStyle="#30394e";

    ctx.fillRect(
        x-12*s,
        y+15*s,
        9*s,
        19*s
    );

    ctx.fillRect(
        x+3*s,
        y+15*s,
        9*s,
        19*s
    );


    /* arms */

    ctx.fillStyle="#ffd0a8";

    ctx.fillRect(
        x-27*s,
        y-10*s,
        11*s,
        9*s
    );

    ctx.fillRect(
        x+16*s,
        y-10*s,
        11*s,
        9*s
    );


    /* player label */

    ctx.fillStyle="white";

    ctx.font=
        "bold "+
        Math.max(
            12,
            17*s
        )+
        "px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        number+"P",
        x,
        y-54*s
    );
}


/* =====================================================
   DRAW PROJECTILES
===================================================== */

function drawProjectile(b){

    const x=b.x*W;
    const y=b.y*H;


    ctx.save();


    ctx.shadowBlur=
        b.skill
        ?22
        :12;


    ctx.shadowColor=
        b.type==="blue"
        ?" #45c8ff"
        :"#ff5068";


    ctx.fillStyle=
        b.type==="blue"
        ?"#45c8ff"
        :"#ff5068";


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        b.radius,
        0,
        Math.PI*2
    );

    ctx.fill();


    if(
        b.skill
    ){

        ctx.strokeStyle=
            "#ffffff";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            b.radius+7,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }


    ctx.restore();
}

            );

                0,

            );

        );

){

        document.getElementById(id);

        skillNumber===1
        ?p.skill1Timer
        :p.skill2Timer;


    const name=
        skillNumber===1
        ?p.hero.skill1
        :p.hero.skill2;

    ){

        );

        );

function updateUltButton(
    id,
    p
){

        document.getElementById(id);


    if(
        p.ult>=100
    ){

        button.classList.remove(
            "cooldown"
        );

        button.textContent=
            p.hero.ult;

    }else{

        button.classList.add(
            "cooldown"
        );

        button.textContent=
            "궁 "+
            Math.floor(p.ult)+"%";
    }
}

/* 이동 */

document
.querySelectorAll(
    "[data-move]"
)
.forEach(button=>{

    const player=
        Number(
            button.dataset.player
        );

    const direction=
        button.dataset.move;


    function start(e){

        e.preventDefault();


        const p=
            player===1
            ?p1
            :p2;


        if(
            direction==="left"
        )
            p.left=true;


        if(
            direction==="right"
        )
            p.right=true;
    }


    function stop(e){

        e.preventDefault();


        const p=
            player===1
            ?p1
            :p2;


        if(
            direction==="left"
        )
            p.left=false;


        if(
            direction==="right"
        )
            p.right=false;
    }


    button.addEventListener(
        "pointerdown",
        start
    );

    button.addEventListener(
        "pointerup",
        stop
    );

    button.addEventListener(
        "pointercancel",
        stop
    );

    button.addEventListener(
        "pointerleave",
        stop
    );
});

function endBattle(
    winner
){

    if(gameEnded)
        return;


    gameEnded=true;

    battleRunning=false;


    document
    .getElementById("winnerText")
    .textContent=
        winner==="DRAW"
        ?"DRAW!"
        :winner+" WIN!";


    document
    .getElementById("endInfo")
    .textContent=
        winner==="DRAW"
        ?"시간 종료 · 무승부"
        :
        HEROES[
            winner==="1P"
            ?selected1
            :selected2
        ].name+
        " 승리";


    document
    .getElementById("endScreen")
    .classList.remove(
        "hidden"
    );
}

/* =====================================================
   ORIENTATION
===================================================== */

function checkOrientation(){

    let angle=0;


    if(
        screen.orientation &&
        typeof screen.orientation.angle==="number"
    ){

        angle=
            screen.orientation.angle;

    }else if(
        typeof window.orientation==="number"
    ){

        angle=
            window.orientation;
    }


    const board=
        document.getElementById("board");


    if(
        Math.abs(angle)===180
    ){

        board.classList.add(
            "rotate"
        );

    }else{

        board.classList.remove(
            "rotate"
        );
    }
}


checkOrientation();


if(
    screen.orientation
){

    screen.orientation.addEventListener(
        "change",
        checkOrientation
    );
}


window.addEventListener(
    "orientationchange",
    ()=>{

        setTimeout(
            resize,
            200
        );

        setTimeout(
            checkOrientation,
            250
        );
    }
);


/* =====================================================
   GAME LOOP
===================================================== */

let lastTime=
    performance.now();


function gameLoop(now){

    const dt=
        Math.min(
            32,
            now-lastTime
        );


    lastTime=now;


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawBackground();


    if(
        p1.hero &&
        p2.hero
    ){

        updatePlayer(
            p1,
            dt
        );

        updatePlayer(
            p2,
            dt
        );


        updateProjectiles(
            dt
        );

        updateBombardments(
            dt
        );

        updateExplosions(
            dt
        );

        updateEffects(
            dt
        );


        if(
            battleRunning &&
            !gameEnded
        ){

            matchTime-=
                dt/1000;


            if(
                matchTime<=0
            ){

                matchTime=0;


                if(
                    p1.hp>p2.hp
                ){

                    endBattle("1P");

                }else if(
                    p2.hp>p1.hp
                ){

                    endBattle("2P");

                }else{

                    endBattle("DRAW");
                }
            }
        }


        drawPlayer(
            p1,
            1
        );

        drawPlayer(
            p2,
            2
        );


        for(
            const b of projectiles
        ){

            drawProjectile(b);
        }


        drawEffects();

        drawBombardments();

        drawExplosions();


        updateUI();
    }


    requestAnimationFrame(
        gameLoop
    );
}


requestAnimationFrame(
    gameLoop
);
