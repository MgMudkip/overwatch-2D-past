<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">

<title>RIVER BATTLE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    position:fixed;
    inset:0;
    background:#101827;
}

button{
    touch-action:none;
    -webkit-tap-highlight-color:transparent;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#cbb891;
}

#board{
    position:absolute;
    inset:0;
    transform-origin:center center;
    transition:transform .25s ease;
}

#board.rotate{
    transform:rotate(180deg);
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

.screen{
    position:absolute;
    inset:0;
    z-index:500;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#101827;
    color:white;
    text-align:center;
}

.hidden{
    display:none!important;
}

.title{
    font-size:clamp(38px,8vw,75px);
    font-weight:900;
    letter-spacing:4px;
    text-shadow:5px 5px #05080e;
}

.sub{
    color:#9eafc4;
    margin:12px 0 30px;
}

.mainBtn{
    width:220px;
    height:65px;
    border:3px solid #7388a4;
    border-radius:14px;
    background:#31527f;
    color:white;
    font-size:21px;
    font-weight:bold;
}

.selectTitle{
    font-size:clamp(28px,5vw,45px);
    font-weight:900;
    margin-bottom:20px;
}

.selectArea{
    width:min(900px,94vw);
    display:flex;
    gap:15px;
}

.selectPlayer{
    flex:1;
    background:#192438;
    border:2px solid #50627a;
    border-radius:14px;
    padding:12px;
}

.selectPlayer h2{
    margin-bottom:10px;
}

.heroChoices{
    display:flex;
    gap:7px;
}

.heroCard{
    flex:1;
    padding:8px 3px;
    border:2px solid #586c85;
    border-radius:10px;
    background:#28374b;
    color:white;
}

.heroCard.selected{
    border-color:#ffe36a;
    box-shadow:0 0 0 2px #ffe36a inset;
}

.heroIcon{
    width:45px;
    height:45px;
    margin:auto;
    border-radius:9px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
}

.heroName{
    font-size:13px;
    font-weight:bold;
    margin-top:5px;
}

.heroRole{
    font-size:9px;
    color:#aab8ca;
    margin-top:3px;
}

.selectionText{
    margin:15px 0;
    color:#d6e0eb;
}

/* =========================
   HP
========================= */

.hp{
    position:absolute;
    width:30%;
    min-width:180px;
    padding:7px 10px;
    background:#172235;
    border:3px solid #53647c;
    border-radius:12px;
    color:white;
    z-index:60;
}

#hp1{
    left:2%;
    top:2%;
}

#hp2{
    right:2%;
    bottom:2%;
}

.hpHead{
    display:flex;
    justify-content:space-between;
    font:bold 14px Arial;
    margin-bottom:5px;
}

.hpBack{
    height:18px;
    background:#343e50;
    border-radius:5px;
    overflow:hidden;
}

.hpBar{
    height:100%;
}

#hpBar1{
    background:#39d878;
}

#hpBar2{
    background:#ed5666;
}

.ultBack{
    height:9px;
    background:#343e50;
    border-radius:5px;
    overflow:hidden;
    margin-top:5px;
}

.ultBar{
    height:100%;
    width:0%;
    background:#f4d65c;
}

/* =========================
   양손 조작
========================= */

/*
   왼쪽 = 이동
   오른쪽 = 공격/스킬
*/

.controlZone{
    position:absolute;
    z-index:100;
}

#move1{
    left:2%;
    top:25%;
}

#attack1{
    right:2%;
    top:23%;
}

#move2{
    right:2%;
    bottom:25%;
}

#attack2{
    left:2%;
    bottom:23%;
}

.movePad{
    width:190px;
    height:150px;
    position:relative;
}

.moveBtn{
    position:absolute;
    width:72px;
    height:72px;
    border-radius:50%;
    border:4px solid #70839d;
    background:#26364c;
    color:white;
    font-size:28px;
    font-weight:bold;
    box-shadow:0 6px #0d1420;
}

.moveBtn:active{
    transform:translateY(5px);
    box-shadow:none;
}

.moveLeft{
    left:0;
    top:39px;
}

.moveRight{
    right:0;
    top:39px;
}

.attackPad{
    width:275px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.gameBtn{
    width:82px;
    height:63px;
    border:3px solid #62738c;
    border-radius:13px;
    background:#29374d;
    color:white;
    font-weight:bold;
    font-size:12px;
    box-shadow:0 5px #0d1420;
}

.gameBtn:active{
    transform:translateY(5px);
    box-shadow:none;
}

.attack{
    background:#394c64;
}

.skill1{
    background:#59416d;
    border-color:#9273b1;
}

.skill2{
    background:#3d5875;
    border-color:#7898ba;
}

.ult{
    background:#665827;
    border-color:#d7bd56;
}

.cooldown{
    background:#343a46!important;
    border-color:#626b78!important;
    color:#aeb5bf;
}

/* 회전 후 상대 기준 */

#board.rotate #move1{
    left:auto;
    right:2%;
    top:auto;
    bottom:25%;
}

#board.rotate #attack1{
    right:auto;
    left:2%;
    top:auto;
    bottom:23%;
}

#board.rotate #move2{
    right:auto;
    left:2%;
    bottom:auto;
    top:25%;
}

#board.rotate #attack2{
    left:auto;
    right:2%;
    bottom:auto;
    top:23%;
}

#center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:70;
    text-align:center;
    color:white;
    font:bold 26px Arial;
    text-shadow:3px 3px #172033;
    pointer-events:none;
}

#timer{
    color:#f4e7a1;
    font-size:17px;
    margin-top:5px;
}

#countdown{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:150;
    color:white;
    font-size:clamp(55px,12vw,110px);
    font-weight:900;
    text-shadow:6px 6px #101827;
    pointer-events:none;
}

#rotateBtn{
    position:absolute;
    left:50%;
    top:55%;
    transform:translate(-50%,-50%);
    z-index:90;
    width:40px;
    height:40px;
    border-radius:50%;
    border:2px solid #66758c;
    background:#263248;
    color:white;
    font-size:20px;
    opacity:.6;
}

#portrait{
    display:none;
    position:absolute;
    inset:0;
    z-index:1000;
    background:#101827;
    color:white;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

@media(orientation:portrait){
    #portrait{
        display:flex;
    }
}

@media(max-width:850px){

    .movePad{
        width:165px;
    }

    .attackPad{
        width:250px;
    }

    .gameBtn{
        width:76px;
        height:59px;
    }

    .moveBtn{
        width:68px;
        height:68px;
    }

    .hp{
        min-width:155px;
    }
}
</style>
</head>

<body>

<div id="game">

<div id="board">

<canvas id="canvas"></canvas>

<!-- =========================
     HP
========================= -->

<div class="hp" id="hp1">
    <div class="hpHead">
        <span id="name1">1P</span>
        <span id="hpText1">100 / 100</span>
    </div>

    <div class="hpBack">
        <div class="hpBar" id="hpBar1"></div>
    </div>

    <div class="ultBack">
        <div class="ultBar" id="ultBar1"></div>
    </div>
</div>


<div class="hp" id="hp2">
    <div class="hpHead">
        <span id="name2">2P</span>
        <span id="hpText2">100 / 100</span>
    </div>

    <div class="hpBack">
        <div class="hpBar" id="hpBar2"></div>
    </div>

    <div class="ultBack">
        <div class="ultBar" id="ultBar2"></div>
    </div>
</div>


<!-- =========================
     1P 이동
========================= -->

<div class="controlZone" id="move1">

    <div class="movePad">

        <button
            class="moveBtn moveLeft"
            data-player="1"
            data-move="left">
            ◀
        </button>

        <button
            class="moveBtn moveRight"
            data-player="1"
            data-move="right">
            ▶
        </button>

    </div>

</div>


<!-- =========================
     1P 공격
========================= -->

<div class="controlZone" id="attack1">

    <div class="attackPad">

        <button
            class="gameBtn attack"
            data-player="1"
            data-action="attack">
            평타
        </button>

        <button
            class="gameBtn skill1"
            id="p1skill1">
            스킬1
        </button>

        <button
            class="gameBtn skill2"
            id="p1skill2">
            스킬2
        </button>

        <button
            class="gameBtn ult"
            id="p1ult"
            style="grid-column:2">
            궁극기
        </button>

    </div>

</div>


<!-- =========================
     2P 이동
========================= -->

<div class="controlZone" id="move2">

    <div class="movePad">

        <button
            class="moveBtn moveLeft"
            data-player="2"
            data-move="left">
            ◀
        </button>

        <button
            class="moveBtn moveRight"
            data-player="2"
            data-move="right">
            ▶
        </button>

    </div>

</div>


<!-- =========================
     2P 공격
========================= -->

<div class="controlZone" id="attack2">

    <div class="attackPad">

        <button
            class="gameBtn attack"
            data-player="2"
            data-action="attack">
            평타
        </button>

        <button
            class="gameBtn skill1"
            id="p2skill1">
            스킬1
        </button>

        <button
            class="gameBtn skill2"
            id="p2skill2">
            스킬2
        </button>

        <button
            class="gameBtn ult"
            id="p2ult"
            style="grid-column:2">
            궁극기
        </button>

    </div>

</div>


<div id="center">
    <div id="status">FIGHT!</div>
    <div id="timer">60</div>
</div>

<button id="rotateBtn">↻</button>

<div id="countdown"></div>

</div>


<!-- =========================
     시작
========================= -->

<div class="screen" id="startScreen">

    <div class="title">
        RIVER BATTLE
    </div>

    <div class="sub">
        HERO ARENA v2.2
    </div>

    <button class="mainBtn" id="startBtn">
        게임 시작
    </button>

</div>


<!-- =========================
     선택
========================= -->

<div class="screen hidden" id="selectScreen">

    <div class="selectTitle">
        HERO SELECT
    </div>

    <div class="selectArea">

        <div class="selectPlayer">

            <h2>1P</h2>

            <div
                class="heroChoices"
                id="choices1">
            </div>

        </div>

        <div class="selectPlayer">

            <h2>2P</h2>

            <div
                class="heroChoices"
                id="choices2">
            </div>

        </div>

    </div>

    <div
        class="selectionText"
        id="selectionText">
    </div>

    <button class="mainBtn" id="battleBtn">
        전투 시작
    </button>

</div>


<!-- =========================
     결과
========================= -->

<div class="screen hidden" id="endScreen">

    <div class="title" id="winnerText">
        1P WIN!
    </div>

    <div class="sub" id="endInfo"></div>

    <button class="mainBtn" id="againBtn">
        다시하기
    </button>

</div>


<div id="portrait">
    아이패드를 가로로 돌려주세요
</div>

</div>


<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;

function resize(){

    const dpr=Math.min(
        window.devicePixelRatio||1,
        2
    );

    W=window.innerWidth;
    H=window.innerHeight;

    canvas.width=W*dpr;
    canvas.height=H*dpr;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =========================
   HERO
========================= */

const HEROES={

    LUCID:{
        name:"루시드",
        icon:"♫",
        role:"기동 / 지원",
        hp:100,
        speed:.00030,
        damage:8,
        attackCooldown:420,
        projectileSpeed:.00045,
        skill1Name:"볼륨 업",
        skill1CD:5,
        skill2Name:"음파 충격",
        skill2CD:7,
        ultName:"비트",
        color:"#36b6e8",
        dark:"#187da7",
        type:"lucid"
    },

    IRON:{
        name:"아이언",
        icon:"▣",
        role:"화력 / 중장갑",
        hp:125,
        speed:.00017,
        damage:12,
        attackCooldown:850,
        projectileSpeed:.00030,
        skill1Name:"강습 모드",
        skill1CD:6,
        skill2Name:"철벽",
        skill2CD:8,
        ultName:"포격",
        color:"#6d8f72",
        dark:"#405b46",
        type:"iron"
    },

    MECHA:{
        name:"메카",
        icon:"◆",
        role:"방어 / 돌진",
        hp:110,
        speed:.00024,
        damage:7,
        attackCooldown:300,
        projectileSpeed:.00052,
        skill1Name:"부스터",
        skill1CD:5,
        skill2Name:"방어막",
        skill2CD:7,
        ultName:"과부하",
        color:"#db71a8",
        dark:"#934c78",
        type:"mecha"
    }

};


/* =========================
   PLAYER
========================= */

function newPlayer(){

    return{

        x:.5,
        y:0,

        hp:100,
        maxHp:100,

        ult:0,

        hero:null,

        left:false,
        right:false,

        attackTimer:0,

        skill1Timer:0,
        skill2Timer:0,

        powerTimer:0,
        speedTimer:0,
        armorTimer:0,
        dashTimer:0,
        dashDirection:0,
        invincibleTimer:0,
        beatTimer:0
    };
}

const p1=newPlayer();
const p2=newPlayer();

p1.y=.29;
p2.y=.71;


let selected1="LUCID";
let selected2="IRON";

let running=false;
let ended=false;

let timeLeft=60;

let projectiles=[];
let effects=[];

let lastTime=performance.now();


/* =========================
   선택 화면
========================= */

function makeHeroCard(
    key,
    player
){

    const hero=HEROES[key];

    const card=document.createElement("button");

    card.className="heroCard";

    card.innerHTML=`

        <div
            class="heroIcon"
            style="background:${hero.dark}">
            ${hero.icon}
        </div>

        <div class="heroName">
            ${hero.name}
        </div>

        <div class="heroRole">
            ${hero.role}
        </div>
    `;

    card.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            if(player===1)
                selected1=key;
            else
                selected2=key;

            updateCards();
        }
    );

    card.dataset.hero=key;
    card.dataset.player=player;

    return card;
}


function createCards(){

    const c1=
        document.getElementById("choices1");

    const c2=
        document.getElementById("choices2");

    c1.innerHTML="";
    c2.innerHTML="";

    for(const key in HEROES){

        c1.appendChild(
            makeHeroCard(key,1)
        );

        c2.appendChild(
            makeHeroCard(key,2)
        );
    }

    updateCards();
}


function updateCards(){

    document
    .querySelectorAll(".heroCard")
    .forEach(card=>{

        const player=
            Number(card.dataset.player);

        const selected=
            player===1
            ?selected1
            :selected2;

        card.classList.toggle(
            "selected",
            card.dataset.hero===selected
        );
    });

    document.getElementById(
        "selectionText"
    ).textContent=
        HEROES[selected1].name+
        " VS "+
        HEROES[selected2].name;
}

createCards();


/* =========================
   시작
========================= */

document
.getElementById("startBtn")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        document
        .getElementById("startScreen")
        .classList.add("hidden");

        document
        .getElementById("selectScreen")
        .classList.remove("hidden");
    }
);


/* =========================
   전투 준비
========================= */

function setupBattle(){

    p1.hero=HEROES[selected1];
    p2.hero=HEROES[selected2];

    p1.x=.5;
    p2.x=.5;

    p1.hp=p1.hero.hp;
    p2.hp=p2.hero.hp;

    p1.maxHp=p1.hero.hp;
    p2.maxHp=p2.hero.hp;

    p1.ult=0;
    p2.ult=0;

    p1.attackTimer=0;
    p2.attackTimer=0;

    p1.skill1Timer=0;
    p2.skill1Timer=0;

    p1.skill2Timer=0;
    p2.skill2Timer=0;

    p1.powerTimer=0;
    p2.powerTimer=0;

    p1.speedTimer=0;
    p2.speedTimer=0;

    p1.armorTimer=0;
    p2.armorTimer=0;

    p1.dashTimer=0;
    p2.dashTimer=0;

    p1.invincibleTimer=0;
    p2.invincibleTimer=0;

    p1.beatTimer=0;
    p2.beatTimer=0;

    projectiles=[];
    effects=[];

    timeLeft=60;

    running=false;
    ended=false;

    updateUI();
}


/* =========================
   카운트다운
========================= */

document
.getElementById("battleBtn")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        setupBattle();

        document
        .getElementById("selectScreen")
        .classList.add("hidden");

        startCountdown();
    }
);


function startCountdown(){

    const box=
        document.getElementById("countdown");

    let n=3;

    box.textContent=n;

    const interval=setInterval(
        ()=>{

            n--;

            if(n>0){

                box.textContent=n;

            }else{

                clearInterval(interval);

                box.textContent="FIGHT!";

                running=true;

                setTimeout(
                    ()=>{
                        box.textContent="";
                    },
                    700
                );
            }

        },
        800
    );
}


/* =========================
   공격
========================= */

function attack(playerNumber){

    if(!running || ended)
        return;

    const p=
        playerNumber===1
        ?p1
        :p2;

    if(p.attackTimer>0)
        return;

    p.attackTimer=
        p.hero.attackCooldown;

    let damage=p.hero.damage;

    if(p.powerTimer>0)
        damage*=1.6;

    projectiles.push({

        owner:playerNumber,

        x:p.x,
        y:p.y,

        direction:
            playerNumber===1
            ?1
            :-1,

        speed:p.hero.projectileSpeed,

        damage:damage,

        radius:
            p.hero.type==="iron"
            ?8
            :6,

        special:false
    });

    p.ult=
        Math.min(
            100,
            p.ult+4
        );
}


/* =========================
   스킬 1
========================= */

function useSkill1(playerNumber){

    if(!running || ended)
        return;

    const p=
        playerNumber===1
        ?p1
        :p2;

    if(p.skill1Timer>0)
        return;

    p.skill1Timer=
        p.hero.skill1CD;

    if(p.hero.type==="lucid"){

        p.speedTimer=3.5;

        effect(
            p.x,
            p.y,
            "speed"
        );

    }else if(
        p.hero.type==="iron"
    ){

        p.powerTimer=4;

        effect(
            p.x,
            p.y,
            "power"
        );

    }else{

        p.dashTimer=.55;

        p.dashDirection=
            playerNumber===1
            ?1
            :-1;

        p.invincibleTimer=.55;

        effect(
            p.x,
            p.y,
            "dash"
        );
    }
}


/* =========================
   스킬 2
========================= */

function useSkill2(playerNumber){

    if(!running || ended)
        return;

    const p=
        playerNumber===1
        ?p1
        :p2;

    if(p.skill2Timer>0)
        return;

    p.skill2Timer=
        p.hero.skill2CD;

    if(p.hero.type==="lucid"){

        projectiles.push({

            owner:playerNumber,

            x:p.x,
            y:p.y,

            direction:
                playerNumber===1
                ?1
                :-1,

            speed:.00075,

            damage:22,

            radius:14,

            special:true
        });

        effect(
            p.x,
            p.y,
            "wave"
        );

    }else if(
        p.hero.type==="iron"
    ){

        p.armorTimer=3;

        projectiles.push({

            owner:playerNumber,

            x:p.x,
            y:p.y,

            direction:
                playerNumber===1
                ?1
                :-1,

            speed:.00042,

            damage:15,

            radius:10,

            special:true
        });

        effect(
            p.x,
            p.y,
            "armor"
        );

    }else{

        p.armorTimer=2.5;
        p.invincibleTimer=.35;

        effect(
            p.x,
            p.y,
            "shield"
        );
    }
}


/* =========================
   궁극기
========================= */

function useUltimate(playerNumber){

    if(!running || ended)
        return;

    const p=
        playerNumber===1
        ?p1
        :p2;

    if(p.ult<100)
        return;

    p.ult=0;


    if(p.hero.type==="lucid"){

        p.beatTimer=5;

        p.hp=
            Math.min(
                p.maxHp,
                p.hp+30
            );

        effect(
            p.x,
            p.y,
            "beat"
        );

    }else if(
        p.hero.type==="iron"
    ){

        const target=
            playerNumber===1
            ?p2
            :p1;

        const targetX=target.x;

        if(
            Math.abs(
                targetX-p.x
            )<=.32
        ){

            damagePlayer(
                target,
                45
            );
        }

        effect(
            targetX,
            target.y,
            "bombard"
        );

        effect(
            Math.max(
                .1,
                targetX-.13
            ),
            target.y,
            "bombard"
        );

        effect(
            Math.min(
                .9,
                targetX+.13
            ),
            target.y,
            "bombard"
        );

    }else{

        const target=
            playerNumber===1
            ?p2
            :p1;

        if(
            Math.abs(
                target.x-p.x
            )<=.35
        ){

            damagePlayer(
                target,
                48
            );
        }

        effect(
            p.x,
            playerNumber===1
            ?.53
            :.47,
            "explosion"
        );
    }
}


/* =========================
   데미지
========================= */

function damagePlayer(
    target,
    damage
){

    if(ended)
        return;

    if(target.invincibleTimer>0)
        return;

    if(target.armorTimer>0)
        damage*=.35;

    if(target.beatTimer>0)
        damage*=.65;

    target.hp=
        Math.max(
            0,
            target.hp-damage
        );

    const attacker=
        target===p1
        ?p2
        :p1;

    attacker.ult=
        Math.min(
            100,
            attacker.ult+8
        );

    target.ult=
        Math.min(
            100,
            target.ult+5
        );

    if(target.hp<=0){

        endBattle(
            target===p1
            ?"2P"
            :"1P"
        );
    }
}


/* =========================
   발사체
========================= */

function updateProjectiles(dt){

    for(
        let i=projectiles.length-1;
        i>=0;
        i--
    ){

        const b=projectiles[i];

        const oldY=b.y;

        b.y+=
            b.direction*
            b.speed*
            dt;

        const target=
            b.owner===1
            ?p2
            :p1;

        const minY=
            Math.min(
                oldY,
                b.y
            );

        const maxY=
            Math.max(
                oldY,
                b.y
            );

        const yHit=
            target.y>=minY-.06 &&
            target.y<=maxY+.06;

        const xHit=
            Math.abs(
                target.x-b.x
            )<=
            (
                b.special
                ?.11
                :.08
            );

        if(yHit && xHit){

            damagePlayer(
                target,
                b.damage
            );

            effect(
                target.x,
                target.y,
                "hit"
            );

            projectiles.splice(
                i,
                1
            );

            continue;
        }

        if(
            b.y<-.15 ||
            b.y>1.15
        ){

            projectiles.splice(
                i,
                1
            );
        }
    }
}


/* =========================
   플레이어 업데이트
========================= */

function updatePlayer(
    p,
    dt
){

    if(!running)
        return;

    let direction=0;

    if(p.left)
        direction--;

    if(p.right)
        direction++;

    let speed=p.hero.speed;

    if(p.speedTimer>0)
        speed*=1.75;

    p.x+=
        direction*
        speed*
        dt;

    if(p.dashTimer>0){

        p.x+=
            p.dashDirection*
            .00065*
            dt;
    }

    p.x=
        Math.max(
            .12,
            Math.min(
                .88,
                p.x
            )
        );

    if(p.attackTimer>0)
        p.attackTimer-=dt;

    if(p.skill1Timer>0)
        p.skill1Timer-=dt/1000;

    if(p.skill2Timer>0)
        p.skill2Timer-=dt/1000;

    if(p.speedTimer>0)
        p.speedTimer-=dt/1000;

    if(p.powerTimer>0)
        p.powerTimer-=dt/1000;

    if(p.armorTimer>0)
        p.armorTimer-=dt/1000;

    if(p.dashTimer>0)
        p.dashTimer-=dt/1000;

    if(p.invincibleTimer>0)
        p.invincibleTimer-=dt/1000;

    if(p.beatTimer>0)
        p.beatTimer-=dt/1000;
}


/* =========================
   효과
========================= */

function effect(
    x,
    y,
    type
){

    effects.push({
        x:x,
        y:y,
        type:type,
        life:1
    });
}


function updateEffects(dt){

    for(
        let i=effects.length-1;
        i>=0;
        i--
    ){

        effects[i].life-=dt/650;

        if(effects[i].life<=0){

            effects.splice(
                i,
                1
            );
        }
    }
}


/* =========================
   배경
========================= */

function drawBackground(){

    ctx.fillStyle="#cbb891";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    ctx.fillStyle="#aabd8e";

    for(
        let i=0;
        i<50;
        i++
    ){

        const x=(i*173)%W;
        const y=40+(i*97)%(H*.40);

        ctx.fillRect(
            x,
            y,
            13,
            4
        );
    }

    for(
        let i=0;
        i<50;
        i++
    ){

        const x=(i*211)%W;
        const y=H*.59+(i*83)%(H*.34);

        ctx.fillRect(
            x,
            y,
            13,
            4
        );
    }

    const riverY=H*.495;

    ctx.strokeStyle="#287fc1";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(
        0,
        riverY
    );

    ctx.lineTo(
        W,
        riverY
    );

    ctx.stroke();

    ctx.strokeStyle="#75c7ef";
    ctx.lineWidth=2;

    for(
        let x=20;
        x<W;
        x+=100
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            riverY
        );

        ctx.lineTo(
            x+40,
            riverY
        );

        ctx.stroke();
    }
}


/* =========================
   캐릭터
========================= */

function drawPlayer(
    p,
    number
){

    const x=p.x*W;
    const y=p.y*H;

    const hero=p.hero;

    const scale=
        Math.max(
            .7,
            Math.min(
                1.25,
                Math.min(W,H)/650
            )
        );


    if(
        p.armorTimer>0 ||
        p.beatTimer>0
    ){

        ctx.strokeStyle=
            p.beatTimer>0
            ?" #f4d65c"
            :"#72d8ff";

        ctx.lineWidth=5;

        ctx.globalAlpha=.7;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            44*scale,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.globalAlpha=1;
    }


    ctx.fillStyle="rgba(0,0,0,.2)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+31*scale,
        25*scale,
        8*scale,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle=hero.color;

    ctx.fillRect(
        x-17*scale,
        y-17*scale,
        34*scale,
        35*scale
    );

    ctx.strokeStyle="#172033";

    ctx.lineWidth=4*scale;

    ctx.strokeRect(
        x-17*scale,
        y-17*scale,
        34*scale,
        35*scale
    );


    ctx.fillStyle="#ffd0a8";

    ctx.fillRect(
        x-16*scale,
        y-43*scale,
        32*scale,
        26*scale
    );

    ctx.strokeStyle="#172033";

    ctx.strokeRect(
        x-16*scale,
        y-43*scale,
        32*scale,
        26*scale
    );


    if(hero.type==="lucid"){

        ctx.fillStyle="#27384d";

        ctx.fillRect(
            x-20*scale,
            y-47*scale,
            40*scale,
            9*scale
        );

    }else if(hero.type==="iron"){

        ctx.fillStyle="#405b46";

        ctx.fillRect(
            x-20*scale,
            y-48*scale,
            40*scale,
            15*scale
        );

    }else{

        ctx.fillStyle="#f1a2ca";

        ctx.fillRect(
            x-20*scale,
            y-48*scale,
            40*scale,
            10*scale
        );
    }


    ctx.fillStyle="#30394e";

    ctx.fillRect(
        x-12*scale,
        y+15*scale,
        9*scale,
        19*scale
    );

    ctx.fillRect(
        x+3*scale,
        y+15*scale,
        9*scale,
        19*scale
    );


    ctx.fillStyle="#ffd0a8";

    ctx.fillRect(
        x-27*scale,
        y-10*scale,
        11*scale,
        9*scale
    );

    ctx.fillRect(
        x+16*scale,
        y-10*scale,
        11*scale,
        9*scale
    );


    ctx.fillStyle="white";

    ctx.font=
        "bold "+
        Math.max(
            12,
            17*scale
        )+
        "px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        number+"P",
        x,
        y-56*scale
    );
}


/* =========================
   발사체
========================= */

function drawProjectiles(){

    for(
        const b of projectiles
    ){

        const x=b.x*W;
        const y=b.y*H;

        ctx.save();

        ctx.shadowBlur=
            b.special
            ?22
            :12;

        ctx.shadowColor=
            b.owner===1
            ?" #45c8ff"
            :"#ff5068";

        ctx.fillStyle=
            b.owner===1
            ?" #45c8ff"
            :"#ff5068";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            b.radius,
            0,
            Math.PI*2
        );

        ctx.fill();

        if(b.special){

            ctx.strokeStyle="#ffffff";
            ctx.lineWidth=2;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                b.radius+7,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }

        ctx.restore();
    }
}


/* =========================
   효과
========================= */

function drawEffects(){

    for(
        const e of effects
    ){

        const x=e.x*W;
        const y=e.y*H;

        const alpha=Math.max(
            0,
            e.life
        );

        ctx.globalAlpha=alpha;


        if(e.type==="hit"){

            ctx.strokeStyle="#fff27b";
            ctx.lineWidth=4;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                10+(1-alpha)*35,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }


        if(e.type==="speed"){

            ctx.strokeStyle="#4ddcff";
            ctx.lineWidth=5;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                38+(1-alpha)*15,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }


        if(e.type==="power"){

            ctx.strokeStyle="#b4d27a";
            ctx.lineWidth=6;

            ctx.strokeRect(
                x-30,
                y-30,
                60,
                60
            );
        }


        if(
            e.type==="armor" ||
            e.type==="shield"
        ){

            ctx.strokeStyle="#72d8ff";
            ctx.lineWidth=7;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                45+(1-alpha)*10,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }


        if(e.type==="dash"){

            ctx.strokeStyle="#ff91c4";
            ctx.lineWidth=5;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                35+(1-alpha)*30,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }


        if(e.type==="wave"){

            ctx.strokeStyle="#72e7ff";
            ctx.lineWidth=5;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                20+(1-alpha)*55,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }


        if(e.type==="beat"){

            ctx.strokeStyle="#f4d65c";
            ctx.lineWidth=7;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                45+(1-alpha)*45,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }


        if(e.type==="bombard"){

            ctx.strokeStyle="#d5e883";
            ctx.lineWidth=7;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                20+(1-alpha)*65,
                0,
                Math.PI*2
            );

            ctx.stroke();

            ctx.fillStyle="rgba(100,130,80,.25)";

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                35+(1-alpha)*45,
                0,
                Math.PI*2
            );

            ctx.fill();
        }


        if(e.type==="explosion"){

            ctx.strokeStyle="#ffd85c";
            ctx.lineWidth=8;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                20+(1-alpha)*100,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }

        ctx.globalAlpha=1;
    }
}

function updateSkillButton(
    id,
    p,
    number
){

    const button=
        document.getElementById(id);

    const timer=
        number===1
        ?p.skill1Timer
        :p.skill2Timer;

    const name=
        number===1
        ?p.hero.skill1Name
        :p.hero.skill2Name;

    if(timer>0){

        button.classList.add(
            "cooldown"
        );

        button.innerHTML=
            name+
            "<br>"+
            timer.toFixed(1);

    }else{

        button.classList.remove(
            "cooldown"
        );

        button.textContent=name;
    }
}


function updateUltButton(
    id,
    p
){

    const button=
        document.getElementById(id);

    if(p.ult>=100){

        button.classList.remove(
            "cooldown"
        );

        button.textContent=
            p.hero.ultName;

    }else{

        button.classList.add(
            "cooldown"
        );

        button.textContent=
            "궁 "+
            Math.floor(p.ult)+
            "%";
    }
}

/* =========================
   게임 루프
========================= */

function loop(now){

    const dt=
        Math.min(
            32,
            now-lastTime
        );

    lastTime=now;

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawBackground();

    if(
        p1.hero &&
        p2.hero
    ){

        if(running && !ended){

            updatePlayer(
                p1,
                dt
            );

            updatePlayer(
                p2,
                dt
            );

            updateProjectiles(
                dt
            );

            updateEffects(
                dt
            );

            timeLeft-=dt/1000;

            if(timeLeft<=0){

                timeLeft=0;

                if(p1.hp>p2.hp)
                    endBattle("1P");

                else if(p2.hp>p1.hp)
                    endBattle("2P");

                else
                    endBattle("DRAW");
            }
        }

        drawPlayer(
            p1,
            1
        );

        drawPlayer(
            p2,
            2
        );

        drawProjectiles();

        drawEffects();

        updateUI();
    }

    requestAnimationFrame(
        loop
    );
}

requestAnimationFrame(
    loop
);


/* =========================
   기기 회전
========================= */

function orientationCheck(){

    let angle=0;

    if(
        screen.orientation &&
        typeof screen.orientation.angle==="number"
    ){

        angle=
            screen.orientation.angle;
    }

    const board=
        document.getElementById("board");

    if(Math.abs(angle)===180){

        board.classList.add("rotate");

    }else{

        board.classList.remove("rotate");
    }
}

orientationCheck();

window.addEventListener(
    "orientationchange",
    ()=>{
        setTimeout(
            ()=>{
                resize();
                orientationCheck();
            },
            200
        );
    }
);

</script>
