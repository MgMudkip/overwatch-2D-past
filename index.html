<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>OVERDUEL</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:manipulation;
}

button{
  font-family:inherit;
  border:0;
  touch-action:manipulation;
}

#app{
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

#game{
  position:relative;
  width:min(1200px,100vw);
  height:min(700px,100vh);
  overflow:hidden;
  background:#d9b66e;
}

/* =========================
   ARENA
========================= */

.arena{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%,#ead18c 0 2px,transparent 3px),
    radial-gradient(circle at 70% 65%,#c9a45f 0 2px,transparent 3px),
    radial-gradient(circle at 45% 80%,#ecd391 0 2px,transparent 3px),
    #d8b56b;
  background-size:90px 90px,130px 130px,110px 110px,auto;
}

.wall{
  position:absolute;
  z-index:2;
  background:
    linear-gradient(135deg,#b9783d,#d19a52 45%,#a96738);
  border:4px solid #774525;
  box-shadow:
    inset 0 4px 0 #e0ae69,
    inset 0 -5px 0 #8d512d;
}

.wall.top{
  left:0;
  top:0;
  width:100%;
  height:48px;
}

.wall.bottom{
  left:0;
  bottom:0;
  width:100%;
  height:48px;
}

.wall.left{
  left:0;
  top:44px;
  bottom:44px;
  width:42px;
}

.wall.right{
  right:0;
  top:44px;
  bottom:44px;
  width:42px;
}

/* =========================
   HUD
========================= */

.hud{
  position:absolute;
  z-index:20;
  left:45px;
  right:45px;
  top:5px;
  height:70px;
  pointer-events:none;
}

.hudSide{
  position:absolute;
  top:7px;
  width:37%;
}

.hudSide.left{
  left:0;
}

.hudSide.right{
  right:0;
  text-align:right;
}

.hpText{
  height:19px;
  font-size:13px;
  font-weight:900;
  color:#fff;
  text-shadow:0 2px 2px #000;
}

.hpBar{
  position:relative;
  height:18px;
  background:#44251c;
  border:2px solid #211612;
  border-radius:5px;
  overflow:hidden;
}

.hpFill{
  height:100%;
  width:100%;
  background:#e34c3d;
  transition:width .12s linear;
}

.ultBar{
  margin-top:4px;
  height:9px;
  background:#5d4930;
  border:2px solid #322619;
  border-radius:5px;
  overflow:hidden;
}

.ultFill{
  height:100%;
  width:0%;
  background:#f2c94c;
  transition:width .12s linear;
}

.timer{
  position:absolute;
  left:50%;
  top:4px;
  transform:translateX(-50%);
  min-width:74px;
  height:43px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#30343a;
  border:4px solid #1b1d20;
  clip-path:polygon(
    18% 0,82% 0,
    100% 25%,100% 75%,
    82% 100%,18% 100%,
    0 75%,0 25%
  );
  color:#fff;
  font-size:25px;
  font-weight:1000;
  text-shadow:0 2px 2px #000;
}

.logo{
  position:absolute;
  right:5px;
  top:49px;
  color:#ffd34d;
  font-size:20px;
  font-weight:1000;
  letter-spacing:1px;
  text-shadow:
    2px 2px 0 #542e18,
    -1px -1px 0 #fff1a0;
}

/* =========================
   CHARACTERS
========================= */

.character{
  position:absolute;
  z-index:8;
  width:78px;
  height:90px;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.tag{
  position:absolute;
  top:-22px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  font-weight:1000;
  padding:2px 7px;
  border-radius:5px;
  color:white;
  text-shadow:0 1px 2px #000;
}

.p1 .tag{
  background:#2878d8;
}

.p2 .tag{
  background:#d93d4b;
}

.marker{
  position:absolute;
  top:-9px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:6px solid transparent;
  border-right:6px solid transparent;
  border-top:8px solid #2878d8;
}

.p2 .marker{
  border-top-color:#d93d4b;
}

.body{
  position:absolute;
  left:15px;
  top:25px;
  width:48px;
  height:49px;
  border-radius:16px 16px 13px 13px;
  border:3px solid #222;
  box-shadow:inset 0 5px 0 #ffffff55;
}

.head{
  position:absolute;
  left:18px;
  top:6px;
  width:42px;
  height:35px;
  border-radius:15px 15px 11px 11px;
  border:3px solid #222;
  z-index:2;
}

.visor{
  position:absolute;
  left:5px;
  top:8px;
  width:26px;
  height:10px;
  border-radius:8px;
  background:#20252b;
  border:2px solid #111;
}

.eye{
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#fff;
  top:11px;
}

.eye.one{
  left:10px;
}

.eye.two{
  left:20px;
}

.arm{
  position:absolute;
  top:34px;
  width:15px;
  height:31px;
  border:3px solid #222;
  border-radius:10px;
}

.arm.left{
  left:1px;
  transform:rotate(18deg);
}

.arm.right{
  right:1px;
  transform:rotate(-18deg);
}

.leg{
  position:absolute;
  top:65px;
  width:15px;
  height:25px;
  border:3px solid #222;
  border-radius:8px;
}

.leg.left{
  left:20px;
}

.leg.right{
  right:20px;
}

/* Lucio */

.lucio .body{
  background:#2b9b55;
}

.lucio .head{
  background:#dce6e4;
}

.lucio .visor{
  background:#48d86d;
}

.lucio .arm,
.lucio .leg{
  background:#252a2d;
}

.lucio .head:before,
.lucio .head:after{
  content:"";
  position:absolute;
  width:10px;
  height:15px;
  background:#38b85b;
  top:-10px;
  border:2px solid #222;
  border-radius:8px;
}

.lucio .head:before{
  left:2px;
}

.lucio .head:after{
  right:2px;
}

/* Bastion */

.bastion .body{
  background:#68705e;
  border-radius:8px;
}

.bastion .head{
  background:#79816e;
  border-radius:8px 8px 4px 4px;
}

.bastion .visor{
  width:8px;
  height:8px;
  left:15px;
  top:10px;
  background:#e7e7d2;
  border-radius:50%;
}

.bastion .arm,
.bastion .leg{
  background:#50584d;
  border-radius:5px;
}

.bastion .body:after{
  content:"";
  position:absolute;
  left:17px;
  top:15px;
  width:14px;
  height:22px;
  background:#333a33;
  border:2px solid #222;
}

/* D.Va */

.dva .body{
  background:#dce5ee;
}

.dva .head{
  background:#f0f4f7;
}

.dva .visor{
  background:#55b9dc;
}

.dva .arm,
.dva .leg{
  background:#7187a0;
}

.dva .body:after{
  content:"";
  position:absolute;
  left:16px;
  top:15px;
  width:13px;
  height:13px;
  background:#ec5c86;
  clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%);
}

/* =========================
   EFFECTS
========================= */

.projectile{
  position:absolute;
  z-index:7;
  width:13px;
  height:13px;
  border-radius:50%;
  pointer-events:none;
}

.projLucio{
  background:#53f06c;
  box-shadow:0 0 13px #53f06c;
}

.projBastion{
  width:14px;
  height:14px;
  background:#d9e3c5;
  box-shadow:0 0 12px #f5ffce;
}

.projDva{
  width:10px;
  height:10px;
  background:#ff76b0;
  box-shadow:0 0 12px #ff76b0;
}

.wave{
  position:absolute;
  z-index:6;
  width:30px;
  height:30px;
  border:4px solid #5aff70;
  border-radius:50%;
  pointer-events:none;
  animation:wave .35s linear forwards;
}

@keyframes wave{
  from{transform:scale(.5);opacity:1}
  to{transform:scale(1.7);opacity:0}
}

.hitEffect{
  position:absolute;
  z-index:15;
  width:30px;
  height:30px;
  border-radius:50%;
  border:4px solid #fff;
  animation:hit .22s ease-out forwards;
  pointer-events:none;
}

@keyframes hit{
  from{transform:scale(.3);opacity:1}
  to{transform:scale(1.5);opacity:0}
}

/* =========================
   LUCIO AURA
========================= */

.aura{
  position:absolute;
  z-index:4;
  width:150px;
  height:150px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:2px solid #48e56b66;
  background:#48e56b10;
  box-shadow:
    0 0 18px #48e56b22,
    inset 0 0 20px #48e56b14;
  pointer-events:none;
}

.aura.heal{
  border-color:#53e58a88;
  background:#53e58a14;
}

.aura.speed{
  border-color:#4de4e888;
  background:#4de4e812;
}

/* =========================
   D.VA MECHLESS
========================= */

.pilot{
  position:absolute;
  z-index:8;
  width:50px;
  height:60px;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.pilotBody{
  position:absolute;
  left:13px;
  top:21px;
  width:25px;
  height:30px;
  background:#f1e7ee;
  border:3px solid #222;
  border-radius:9px;
}

.pilotHead{
  position:absolute;
  left:13px;
  top:5px;
  width:25px;
  height:22px;
  background:#f5e9e8;
  border:3px solid #222;
  border-radius:10px;
}

.pilotHead:after{
  content:"";
  position:absolute;
  left:5px;
  top:6px;
  width:10px;
  height:5px;
  background:#5ebbd8;
  border-radius:5px;
}

.pilotArm{
  position:absolute;
  top:27px;
  width:8px;
  height:21px;
  background:#ed6e95;
  border:2px solid #222;
  border-radius:6px;
}

.pilotArm.left{
  left:6px;
  transform:rotate(15deg);
}

.pilotArm.right{
  right:6px;
  transform:rotate(-15deg);
}

/* =========================
   CONTROLS
========================= */

.controls{
  position:absolute;
  z-index:30;
  bottom:7px;
  left:12px;
  right:12px;
  height:106px;
  pointer-events:none;
}

.controlGroup{
  position:absolute;
  bottom:0;
  display:flex;
  gap:8px;
  align-items:end;
  pointer-events:auto;
}

.controlGroup.left{
  left:0;
}

.controlGroup.right{
  right:0;
}

.skill{
  width:64px;
  height:64px;
  border-radius:15px;
  border:3px solid #242424;
  box-shadow:
    inset 0 4px 0 #ffffffaa,
    0 4px 0 #0006;
  font-size:10px;
  font-weight:1000;
  color:#222;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
}

.skill:active{
  transform:translateY(3px);
  box-shadow:inset 0 2px 0 #ffffff88;
}

.skill .icon{
  font-size:25px;
  line-height:25px;
  margin-bottom:3px;
}

.basic{
  background:#eee;
}

.skill1{
  background:#4bc56b;
}

.skill2{
  background:#4b9ce8;
}

.ult{
  background:#f2c844;
}

.skill.cooldown{
  filter:grayscale(.65);
  opacity:.65;
}

.cooldownText{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:#0008;
  color:#fff;
  border-radius:12px;
  font-size:18px;
}

.skill.cooldown .cooldownText{
  display:flex;
}

.ammo{
  position:absolute;
  bottom:70px;
  height:28px;
  min-width:85px;
  padding:0 10px;
  background:#282828dd;
  border:2px solid #111;
  border-radius:8px;
  color:#fff;
  font-size:13px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
}

.controlGroup.left .ammo{
  left:0;
}

.controlGroup.right .ammo{
  right:0;
}

/* =========================
   SCREENS
========================= */

.screen{
  position:absolute;
  z-index:100;
  inset:0;
  background:#222c;
  display:flex;
  align-items:center;
  justify-content:center;
}

.panel{
  width:min(90%,620px);
  padding:28px;
  border:5px solid #5c3a22;
  border-radius:20px;
  background:#d8b46b;
  box-shadow:0 10px 0 #4a2c19;
  text-align:center;
}

.panel h1{
  margin:0 0 20px;
  color:#ffd44d;
  font-size:42px;
  font-weight:1000;
  text-shadow:3px 3px 0 #51301b;
}

.panel p{
  font-weight:900;
  color:#352417;
}

.startButton{
  margin-top:20px;
  padding:14px 35px;
  border-radius:12px;
  background:#f0c544;
  border:3px solid #50351f;
  box-shadow:0 4px 0 #50351f;
  font-size:20px;
  font-weight:1000;
  cursor:pointer;
}

.heroSelect{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
}

.heroChoice{
  width:125px;
  min-height:150px;
  padding:12px;
  border-radius:14px;
  background:#e9d09a;
  border:3px solid #664126;
  cursor:pointer;
}

.heroChoice.selected{
  outline:5px solid #ffd449;
  transform:translateY(-4px);
}

.heroPreview{
  width:70px;
  height:75px;
  margin:0 auto 8px;
  position:relative;
}

.heroChoice b{
  color:#352417;
}

.hidden{
  display:none!important;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){
  .hud{
    left:46px;
    right:46px;
  }

  .logo{
    display:none;
  }

  .skill{
    width:58px;
    height:58px;
  }

  .controlGroup{
    gap:5px;
  }

  .controls{
    height:96px;
  }

  .ammo{
    bottom:64px;
  }

  .timer{
    min-width:65px;
    height:38px;
    font-size:21px;
  }
}
</style>
</head>

<body>
<div id="app">

<div id="game">

  <div class="arena"></div>
  <div class="wall top"></div>
  <div class="wall bottom"></div>
  <div class="wall left"></div>
  <div class="wall right"></div>

  <!-- HUD -->
  <div class="hud">

    <div class="hudSide left">
      <div class="hpText">
        P1 <span id="p1HpText">100</span>
      </div>
      <div class="hpBar">
        <div id="p1Hp" class="hpFill"></div>
      </div>
      <div class="ultBar">
        <div id="p1Ult" class="ultFill"></div>
      </div>
    </div>

    <div class="hudSide right">
      <div class="hpText">
        <span id="p2HpText">100</span> P2
      </div>
      <div class="hpBar">
        <div id="p2Hp" class="hpFill"></div>
      </div>
      <div class="ultBar">
        <div id="p2Ult" class="ultFill"></div>
      </div>
    </div>

    <div id="timer" class="timer">90</div>
    <div class="logo">OVERDUEL</div>

  </div>

  <!-- characters are created by JS -->

  <div id="effects"></div>

  <!-- CONTROLS -->
  <div class="controls">

    <div id="controls1" class="controlGroup left">
      <div id="ammo1" class="ammo">● 18 / 18</div>

      <button class="skill basic" id="p1basic">
        <span class="icon">●</span>
        평타
        <span class="cooldownText"></span>
      </button>

      <button class="skill skill1" id="p1skill1">
        <span class="icon">〽</span>
        스킬 1
        <span class="cooldownText"></span>
      </button>

      <button class="skill skill2" id="p1skill2">
        <span class="icon">◉</span>
        스킬 2
        <span class="cooldownText"></span>
      </button>

      <button class="skill ult" id="p1ultBtn">
        <span class="icon">★</span>
        궁극기
        <span class="cooldownText"></span>
      </button>
    </div>

    <div id="controls2" class="controlGroup right">
      <div id="ammo2" class="ammo">● 18 / 18</div>

      <button class="skill basic" id="p2basic">
        <span class="icon">●</span>
        평타
        <span class="cooldownText"></span>
      </button>

      <button class="skill skill1" id="p2skill1">
        <span class="icon">⚡</span>
        스킬 1
        <span class="cooldownText"></span>
      </button>

      <button class="skill skill2" id="p2skill2">
        <span class="icon">⬡</span>
        스킬 2
        <span class="cooldownText"></span>
      </button>

      <button class="skill ult" id="p2ultBtn">
        <span class="icon">💥</span>
        궁극기
        <span class="cooldownText"></span>
      </button>
    </div>

  </div>

  <!-- START -->
  <div id="startScreen" class="screen">
    <div class="panel">
      <h1>OVERDUEL</h1>
      <p>90초 동안 상대를 쓰러뜨리세요.</p>

      <div class="heroSelect">

        <div class="heroChoice selected" data-p1="lucio">
          <div class="heroPreview lucio">
            <div class="body"></div>
            <div class="head"><div class="visor"></div></div>
          </div>
          <b>루시우</b>
        </div>

        <div class="heroChoice" data-p1="bastion">
          <div class="heroPreview bastion">
            <div class="body"></div>
            <div class="head"><div class="visor"></div></div>
          </div>
          <b>바스티온</b>
        </div>

        <div class="heroChoice" data-p1="dva">
          <div class="heroPreview dva">
            <div class="body"></div>
            <div class="head"><div class="visor"></div></div>
          </div>
          <b>D.Va</b>
        </div>

      </div>

      <button id="startButton" class="startButton">
        게임 시작
      </button>
    </div>
  </div>

  <!-- END -->
  <div id="endScreen" class="screen hidden">
    <div class="panel">
      <h1 id="endTitle">승리!</h1>
      <p id="endText"></p>
      <button id="restartButton" class="startButton">
        다시 시작
      </button>
    </div>
  </div>

</div>
</div>

<script>
/* =========================================================
   OVERDUEL
   gameplay patch
   - UI 유지
   - 90초
   - 자동 상하 이동
   - 평타 기본 쿨타임 0.5초
   - Lucio 항상 유지되는 오라
   - Lucio 스킬1 = 오라 효과 변경
   - Lucio 스킬2 = 음파
   - Lucio 궁극기 = 보호막
   - Bastion 스킬1 = 1초 동안 25HP 회복
   - Bastion 스킬2 = 전차 모드
   - Bastion 궁극기 = 3회 포격
   - D.Va 스킬1 = 좌우만 이동하는 부스터
   - D.Va 스킬2 = 방어
   - D.Va 궁극기 = 메카 투척 → 폭발
   - 메카가 없을 때 평타 사용 가능
   - 메카가 없을 때 궁극기 게이지 자동 충전
   - 게이지 100% → 메카 자동 복귀
========================================================= */

const game = document.getElementById("game");
const effects = document.getElementById("effects");

const GAME_TIME = 90;

let running = false;
let gameTime = GAME_TIME;
let lastFrame = performance.now();
let timerAccumulator = 0;

let selectedP1 = "lucio";
let selectedP2 = "dva";

let p1;
let p2;

const heroes = {
  lucio:{
    hp:100,
    maxHp:100,
    ammoMax:18,
    damage:10,
    speed:80,
    aura:true,
    auraMode:"heal"
  },

  bastion:{
    hp:130,
    maxHp:130,
    ammoMax:18,
    damage:13,
    speed:65,
    aura:false
  },

  dva:{
    hp:120,
    maxHp:120,
    ammoMax:18,
    damage:12,
    speed:70,
    aura:false
  }
};


/* =========================================================
   CHARACTER CREATION
========================================================= */

function createCharacter(id, hero, x, y){
  const el = document.createElement("div");

  el.id = id;
  el.className = "character " + hero;

  el.innerHTML = `
    <div class="tag">${id==="p1"?"P1":"P2"}</div>
    <div class="marker"></div>

    <div class="head">
      <div class="visor"></div>
      <i class="eye one"></i>
      <i class="eye two"></i>
    </div>

    <div class="body"></div>

    <div class="arm left"></div>
    <div class="arm right"></div>

    <div class="leg left"></div>
    <div class="leg right"></div>
  `;

  game.appendChild(el);

  return {
    id,
    hero,
    el,

    x,
    y,

    hp:heroes[hero].hp,
    maxHp:heroes[hero].maxHp,

    ammo:heroes[hero].ammoMax,
    maxAmmo:heroes[hero].ammoMax,

    ult:0,

    attackCooldown:0,

    skill1Cooldown:0,
    skill2Cooldown:0,
    ultCooldown:0,

    blocking:false,

    moveDirection:id==="p1"?1:-1,
    moveTimer:0,
    moveChangeTimer:.8+Math.random()*1.5,

    auraMode:"heal",

    healing:false,
    healTimer:0,

    tank:false,

    dvaMech:true,
    dvaRecallCharging:false,

    dashTimer:0,
    dashDirection:0,

    invincibleTimer:0,

    shieldTimer:0,
    shieldHp:0,

    alive:true
  };
}


/* =========================================================
   START
========================================================= */

function startGame(){

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("endScreen").classList.add("hidden");

  document.querySelectorAll(".character,.aura,.pilot,.projectile,.wave,.hitEffect")
    .forEach(e=>e.remove());

  p1=createCharacter(
    "p1",
    selectedP1,
    game.clientWidth*.25,
    game.clientHeight*.38
  );

  p2=createCharacter(
    "p2",
    selectedP2,
    game.clientWidth*.75,
    game.clientHeight*.62
  );

  gameTime=GAME_TIME;
  timerAccumulator=0;
  running=true;
  lastFrame=performance.now();

  setupAura(p1);

  updateUI();
  requestAnimationFrame(loop);
}


/* =========================================================
   AURA
========================================================= */

function setupAura(p){

  if(p.hero!=="lucio") return;

  const aura=document.createElement("div");

  aura.id=p.id+"Aura";
  aura.className="aura heal";

  game.appendChild(aura);

  p.auraEl=aura;
}

function updateAura(p){

  if(p.hero!=="lucio" || !p.auraEl) return;

  p.auraEl.style.left=p.x+"px";
  p.auraEl.style.top=p.y+"px";

  p.auraEl.className="aura "+p.auraMode;
}

function auraEffect(p,dt){

  if(p.hero!=="lucio") return;

  const other=p.id==="p1"?p2:p1;

  if(!other || !other.alive) return;

  /*
    스킬1은 오라 자체를 켜고 끄는 방식이 아니라
    항상 존재하는 오라의 효과만 변경한다.
  */

  if(p.auraMode==="heal"){

    if(distance(p,other)<=75){

      other.hp=Math.min(
        other.maxHp,
        other.hp+4*dt
      );
    }
  }

  if(p.auraMode==="speed"){

    /* 속도 보정은 movement()에서 처리 */
  }
}


/* =========================================================
   LOOP
========================================================= */

function loop(now){

  if(!running) return;

  const dt=Math.min(.05,(now-lastFrame)/1000);
  lastFrame=now;

  gameTime-=dt;

  if(gameTime<=0){

    gameTime=0;
    finishByTime();
    return;
  }

  updatePlayer(p1,p2,dt);
  updatePlayer(p2,p1,dt);

  auraEffect(p1,dt);
  auraEffect(p2,dt);

  updateUI();

  requestAnimationFrame(loop);
}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(p,enemy,dt){

  if(!p.alive) return;

  p.attackCooldown=Math.max(0,p.attackCooldown-dt);
  p.skill1Cooldown=Math.max(0,p.skill1Cooldown-dt);
  p.skill2Cooldown=Math.max(0,p.skill2Cooldown-dt);
  p.ultCooldown=Math.max(0,p.ultCooldown-dt);

  p.invincibleTimer=Math.max(0,p.invincibleTimer-dt);
  p.shieldTimer=Math.max(0,p.shieldTimer-dt);

  if(p.healing){

    p.healTimer-=dt;

    if(p.healTimer<=0){
      p.healing=false;
    }
  }

  if(p.dashTimer>0){

    p.x+=p.dashDirection*300*dt;

    p.dashTimer-=dt;

    if(p.dashTimer<=0){
      p.dashTimer=0;
      p.dashDirection=0;
    }

  }else{

    automaticVerticalMovement(p,dt);
  }

  clampPlayer(p);

  if(p.hero==="lucio"){
    updateAura(p);
  }

  p.el.style.left=p.x+"px";
  p.el.style.top=p.y+"px";

  if(p.invincibleTimer>0){
    p.el.style.opacity=(Math.floor(p.invincibleTimer*20)%2) ? ".35" : "1";
  }else{
    p.el.style.opacity="1";
  }

  if(p.tank){
    p.el.style.filter="sepia(.25) saturate(1.3)";
  }else{
    p.el.style.filter="";
  }

  if(p.shieldTimer<=0){
    p.shieldHp=0;
  }
}


/* =========================================================
   AUTOMATIC VERTICAL MOVEMENT
========================================================= */

function automaticVerticalMovement(p,dt){

  /*
    유저가 위/아래를 직접 조작하지 않는다.
    캐릭터가 자동으로 위아래 이동한다.
  */

  p.moveChangeTimer-=dt;

  if(p.moveChangeTimer<=0){

    p.moveDirection*=-1;

    p.moveChangeTimer=.7+Math.random()*1.7;
  }

  let speed=heroes[p.hero].speed;

  if(p.hero==="lucio" && p.auraMode==="speed"){
    speed*=1.35;
  }

  if(p.tank){
    speed*=.8;
  }

  p.y+=p.moveDirection*speed*dt;
}


/* =========================================================
   CLAMP
========================================================= */

function clampPlayer(p){

  const minY=105;
  const maxY=game.clientHeight-150;

  p.y=Math.max(minY,Math.min(maxY,p.y));

  const minX=70;
  const maxX=game.clientWidth-70;

  p.x=Math.max(minX,Math.min(maxX,p.x));
}


/* =========================================================
   BASIC ATTACK
========================================================= */

function basicAttack(p){

  if(!running || !p.alive) return;

  /*
    모든 영웅의 기본 공격 기본 쿨타임 0.5초.
    Bastion 전차 모드는 별도의 빠른 연사 모드.
  */

  const cooldown=p.tank?.17:.5;

  if(p.attackCooldown>0) return;

  if(p.ammo<=0){

    reload(p);
    return;
  }

  p.attackCooldown=cooldown;
  p.ammo--;

  const enemy=p.id==="p1"?p2:p1;

  fireProjectile(p,enemy);

  if(p.ammo<=0){
    setTimeout(()=>reload(p),150);
  }
}


/* =========================================================
   PROJECTILE
========================================================= */

function fireProjectile(p,enemy){

  const projectile=document.createElement("div");

  projectile.className="projectile "+
    (p.hero==="lucio"?"projLucio":
     p.hero==="bastion"?"projBastion":"projDva");

  projectile.style.left=p.x+"px";
  projectile.style.top=p.y+"px";

  effects.appendChild(projectile);

  const dir=p.id==="p1"?1:-1;
  let x=p.x;
  let y=p.y;

  const speed=p.tank?620:500;

  const start=performance.now();

  function move(now){

    if(!projectile.isConnected) return;

    const dt=(now-start)/1000;

    x=p.x+dir*speed*dt;

    projectile.style.left=x+"px";
    projectile.style.top=y+"px";

    if(enemy.alive && Math.abs(x-enemy.x)<34 && Math.abs(y-enemy.y)<42){

      projectile.remove();

      damage(
        p,
        enemy,
        p.tank?7:heroes[p.hero].damage
      );

      return;
    }

    if(x<-50 || x>game.clientWidth+50){
      projectile.remove();
      return;
    }

    requestAnimationFrame(move);
  }

  requestAnimationFrame(move);
}


/* =========================================================
   DAMAGE
========================================================= */

function damage(attacker,target,amount){

  if(!target.alive) return;

  if(target.blocking){
    amount=0;
  }

  if(target.invincibleTimer>0){
    amount=0;
  }

  if(target.shieldTimer>0){

    const absorbed=Math.min(target.shieldHp,amount);

    target.shieldHp-=absorbed;
    amount-=absorbed;

    if(target.shieldHp<=0){
      target.shieldTimer=0;
    }
  }

  if(amount<=0) return;

  /*
    회복 중인 Bastion은 맞으면 회복 취소
  */
  if(target.hero==="bastion" && target.healing){
    target.healing=false;
    target.healTimer=0;
  }

  target.hp-=amount;
  target.hp=Math.max(0,target.hp);

  /*
    공격으로 준 피해만 궁극기 게이지 증가.
    궁극기 자체의 피해는 호출하는 곳에서 충전하지 않는다.
  */
  attacker.ult=Math.min(
    100,
    attacker.ult+amount*.65
  );

  createHit(target);

  if(target.hp<=0){
    target.alive=false;
    target.el.style.opacity=".35";
    checkEnd();
  }
}


/* =========================================================
   HIT EFFECT
========================================================= */

function createHit(p){

  const e=document.createElement("div");

  e.className="hitEffect";
  e.style.left=(p.x-15)+"px";
  e.style.top=(p.y-15)+"px";

  effects.appendChild(e);

  setTimeout(()=>e.remove(),250);
}


/* =========================================================
   LUCIO SKILL 1
========================================================= */

function lucioSkill1(p){

  if(!running || !p.alive) return;
  if(p.hero!=="lucio") return;
  if(p.skill1Cooldown>0) return;

  /*
    오라를 생성하거나 삭제하지 않는다.
    이미 존재하는 오라의 효과만 바꾼다.
  */

  p.auraMode=
    p.auraMode==="heal"
    ?"speed"
    :"heal";

  p.skill1Cooldown=1;

  if(p.auraEl){
    p.auraEl.className="aura "+p.auraMode;
  }
}


/* =========================================================
   LUCIO SKILL 2
========================================================= */

function lucioSkill2(p){

  if(!running || !p.alive) return;
  if(p.hero!=="lucio") return;
  if(p.skill2Cooldown>0) return;

  p.skill2Cooldown=3;

  const enemy=p.id==="p1"?p2:p1;
  const dir=p.id==="p1"?1:-1;

  const wave=document.createElement("div");

  wave.className="wave";
  wave.style.left=(p.x+dir*25-15)+"px";
  wave.style.top=(p.y-15)+"px";

  effects.appendChild(wave);

  let x=p.x+dir*25;
  const speed=430;

  const start=performance.now();

  function move(now){

    if(!wave.isConnected) return;

    const dt=(now-start)/1000;

    x=p.x+dir*(25+speed*dt);

    wave.style.left=(x-15)+"px";
    wave.style.top=(p.y-15)+"px";

    if(enemy.alive &&
       Math.abs(x-enemy.x)<40 &&
       Math.abs(p.y-enemy.y)<55){

      wave.remove();

      damage(p,enemy,16);
      return;
    }

    if(x<0 || x>game.clientWidth){
      wave.remove();
      return;
    }

    requestAnimationFrame(move);
  }

  requestAnimationFrame(move);
}


/* =========================================================
   LUCIO ULT
========================================================= */

function lucioUlt(p){

  if(!running || !p.alive) return;
  if(p.hero!=="lucio") return;
  if(p.ult<100) return;

  p.ult=0;
  p.shieldHp=45;
  p.shieldTimer=5;
}


/* =========================================================
   BASTION SKILL 1
========================================================= */

function bastionSkill1(p){

  if(!running || !p.alive) return;
  if(p.hero!=="bastion") return;
  if(p.skill1Cooldown>0) return;
  if(p.tank) return;

  p.skill1Cooldown=5;
  p.healing=true;
  p.healTimer=1;

  const startHp=p.hp;

  function healTick(){

    if(!p.alive || !p.healing) return;

    const elapsed=1-p.healTimer;

    /*
      총 25HP를 정확히 1초 동안 회복
    */
    p.hp=Math.min(
      p.maxHp,
      startHp+25*elapsed
    );

    if(p.healTimer>0){
      requestAnimationFrame(healTick);
    }
  }

  healTick();

  setTimeout(()=>{

    if(p.healing){

      p.hp=Math.min(
        p.maxHp,
        startHp+25
      );

      p.healing=false;
    }

  },1000);
}


/* =========================================================
   BASTION SKILL 2 - TANK MODE
========================================================= */

function bastionSkill2(p){

  if(!running || !p.alive) return;
  if(p.hero!=="bastion") return;
  if(p.skill2Cooldown>0) return;

  /*
    스킬을 다시 누르면 전차 모드 종료.
  */

  p.tank=!p.tank;

  p.skill2Cooldown=.35;
}


/* =========================================================
   BASTION ULT
========================================================= */

function bastionUlt(p){

  if(!running || !p.alive) return;
  if(p.hero!=="bastion") return;
  if(p.ult<100) return;

  p.ult=0;

  const enemy=p.id==="p1"?p2:p1;

  /*
    3번의 포격.
    이 공격으로는 궁극기 게이지가 충전되지 않는다.
  */

  for(let i=0;i<3;i++){

    setTimeout(()=>{

      if(!running || !enemy.alive) return;

      const x=
        enemy.x+
        (Math.random()-.5)*90;

      const y=
        enemy.y+
        (Math.random()-.5)*90;

      const marker=document.createElement("div");

      marker.style.position="absolute";
      marker.style.zIndex="10";
      marker.style.left=(x-28)+"px";
      marker.style.top=(y-28)+"px";
      marker.style.width="56px";
      marker.style.height="56px";
      marker.style.border="4px solid #e44";
      marker.style.borderRadius="50%";
      marker.style.background="#e44 1";
      marker.style.boxShadow="0 0 20px #e44";

      effects.appendChild(marker);

      setTimeout(()=>{

        marker.remove();

        if(!enemy.alive) return;

        damageNoUltCharge(p,enemy,24);

      },450);

    },i*700);
  }
}


/* =========================================================
   DAMAGE WITHOUT ULT CHARGE
========================================================= */

function damageNoUltCharge(attacker,target,amount){

  if(!target.alive) return;

  if(target.blocking || target.invincibleTimer>0){
    return;
  }

  if(target.shieldTimer>0){

    const absorbed=Math.min(target.shieldHp,amount);

    target.shieldHp-=absorbed;
    amount-=absorbed;

    if(target.shieldHp<=0){
      target.shieldTimer=0;
    }
  }

  if(amount<=0) return;

  target.hp=Math.max(0,target.hp-amount);

  createHit(target);

  if(target.hp<=0){
    target.alive=false;
    target.el.style.opacity=".35";
    checkEnd();
  }
}


/* =========================================================
   D.VA SKILL 1
========================================================= */

function dvaSkill1(p){

  if(!running || !p.alive) return;
  if(p.hero!=="dva") return;
  if(!p.dvaMech) return;
  if(p.skill1Cooldown>0) return;

  /*
    중요:
    대시는 좌우만.
    자동 상하 이동값을 건드리지 않는다.
  */

  p.skill1Cooldown=3;

  const enemy=p.id==="p1"?p2:p1;

  let direction;

  if(Math.abs(enemy.x-p.x)>20){
    direction=enemy.x>p.x?1:-1;
  }else{
    direction=p.id==="p1"?1:-1;
  }

  p.dashDirection=direction;
  p.dashTimer=.32;

  p.invincibleTimer=.32;
}


/* =========================================================
   D.VA SKILL 2
========================================================= */

function dvaSkill2(p){

  if(!running || !p.alive) return;
  if(p.hero!=="dva") return;
  if(!p.dvaMech) return;
  if(p.skill2Cooldown>0) return;

  p.blocking=true;

  p.skill2Cooldown=1.5;

  setTimeout(()=>{
    p.blocking=false;
  },700);
}


/* =========================================================
   D.VA ULT
========================================================= */

function dvaUlt(p){

  if(!running || !p.alive) return;
  if(p.hero!=="dva") return;

  /*
    메카가 없는 동안은 궁극기를 다시 사용할 수 없다.
  */

  if(!p.dvaMech) return;

  if(p.ult<100) return;

  p.ult=0;

  p.dvaMech=false;
  p.dvaRecallCharging=true;

  /*
    메카를 상대 방향으로 던진다.
  */

  const enemy=p.id==="p1"?p2:p1;

  const direction=enemy.x>p.x?1:-1;

  const mech={
    x:p.x,
    y:p.y,
    direction,
    distance:0
  };

  const mechEl=document.createElement("div");

  mechEl.style.position="absolute";
  mechEl.style.zIndex="12";
  mechEl.style.width="72px";
  mechEl.style.height="55px";
  mechEl.style.borderRadius="15px";
  mechEl.style.background="#e6e8ec";
  mechEl.style.border="4px solid #252525";
  mechEl.style.boxShadow="inset 0 8px 0 #fff,0 0 15px #fff8";

  mechEl.innerHTML=
    `<div style="
      position:absolute;
      width:25px;
      height:9px;
      background:#e75d8c;
      left:19px;
      top:17px;
      border-radius:6px
    "></div>`;

  effects.appendChild(mechEl);

  const startX=p.x;
  const targetX=
    Math.max(
      65,
      Math.min(
        game.clientWidth-65,
        enemy.x-direction*15
      )
    );

  const duration=.65;
  const start=performance.now();

  function throwMech(now){

    if(!mechEl.isConnected) return;

    const t=Math.min(
      1,
      (now-start)/(duration*1000)
    );

    mech.x=startX+(targetX-startX)*t;

    mechEl.style.left=(mech.x-36)+"px";
    mechEl.style.top=(mech.y-27)+"px";
    mechEl.style.transform=
      `rotate(${direction*t*18}deg)`;

    if(t<1){

      requestAnimationFrame(throwMech);

    }else{

      setTimeout(()=>{

        if(mechEl.isConnected){
          mechEl.remove();
        }

        explodeDvaMech(p,enemy,mech.x,mech.y);

      },180);
    }
  }

  requestAnimationFrame(throwMech);
}


/* =========================================================
   D.VA MECH EXPLOSION
========================================================= */

function explodeDvaMech(owner,enemy,x,y){

  const boom=document.createElement("div");

  boom.style.position="absolute";
  boom.style.zIndex="14";
  boom.style.left=(x-48)+"px";
  boom.style.top=(y-48)+"px";
  boom.style.width="96px";
  boom.style.height="96px";
  boom.style.borderRadius="50%";
  boom.style.background="radial-gradient(circle,#fff7a8 0,#ffbf3d 25%,#ef6240 55%,transparent 70%)";
  boom.style.transform="scale(.4)";
  boom.style.transition="transform .35s ease,opacity .35s ease";

  effects.appendChild(boom);

  requestAnimationFrame(()=>{
    boom.style.transform="scale(1.25)";
    boom.style.opacity="0";
  });

  setTimeout(()=>boom.remove(),450);

  if(enemy.alive &&
     distanceXY(enemy.x,enemy.y,x,y)<105){

    damageNoUltCharge(owner,enemy,40);
  }

  /*
    D.Va는 메카가 없는 동안에도 평타 사용 가능.
    궁극기 게이지는 자동 충전된다.
  */

  owner.dvaRecallCharging=true;
}


/* =========================================================
   D.VA AUTO ULT CHARGE
========================================================= */

function updateDvaRecall(p,dt){

  if(p.hero!=="dva") return;
  if(p.dvaMech) return;
  if(!p.dvaRecallCharging) return;

  /*
    메카가 없는 동안 궁극기 게이지 자동 충전.
  */

  p.ult=Math.min(
    100,
    p.ult+9*dt
  );

  if(p.ult>=100){

    recallDvaMech(p);
  }
}


/* =========================================================
   D.VA RECALL
========================================================= */

function recallDvaMech(p){

  if(p.dvaMech) return;

  p.dvaMech=true;
  p.dvaRecallCharging=false;

  p.ult=0;

  p.el.classList.remove("pilot");

  /*
    메카 복귀 후 스킬 사용 가능.
  */

  createRecallEffect(p);
}


/* =========================================================
   RECALL EFFECT
========================================================= */

function createRecallEffect(p){

  const e=document.createElement("div");

  e.style.position="absolute";
  e.style.zIndex="13";
  e.style.left=(p.x-35)+"px";
  e.style.top=(p.y-35)+"px";
  e.style.width="70px";
  e.style.height="70px";
  e.style.border="5px solid #6bd8ff";
  e.style.borderRadius="50%";
  e.style.boxShadow="0 0 25px #6bd8ff";
  e.style.animation="wave .5s linear forwards";

  effects.appendChild(e);

  setTimeout(()=>e.remove(),600);
}


/* =========================================================
   D.VA PILOT VISUAL
========================================================= */

function updateDvaVisual(p){

  if(p.hero!=="dva") return;

  if(p.dvaMech){

    p.el.style.transform="translate(-50%,-50%)";

    if(p.pilotEl){
      p.pilotEl.remove();
      p.pilotEl=null;
    }

    return;
  }

  /*
    메카가 없는 동안 파일럿으로 표시.
  */

  if(!p.pilotEl){

    const pilot=document.createElement("div");

    pilot.className="pilot";

    pilot.innerHTML=`
      <div class="pilotHead"></div>
      <div class="pilotBody"></div>
      <div class="pilotArm left"></div>
      <div class="pilotArm right"></div>
    `;

    game.appendChild(pilot);

    p.pilotEl=pilot;

    p.el.style.opacity="0";
  }

  p.pilotEl.style.left=p.x+"px";
  p.pilotEl.style.top=p.y+"px";
}

/* =========================================================
   DISTANCE
========================================================= */

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}

function distanceXY(x1,y1,x2,y2){

  return Math.hypot(
    x1-x2,
    y1-y2
  );
}

/* =========================================================
   P2 AI
========================================================= */

let aiTimers={
  basic:0,
  skill1:0,
  skill2:0,
  ult:0
};

function updateAI(p,enemy,dt){

  if(!running || !p.alive) return;

  /*
    P2도 이동은 자동 상하 이동.
    공격과 스킬은 AI가 사용.
  */

  aiTimers.basic-=dt;
  aiTimers.skill1-=dt;
  aiTimers.skill2-=dt;
  aiTimers.ult-=dt;

  const d=distance(p,enemy);

  if(aiTimers.basic<=0){

    if(d<430){

      basicAttack(p);
      aiTimers.basic=.52+Math.random()*.2;
    }
  }

  if(aiTimers.skill1<=0){

    if(Math.random()<.18){

      if(p.hero==="lucio") lucioSkill1(p);
      if(p.hero==="bastion") bastionSkill1(p);
      if(p.hero==="dva") dvaSkill1(p);

      aiTimers.skill1=3;
    }
  }

  if(aiTimers.skill2<=0){

    if(Math.random()<.13){

      if(p.hero==="lucio") lucioSkill2(p);
      if(p.hero==="bastion") bastionSkill2(p);
      if(p.hero==="dva") dvaSkill2(p);

      aiTimers.skill2=3;
    }
  }

  if(p.ult>=100 && aiTimers.ult<=0){

    if(p.hero==="lucio") lucioUlt(p);
    if(p.hero==="bastion") bastionUlt(p);
    if(p.hero==="dva") dvaUlt(p);

    aiTimers.ult=5;
  }
}

/* =========================================================
   BUTTON STATE
========================================================= */

function updateButtonState(button,time){

  if(time>0){

    button.classList.add("cooldown");

    const text=button.querySelector(".cooldownText");

    if(time<900){
      text.textContent=time.toFixed(1);
    }else{
      text.textContent="";
    }

  }else{

    button.classList.remove("cooldown");

    const text=button.querySelector(".cooldownText");

    text.textContent="";
  }
}

========================================================= */

function checkEnd(){

  if(!running) return;

  if(!p1.alive){

    finish("P2 승리!");
    return;
  }

  if(!p2.alive){

    finish("P1 승리!");
    return;
  }
}


/* =========================================================
   TIME END
========================================================= */

function finishByTime(){

  if(!running) return;

  if(p1.hp>p2.hp){

    finish("P1 승리!");

  }else if(p2.hp>p1.hp){

    finish("P2 승리!");

  }else{

    finish("무승부!");
  }
}


/* =========================================================
   FINISH
========================================================= */

function finish(title){

  if(!running) return;

  running=false;

  document.getElementById("endTitle").textContent=title;

  document.getElementById("endText").textContent=
    "전투가 종료되었습니다.";

  document.getElementById("endScreen")
    .classList.remove("hidden");
}


/* =========================================================
   MASTER AI / SPECIAL UPDATE
========================================================= */

function masterUpdate(dt){

  if(!running) return;

  updateAI(p2,p1,dt);

  updateDvaRecall(p1,dt);
  updateDvaRecall(p2,dt);
}


/* =========================================================
   PATCH LOOP
========================================================= */

const originalLoop=loop;

function patchedLoop(now){

  if(!running) return;

  const dt=Math.min(.05,(now-lastFrame)/1000);
  lastFrame=now;

  gameTime-=dt;

  if(gameTime<=0){

    gameTime=0;
    finishByTime();
    return;
  }

  updatePlayer(p1,p2,dt);
  updatePlayer(p2,p1,dt);

  masterUpdate(dt);

  auraEffect(p1,dt);
  auraEffect(p2,dt);

  updateUI();

  requestAnimationFrame(patchedLoop);
}


/* =========================================================
   REPLACE START LOOP
========================================================= */

function startGame(){

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("endScreen").classList.add("hidden");

  document.querySelectorAll(
    ".character,.aura,.pilot,.projectile,.wave,.hitEffect"
  ).forEach(e=>e.remove());

  p1=createCharacter(
    "p1",
    selectedP1,
    game.clientWidth*.25,
    game.clientHeight*.38
  );

  p2=createCharacter(
    "p2",
    selectedP2,
    game.clientWidth*.75,
    game.clientHeight*.62
  );

  /*
    P2도 테스트 가능하도록 기본 영웅을 D.Va로 설정.
    P1은 선택 화면에서 선택.
  */

  gameTime=GAME_TIME;
  running=true;
  lastFrame=performance.now();

  aiTimers.basic=.5;
  aiTimers.skill1=1.5;
  aiTimers.skill2=2;
  aiTimers.ult=2;

  setupAura(p1);
  setupAura(p2);

  updateUI();

  requestAnimationFrame(patchedLoop);
}

);

);
