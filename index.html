<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>RIVER BATTLE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    -webkit-text-size-adjust:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    position:fixed;
    left:0;
    top:0;
    background:#111827;
    touch-action:none;
    overscroll-behavior:none;
}

body{
    width:100vw;
    height:100vh;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#cbb891;
    touch-action:none;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}


/* =========================
   시작 / 종료 화면
========================= */

.screen{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    z-index:200;

    background:linear-gradient(
        rgba(17,24,39,.97),
        rgba(28,42,61,.97)
    );

    color:white;
    text-align:center;
}

.screen.hidden{
    display:none;
}

.title{
    font-family:Arial,sans-serif;
    font-size:clamp(32px,7vw,65px);
    font-weight:900;
    letter-spacing:5px;
    margin-bottom:12px;
    text-shadow:4px 4px #0b1220;
}

.subtitle{
    font-family:Arial,sans-serif;
    font-size:clamp(13px,2.5vw,20px);
    color:#cbd5e1;
    margin-bottom:35px;
}

.screenButton{
    width:clamp(180px,28vw,240px);
    height:clamp(55px,9vw,70px);

    border-radius:14px;
    border:3px solid #6f8bb3;

    background:#304d7c;
    color:white;

    font-size:clamp(17px,2.5vw,23px);
    font-weight:bold;

    box-shadow:0 5px #111827;

    touch-action:none;
    -webkit-tap-highlight-color:transparent;
}

.screenButton:active{
    transform:translateY(5px);
    box-shadow:0 0 #111827;
}

#winnerText{
    font-size:clamp(34px,8vw,72px);
    font-weight:900;
    margin-bottom:15px;
    text-shadow:4px 4px #111827;
}

#endingMessage{
    font-size:clamp(14px,3vw,22px);
    color:#dbe5f2;
    margin-bottom:35px;
}


/* =========================
   HP
========================= */

.hp{
    position:absolute;

    width:30%;
    min-width:190px;
    height:58px;

    padding:7px 10px;

    background:#202b3d;
    border:3px solid #596b86;
    border-radius:12px;

    color:white;

    z-index:50;
}

/* 1P는 위쪽 */
#hp1{
    left:2%;
    top:2%;
}

/* 2P는 아래쪽 */
#hp2{
    right:2%;
    bottom:2%;
}

.hp-name{
    display:flex;
    justify-content:space-between;
    align-items:center;

    font:bold 15px Arial;

    margin-bottom:5px;
}

.hp-bg{
    width:100%;
    height:18px;

    background:#343d4e;
    border-radius:5px;

    overflow:hidden;
}

.hp-value{
    width:100%;
    height:100%;
}

#bar1{
    background:#35d477;
}

#bar2{
    background:#ed5666;
}


/* =========================
   조작 버튼
========================= */

.controls{
    position:absolute;

    display:flex;
    gap:10px;

    z-index:60;

    touch-action:none;
}

/* 1P */
#controls1{
    left:2%;
    top:12%;
}

/* 2P */
#controls2{
    right:2%;
    bottom:12%;
}

.gameButton{
    width:78px;
    height:62px;

    border:3px solid #64748b;
    border-radius:14px;

    background:#263248;
    color:white;

    font-size:16px;
    font-weight:bold;

    box-shadow:0 5px #111827;

    touch-action:none;

    -webkit-tap-highlight-color:transparent;
}

.gameButton:active{
    transform:translateY(5px);
    box-shadow:0 0 #111827;
}

.attack{
    background:#35445d;
}

.skill{
    background:#583b73;
    border-color:#9870bd;
}

.skill.cooldown{
    background:#383d48;
    color:#aaa;
}


/* =========================
   가운데 상태 표시
========================= */

#status{
    position:absolute;

    left:50%;
    top:47%;

    transform:translate(-50%,-50%);

    z-index:40;

    color:white;

    font:bold 22px Arial;

    text-shadow:2px 2px #172033;

    pointer-events:none;
}


/* =========================
   180도 회전
========================= */

/*
   중요한 부분

   게임판 전체를 뒤집는다.
   따라서 2P는 자기 기준으로
   정상적인 방향으로 게임을 볼 수 있다.
*/

.rotate180{
    transform:rotate(180deg);
}


/*
   게임판 전체를 뒤집기 때문에
   버튼의 위치도 자연스럽게
   반대편으로 이동한다.
*/

.rotate180 #controls1{
    left:auto;
    right:2%;
    top:auto;
    bottom:12%;
}

.rotate180 #controls2{
    right:auto;
    left:2%;
    bottom:auto;
    top:12%;
}


/*
   HP 역시 같이 이동
*/

.rotate180 #hp1{
    left:auto;
    right:2%;
    top:auto;
    bottom:2%;
}

.rotate180 #hp2{
    right:auto;
    left:2%;
    bottom:auto;
    top:2%;
}


/* =========================
   작은 화면
========================= */

@media(max-width:800px){

    .hp{
        width:35%;
        min-width:150px;
        height:50px;
        padding:6px 8px;
    }

    .hp-name{
        font-size:12px;
    }

    .hp-bg{
        height:15px;
    }

    .gameButton{
        width:72px;
        height:58px;
        font-size:14px;
    }

}

@media(max-width:500px){

    .hp{
        min-width:135px;
        width:38%;
    }

    .gameButton{
        width:64px;
        height:54px;
        font-size:12px;
    }

    .controls{
        gap:6px;
    }
}
</style>
</head>


<body>

<div id="game">

    <canvas id="canvas"></canvas>


    <!-- ================= HP ================= -->

    <div class="hp" id="hp1">

        <div class="hp-name">
            <span>1P</span>
            <span id="hpText1">100 / 100</span>
        </div>

        <div class="hp-bg">
            <div class="hp-value" id="bar1"></div>
        </div>

    </div>


    <div class="hp" id="hp2">

        <div class="hp-name">
            <span>2P</span>
            <span id="hpText2">100 / 100</span>
        </div>

        <div class="hp-bg">
            <div class="hp-value" id="bar2"></div>
        </div>

    </div>


    <!-- ================= 1P ================= -->

    <div class="controls" id="controls1">

        <button
            class="gameButton"
            data-player="1"
            data-key="left">
            ◀
        </button>

        <button
            class="gameButton"
            data-player="1"
            data-key="right">
            ▶
        </button>

        <button
            class="gameButton attack"
            data-attack="1">
            평타
        </button>

        <button
            class="gameButton skill"
            id="skill1">
            스킬
        </button>

    </div>


    <!-- ================= 2P ================= -->

    <div class="controls" id="controls2">

        <button
            class="gameButton"
            data-player="2"
            data-key="left">
            ◀
        </button>

        <button
            class="gameButton"
            data-player="2"
            data-key="right">
            ▶
        </button>

        <button
            class="gameButton attack"
            data-attack="2">
            평타
        </button>

        <button
            class="gameButton skill"
            id="skill2">
            스킬
        </button>

    </div>


    <div id="status">FIGHT!</div>


    <!-- ================= 시작 화면 ================= -->

    <div class="screen" id="startScreen">

        <div class="title">
            RIVER BATTLE
        </div>

        <div class="subtitle">
            1P VS 2P
        </div>

        <button
            class="screenButton"
            id="startButton">
            GAME START
        </button>

    </div>


    <!-- ================= 종료 화면 ================= -->

    <div class="screen hidden" id="endingScreen">

        <div id="winnerText">
            1P WIN!
        </div>

        <div id="endingMessage">
            BATTLE COMPLETE
        </div>

        <button
            class="screenButton"
            id="restartButton">
            다시하기
        </button>

    </div>

</div>


<script>

/* =====================================================
   기본 설정
===================================================== */


/* iPad 더블탭 확대 방지 */

let lastTouchTime=0;
let lastTouchX=0;
let lastTouchY=0;

document.addEventListener(
    "touchend",
    function(e){

        const now=Date.now();

        if(
            e.changedTouches &&
            e.changedTouches.length>0
        ){

            const touch=e.changedTouches[0];

            const x=touch.clientX;
            const y=touch.clientY;

            const timeGap=now-lastTouchTime;

            const distance=Math.sqrt(
                Math.pow(x-lastTouchX,2)+
                Math.pow(y-lastTouchY,2)
            );

            if(
                timeGap<350 &&
                distance<30
            ){
                e.preventDefault();
            }

            lastTouchTime=now;
            lastTouchX=x;
            lastTouchY=y;
        }

    },
    {passive:false}
);


/* iOS 제스처 방지 */

document.addEventListener(
    "gesturestart",
    e=>e.preventDefault(),
    {passive:false}
);

document.addEventListener(
    "gesturechange",
    e=>e.preventDefault(),
    {passive:false}
);

document.addEventListener(
    "gestureend",
    e=>e.preventDefault(),
    {passive:false}
);

document.addEventListener(
    "contextmenu",
    e=>e.preventDefault()
);


/* =====================================================
   Canvas
===================================================== */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;

function resize(){

    W=window.innerWidth;
    H=window.innerHeight;

    const ratio=Math.min(
        window.devicePixelRatio||1,
        2
    );

    canvas.width=W*ratio;
    canvas.height=H*ratio;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   플레이어
===================================================== */

const p1={
    x:.50,
    y:.30,

    hp:100,

    left:false,
    right:false,

    skillCooldown:0,
    normalCooldown:0
};

const p2={
    x:.50,
    y:.70,

    hp:100,

    left:false,
    right:false,

    skillCooldown:0,
    normalCooldown:0
};


/* =====================================================
   게임 변수
===================================================== */

let started=false;
let gameOver=false;

const MOVE_SPEED=.00025;

const NORMAL_COOLDOWN=800;

const SKILL_COOLDOWN=3;

const NORMAL_DAMAGE=10;

const SKILL_DAMAGE=25;

const projectiles=[];
const effects=[];


/* =====================================================
   배경
===================================================== */

function drawBackground(){

    /* 땅 */

    ctx.fillStyle="#cbb891";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* 위쪽 풀 */

    ctx.fillStyle="#a9bd8c";

    for(let i=0;i<35;i++){

        const x=(i*173)%W;

        const y=
            60+
            (i*91)%(H*.38);

        ctx.fillRect(
            x,
            y,
            14,
            4
        );
    }


    /* 아래쪽 풀 */

    for(let i=0;i<35;i++){

        const x=(i*211)%W;

        const y=
            H*.59+
            (i*71)%(H*.33);

        ctx.fillRect(
            x,
            y,
            14,
            4
        );
    }


    /* 돌 */

    ctx.fillStyle="#818171";

    for(let i=0;i<12;i++){

        const x=(i*257)%W;

        const y=
            90+
            (i*119)%(H-180);

        ctx.beginPath();

        ctx.ellipse(
            x,
            y,
            13,
            8,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /* =================
       강
    ================= */

    /*
       강을 넓은 물줄기가 아니라
       가운데 선처럼 보이게 함
    */

    const riverY=H*.495;

    ctx.strokeStyle="#287fc1";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(
        0,
        riverY
    );

    ctx.lineTo(
        W,
        riverY
    );

    ctx.stroke();


    /* 물결 */

    ctx.strokeStyle="#75c7ef";
    ctx.lineWidth=2;

    for(
        let x=20;
        x<W;
        x+=90
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            riverY
        );

        ctx.lineTo(
            x+35,
            riverY
        );

        ctx.stroke();
    }
}


/* =====================================================
   플레이어 그리기
===================================================== */

function drawPlayer(
    p,
    bodyColor,
    hairColor,
    number
){

    const x=p.x*W;
    const y=p.y*H;

    const s=Math.max(
        .7,
        Math.min(
            1.2,
            Math.min(W,H)/650
        )
    );


    /* 그림자 */

    ctx.fillStyle="rgba(0,0,0,.20)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+31*s,
        23*s,
        8*s,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* 다리 */

    ctx.fillStyle="#30394e";

    ctx.fillRect(
        x-12*s,
        y+13*s,
        9*s,
        20*s
    );

    ctx.fillRect(
        x+3*s,
        y+13*s,
        9*s,
        20*s
    );


    /* 몸 */

    ctx.fillStyle=bodyColor;

    ctx.fillRect(
        x-16*s,
        y-16*s,
        32*s,
        34*s
    );

    ctx.strokeStyle="#172033";
    ctx.lineWidth=4*s;

    ctx.strokeRect(
        x-16*s,
        y-16*s,
        32*s,
        34*s
    );


    /* 얼굴 */

    ctx.fillStyle="#ffd0a8";

    ctx.fillRect(
        x-17*s,
        y-42*s,
        34*s,
        27*s
    );

    ctx.strokeStyle="#172033";

    ctx.strokeRect(
        x-17*s,
        y-42*s,
        34*s,
        27*s
    );


    /* 머리 */

    ctx.fillStyle=hairColor;

    ctx.fillRect(
        x-17*s,
        y-43*s,
        34*s,
        9*s
    );


    /* 팔 */

    ctx.fillStyle="#ffd0a8";

    ctx.fillRect(
        x-27*s,
        y-10*s,
        12*s,
        8*s
    );

    ctx.fillRect(
        x+15*s,
        y-10*s,
        12*s,
        8*s
    );


    /* 플레이어 번호 */

    ctx.fillStyle=bodyColor;

    ctx.font=
        "bold "+
        Math.max(12,18*s)+
        "px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        number+"P",
        x,
        y-53*s
    );
}


/* =====================================================
   공격
===================================================== */

function shoot(
    player,
    skill
){

    const p=
        player===1
        ?p1
        :p2;


    projectiles.push({

        player:player,

        x:p.x,

        y:p.y,

        direction:
            player===1
            ?1
            :-1,

        speed:
            skill
            ?0.00055
            :0.00032,

        damage:
            skill
            ?SKILL_DAMAGE
            :NORMAL_DAMAGE,

        skill:skill
    });
}


/* =====================================================
   투사체
===================================================== */

function drawProjectile(b){

    const x=b.x*W;
    const y=b.y*H;

    ctx.save();

    ctx.shadowColor=
        b.player===1
        ?" #45b8ff"
        :"#ff5368";

    ctx.shadowBlur=
        b.skill
        ?18
        :10;

    ctx.fillStyle=
        b.player===1
        ?"#45b8ff"
        :"#ff5368";


    if(b.skill){

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            11,
            0,
            Math.PI*2
        );

        ctx.fill();

    }else{

        ctx.fillRect(
            x-4,
            y-12,
            8,
            24
        );
    }

    ctx.restore();
}


/* =====================================================
   투사체 업데이트
===================================================== */

function updateProjectiles(dt){

    for(
        let i=projectiles.length-1;
        i>=0;
        i--
    ){

        const b=projectiles[i];

        const oldY=b.y;

        b.y+=
            b.direction*
            b.speed*
            dt;


        const target=
            b.player===1
            ?p2
            :p1;


        const minY=
            Math.min(
                oldY,
                b.y
            );

        const maxY=
            Math.max(
                oldY,
                b.y
            );


        const targetSize=.045;


        const verticalHit=
            target.y>=minY-targetSize &&
            target.y<=maxY+targetSize;


        const horizontalHit=
            Math.abs(
                b.x-target.x
            )<=.075;


        if(
            verticalHit &&
            horizontalHit
        ){

            target.hp=Math.max(
                0,
                target.hp-b.damage
            );


            effects.push({

                x:target.x,

                y:target.y,

                life:1
            });


            projectiles.splice(
                i,
                1
            );


            if(target.hp<=0){

                endGame(
                    b.player===1
                    ?"1P"
                    :"2P"
                );
            }

            continue;
        }


        if(
            b.y<-.05 ||
            b.y>1.05
        ){

            projectiles.splice(
                i,
                1
            );
        }
    }
}


/* =====================================================
   효과
===================================================== */

function updateEffects(dt){

    for(
        let i=effects.length-1;
        i>=0;
        i--
    ){

        effects[i].life-=dt/250;

        if(
            effects[i].life<=0
        ){

            effects.splice(
                i,
                1
            );
        }
    }
}


function drawEffects(){

    for(
        const e of effects
    ){

        ctx.globalAlpha=e.life;

        ctx.strokeStyle="#fff27b";

        ctx.lineWidth=4;

        ctx.beginPath();

        ctx.arc(
            e.x*W,
            e.y*H,
            10+
            30*(1-e.life),
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.globalAlpha=1;
    }
}


/* =====================================================
   플레이어 이동
===================================================== */

function updatePlayers(dt){

    if(
        !started ||
        gameOver
    ){
        return;
    }


    if(p1.left)
        p1.x-=MOVE_SPEED*dt;

    if(p1.right)
        p1.x+=MOVE_SPEED*dt;


    if(p2.left)
        p2.x-=MOVE_SPEED*dt;

    if(p2.right)
        p2.x+=MOVE_SPEED*dt;


    p1.x=Math.max(
        .20,
        Math.min(.80,p1.x)
    );

    p2.x=Math.max(
        .20,
        Math.min(.80,p2.x)
    );
}


/* =====================================================
   쿨타임
===================================================== */

function updateCooldown(dt){

    if(p1.skillCooldown>0){

        p1.skillCooldown=Math.max(
            0,
            p1.skillCooldown-dt/1000
        );
    }


    if(p2.skillCooldown>0){

        p2.skillCooldown=Math.max(
            0,
            p2.skillCooldown-dt/1000
        );
    }


    updateSkillButton(
        "skill1",
        p1.skillCooldown
    );

    updateSkillButton(
        "skill2",
        p2.skillCooldown
    );
}


function updateSkillButton(
    id,
    time
){

    const button=
        document.getElementById(id);


    if(time>0){

        button.classList.add(
            "cooldown"
        );

        button.innerHTML=
            "스킬<br>"+
            time.toFixed(1);

    }else{

        button.classList.remove(
            "cooldown"
        );

        button.innerHTML="스킬";
    }
}


/* =====================================================
   평타
===================================================== */

document
.querySelectorAll("[data-attack]")
.forEach(button=>{

    button.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();


            if(
                !started ||
                gameOver
            ){
                return;
            }


            const player=
                Number(
                    button.dataset.attack
                );


            const p=
                player===1
                ?p1
                :p2;


            const now=
                performance.now();


            if(
                now-p.normalCooldown<
                NORMAL_COOLDOWN
            ){
                return;
            }


            p.normalCooldown=now;


            shoot(
                player,
                false
            );
        }
    );
});


/* =====================================================
   스킬
===================================================== */

document
.getElementById("skill1")
.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();


        if(
            !started ||
            gameOver ||
            p1.skillCooldown>0
        ){
            return;
        }


        p1.skillCooldown=
            SKILL_COOLDOWN;


        shoot(
            1,
            true
        );
    }
);


document
.getElementById("skill2")
.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();


        if(
            !started ||
            gameOver ||
            p2.skillCooldown>0
        ){
            return;
        }


        p2.skillCooldown=
            SKILL_COOLDOWN;


        shoot(
            2,
            true
        );
    }
);


/* =====================================================
   이동 버튼
===================================================== */

document
.querySelectorAll("[data-key]")
.forEach(button=>{

    const player=
        Number(
            button.dataset.player
        );

    const key=
        button.dataset.key;


    function startMove(e){

        e.preventDefault();


        if(
            !started ||
            gameOver
        ){
            return;
        }


        const p=
            player===1
            ?p1
            :p2;


        if(key==="left")
            p.left=true;

        if(key==="right")
            p.right=true;
    }


    function stopMove(e){

        e.preventDefault();


        const p=
            player===1
            ?p1
            :p2;


        if(key==="left")
            p.left=false;

        if(key==="right")
            p.right=false;
    }


    button.addEventListener(
        "pointerdown",
        startMove
    );

    button.addEventListener(
        "pointerup",
        stopMove
    );

    button.addEventListener(
        "pointercancel",
        stopMove
    );

    button.addEventListener(
        "pointerleave",
        stopMove
    );
});


/* =====================================================
   시작
===================================================== */

document
.getElementById("startButton")
.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();


        document
        .getElementById("startScreen")
        .classList.add("hidden");


        started=true;
        gameOver=false;


        document
        .getElementById("status")
        .textContent="FIGHT!";
    }
);


/* =====================================================
   게임 종료
===================================================== */

function endGame(winner){

    gameOver=true;
    started=false;


    document
    .getElementById("winnerText")
    .textContent=
        winner+" WIN!";


    document
    .getElementById("endingMessage")
    .textContent=
        winner+" 플레이어 승리";


    document
    .getElementById("hp1")
    .style.display="none";


    document
    .getElementById("hp2")
    .style.display="none";


    document
    .getElementById("controls1")
    .style.display="none";


    document
    .getElementById("controls2")
    .style.display="none";


    document
    .getElementById("status")
    .style.display="none";


    document
    .getElementById("endingScreen")
    .classList.remove("hidden");
}


/* =====================================================
   다시하기
===================================================== */

document
.getElementById("restartButton")
.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();


        resetGame();


        document
        .getElementById("endingScreen")
        .classList.add("hidden");


        document
        .getElementById("startScreen")
        .classList.remove("hidden");
    }
);


function resetGame(){

    p1.x=.50;
    p1.y=.30;
    p1.hp=100;
    p1.left=false;
    p1.right=false;
    p1.skillCooldown=0;
    p1.normalCooldown=0;


    p2.x=.50;
    p2.y=.70;
    p2.hp=100;
    p2.left=false;
    p2.right=false;
    p2.skillCooldown=0;
    p2.normalCooldown=0;


    projectiles.length=0;
    effects.length=0;


    gameOver=false;
    started=false;


    document
    .getElementById("hp1")
    .style.display="block";


    document
    .getElementById("hp2")
    .style.display="block";


    document
    .getElementById("controls1")
    .style.display="flex";


    document
    .getElementById("controls2")
    .style.display="flex";


    document
    .getElementById("status")
    .style.display="block";


    updateHP();
}


/* =====================================================
   HP
===================================================== */

function updateHP(){

    document
    .getElementById("bar1")
    .style.width=
        p1.hp+"%";


    document
    .getElementById("bar2")
    .style.width=
        p2.hp+"%";


    document
    .getElementById("hpText1")
    .textContent=
        p1.hp+" / 100";


    document
    .getElementById("hpText2")
    .textContent=
        p2.hp+" / 100";
}


/* =====================================================
   방향 감지
===================================================== */

function checkOrientation(){

    let angle=0;


    if(
        screen.orientation &&
        typeof screen.orientation.angle==="number"
    ){

        angle=
            screen.orientation.angle;

    }else if(
        typeof window.orientation==="number"
    ){

        angle=
            window.orientation;
    }


    const game=
        document.getElementById("game");


    /*
       180도 회전했을 때만
       전체 게임판을 뒤집는다.
    */

    if(
        Math.abs(angle)===180
    ){

        game.classList.add(
            "rotate180"
        );

    }else{

        game.classList.remove(
            "rotate180"
        );
    }
}


checkOrientation();


if(screen.orientation){

    screen.orientation.addEventListener(
        "change",
        checkOrientation
    );
}


window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            resize,
            200
        );

        setTimeout(
            checkOrientation,
            250
        );
    }
);


/* =====================================================
   게임 루프
===================================================== */

let lastTime=
    performance.now();


function loop(now){

    const dt=
        Math.min(
            32,
            now-lastTime
        );


    lastTime=now;


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawBackground();


    updatePlayers(dt);

    updateProjectiles(dt);

    updateEffects(dt);

    updateCooldown(dt);


    drawPlayer(
        p1,
        "#357bdd",
        "#2874dc",
        1
    );


    drawPlayer(
        p2,
        "#df465b",
        "#d84259",
        2
    );


    for(
        const b of projectiles
    ){

        drawProjectile(b);
    }


    drawEffects();


    updateHP();


    requestAnimationFrame(
        loop
    );
}


updateHP();

requestAnimationFrame(
    loop
);

</script>
