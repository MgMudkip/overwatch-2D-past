<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>River Battle</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111827;
    font-family:Arial,sans-serif;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
    linear-gradient(
        to bottom,
        #b9d4a7 0%,
        #d8c59f 45%,
        #cbb58d 55%,
        #b8d09f 100%
    );
}

/* =========================
   전투 지역
========================= */

.battlefield{
    position:absolute;
    inset:0;
}

/* 강 */

.river{
    position:absolute;

    left:0;
    right:0;

    top:49%;
    height:5%;

    background:#4daee8;

    border-top:3px solid #287fc1;
    border-bottom:3px solid #287fc1;

    z-index:2;
}

.riverLine{
    position:absolute;
    left:0;
    right:0;
    top:50%;
    height:2px;
    background:#d4f1ff;
    opacity:.7;
}

/* 땅 장식 */

.rock{
    position:absolute;
    width:25px;
    height:15px;

    background:#7c806e;
    border-radius:50%;

    opacity:.7;
}

.rock.r1{left:8%;top:25%;}
.rock.r2{left:20%;top:37%;}
.rock.r3{right:12%;top:28%;}
.rock.r4{right:23%;top:40%;}
.rock.r5{left:10%;bottom:25%;}
.rock.r6{right:15%;bottom:29%;}

/* =========================
   HP
========================= */

.hpPanel{
    position:absolute;

    width:30%;
    min-width:210px;
    height:58px;

    background:#1d2738;

    border:3px solid #53627a;
    border-radius:12px;

    padding:8px;

    z-index:20;

    color:white;
}

.hpPanel.p1{
    left:2%;
    top:2%;
}

.hpPanel.p2{
    right:2%;
    bottom:2%;
}

.hpTitle{
    display:flex;
    justify-content:space-between;

    font-size:15px;
    font-weight:bold;

    margin-bottom:5px;
}

.hpOuter{
    width:100%;
    height:18px;

    background:#30394a;

    border:2px solid #111827;

    border-radius:5px;

    overflow:hidden;
}

.hpBar{
    width:100%;
    height:100%;

    transition:width .15s;
}

.hpBar.p1{
    background:#36d477;
}

.hpBar.p2{
    background:#ef5b68;
}

/* =========================
   캐릭터
========================= */

.player{
    position:absolute;

    width:55px;
    height:75px;

    transform:translateX(-50%);

    z-index:10;

    transition:filter .1s;
}

.playerBody{
    position:absolute;

    left:13px;
    top:27px;

    width:29px;
    height:34px;

    background:#3578db;

    border:4px solid #172033;

    border-radius:4px;
}

.playerHead{
    position:absolute;

    left:11px;
    top:2px;

    width:33px;
    height:27px;

    background:#ffd0a8;

    border:4px solid #172033;

    border-radius:5px;
}

.playerLeg{
    position:absolute;

    top:57px;

    width:10px;
    height:18px;

    background:#303b55;

    border:3px solid #172033;
}

.playerLeg.left{
    left:13px;
}

.playerLeg.right{
    right:13px;
}

.playerArm{
    position:absolute;

    top:31px;

    width:20px;
    height:10px;

    background:#ffd0a8;

    border:3px solid #172033;
}

.playerArm.left{
    left:-5px;
}

.playerArm.right{
    right:-5px;
}

/* 2P 색 */

#p2 .playerBody{
    background:#df465b;
}

/* =========================
   플레이어 위치
========================= */

#p1{
    left:50%;
    top:30%;
}

#p2{
    left:50%;
    top:66%;
}

/* =========================
   공격 이펙트
========================= */

.projectile{
    position:absolute;

    width:10px;
    height:34px;

    border-radius:8px;

    z-index:8;

    box-shadow:
    0 0 8px currentColor,
    0 0 18px currentColor;
}

.projectile.p1{
    background:#4bb8ff;
    color:#4bb8ff;
}

.projectile.p2{
    background:#ff5267;
    color:#ff5267;
}

.skillProjectile{
    width:18px;
    height:46px;

    border-radius:10px;
}

/* 피격 효과 */

.hit{
    position:absolute;

    width:45px;
    height:45px;

    border:4px solid #fff27b;

    border-radius:50%;

    transform:translate(-50%,-50%);

    z-index:30;

    animation:hitAnim .25s forwards;
}

@keyframes hitAnim{

    0%{
        transform:translate(-50%,-50%) scale(.3);
        opacity:1;
    }

    100%{
        transform:translate(-50%,-50%) scale(1.5);
        opacity:0;
    }

}

/* =========================
   조작 버튼
========================= */

.controls{
    position:absolute;

    display:flex;

    gap:9px;

    z-index:50;
}

.controls.p1{
    left:3%;
    top:11%;
}

.controls.p2{
    right:3%;
    bottom:11%;
}

.control{
    width:64px;
    height:52px;

    border:3px solid #65748d;

    border-radius:12px;

    background:#222d42;

    color:white;

    font-size:14px;
    font-weight:bold;

    box-shadow:
    0 4px 0 #111827;
}

.control:active{
    transform:translateY(4px);
    box-shadow:0 0 0 #111827;
    background:#394965;
}

.attack{
    border-color:#7487a6;
}

.skill{
    border-color:#9b67ce;
    background:#50366b;
}

.skill.cooldown{
    background:#353a48;
    color:#aeb5c2;
}

/* =========================
   중앙 상태
========================= */

#status{
    position:absolute;

    left:50%;
    top:46%;

    transform:translate(-50%,-50%);

    font-size:22px;
    font-weight:bold;

    color:white;

    text-shadow:
    2px 2px #182033,
    -1px -1px #182033;

    z-index:40;
}

/* =========================
   다시하기
========================= */

#restart{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:150px;
    height:52px;

    background:#202b3e;

    border:3px solid #71819b;

    border-radius:14px;

    color:white;

    font-size:17px;
    font-weight:bold;

    z-index:100;

    display:none;

    box-shadow:
    0 5px 0 #111827;
}

#restart:active{
    transform:translate(-50%,calc(-50% + 5px));
    box-shadow:0 0 0 #111827;
}

/* =========================
   시작 화면
========================= */

#startScreen{
    position:absolute;

    inset:0;

    background:rgba(13,20,32,.82);

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    z-index:200;
}

#startScreen h1{
    color:white;

    font-size:40px;

    letter-spacing:4px;

    margin-bottom:25px;
}

#startButton{
    width:180px;
    height:60px;

    background:#304a78;

    border:3px solid #8195ba;

    border-radius:14px;

    color:white;

    font-size:18px;
    font-weight:bold;
}

/* =========================
   모바일
========================= */

@media(max-width:700px){

    .hpPanel{
        min-width:150px;
        width:35%;
        height:50px;
        padding:6px;
    }

    .hpTitle{
        font-size:12px;
        margin-bottom:3px;
    }

    .hpOuter{
        height:15px;
    }

    .controls.p1{
        left:2%;
        top:10%;
    }

    .controls.p2{
        right:2%;
        bottom:10%;
    }

    .control{
        width:55px;
        height:46px;
        font-size:12px;
    }

    #status{
        font-size:18px;
    }

    #startScreen h1{
        font-size:28px;
    }
}

</style>
</head>

<body>

<div id="game">

    <!-- =====================
         배경
    ====================== -->

    <div class="battlefield">

        <div class="rock r1"></div>
        <div class="rock r2"></div>
        <div class="rock r3"></div>
        <div class="rock r4"></div>
        <div class="rock r5"></div>
        <div class="rock r6"></div>

        <!-- 강 -->
        <div class="river"></div>
        <div class="riverLine"></div>

    </div>


    <!-- =====================
         1P HP
    ====================== -->

    <div class="hpPanel p1">

        <div class="hpTitle">
            <span>1P</span>
            <span id="hpText1">100 / 100</span>
        </div>

        <div class="hpOuter">
            <div
                id="hp1"
                class="hpBar p1">
            </div>
        </div>

    </div>


    <!-- =====================
         2P HP
    ====================== -->

    <div class="hpPanel p2">

        <div class="hpTitle">
            <span>2P</span>
            <span id="hpText2">100 / 100</span>
        </div>

        <div class="hpOuter">
            <div
                id="hp2"
                class="hpBar p2">
            </div>
        </div>

    </div>


    <!-- =====================
         1P
    ====================== -->

    <div
        id="p1"
        class="player">

        <div class="playerHead"></div>

        <div class="playerBody"></div>

        <div class="playerArm left"></div>
        <div class="playerArm right"></div>

        <div class="playerLeg left"></div>
        <div class="playerLeg right"></div>

    </div>


    <!-- =====================
         2P
    ====================== -->

    <div
        id="p2"
        class="player">

        <div class="playerHead"></div>

        <div class="playerBody"></div>

        <div class="playerArm left"></div>
        <div class="playerArm right"></div>

        <div class="playerLeg left"></div>
        <div class="playerLeg right"></div>

    </div>


    <!-- =====================
         상태
    ====================== -->

    <div id="status">
        FIGHT!
    </div>


    <!-- =====================
         1P 조작
    ====================== -->

    <div class="controls p1">

        <button
            class="control"
            data-player="p1"
            data-action="left">
            ◀
        </button>

        <button
            class="control"
            data-player="p1"
            data-action="right">
            ▶
        </button>

        <button
            class="control attack"
            data-attack="p1">
            평타
        </button>

        <button
            class="control skill"
            id="skill1">
            스킬
        </button>

    </div>


    <!-- =====================
         2P 조작
    ====================== -->

    <div class="controls p2">

        <button
            class="control"
            data-player="p2"
            data-action="left">
            ◀
        </button>

        <button
            class="control"
            data-player="p2"
            data-action="right">
            ▶
        </button>

        <button
            class="control attack"
            data-attack="p2">
            평타
        </button>

        <button
            class="control skill"
            id="skill2">
            스킬
        </button>

    </div>


    <!-- =====================
         다시하기
    ====================== -->

    <button id="restart">
        ↻ 다시하기
    </button>


    <!-- =====================
         시작
    ====================== -->

    <div id="startScreen">

        <h1>RIVER BATTLE</h1>

        <button id="startButton">
            GAME START
        </button>

    </div>

</div>


<script>

/* =========================================
   게임 데이터
========================================= */

const players = {

    p1:{
        x:50,
        hp:100,
        movingLeft:false,
        movingRight:false,
        skillCooldown:0
    },

    p2:{
        x:50,
        hp:100,
        movingLeft:false,
        movingRight:false,
        skillCooldown:0
    }

};


let gameStarted = false;
let gameEnded = false;


/* 이동 속도 */

const moveSpeed = 0.45;


/* 공격 설정 */

const normalDamage = 10;
const skillDamage = 25;


/* 평타 / 스킬 쿨타임 */

const normalCooldown = 0.45;
const skillCooldownMax = 3;


/* 마지막 공격 시간 */

const lastNormal = {
    p1:0,
    p2:0
};


/* =========================================
   HTML 요소
========================================= */

const game =
document.getElementById("game");

const p1Element =
document.getElementById("p1");

const p2Element =
document.getElementById("p2");

const statusElement =
document.getElementById("status");

const restartButton =
document.getElementById("restart");


/* =========================================
   게임 시작
========================================= */

document
.getElementById("startButton")
.addEventListener("pointerdown",function(e){

    e.preventDefault();

    document
    .getElementById("startScreen")
    .style.display="none";

    gameStarted=true;

    statusElement.textContent="FIGHT!";

});


/* =========================================
   이동 버튼
========================================= */

document
.querySelectorAll("[data-action]")
.forEach(button=>{

    const player =
    button.dataset.player;

    const action =
    button.dataset.action;


    button.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            if(!gameStarted || gameEnded)
                return;

            players[player][
                action==="left"
                ?"movingLeft"
                :"movingRight"
            ]=true;

        }
    );


    function stop(e){

        e.preventDefault();

        players[player][
            action==="left"
            ?"movingLeft"
            :"movingRight"
        ]=false;

    }


    button.addEventListener(
        "pointerup",
        stop
    );

    button.addEventListener(
        "pointercancel",
        stop
    );

    button.addEventListener(
        "pointerleave",
        stop
    );

});


/* =========================================
   평타
========================================= */

document
.querySelectorAll("[data-attack]")
.forEach(button=>{

    button.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            if(!gameStarted || gameEnded)
                return;

            const player =
            button.dataset.attack;

            const now =
            performance.now()/1000;

            if(
                now-lastNormal[player]
                <normalCooldown
            ){
                return;
            }

            lastNormal[player]=now;

            shootNormal(player);

        }
    );

});


/* =========================================
   스킬
========================================= */

document
.getElementById("skill1")
.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        useSkill("p1");

    }
);


document
.getElementById("skill2")
.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        useSkill("p2");

    }
);


/* =========================================
   평타 발사
========================================= */

function shootNormal(player){

    const shooter =
    players[player];

    const target =
    player==="p1"
    ?"p2"
    :"p1";


    createProjectile(
        player,
        false
    );


    /*
       1P는 아래 방향
       2P는 위 방향
    */

    const projectile = {

        player:player,

        x:shooter.x,

        y:player==="p1"
            ?30
            :66,

        direction:
            player==="p1"
            ?1
            :-1,

        speed:0.9,

        damage:normalDamage,

        skill:false

    };


    projectiles.push(projectile);

}


/* =========================================
   스킬
========================================= */

function useSkill(player){

    if(
        !gameStarted ||
        gameEnded
    ){
        return;
    }


    const p =
    players[player];


    if(p.skillCooldown>0){
        return;
    }


    p.skillCooldown=
    skillCooldownMax;


    createProjectile(
        player,
        true
    );


    projectiles.push({

        player:player,

        x:p.x,

        y:player==="p1"
            ?30
            :66,

        direction:
            player==="p1"
            ?1
            :-1,

        speed:1.15,

        damage:skillDamage,

        skill:true

    });

}


/* =========================================
   투사체 배열
========================================= */

const projectiles=[];


/* =========================================
   투사체 HTML 생성
========================================= */

function createProjectile(
    player,
    skill
){

    const element =
    document.createElement("div");


    element.className=
    "projectile "
    +(player==="p1"
        ?"p1"
        :"p2");


    if(skill){
        element.classList
        .add("skillProjectile");
    }


    game.appendChild(element);

}


/* =========================================
   실제 투사체와 DOM 연결
========================================= */

function updateProjectiles(){

    const elements =
    document.querySelectorAll(
        ".projectile"
    );


    for(
        let i=0;
        i<projectiles.length;
        i++
    ){

        const projectile =
        projectiles[i];

        const element =
        elements[i];

        if(!element)
            continue;


        projectile.y +=
        projectile.direction *
        projectile.speed;


        element.style.left =
        projectile.x+"%";


        element.style.top =
        projectile.y+"%";


        /*
          상대방에게 맞았는지 확인
        */

        const target =
        projectile.player==="p1"
        ?"p2"
        :"p1";


        const targetY =
        target==="p1"
        ?30
        :66;


        const verticalDistance =
        Math.abs(
            projectile.y-targetY
        );


        const horizontalDistance =
        Math.abs(
            projectile.x-
            players[target].x
        );


        if(
            verticalDistance<5 &&
            horizontalDistance<8
        ){

            damagePlayer(
                target,
                projectile.damage
            );


            element.remove();


            projectiles.splice(
                i,
                1
            );


            i--;

            continue;
        }


        /*
          화면 밖
        */

        if(
            projectile.y<0 ||
            projectile.y>100
        ){

            element.remove();

            projectiles.splice(
                i,
                1
            );

            i--;

        }

    }

}


/* =========================================
   데미지
========================================= */

function damagePlayer(
    player,
    damage
){

    if(gameEnded)
        return;


    players[player].hp =
    Math.max(
        0,
        players[player].hp-damage
    );


    showHitEffect(player);


    updateHP();


    if(
        players[player].hp<=0
    ){

        const winner =
        player==="p1"
        ?"2P"
        :"1P";


        endGame(winner);

    }

}


/* =========================================
   피격 효과
========================================= */

function showHitEffect(player){

    const target =
    document.getElementById(player);


    const effect =
    document.createElement("div");


    effect.className="hit";


    effect.style.left =
    target.offsetLeft+27+"px";


    effect.style.top =
    target.offsetTop+30+"px";


    game.appendChild(effect);


    setTimeout(
        ()=>{
            effect.remove();
        },
        250
    );

}


/* =========================================
   HP 업데이트
========================================= */

function updateHP(){

    document
    .getElementById("hp1")
    .style.width=
    players.p1.hp+"%";


    document
    .getElementById("hp2")
    .style.width=
    players.p2.hp+"%";


    document
    .getElementById("hpText1")
    .textContent=
    players.p1.hp+
    " / 100";


    document
    .getElementById("hpText2")
    .textContent=
    players.p2.hp+
    " / 100";

}


/* =========================================
   게임 종료
========================================= */

function endGame(winner){

    gameEnded=true;


    statusElement.textContent=
    winner+" WIN!";


    restartButton.style.display=
    "block";

}


/* =========================================
   다시하기
========================================= */

restartButton
.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        resetGame();

    }
);


/* =========================================
   게임 초기화
========================================= */

function resetGame(){

    players.p1.x=50;
    players.p1.hp=100;
    players.p1.movingLeft=false;
    players.p1.movingRight=false;
    players.p1.skillCooldown=0;


    players.p2.x=50;
    players.p2.hp=100;
    players.p2.movingLeft=false;
    players.p2.movingRight=false;
    players.p2.skillCooldown=0;


    projectiles
    .forEach(p=>{

        /*
          DOM 투사체 제거
        */

    });


    document
    .querySelectorAll(".projectile")
    .forEach(e=>e.remove());


    projectiles.length=0;


    gameEnded=false;
    gameStarted=true;


    statusElement.textContent=
    "FIGHT!";


    restartButton.style.display=
    "none";


    updateHP();

}


/* =========================================
   캐릭터 이동
========================================= */

function updatePlayers(){

    if(
        !gameStarted ||
        gameEnded
    ){
        return;
    }


    /*
      1P
    */

    if(players.p1.movingLeft){
        players.p1.x-=moveSpeed;
    }

    if(players.p1.movingRight){
        players.p1.x+=moveSpeed;
    }


    /*
      2P
    */

    if(players.p2.movingLeft){
        players.p2.x-=moveSpeed;
    }

    if(players.p2.movingRight){
        players.p2.x+=moveSpeed;
    }


    /*
      이동 범위
    */

    players.p1.x=
    Math.max(
        25,
        Math.min(
            75,
            players.p1.x
        )
    );


    players.p2.x=
    Math.max(
        25,
        Math.min(
            75,
            players.p2.x
        )
    );


    /*
      캐릭터 위치
    */

    p1Element.style.left=
    players.p1.x+"%";


    p2Element.style.left=
    players.p2.x+"%";

}


/* =========================================
   스킬 쿨타임
========================================= */

function updateCooldown(){

    if(!gameStarted)
        return;


    const delta=0.016;


    if(players.p1.skillCooldown>0){

        players.p1.skillCooldown=
        Math.max(
            0,
            players.p1.skillCooldown-delta
        );

    }


    if(players.p2.skillCooldown>0){

        players.p2.skillCooldown=
        Math.max(
            0,
            players.p2.skillCooldown-delta
        );

    }


    updateSkillButton(
        "skill1",
        players.p1.skillCooldown
    );


    updateSkillButton(
        "skill2",
        players.p2.skillCooldown
    );

}


function updateSkillButton(
    id,
    cooldown
){

    const button=
    document.getElementById(id);


    if(cooldown>0){

        button.classList
        .add("cooldown");


        button.innerHTML=
        "스킬<br>"+
        cooldown.toFixed(1);

    }else{

        button.classList
        .remove("cooldown");


        button.innerHTML=
        "스킬";

    }

}


/* =========================================
   메인 루프
========================================= */

function gameLoop(){

    updatePlayers();

    updateProjectiles();

    updateCooldown();

    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();


/* =========================================
   초기 HP
========================================= */

updateHP();

</script>
