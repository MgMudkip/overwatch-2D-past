<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>RIVER BATTLE v2</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;

    touch-action:none;
}

html,body{
    width:100%;
    height:100%;

    overflow:hidden;

    position:fixed;
    inset:0;

    background:#101827;

    touch-action:none;
    overscroll-behavior:none;
}

body{
    width:100vw;
    height:100vh;
}

button{
    font-family:Arial,sans-serif;
    touch-action:none;
    -webkit-tap-highlight-color:transparent;
}


/* ========================================
   GAME
======================================== */

#game{
    position:fixed;
    inset:0;

    overflow:hidden;

    background:#cbb891;

    touch-action:none;
}

#board{
    position:absolute;
    inset:0;

    transform-origin:center center;

    transition:transform .25s ease;
}

#board.rotate{
    transform:rotate(180deg);
}

canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    display:block;

    touch-action:none;
}


/* ========================================
   SCREEN
======================================== */

.screen{
    position:absolute;
    inset:0;

    z-index:500;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at center,
            #263c58,
            #101827 70%
        );

    color:white;

    text-align:center;
}

.screen.hidden{
    display:none;
}

.gameTitle{
    font-family:Arial,sans-serif;

    font-size:clamp(
        38px,
        8vw,
        76px
    );

    font-weight:900;

    letter-spacing:5px;

    text-shadow:
        5px 5px #070b12;

    margin-bottom:10px;
}

.version{
    color:#9fb3cc;

    font-size:
        clamp(12px,2.5vw,18px);

    margin-bottom:35px;
}

.mainButton{
    width:
        clamp(190px,30vw,260px);

    height:
        clamp(60px,9vw,75px);

    border:3px solid #7690b2;

    border-radius:15px;

    background:#31527f;

    color:white;

    font-size:
        clamp(18px,3vw,25px);

    font-weight:bold;

    box-shadow:
        0 6px #090e18;
}

.mainButton:active{
    transform:translateY(6px);
    box-shadow:0 0 #090e18;
}


/* ========================================
   CHARACTER SELECT
======================================== */

#selectScreen{
    padding:20px;
}

.selectTitle{
    font-size:
        clamp(26px,5vw,45px);

    font-weight:900;

    margin-bottom:8px;
}

.selectInfo{
    color:#b7c6d9;

    font-size:
        clamp(12px,2.2vw,17px);

    margin-bottom:22px;
}

.playerSelectArea{
    width:min(920px,94vw);

    display:flex;
    gap:25px;

    justify-content:center;
    align-items:stretch;
}

.selectPlayer{
    flex:1;

    min-width:0;

    padding:15px;

    border:
        2px solid #53677f;

    border-radius:14px;

    background:#182438;
}

.selectPlayer h2{
    font-size:
        clamp(17px,3vw,25px);

    margin-bottom:12px;
}

.heroChoices{
    display:flex;
    gap:10px;
}

.heroCard{
    flex:1;

    min-width:0;

    padding:10px 5px;

    border:
        2px solid #566b85;

    border-radius:10px;

    background:#26354b;

    color:white;
}

.heroCard.selected{
    border-color:#ffe26b;

    background:#3a4960;

    box-shadow:
        0 0 0 2px #ffe26b inset;
}

.heroIcon{
    width:58px;
    height:58px;

    margin:0 auto 7px;

    border-radius:10px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:28px;

    background:#44556e;
}

.heroName{
    font-weight:bold;

    font-size:
        clamp(12px,2vw,16px);

    margin-bottom:5px;
}

.heroRole{
    color:#aebed1;

    font-size:
        clamp(9px,1.5vw,12px);
}

.selectBottom{
    margin-top:22px;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:10px;
}

#selectionText{
    color:#d9e3ef;

    font-size:
        clamp(12px,2vw,16px);
}


/* ========================================
   HP
======================================== */

.hpBox{
    position:absolute;

    width:30%;
    min-width:190px;

    padding:7px 10px;

    border:
        3px solid #53647c;

    border-radius:12px;

    background:#172235;

    color:white;

    z-index:60;
}

#hp1{
    left:2%;
    top:2%;
}

#hp2{
    right:2%;
    bottom:2%;
}

.hpHeader{
    display:flex;
    justify-content:space-between;

    font:bold 14px Arial;

    margin-bottom:5px;
}

.hpBackground{
    width:100%;
    height:18px;

    overflow:hidden;

    border-radius:5px;

    background:#343e50;
}

.hpBar{
    height:100%;
    width:100%;
}

#hpBar1{
    background:#39d878;
}

#hpBar2{
    background:#ed5666;
}


/* ========================================
   ULTIMATE
======================================== */

.ultBox{
    margin-top:5px;

    height:8px;

    width:100%;

    overflow:hidden;

    border-radius:4px;

    background:#30394b;
}

.ultBar{
    height:100%;

    width:0%;

    background:#f4d65c;
}


/* ========================================
   CONTROLS
======================================== */

.controls{
    position:absolute;

    display:flex;

    gap:9px;

    z-index:80;
}

#controls1{
    left:2%;
    top:13%;
}

#controls2{
    right:2%;
    bottom:13%;
}

.gameButton{
    width:76px;
    height:62px;

    border:
        3px solid #62738c;

    border-radius:14px;

    background:#29374d;

    color:white;

    font-size:15px;

    font-weight:bold;

    box-shadow:
        0 5px #0d1420;
}

.gameButton:active{
    transform:translateY(5px);

    box-shadow:0 0 #0d1420;
}

.attackButton{
    background:#364860;
}

.skillButton{
    background:#55416c;

    border-color:#9272b0;
}

.ultButton{
    background:#665827;

    border-color:#d5bb55;
}

.cooldown{
    background:#343a46 !important;

    border-color:#5b6471 !important;

    color:#aab0ba;
}


/* ========================================
   CENTER
======================================== */

#centerStatus{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:70;

    pointer-events:none;

    color:white;

    font:bold 27px Arial;

    text-shadow:
        3px 3px #172033;

    text-align:center;
}

#timer{
    font-size:16px;

    color:#f4e7a1;

    margin-top:5px;
}


/* ========================================
   ROTATE BUTTON
======================================== */

#rotateButton{
    position:absolute;

    left:50%;
    top:54%;

    transform:
        translate(-50%,-50%);

    width:38px;
    height:38px;

    border:
        2px solid #64748b;

    border-radius:50%;

    background:#263248;

    color:#d8e0eb;

    font-size:20px;

    opacity:.65;

    z-index:90;
}

#rotateButton:active{
    opacity:1;
}


/* ========================================
   ROTATION UI
======================================== */

#board.rotate #controls1{
    left:auto;
    right:2%;
    top:auto;
    bottom:13%;
}

#board.rotate #controls2{
    right:auto;
    left:2%;
    bottom:auto;
    top:13%;
}

#board.rotate #hp1{
    left:auto;
    right:2%;
    top:auto;
    bottom:2%;
}

#board.rotate #hp2{
    right:auto;
    left:2%;
    bottom:auto;
    top:2%;
}


/* ========================================
   COUNTDOWN
======================================== */

#countdown{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:150;

    color:white;

    font-size:
        clamp(50px,12vw,110px);

    font-weight:900;

    text-shadow:
        6px 6px #101827;

    pointer-events:none;
}


/* ========================================
   PORTRAIT
======================================== */

#portraitNotice{
    display:none;

    position:absolute;

    inset:0;

    z-index:1000;

    background:#101827;

    color:white;

    justify-content:center;
    align-items:center;

    text-align:center;

    font-size:22px;

    font-weight:bold;
}

@media(
    orientation:portrait
){

    #portraitNotice{
        display:flex;
    }
}


/* ========================================
   MOBILE
======================================== */

@media(max-width:800px){

    .playerSelectArea{
        gap:10px;
    }

    .selectPlayer{
        padding:9px;
    }

    .heroIcon{
        width:45px;
        height:45px;
        font-size:22px;
    }

    .gameButton{
        width:68px;
        height:57px;
        font-size:13px;
    }

    .hpBox{
        min-width:150px;
    }
}

@media(max-width:600px){

    .heroChoices{
        gap:5px;
    }

    .heroCard{
        padding:6px 3px;
    }

    .heroIcon{
        width:35px;
        height:35px;
        font-size:18px;
    }

    .gameButton{
        width:61px;
        height:52px;
        font-size:11px;
    }
}

</style>
</head>


<body>

<div id="game">

<div id="board">

<canvas id="canvas"></canvas>


<!-- ================= HP ================= -->

<div class="hpBox" id="hp1">

    <div class="hpHeader">
        <span id="name1">1P</span>
        <span id="hpText1">100 / 100</span>
    </div>

    <div class="hpBackground">
        <div
            class="hpBar"
            id="hpBar1">
        </div>
    </div>

    <div class="ultBox">
        <div
            class="ultBar"
            id="ultBar1">
        </div>
    </div>

</div>


<div class="hpBox" id="hp2">

    <div class="hpHeader">
        <span id="name2">2P</span>
        <span id="hpText2">100 / 100</span>
    </div>

    <div class="hpBackground">
        <div
            class="hpBar"
            id="hpBar2">
        </div>
    </div>

    <div class="ultBox">
        <div
            class="ultBar"
            id="ultBar2">
        </div>
    </div>

</div>


<!-- ================= 1P ================= -->

<div
    class="controls"
    id="controls1">

    <button
        class="gameButton"
        data-player="1"
        data-move="left">
        ◀
    </button>

    <button
        class="gameButton"
        data-player="1"
        data-move="right">
        ▶
    </button>

    <button
        class="gameButton attackButton"
        data-player="1"
        data-action="attack">
        평타
    </button>

    <button
        class="gameButton skillButton"
        id="skill1">
        스킬
    </button>

    <button
        class="gameButton ultButton"
        id="ult1">
        궁극기
    </button>

</div>


<!-- ================= 2P ================= -->

<div
    class="controls"
    id="controls2">

    <button
        class="gameButton"
        data-player="2"
        data-move="left">
        ◀
    </button>

    <button
        class="gameButton"
        data-player="2"
        data-move="right">
        ▶
    </button>

    <button
        class="gameButton attackButton"
        data-player="2"
        data-action="attack">
        평타
    </button>

    <button
        class="gameButton skillButton"
        id="skill2">
        스킬
    </button>

    <button
        class="gameButton ultButton"
        id="ult2">
        궁극기
    </button>

</div>


<div id="centerStatus">

    <div id="statusText">
        FIGHT!
    </div>

    <div id="timer">
        60
    </div>

</div>


<button id="rotateButton">
    ↻
</button>


<div id="countdown"></div>

</div>


<!-- ========================================
     START SCREEN
======================================== -->

<div
    class="screen"
    id="startScreen">

    <div class="gameTitle">
        RIVER BATTLE
    </div>

    <div class="version">
        HERO ARENA v2.0
    </div>

    <button
        class="mainButton"
        id="startButton">
        게임 시작
    </button>

</div>


<!-- ========================================
     CHARACTER SELECT
======================================== -->

<div
    class="screen hidden"
    id="selectScreen">

    <div class="selectTitle">
        HERO SELECT
    </div>

    <div class="selectInfo">
        각 플레이어가 사용할 영웅을 선택하세요
    </div>


    <div class="playerSelectArea">


        <!-- 1P -->

        <div class="selectPlayer">

            <h2>1P</h2>

            <div
                class="heroChoices"
                id="choices1">

            </div>

        </div>


        <!-- 2P -->

        <div class="selectPlayer">

            <h2>2P</h2>

            <div
                class="heroChoices"
                id="choices2">

            </div>

        </div>

    </div>


    <div class="selectBottom">

        <div id="selectionText">
            1P와 2P의 캐릭터를 선택하세요
        </div>

        <button
            class="mainButton"
            id="battleStartButton">
            전투 시작
        </button>

    </div>

</div>


<!-- ========================================
     END SCREEN
======================================== -->

<div
    class="screen hidden"
    id="endScreen">

    <div
        class="gameTitle"
        id="winnerText">
        1P WIN!
    </div>

    <div
        class="version"
        id="endInfo">
        BATTLE COMPLETE
    </div>

    <button
        class="mainButton"
        id="againButton">
        다시하기
    </button>

</div>


<div id="portraitNotice">
    아이패드를 가로로 돌려주세요
</div>


</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas=
    document.getElementById("canvas");

const ctx=
    canvas.getContext("2d");

let W=0;
let H=0;

function resize(){

    W=window.innerWidth;
    H=window.innerHeight;

    const ratio=
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width=W*ratio;
    canvas.height=H*ratio;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   HERO DATA
===================================================== */

/*
    OW1의 플레이 감각을 참고한
    오리지널 영웅 데이터
*/

const HEROES={

    LUCID:{
        name:"루시드",
        icon:"♫",

        role:"기동 / 지원",

        hp:100,

        speed:.00030,

        attackDamage:8,
        attackSpeed:420,

        projectileSpeed:.00045,

        skillName:"볼륨 업",
        skillCooldown:5,

        ultName:"비트",

        color:"#36b6e8",
        dark:"#187da7",

        skillType:"speed",

        ultType:"shield"
    },


    BASTION:{
        name:"아이언",
        icon:"▣",

        role:"화력 / 중장갑",

        hp:125,

        speed:.00017,

        attackDamage:12,
        attackSpeed:850,

        projectileSpeed:.00030,

        skillName:"강습 모드",
        skillCooldown:6,

        ultName:"포격",

        color:"#6d8f72",
        dark:"#405b46",

        skillType:"power",

        ultType:"bombard"
    },


    DVA:{
        name:"메카",
        icon:"◆",

        role:"방어 / 돌진",

        hp:110,

        speed:.00024,

        attackDamage:7,
        attackSpeed:300,

        projectileSpeed:.00052,

        skillName:"부스터",
        skillCooldown:5,

        ultName:"과부하",

        color:"#db71a8",
        dark:"#934c78",

        skillType:"dash",

        ultType:"explosion"
    }

};


/* =====================================================
   PLAYER
===================================================== */

function makePlayer(){

    return{

        x:.50,

        y:0,

        hp:100,
        maxHp:100,

        ult:0,

        left:false,
        right:false,

        hero:null,

        skillTimer:0,

        ultTimer:0,

        speedBoost:0,

        powerTimer:0,

        shieldTimer:0,

        dashTimer:0,

        dashDirection:0,

        normalTimer:0,

        invincible:0
    };
}

const p1=makePlayer();
const p2=makePlayer();

p1.y=.29;
p2.y=.71;


/* =====================================================
   GAME STATE
===================================================== */

let gameStarted=false;
let battleRunning=false;
let gameEnded=false;

let matchTime=60;

let projectiles=[];
let effects=[];
let explosions=[];

let selected1="LUCID";
let selected2="BASTION";


/* =====================================================
   CHARACTER SELECT UI
===================================================== */

function createHeroCards(){

    const area1=
        document.getElementById("choices1");

    const area2=
        document.getElementById("choices2");

    area1.innerHTML="";
    area2.innerHTML="";


    Object.keys(HEROES).forEach(key=>{

        area1.appendChild(
            createHeroCard(
                key,
                1
            )
        );

        area2.appendChild(
            createHeroCard(
                key,
                2
            )
        );

    });

    refreshHeroSelection();
}


function createHeroCard(
    key,
    player
){

    const hero=HEROES[key];

    const button=
        document.createElement("button");

    button.className="heroCard";

    button.dataset.hero=key;
    button.dataset.player=player;


    button.innerHTML=`

        <div
            class="heroIcon"
            style="background:${hero.dark}">
            ${hero.icon}
        </div>

        <div class="heroName">
            ${hero.name}
        </div>

        <div class="heroRole">
            ${hero.role}
        </div>

    `;


    button.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            if(player===1){

                selected1=key;

            }else{

                selected2=key;
            }

            refreshHeroSelection();
        }
    );


    return button;
}


function refreshHeroSelection(){

    document
    .querySelectorAll(".heroCard")
    .forEach(card=>{

        const player=
            Number(card.dataset.player);

        const key=
            card.dataset.hero;

        const selected=
            player===1
            ?selected1
            :selected2;

        card.classList.toggle(
            "selected",
            key===selected
        );
    });


    document
    .getElementById("selectionText")
    .textContent=
        `${HEROES[selected1].name} VS ${HEROES[selected2].name}`;
}


createHeroCards();


/* =====================================================
   START
===================================================== */

document
.getElementById("startButton")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        document
        .getElementById("startScreen")
        .classList.add("hidden");

        document
        .getElementById("selectScreen")
        .classList.remove("hidden");
    }
);


/* =====================================================
   BATTLE START
===================================================== */

document
.getElementById("battleStartButton")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        setupBattle();

        document
        .getElementById("selectScreen")
        .classList.add("hidden");

        startCountdown();
    }
);


function setupBattle(){

    const hero1=
        HEROES[selected1];

    const hero2=
        HEROES[selected2];


    p1.hero=hero1;
    p2.hero=hero2;


    p1.x=.50;
    p2.x=.50;


    p1.hp=hero1.hp;
    p1.maxHp=hero1.hp;

    p2.hp=hero2.hp;
    p2.maxHp=hero2.hp;


    p1.ult=0;
    p2.ult=0;


    p1.skillTimer=0;
    p2.skillTimer=0;

    p1.ultTimer=0;
    p2.ultTimer=0;

    p1.speedBoost=0;
    p2.speedBoost=0;

    p1.powerTimer=0;
    p2.powerTimer=0;

    p1.shieldTimer=0;
    p2.shieldTimer=0;

    p1.dashTimer=0;
    p2.dashTimer=0;

    p1.invincible=0;
    p2.invincible=0;

    p1.normalTimer=0;
    p2.normalTimer=0;


    projectiles=[];
    effects=[];
    explosions=[];


    matchTime=60;

    gameEnded=false;
    battleRunning=false;

    updateUI();
}


/* =====================================================
   COUNTDOWN
===================================================== */

function startCountdown(){

    const countdown=
        document.getElementById("countdown");

    let number=3;

    countdown.textContent=number;


    const timer=
        setInterval(()=>{

            number--;

            if(number>0){

                countdown.textContent=
                    number;

            }else{

                clearInterval(timer);

                countdown.textContent=
                    "FIGHT!";

                battleRunning=true;

                setTimeout(
                    ()=>{
                        countdown.textContent="";
                    },
                    700
                );
            }

        },800);
}


/* =====================================================
   ATTACK
===================================================== */

function attack(player){

    if(
        !battleRunning ||
        gameEnded
    ){
        return;
    }


    const p=
        player===1
        ?p1
        :p2;


    if(
        p.normalTimer>0
    ){
        return;
    }


    let cooldown=
        p.hero.attackSpeed;


    if(p.speedBoost>0){

        cooldown*=.55;
    }


    p.normalTimer=cooldown;


    const damage=
        p.hero.attackDamage *
        (
            p.powerTimer>0
            ?1.65
            :1
        );


    projectiles.push({

        owner:player,

        x:p.x,

        y:p.y,

        oldY:p.y,

        direction:
            player===1
            ?1
            :-1,

        speed:p.hero.projectileSpeed,

        damage:damage,

        radius:
            p.hero===HEROES.BASTION
            ?8
            :6,

        type:
            player===1
            ?"blue"
            :"red"
    });


    p.ult=
        Math.min(
            100,
            p.ult+4
        );
}


/* =====================================================
   SKILL
===================================================== */

function useSkill(player){

    if(
        !battleRunning ||
        gameEnded
    ){
        return;
    }


    const p=
        player===1
        ?p1
        :p2;


    if(
        p.skillTimer>0
    ){
        return;
    }


    p.skillTimer=
        p.hero.skillCooldown;


    switch(
        p.hero.skillType
    ){

        case "speed":

            p.speedBoost=3.5;

            addEffect(
                p.x,
                p.y,
                "speed"
            );

            break;


        case "power":

            p.powerTimer=4;

            addEffect(
                p.x,
                p.y,
                "power"
            );

            break;


        case "dash":

            p.dashTimer=.55;

            p.dashDirection=
                player===1
                ?1
                :-1;

            p.invincible=.55;

            addEffect(
                p.x,
                p.y,
                "dash"
            );

            break;
    }
}


/* =====================================================
   ULTIMATE
===================================================== */

function useUltimate(player){

    if(
        !battleRunning ||
        gameEnded
    ){
        return;
    }


    const p=
        player===1
        ?p1
        :p2;


    if(
        p.ult<100
    ){
        return;
    }


    p.ult=0;


    switch(
        p.hero.ultType
    ){

        case "shield":

            p.shieldTimer=5;

            p.hp=
                Math.min(
                    p.maxHp,
                    p.hp+30
                );

            addEffect(
                p.x,
                p.y,
                "shield"
            );

            break;


        case "bombard":

            createBombard(
                player
            );

            break;


        case "explosion":

            createExplosion(
                player
            );

            break;
    }
}


/* =====================================================
   PROJECTILES
===================================================== */

function updateProjectiles(dt){

    for(
        let i=projectiles.length-1;
        i>=0;
        i--
    ){

        const b=
            projectiles[i];


        b.oldY=b.y;


        b.y+=
            b.direction*
            b.speed*
            dt;


        const target=
            b.owner===1
            ?p2
            :p1;


        const verticalHit=
            target.y >=
                Math.min(
                    b.oldY,
                    b.y
                )-.055
            &&
            target.y <=
                Math.max(
                    b.oldY,
                    b.y
                )+.055;


        const horizontalHit=
            Math.abs(
                target.x-b.x
            )<=.08;


        if(
            verticalHit &&
            horizontalHit
        ){

            damagePlayer(
                target,
                b.damage
            );


            addHitEffect(
                target.x,
                target.y
            );


            projectiles.splice(
                i,
                1
            );

            continue;
        }


        if(
            b.y<-.1 ||
            b.y>1.1
        ){

            projectiles.splice(
                i,
                1
            );
        }
    }
}


/* =====================================================
   DAMAGE
===================================================== */

function damagePlayer(
    target,
    damage
){

    if(
        target.invincible>0
    ){
        return;
    }


    if(
        target.shieldTimer>0
    ){

        damage*=.25;
    }


    target.hp=
        Math.max(
            0,
            target.hp-damage
        );


    const attacker=
        target===p1
        ?p2
        :p1;


    attacker.ult=
        Math.min(
            100,
            attacker.ult+8
        );


    target.ult=
        Math.min(
            100,
            target.ult+5
        );


    if(
        target.hp<=0
    ){

        endBattle(
            target===p1
            ?"2P"
            :"1P"
        );
    }
}


/* =====================================================
   SPECIAL ULT
===================================================== */

function createBombard(player){

    const target=
        player===1
        ?p2
        :p1;


    explosions.push({

        x:target.x,

        y:target.y,

        timer:1.1,

        owner:player,

        damage:42
    });
}


function createExplosion(player){

    const p=
        player===1
        ?p1
        :p2;

    explosions.push({

        x:p.x,

        y:
            player===1
            ?.52
            :.48,

        timer:1.0,

        owner:player,

        damage:48,

        large:true
    });
}


function updateExplosions(dt){

    for(
        let i=explosions.length-1;
        i>=0;
        i--
    ){

        const ex=
            explosions[i];


        ex.timer-=dt/1000;


        /*
           폭발의 중간 시점에
           한 번만 판정
        */

        if(
            ex.timer<
                .55 &&
            !ex.hit
        ){

            ex.hit=true;


            const target=
                ex.owner===1
                ?p2
                :p1;


            const distance=
                Math.abs(
                    target.x-ex.x
                );


            if(
                distance<
                (
                    ex.large
                    ?.25
                    :.18
                )
            ){

                damagePlayer(
                    target,
                    ex.damage
                );
            }
        }


        if(
            ex.timer<=0
        ){

            explosions.splice(
                i,
                1
            );
        }
    }
}


/* =====================================================
   EFFECTS
===================================================== */

function addEffect(
    x,
    y,
    type
){

    effects.push({

        x:x,

        y:y,

        type:type,

        life:1
    });
}


function addHitEffect(
    x,
    y
){

    effects.push({

        x:x,

        y:y,

        type:"hit",

        life:.6
    });
}


function updateEffects(dt){

    for(
        let i=effects.length-1;
        i>=0;
        i--
    ){

        effects[i].life
            -=dt/700;


        if(
            effects[i].life<=0
        ){

            effects.splice(
                i,
                1
            );
        }
    }
}


/* =====================================================
   PLAYER UPDATE
===================================================== */

function updatePlayer(
    p,
    dt
){

    if(
        !battleRunning
    ){
        return;
    }


    const direction=
        (p.right?1:0)-
        (p.left?1:0);


    let speed=
        p.hero.speed;


    if(
        p.speedBoost>0
    ){

        speed*=1.75;
    }


    p.x+=
        direction*
        speed*
        dt;


    if(
        p.dashTimer>0
    ){

        p.x+=
            p.dashDirection*
            .00065*
            dt;

        p.dashTimer-=
            dt/1000;
    }


    p.x=
        Math.max(
            .15,
            Math.min(
                .85,
                p.x
            )
        );


    if(p.skillTimer>0)
        p.skillTimer-=dt/1000;

    if(p.speedBoost>0)
        p.speedBoost-=dt/1000;

    if(p.powerTimer>0)
        p.powerTimer-=dt/1000;

    if(p.shieldTimer>0)
        p.shieldTimer-=dt/1000;

    if(p.invincible>0)
        p.invincible-=dt/1000;

    if(p.normalTimer>0)
        p.normalTimer-=dt;

}


/* =====================================================
   TIMER
===================================================== */

function updateMatchTimer(dt){

    if(
        !battleRunning ||
        gameEnded
    ){
        return;
    }


    matchTime-=
        dt/1000;


    if(
        matchTime<=0
    ){

        matchTime=0;


        if(
            p1.hp>p2.hp
        ){

            endBattle("1P");

        }else if(
            p2.hp>p1.hp
        ){

            endBattle("2P");

        }else{

            endBattle("DRAW");
        }
    }
}


/* =====================================================
   DRAW BACKGROUND
===================================================== */

function drawBackground(){

    ctx.fillStyle="#cbb891";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* grass areas */

    ctx.fillStyle="#aabd8e";

    for(
        let i=0;
        i<45;
        i++
    ){

        const x=
            (i*173)%W;

        const y=
            50+
            (i*97)%(H*.38);


        ctx.fillRect(
            x,
            y,
            13,
            4
        );
    }


    for(
        let i=0;
        i<45;
        i++
    ){

        const x=
            (i*211)%W;

        const y=
            H*.60+
            (i*83)%(H*.32);


        ctx.fillRect(
            x,
            y,
            13,
            4
        );
    }


    /* river line */

    const riverY=
        H*.495;


    ctx.strokeStyle="#287fc1";

    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(
        0,
        riverY
    );

    ctx.lineTo(
        W,
        riverY
    );

    ctx.stroke();


    ctx.strokeStyle="#75c7ef";

    ctx.lineWidth=2;


    for(
        let x=25;
        x<W;
        x+=100
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            riverY
        );

        ctx.lineTo(
            x+38,
            riverY
        );

        ctx.stroke();
    }


    /* center marks */

    ctx.fillStyle=
        "rgba(40,127,193,.25)";


    ctx.fillRect(
        W*.47,
        riverY-18,
        W*.06,
        2
    );
}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer(
    p,
    number
){

    const hero=p.hero;

    const x=p.x*W;

    const y=p.y*H;

    const s=
        Math.max(
            .7,
            Math.min(
                1.25,
                Math.min(W,H)/650
            )
        );


    /* shadow */

    ctx.fillStyle=
        "rgba(0,0,0,.2)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+32*s,
        25*s,
        8*s,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* shield */

    if(
        p.shieldTimer>0
    ){

        ctx.strokeStyle=
            "#f4d65c";

        ctx.lineWidth=5;

        ctx.globalAlpha=.7;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            42*s,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.globalAlpha=1;
    }


    /* body */

    ctx.fillStyle=hero.color;

    ctx.fillRect(
        x-17*s,
        y-17*s,
        34*s,
        35*s
    );


    ctx.strokeStyle="#172033";

    ctx.lineWidth=4*s;

    ctx.strokeRect(
        x-17*s,
        y-17*s,
        34*s,
        35*s
    );


    /* head */

    ctx.fillStyle=
        "#ffd0a8";

    ctx.fillRect(
        x-16*s,
        y-43*s,
        32*s,
        26*s
    );


    ctx.strokeStyle="#172033";

    ctx.strokeRect(
        x-16*s,
        y-43*s,
        32*s,
        26*s
    );


    /* hero-specific head */

    if(
        p.hero===HEROES.LUCID
    ){

        ctx.fillStyle=
            "#27384d";

        ctx.fillRect(
            x-18*s,
            y-45*s,
            36*s,
            9*s
        );

        ctx.fillRect(
            x-22*s,
            y-38*s,
            5*s,
            12*s
        );
    }


    if(
        p.hero===HEROES.BASTION
    ){

        ctx.fillStyle=
            "#405b46";

        ctx.fillRect(
            x-19*s,
            y-47*s,
            38*s,
            14*s
        );
    }


    if(
        p.hero===HEROES.DVA
    ){

        ctx.fillStyle=
            "#f1a2ca";

        ctx.fillRect(
            x-19*s,
            y-46*s,
            38*s,
            9*s
        );
    }


    /* legs */

    ctx.fillStyle="#30394e";

    ctx.fillRect(
        x-12*s,
        y+15*s,
        9*s,
        19*s
    );

    ctx.fillRect(
        x+3*s,
        y+15*s,
        9*s,
        19*s
    );


    /* arms */

    ctx.fillStyle="#ffd0a8";

    ctx.fillRect(
        x-27*s,
        y-10*s,
        11*s,
        9*s
    );

    ctx.fillRect(
        x+16*s,
        y-10*s,
        11*s,
        9*s
    );


    /* number */

    ctx.fillStyle="white";

    ctx.font=
        "bold "+
        Math.max(
            12,
            17*s
        )+
        "px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        number+"P",
        x,
        y-54*s
    );
}


/* =====================================================
   DRAW PROJECTILE
===================================================== */

function drawProjectile(b){

    const x=b.x*W;
    const y=b.y*H;


    ctx.save();

    ctx.shadowBlur=12;

    ctx.shadowColor=
        b.type==="blue"
        ?" #45c8ff"
        :"#ff5068";


    ctx.fillStyle=
        b.type==="blue"
        ?"#45c8ff"
        :"#ff5068";


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        b.radius,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/* =====================================================
   DRAW EFFECTS
===================================================== */

function drawEffects(){

    for(
        const e of effects
    ){

        const x=e.x*W;
        const y=e.y*H;


        ctx.globalAlpha=
            Math.max(
                0,
                e.life
            );


        if(
            e.type==="hit"
        ){

            ctx.strokeStyle="#fff27b";

            ctx.lineWidth=4;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                10+
                (1-e.life)*30,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }


        if(
            e.type==="speed"
        ){

            ctx.strokeStyle="#4ddcff";

            ctx.lineWidth=5;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                38,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }


        if(
            e.type==="power"
        ){

            ctx.strokeStyle="#b4d27a";

            ctx.lineWidth=6;

            ctx.strokeRect(
                x-30,
                y-30,
                60,
                60
            );
        }


        if(
            e.type==="dash"
        ){

            ctx.strokeStyle="#ff91c4";

            ctx.lineWidth=5;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                34+
                (1-e.life)*25,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }


        if(
            e.type==="shield"
        ){

            ctx.strokeStyle="#f4d65c";

            ctx.lineWidth=7;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                45+
                (1-e.life)*15,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }


        ctx.globalAlpha=1;
    }
}


/* =====================================================
   DRAW EXPLOSIONS
===================================================== */

function drawExplosions(){

    for(
        const ex of explosions
    ){

        const x=ex.x*W;

        const y=ex.y*H;


        const progress=
            1-
            Math.max(
                0,
                ex.timer
            );


        const radius=
            (
                ex.large
                ?100
                :70
            )*
            progress;


        ctx.globalAlpha=
            Math.min(
                1,
                ex.timer*1.8
            );


        ctx.strokeStyle="#ffd85c";

        ctx.lineWidth=8;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI*2
        );

        ctx.stroke();


        ctx.fillStyle=
            "rgba(255,216,92,.18)";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.globalAlpha=1;
    }
}

        button.dataset.move;


    function start(e){

        e.preventDefault();


        if(
            !battleRunning
        ){
            return;

        const p=
            player===1
            ?p1

        if(
            direction==="left"
        )
            p.left=true;

        if(
            direction==="right"
        )
            p.right=true;
    }


    function stop(e){

        e.preventDefault();


        const p=
            player===1
            ?p1
            :p2;


        if(
            direction==="left"
        )
            p.left=false;

        if(
            direction==="right"
        )
            p.right=false;
    }


    button.addEventListener(
        "pointerdown",
        start
    );

    button.addEventListener(
        "pointerup",
        stop
    );

    button.addEventListener(
        "pointercancel",
        stop
    );

    button.addEventListener(
        "pointerleave",
        stop
    );
});

/* =====================================================
   ORIENTATION
===================================================== */

function checkOrientation(){

    let angle=0;


    if(
        screen.orientation &&
        typeof screen.orientation.angle==="number"
    ){

        angle=
            screen.orientation.angle;

    }else if(
        typeof window.orientation==="number"
    ){

        angle=
            window.orientation;
    }


    /*
       180도 돌리면
       게임판 전체 회전
    */

    if(
        Math.abs(angle)===180
    ){

        document
        .getElementById("board")
        .classList.add("rotate");

    }else{

        document
        .getElementById("board")
        .classList.remove("rotate");
    }
}


checkOrientation();


if(
    screen.orientation
){

    screen.orientation.addEventListener(
        "change",
        checkOrientation
    );
}


window.addEventListener(
    "orientationchange",
    ()=>{
        setTimeout(
            checkOrientation,
            200
        );

        setTimeout(
            resize,
            200
        );
    }
);


/* =====================================================
   GAME LOOP
===================================================== */

let lastTime=
    performance.now();


function gameLoop(now){

    const dt=
        Math.min(
            32,
            now-lastTime
        );

    lastTime=now;


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawBackground();


    if(
        p1.hero &&
        p2.hero
    ){

        updatePlayer(
            p1,
            dt
        );

        updatePlayer(
            p2,
            dt
        );


        updateProjectiles(
            dt
        );

        updateExplosions(
            dt
        );

        updateEffects(
            dt
        );

        updateMatchTimer(
            dt
        );


        drawPlayer(
            p1,
            1
        );

        drawPlayer(
            p2,
            2
        );


        for(
            const projectile
            of projectiles
        ){

            drawProjectile(
                projectile
            );
        }


        drawEffects();

        drawExplosions();


        updateUI();
    }


    requestAnimationFrame(
        gameLoop
    );
}


requestAnimationFrame(
    gameLoop
);

</script>
