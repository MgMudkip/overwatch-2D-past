<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no,
               viewport-fit=cover">

<title>Overduel 2D</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
  overscroll-behavior:none;
  user-select:none;
  -webkit-user-select:none;
}

button{
  font-family:inherit;
  border:0;
  outline:0;
  cursor:pointer;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.screen{
  position:fixed;
  inset:0;
  display:none;
  width:100%;
  height:100%;
}

.screen.active{
  display:flex;
}

/* =========================
   START
========================= */

#start{
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:
    radial-gradient(circle at center,#604a32 0%,#30271f 55%,#151515 100%);
  color:white;
  z-index:50;
}

.logo{
  font-size:clamp(42px,10vw,80px);
  font-weight:900;
  letter-spacing:3px;
  text-shadow:5px 5px 0 #111;
  margin-bottom:10px;
}

.subtitle{
  color:#ddd;
  font-size:clamp(13px,3vw,20px);
  margin-bottom:40px;
}

.startBtn{
  min-width:220px;
  min-height:70px;
  padding:15px 30px;
  border-radius:18px;
  background:#f3c95c;
  color:#2c2115;
  font-size:24px;
  font-weight:900;
  box-shadow:0 7px 0 #9b7626;
  position:relative;
  z-index:100;
  pointer-events:auto;
}

.startBtn:active{
  transform:translateY(5px);
  box-shadow:0 2px 0 #9b7626;
}

/* =========================
   PICK
========================= */

#pick{
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#1c1713;
  color:white;
  padding:20px;
  z-index:50;
}

.pickTitle{
  font-size:clamp(24px,6vw,42px);
  font-weight:900;
  margin-bottom:20px;
}

.pickSub{
  color:#aaa;
  margin-bottom:20px;
}

.pickArea{
  width:min(950px,96vw);
  display:flex;
  gap:16px;
  justify-content:center;
}

.pickCard{
  flex:1;
  min-width:0;
  max-width:280px;
  min-height:230px;
  border:4px solid #555;
  border-radius:18px;
  background:#29231e;
  color:white;
  padding:14px;
  position:relative;
  touch-action:none;
  transition:.12s;
}

.pickCard.selectedP1{
  border-color:#63a9ff;
  box-shadow:0 0 0 4px rgba(70,150,255,.2);
}

.pickCard.selectedP2{
  border-color:#ff6c6c;
  box-shadow:0 0 0 4px rgba(255,80,80,.2);
}

.pickCard:active{
  transform:scale(.97);
}

.preview{
  width:100%;
  height:120px;
  display:block;
  border-radius:12px;
  background:#151515;
}

.heroName{
  font-size:22px;
  font-weight:900;
  margin-top:10px;
}

.heroDesc{
  font-size:12px;
  color:#aaa;
  margin-top:5px;
}

.pickStatus{
  margin-top:20px;
  font-weight:800;
  color:#f3c95c;
  text-align:center;
}

.pickGo{
  margin-top:15px;
  min-width:180px;
  min-height:54px;
  border-radius:14px;
  background:#5dce72;
  color:#102313;
  font-size:19px;
  font-weight:900;
}

/* =========================
   GAME
========================= */

#game{
  background:#111;
  align-items:center;
  justify-content:center;
}

.gameWrap{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
}

#gameCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
  pointer-events:none;
}

/* =========================
   HUD
========================= */

.hud{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:95px;
  z-index:10;
  pointer-events:none;
}

.hudPlayer{
  position:absolute;
  top:12px;
  width:36%;
  max-width:420px;
}

.hudLeft{
  left:3%;
}

.hudRight{
  right:3%;
}

.hudName{
  color:white;
  font-weight:900;
  font-size:clamp(13px,3vw,21px);
  margin-bottom:4px;
  text-shadow:2px 2px 0 #111;
}

.bar{
  height:15px;
  background:#1b1b1b;
  border:2px solid #080808;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 2px 0 rgba(255,255,255,.1);
}

.hpFill{
  height:100%;
  background:#e95757;
  width:100%;
  transition:width:.1s linear;
}

.ultFill{
  height:100%;
  background:#f3cf4f;
  width:0%;
}

.hudRight .hpFill,
.hudRight .ultFill{
  float:right;
}

.timer{
  position:absolute;
  left:50%;
  top:10px;
  transform:translateX(-50%);
  min-width:70px;
  padding:5px 10px;
  border-radius:10px;
  background:#151515;
  border:3px solid #555;
  color:white;
  text-align:center;
  font-size:clamp(22px,5vw,35px);
  font-weight:900;
  z-index:20;
}

.ammo{
  color:white;
  font-size:clamp(11px,2.5vw,17px);
  font-weight:900;
  margin-top:4px;
}

/* =========================
   CONTROLS
========================= */

.controls{
  position:absolute;
  left:0;
  right:0;
  bottom:
    max(12px, env(safe-area-inset-bottom));
  height:145px;
  z-index:30;
  display:flex;
  justify-content:space-between;
  padding:
    0 max(12px, env(safe-area-inset-left))
    0 max(12px, env(safe-area-inset-right));
  pointer-events:none;
}

.controlSide{
  width:42%;
  max-width:420px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  pointer-events:auto;
}

.actionBtn{
  min-width:0;
  min-height:62px;
  border-radius:16px;
  border:4px solid #222;
  box-shadow:0 5px 0 #111;
  color:#111;
  font-weight:900;
  font-size:clamp(12px,3vw,18px);
  position:relative;
  pointer-events:auto;
  touch-action:none;
  transition:transform .05s;
}

.actionBtn.white{
  background:#f4f4f4;
}

.actionBtn.green{
  background:#62d879;
}

.actionBtn.blue{
  background:#55a9ef;
}

.actionBtn.yellow{
  background:#f3cd55;
}

.actionBtn.pressed{
  transform:translateY(4px);
  box-shadow:0 1px 0 #111;
}

.actionBtn.disabled{
  filter:grayscale(.7);
  opacity:.5;
}

.cooldownText{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:24px;
  text-shadow:2px 2px #111;
}

/* =========================
   RESULT
========================= */

#result{
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle,#55402d,#211b16 70%);
  color:white;
  z-index:60;
}

.resultTitle{
  font-size:clamp(38px,9vw,70px);
  font-weight:900;
  margin-bottom:25px;
}

.resultText{
  font-size:clamp(18px,4vw,28px);
  margin-bottom:30px;
}

.resultButtons{
  display:flex;
  gap:12px;
}

.resultBtn{
  min-width:145px;
  min-height:58px;
  padding:12px 20px;
  border-radius:15px;
  font-weight:900;
  font-size:18px;
}

.restartBtn{
  background:#f3c95c;
}

.menuBtn{
  background:#ddd;
}

/* =========================
   SMALL SCREEN
========================= */

@media(max-width:700px){
  .pickArea{
    gap:8px;
  }

  .pickCard{
    min-height:200px;
    padding:8px;
  }

  .preview{
    height:95px;
  }

  .heroName{
    font-size:17px;
  }

  .heroDesc{
    font-size:10px;
  }

  .controls{
    height:125px;
  }

  .actionBtn{
    min-height:54px;
    border-width:3px;
    border-radius:13px;
  }
}

@media(max-height:600px){
  .hud{
    height:75px;
  }

  .controls{
    height:105px;
  }

  .actionBtn{
    min-height:44px;
  }
}
</style>
</head>

<body>

<!-- =========================
     START
========================= -->

<section id="start" class="screen active">
  <div class="logo">OVERDUEL 2D</div>
  <div class="subtitle">2인 모바일 픽셀 배틀</div>

  <button id="startBtn" class="startBtn">
    게임 시작
  </button>
</section>


<!-- =========================
     PICK
========================= -->

<section id="pick" class="screen">

  <div class="pickTitle">영웅 선택</div>
  <div class="pickSub" id="pickSub">
    P1이 영웅을 선택하세요
  </div>

  <div class="pickArea">

    <button class="pickCard" data-hero="lucio">
      <canvas class="preview" id="previewLucio"></canvas>
      <div class="heroName">LUCIO</div>
      <div class="heroDesc">
        기동력 · 음파 공격 · 방벽
      </div>
    </button>

    <button class="pickCard" data-hero="bastion">
      <canvas class="preview" id="previewBastion"></canvas>
      <div class="heroName">BASTION</div>
      <div class="heroDesc">
        회복 · 연사 모드 · 포격
      </div>
    </button>

    <button class="pickCard" data-hero="dva">
      <canvas class="preview" id="previewDva"></canvas>
      <div class="heroName">D.VA</div>
      <div class="heroDesc">
        부스터 · 방어 · 자폭
      </div>
    </button>

  </div>

  <div class="pickStatus" id="pickStatus">
    P1 선택 대기
  </div>

  <button class="pickGo" id="pickGo">
    전투 시작
  </button>

</section>


<!-- =========================
     GAME
========================= -->

<section id="game" class="screen">

  <div class="gameWrap">

    <canvas id="gameCanvas"></canvas>

    <div class="hud">

      <div class="hudPlayer hudLeft">
        <div class="hudName" id="name1">P1</div>
        <div class="bar">
          <div class="hpFill" id="hp1"></div>
        </div>
        <div class="bar">
          <div class="ultFill" id="ult1"></div>
        </div>
        <div class="ammo" id="ammo1">탄약 6 / 6</div>
      </div>

      <div class="timer" id="timer">
        60
      </div>

      <div class="hudPlayer hudRight">
        <div class="hudName" id="name2">P2</div>
        <div class="bar">
          <div class="hpFill" id="hp2"></div>
        </div>
        <div class="bar">
          <div class="ultFill" id="ult2"></div>
        </div>
        <div class="ammo" id="ammo2">탄약 6 / 6</div>
      </div>

    </div>


    <div class="controls">

      <div class="controlSide">

        <button class="actionBtn white" data-player="0" data-action="attack">
          평타
        </button>

        <button class="actionBtn green" data-player="0" data-action="skill1">
          스킬 1
        </button>

        <button class="actionBtn blue" data-player="0" data-action="skill2">
          스킬 2
        </button>

        <button class="actionBtn yellow" data-player="0" data-action="ult">
          궁극기
        </button>

      </div>


      <div class="controlSide">

        <button class="actionBtn white" data-player="1" data-action="attack">
          평타
        </button>

        <button class="actionBtn green" data-player="1" data-action="skill1">
          스킬 1
        </button>

        <button class="actionBtn blue" data-player="1" data-action="skill2">
          스킬 2
        </button>

        <button class="actionBtn yellow" data-player="1" data-action="ult">
          궁극기
        </button>

      </div>

    </div>

  </div>

</section>


<!-- =========================
     RESULT
========================= -->

<section id="result" class="screen">

  <div class="resultTitle" id="resultTitle">
    P1 승리
  </div>

  <div class="resultText" id="resultText">
    전투 종료
  </div>

  <div class="resultButtons">

    <button class="resultBtn restartBtn" id="restartBtn">
      다시하기
    </button>

    <button class="resultBtn menuBtn" id="menuBtn">
      메뉴
    </button>

  </div>

</section>


<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W = 1000;
let H = 600;
let dpr = 1;

function resizeCanvas(){

  const rect = canvas.getBoundingClientRect();

  dpr = Math.min(window.devicePixelRatio || 1, 2);

  W = Math.max(320, rect.width);
  H = Math.max(240, rect.height);

  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange",()=>{
  setTimeout(resizeCanvas,100);
});


/* =========================================================
   SCREEN
========================================================= */

const screens = {
  start:document.getElementById("start"),
  pick:document.getElementById("pick"),
  game:document.getElementById("game"),
  result:document.getElementById("result")
};

function showScreen(name){

  Object.values(screens).forEach(s=>{
    s.classList.remove("active");
  });

  screens[name].classList.add("active");

  if(name === "game"){
    setTimeout(resizeCanvas,30);
  }
}


/* =========================================================
   MOBILE INPUT
   - touchstart 즉시 반응
   - click fallback
   - 중복 실행 방지
========================================================= */

function mobileButton(element, callback){

  let touchTriggered = false;
  let lastTouchTime = 0;

  element.addEventListener(
    "touchstart",
    function(e){

      e.preventDefault();

      touchTriggered = true;
      lastTouchTime = performance.now();

      element.classList.add("pressed");

      callback(e);

    },
    {passive:false}
  );

  element.addEventListener(
    "touchend",
    function(e){

      e.preventDefault();

      element.classList.remove("pressed");

    },
    {passive:false}
  );

  element.addEventListener(
    "touchcancel",
    function(){

      element.classList.remove("pressed");

    },
    {passive:false}
  );

  element.addEventListener(
    "click",
    function(e){

      e.preventDefault();

      const now = performance.now();

      if(
        touchTriggered &&
        now - lastTouchTime < 600
      ){
        touchTriggered = false;
        return;
      }

      callback(e);

    }
  );
}


/* =========================================================
   HERO
========================================================= */

const HERO_DATA = {

  lucio:{
    name:"LUCIO",
    color:"#43c96b",
    hp:100,
    ammo:6
  },

  bastion:{
    name:"BASTION",
    color:"#8d9c61",
    hp:125,
    ammo:6
  },

  dva:{
    name:"D.VA",
    color:"#f18ac0",
    hp:105,
    ammo:6
  }

};

let selectedP1 = null;
let selectedP2 = null;

const pickCards = document.querySelectorAll(".pickCard");
const pickStatus = document.getElementById("pickStatus");
const pickSub = document.getElementById("pickSub");

pickCards.forEach(card=>{

  mobileButton(card,()=>{

    const hero = card.dataset.hero;

    if(!selectedP1){

      selectedP1 = hero;

      pickCards.forEach(c=>{
        c.classList.remove("selectedP1");
      });

      card.classList.add("selectedP1");

      pickSub.textContent = "P2가 영웅을 선택하세요";
      pickStatus.textContent =
        "P1: " + HERO_DATA[hero].name +
        " / P2 선택 대기";

      return;
    }

    if(!selectedP2){

      selectedP2 = hero;

      card.classList.add("selectedP2");

      pickStatus.textContent =
        "P1: " + HERO_DATA[selectedP1].name +
        " / P2: " + HERO_DATA[selectedP2].name;

    }

  });

});


/* =========================================================
   PREVIEW
========================================================= */

function drawPreview(canvasEl,hero){

  const c = canvasEl.getContext("2d");

  const w = canvasEl.width =
    canvasEl.clientWidth * 2;

  const h = canvasEl.height =
    canvasEl.clientHeight * 2;

  c.setTransform(2,0,0,2,0,0);

  const cw = canvasEl.clientWidth;
  const ch = canvasEl.clientHeight;

  c.clearRect(0,0,cw,ch);

  c.fillStyle="#151515";
  c.fillRect(0,0,cw,ch);

  drawCharacter(
    c,
    hero,
    cw/2,
    ch/2,
    1.1,
    false
  );
}

function drawPreviews(){

  drawPreview(
    document.getElementById("previewLucio"),
    "lucio"
  );

  drawPreview(
    document.getElementById("previewBastion"),
    "bastion"
  );

  drawPreview(
    document.getElementById("previewDva"),
    "dva"
  );
}


/* =========================================================
   PLAYER
========================================================= */

function createPlayer(hero,side){

  const data = HERO_DATA[hero];

  return {

    hero,
    name:data.name,

    side,

    x:
      side === 0
      ? W * .22
      : W * .78,

    y:
      H * .5,

    baseY:
      H * .5,

    phase:
      side === 0 ? 0 : Math.PI,

    hp:data.hp,
    maxHp:data.hp,

    shield:0,

    ammo:data.ammo,
    maxAmmo:data.ammo,

    reloading:false,
    reloadTimer:0,

    attackTimer:0,

    skill1Timer:0,
    skill2Timer:0,

    ultCharge:0,

    radius:28,

    boosted:0,

    blocking:false,

    tankMode:false,

    healing:false,
    healTimer:0,

    dashTimer:0,

    alive:true

  };
}

let players = [];


/* =========================================================
   GAME STATE
========================================================= */

let bullets = [];
let effects = [];
let particles = [];

let running = false;
let gameTime = 60;
let lastFrame = 0;

const BASE_ATTACK_COOLDOWN = .5;


/* =========================================================
   START GAME
========================================================= */

function startGame(){

  if(!selectedP1 || !selectedP2) return;

  showScreen("game");

  resizeCanvas();

  players = [
    createPlayer(selectedP1,0),
    createPlayer(selectedP2,1)
  ];

  bullets = [];
  effects = [];
  particles = [];

  gameTime = 60;

  running = true;

  lastFrame = performance.now();

  updateHUD();

  requestAnimationFrame(gameLoop);
}


/* =========================================================
   ATTACK
========================================================= */

function normalAttack(p){

  if(!running || !p.alive) return;

  if(p.reloading) return;

  if(p.attackTimer > 0) return;

  if(p.ammo <= 0){

    reload(p);
    return;
  }

  p.ammo--;

  let damage = 12;

  let cooldown = BASE_ATTACK_COOLDOWN;

  if(p.hero === "bastion" && p.tankMode){

    damage = 4;
    cooldown = .17;
  }

  p.attackTimer = cooldown;

  if(p.hero === "lucio"){

    fireBullet(p,0,-0.03,damage);

    fireBullet(p,0,0.03,damage);

  }
  else if(p.hero === "bastion"){

    fireBullet(p,0,0,damage);

  }
  else if(p.hero === "dva"){

    fireBullet(p,0,-0.08,damage);
    fireBullet(p,0,0,damage);
    fireBullet(p,0,0.08,damage);

  }

  effects.push({
    type:"muzzle",
    x:p.x,
    y:p.y,
    life:.12
  });

  if(p.ammo <= 0){

    setTimeout(()=>{

      if(
        p.alive &&
        p.ammo <= 0 &&
        !p.reloading
      ){
        reload(p);
      }

    },80);
  }
}


/* =========================================================
   BULLET
========================================================= */

function fireBullet(p,angle,spread,damage){

  const target =
    players[1-p.side];

  if(!target || !target.alive) return;

  const dx = target.x - p.x;
  const dy = target.y - p.y;

  const baseAngle =
    Math.atan2(dy,dx) + spread;

  const speed = 700;

  bullets.push({

    x:p.x,
    y:p.y,

    vx:Math.cos(baseAngle)*speed,
    vy:Math.sin(baseAngle)*speed,

    damage,

    owner:p.side,

    radius:7,

    life:2

  });
}


/* =========================================================
   RELOAD
========================================================= */

function reload(p){

  if(p.reloading) return;

  if(p.ammo >= p.maxAmmo) return;

  p.reloading = true;
  p.reloadTimer = 1.25;

  if(p.hero === "bastion"){
    p.tankMode = false;
  }
}


/* =========================================================
   SKILL 1
========================================================= */

function useSkill1(p){

  if(!running || !p.alive) return;

  if(p.skill1Timer > 0) return;

  if(p.hero === "lucio"){

    p.boosted = 3;
    p.skill1Timer = 8;

    effects.push({
      type:"boost",
      owner:p.side,
      life:3
    });

  }

  else if(p.hero === "bastion"){

    if(p.healing) return;

    p.healing = true;
    p.healTimer = 1;

    p.skill1Timer = 8;

  }

  else if(p.hero === "dva"){

    p.dashTimer = .35;
    p.skill1Timer = 6;

    p.x += p.side === 0 ? 100 : -100;

    p.x = Math.max(
      100,
      Math.min(W-100,p.x)
    );

    effects.push({
      type:"dash",
      x:p.x,
      y:p.y,
      life:.35
    });

  }
}


/* =========================================================
   SKILL 2
========================================================= */

function useSkill2(p){

  if(!running || !p.alive) return;

  if(p.skill2Timer > 0) return;

  if(p.hero === "lucio"){

    const target = players[1-p.side];

    if(target){

      fireSpecialBullet(
        p,
        17,
        850,
        12
      );

    }

    p.skill2Timer = 5;

  }

  else if(p.hero === "bastion"){

    p.tankMode = !p.tankMode;

    p.skill2Timer = 4;

    effects.push({
      type:"tank",
      owner:p.side,
      life:4
    });

  }

  else if(p.hero === "dva"){

    p.blocking = true;

    p.skill2Timer = 8;

    setTimeout(()=>{

      p.blocking = false;

    },1300);

  }
}


/* =========================================================
   SPECIAL BULLET
========================================================= */

function fireSpecialBullet(
  p,
  damage,
  speed,
  radius
){

  const target =
    players[1-p.side];

  if(!target) return;

  const angle =
    Math.atan2(
      target.y-p.y,
      target.x-p.x
    );

  bullets.push({

    x:p.x,
    y:p.y,

    vx:Math.cos(angle)*speed,
    vy:Math.sin(angle)*speed,

    damage,

    owner:p.side,

    radius,

    life:1.5,

    special:true

  });

}


/* =========================================================
   ULT
========================================================= */

function useUltimate(p){

  if(!running || !p.alive) return;

  if(p.ultCharge < 100) return;

  p.ultCharge = 0;

  if(p.hero === "lucio"){

    p.shield += 40;

    effects.push({
      type:"barrier",
      owner:p.side,
      life:4
    });

  }

  else if(p.hero === "bastion"){

    for(let i=0;i<3;i++){

      effects.push({

        type:"artillery",

        owner:p.side,

        targetX:
          players[1-p.side].x +
          (Math.random()-.5)*130,

        targetY:
          players[1-p.side].y +
          (Math.random()-.5)*130,

        delay:.7+i*.5,

        life:2.4

      });

    }

  }

  else if(p.hero === "dva"){

    effects.push({

      type:"bomb",

      owner:p.side,

      x:p.x,

      y:p.y,

      delay:1.2,

      life:2

    });

  }
}


/* =========================================================
   DAMAGE
========================================================= */

function damage(target,amount,attackerSide){

  if(!target.alive) return;

  /* 방어 */

  if(target.blocking){

    effects.push({
      type:"block",
      x:target.x,
      y:target.y,
      life:.2
    });

    return;
  }

  /* 회복 중 피격 */

  if(target.healing){

    target.healing = false;
    target.healTimer = 0;
  }

  /* 실드 */

  if(target.shield > 0){

    const absorbed =
      Math.min(target.shield,amount);

    target.shield -= absorbed;

    amount -= absorbed;
  }

  if(amount <= 0) return;

  target.hp -= amount;

  target.hp =
    Math.max(0,target.hp);

  /* 궁극기 충전 */

  if(
    attackerSide !== undefined &&
    attackerSide !== target.side
  ){

    players[attackerSide].ultCharge +=
      amount * .65;

    players[attackerSide].ultCharge =
      Math.min(
        100,
        players[attackerSide].ultCharge
      );
  }

  effects.push({
    type:"hit",
    x:target.x,
    y:target.y,
    life:.2
  });

  if(target.hp <= 0){

    target.alive = false;

    finishGame(
      attackerSide === 0
      ? "P1"
      : "P2"
    );
  }
}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayers(dt){

  players.forEach(p=>{

    if(!p.alive) return;

    /* 쿨다운 */

    p.attackTimer =
      Math.max(0,p.attackTimer-dt);

    p.skill1Timer =
      Math.max(0,p.skill1Timer-dt);

    p.skill2Timer =
      Math.max(0,p.skill2Timer-dt);

    p.boosted =
      Math.max(0,p.boosted-dt);

    p.dashTimer =
      Math.max(0,p.dashTimer-dt);


    /* 자동 세로 이동 */

    const movementSpeed =
      p.boosted > 0 ? 2.5 : 1.35;

    p.phase +=
      dt * movementSpeed;

    const amplitude =
      p.boosted > 0 ? H*.28 : H*.20;

    p.y =
      H*.5 +
      Math.sin(p.phase)*amplitude;

    p.y =
      Math.max(100,
        Math.min(H-150,p.y)
      );


    /* 바스티온 회복 */

    if(p.healing){

      const healAmount =
        25 * dt;

      p.hp =
        Math.min(
          p.maxHp,
          p.hp + healAmount
        );

      p.healTimer -= dt;

      if(p.healTimer <= 0){

        p.healing = false;
        p.healTimer = 0;

      }
    }


    /* 재장전 */

    if(p.reloading){

      p.reloadTimer -= dt;

      if(p.reloadTimer <= 0){

        p.reloading = false;
        p.ammo = p.maxAmmo;

      }
    }

  });
}


/* =========================================================
   BULLET UPDATE
========================================================= */

function updateBullets(dt){

  for(let i=bullets.length-1;i>=0;i--){

    const b = bullets[i];

    const oldX = b.x;
    const oldY = b.y;

    b.x += b.vx * dt;
    b.y += b.vy * dt;

    b.life -= dt;

    const target =
      players[1-b.owner];

    if(target && target.alive){

      /*
       선분에 가까운 판정을 사용해서
       빠른 탄환도 상대를 그냥 통과하지 않도록 함
      */

      const dx = b.x-oldX;
      const dy = b.y-oldY;

      const len2 = dx*dx+dy*dy;

      let t = 0;

      if(len2 > 0){

        t =
          ((target.x-oldX)*dx +
           (target.y-oldY)*dy) /
          len2;

        t = Math.max(0,Math.min(1,t));
      }

      const closestX =
        oldX + dx*t;

      const closestY =
        oldY + dy*t;

      const distance =
        Math.hypot(
          target.x-closestX,
          target.y-closestY
        );

      if(
        distance <
        target.radius + b.radius
      ){

        damage(
          target,
          b.damage,
          b.owner
        );

        bullets.splice(i,1);

        continue;
      }
    }

    if(
      b.life <= 0 ||
      b.x < -100 ||
      b.x > W+100 ||
      b.y < -100 ||
      b.y > H+100
    ){

      bullets.splice(i,1);
    }

  }
}


/* =========================================================
   EFFECT UPDATE
========================================================= */

function updateEffects(dt){

  for(let i=effects.length-1;i>=0;i--){

    const e = effects[i];

    e.life -= dt;

    if(e.delay !== undefined){

      e.delay -= dt;

      if(
        e.delay <= 0 &&
        !e.done
      ){

        processSpecialEffect(e);
        e.done = true;
      }
    }

    if(e.life <= 0){

      effects.splice(i,1);
    }
  }


  for(let i=particles.length-1;i>=0;i--){

    const p = particles[i];

    p.x += p.vx*dt;
    p.y += p.vy*dt;

    p.life -= dt;

    if(p.life <= 0){

      particles.splice(i,1);
    }
  }
}


/* =========================================================
   SPECIAL EFFECTS
========================================================= */

function processSpecialEffect(e){

  const target =
    players[1-e.owner];

  if(!target || !target.alive) return;


  if(e.type === "artillery"){

    const distance =
      Math.hypot(
        target.x-e.targetX,
        target.y-e.targetY
      );

    if(distance < 100){

      damage(
        target,
        20,
        e.owner
      );
    }

    createExplosion(
      e.targetX,
      e.targetY,
      100
    );

  }


  else if(e.type === "bomb"){

    const distance =
      Math.hypot(
        target.x-e.x,
        target.y-e.y
      );

    if(distance < 170){

      damage(
        target,
        42,
        e.owner
      );
    }

    createExplosion(
      e.x,
      e.y,
      170
    );
  }
}


/* =========================================================
   PARTICLES
========================================================= */

function createExplosion(x,y,size){

  effects.push({
    type:"explosion",
    x,
    y,
    size,
    life:.5
  });

  for(let i=0;i<25;i++){

    const angle =
      Math.random()*Math.PI*2;

    const speed =
      70+Math.random()*180;

    particles.push({

      x,
      y,

      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,

      life:.35+Math.random()*.3

    });
  }
}


/* =========================================================
   DRAW ARENA
========================================================= */

function drawArena(){

  ctx.clearRect(0,0,W,H);

  /* background */

  ctx.fillStyle="#15120f";
  ctx.fillRect(0,0,W,H);

  /* arena */

  const arenaX = W*.07;
  const arenaY = H*.12;
  const arenaW = W*.86;
  const arenaH = H*.70;

  ctx.fillStyle="#d2b47a";
  ctx.fillRect(
    arenaX,
    arenaY,
    arenaW,
    arenaH
  );

  /* stone border */

  ctx.strokeStyle="#493b2c";
  ctx.lineWidth=18;

  ctx.strokeRect(
    arenaX,
    arenaY,
    arenaW,
    arenaH
  );

  /* sand details */

  ctx.strokeStyle="rgba(100,70,35,.18)";
  ctx.lineWidth=2;

  for(let i=0;i<18;i++){

    const x =
      arenaX+Math.random()*arenaW;

    const y =
      arenaY+Math.random()*arenaH;

    ctx.beginPath();
    ctx.arc(x,y,2,0,Math.PI*2);
    ctx.stroke();
  }

  /* river */

  ctx.fillStyle="#80a8a1";

  ctx.fillRect(
    arenaX,
    H*.495,
    arenaW,
    4
  );

  ctx.fillStyle="rgba(255,255,255,.35)";

  for(let i=0;i<12;i++){

    ctx.fillRect(
      arenaX+i*arenaW/12,
      H*.495,
      25,
      1
    );
  }

  /* center line */

  ctx.strokeStyle="rgba(40,30,20,.25)";
  ctx.setLineDash([10,10]);
  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(W/2,arenaY);
  ctx.lineTo(W/2,arenaY+arenaH);

  ctx.stroke();

  ctx.setLineDash([]);
}


/* =========================================================
   CHARACTER
========================================================= */

function drawCharacter(
  c,
  hero,
  x,
  y,
  scale=1,
  battle=true
){

  c.save();

  c.translate(x,y);
  c.scale(scale,scale);

  /* shadow */

  c.fillStyle="rgba(0,0,0,.25)";
  c.beginPath();
  c.ellipse(0,30,28,9,0,0,Math.PI*2);
  c.fill();


  if(hero === "lucio"){

    /* body */

    c.fillStyle="#49c96c";
    c.fillRect(-17,-12,34,38);

    /* armor */

    c.fillStyle="#e2e2e2";
    c.fillRect(-14,-8,28,13);

    /* head */

    c.fillStyle="#704735";
    c.beginPath();
    c.arc(0,-22,18,0,Math.PI*2);
    c.fill();

    /* hair */

    c.fillStyle="#41b85e";

    c.fillRect(-19,-38,38,9);

    c.fillRect(-22,-31,8,12);
    c.fillRect(14,-31,8,12);

    /* glasses */

    c.fillStyle="#161616";
    c.fillRect(-14,-25,11,6);
    c.fillRect(3,-25,11,6);

    c.fillStyle="#77e5ff";
    c.fillRect(-11,-24,7,3);
    c.fillRect(4,-24,7,3);

    /* legs */

    c.fillStyle="#303030";

    c.fillRect(-13,24,9,12);
    c.fillRect(4,24,9,12);

  }


  else if(hero === "bastion"){

    /* body */

    c.fillStyle="#76805b";
    c.fillRect(-22,-15,44,42);

    /* armor */

    c.fillStyle="#9ba47c";
    c.fillRect(-18,-28,36,22);

    /* eye */

    c.fillStyle="#58b9d8";
    c.fillRect(-5,-22,10,6);

    /* antenna */

    c.strokeStyle="#6d754f";
    c.lineWidth=4;

    c.beginPath();
    c.moveTo(12,-25);
    c.lineTo(22,-40);
    c.stroke();

    /* legs */

    c.fillStyle="#444936";
    c.fillRect(-18,26,13,12);
    c.fillRect(5,26,13,12);

  }


  else if(hero === "dva"){

    /* mech */

    c.fillStyle="#e887bb";
    c.fillRect(-24,-13,48,40);

    /* armor */

    c.fillStyle="#71a5dc";

    c.fillRect(-21,-25,42,20);

    /* cockpit */

    c.fillStyle="#302b40";

    c.fillRect(-13,-21,26,11);

    /* face */

    c.fillStyle="#f0c2ad";

    c.fillRect(-8,-19,16,8);

    /* bunny mark */

    c.fillStyle="#f4a6ca";

    c.fillRect(-5,-30,10,4);

    /* legs */

    c.fillStyle="#5d6b89";

    c.fillRect(-20,25,13,12);
    c.fillRect(7,25,13,12);

  }

  c.restore();
}


/* =========================================================
   DRAW PLAYERS
========================================================= */

function drawPlayers(){

  players.forEach(p=>{

    if(!p.alive) return;

    drawCharacter(
      ctx,
      p.hero,
      p.x,
      p.y,
      1,
      true
    );

    /* shield */

    if(p.shield > 0){

      ctx.strokeStyle="rgba(90,200,255,.8)";
      ctx.lineWidth=5;

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        42,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }

    /* blocking */

    if(p.blocking){

      ctx.strokeStyle="#63a9ff";
      ctx.lineWidth=6;

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        48,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }

    /* healing */

    if(p.healing){

      ctx.strokeStyle="#62d879";
      ctx.lineWidth=4;

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        40,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }

  });
}


/* =========================================================
   DRAW BULLETS
========================================================= */

function drawBullets(){

  bullets.forEach(b=>{

    ctx.fillStyle =
      b.special
      ? "#69d5ff"
      : "#fff1a8";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      b.radius,
      0,
      Math.PI*2
    );

    ctx.fill();

    if(b.special){

      ctx.strokeStyle="rgba(90,220,255,.5)";
      ctx.lineWidth=4;

      ctx.beginPath();

      ctx.arc(
        b.x,
        b.y,
        b.radius+5,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }

  });
}


/* =========================================================
   DRAW EFFECTS
========================================================= */

function drawEffects(){

  effects.forEach(e=>{

    if(e.type === "hit"){

      ctx.strokeStyle="#fff";
      ctx.lineWidth=4;

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        20,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }


    else if(e.type === "muzzle"){

      ctx.fillStyle="#fff0a0";

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        18,
        0,
        Math.PI*2
      );

      ctx.fill();
    }


    else if(e.type === "explosion"){

      const progress =
        1 - e.life/.5;

      ctx.strokeStyle =
        "rgba(255,220,100,"+
        Math.max(0,e.life*2)+")";

      ctx.lineWidth=8;

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        e.size*progress,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }


    else if(e.type === "barrier"){

      const p =
        players[e.owner];

      if(p){

        ctx.strokeStyle="rgba(100,220,255,.8)";
        ctx.lineWidth=7;

        ctx.beginPath();

        ctx.arc(
          p.x,
          p.y,
          55,
          0,
          Math.PI*2
        );

        ctx.stroke();
      }
    }


    else if(e.type === "boost"){

      const p =
        players[e.owner];

      if(p){

        ctx.strokeStyle="rgba(70,255,120,.6)";
        ctx.lineWidth=4;

        ctx.beginPath();

        ctx.arc(
          p.x,
          p.y,
          45,
          0,
          Math.PI*2
        );

        ctx.stroke();
      }
    }


    else if(e.type === "tank"){

      const p =
        players[e.owner];

      if(p){

        ctx.strokeStyle="rgba(160,170,100,.7)";
        ctx.lineWidth=5;

        ctx.strokeRect(
          p.x-35,
          p.y-40,
          70,
          80
        );
      }
    }


    else if(e.type === "dash"){

      ctx.strokeStyle="rgba(255,150,210,.7)";
      ctx.lineWidth=5;

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        35,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }


    else if(e.type === "block"){

      ctx.strokeStyle="#79bfff";
      ctx.lineWidth=5;

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        34,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }


    else if(e.type === "artillery"){

      if(e.delay > 0){

        ctx.strokeStyle="rgba(255,80,80,.8)";
        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
          e.targetX,
          e.targetY,
          35,
          0,
          Math.PI*2
        );

        ctx.stroke();
      }
    }


    else if(e.type === "bomb"){

      ctx.strokeStyle="#ff8c62";
      ctx.lineWidth=5;

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        45,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }

  });


  particles.forEach(p=>{

    ctx.fillStyle="#f4d66b";

    ctx.fillRect(
      p.x,
      p.y,
      5,
      5
    );

  });
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  if(players.length < 2) return;

  const p1 = players[0];
  const p2 = players[1];

  document.getElementById("name1").textContent =
    "P1 " + p1.name;

  document.getElementById("name2").textContent =
    "P2 " + p2.name;

  document.getElementById("hp1").style.width =
    (p1.hp/p1.maxHp*100)+"%";

  document.getElementById("hp2").style.width =
    (p2.hp/p2.maxHp*100)+"%";

  document.getElementById("ult1").style.width =
    p1.ultCharge+"%";

  document.getElementById("ult2").style.width =
    p2.ultCharge+"%";

  document.getElementById("ammo1").textContent =
    p1.reloading
    ? "재장전 중..."
    : `탄약 ${p1.ammo} / ${p1.maxAmmo}`;

  document.getElementById("ammo2").textContent =
    p2.reloading
    ? "재장전 중..."
    : `탄약 ${p2.ammo} / ${p2.maxAmmo}`;

  document.getElementById("timer").textContent =
    Math.ceil(gameTime);
}


/* =========================================================
   BUTTON STATE
========================================================= */

function updateButtons(){

  document.querySelectorAll(
    ".actionBtn"
  ).forEach(btn=>{

    const p =
      players[Number(btn.dataset.player)];

    if(!p) return;

    const action =
      btn.dataset.action;

    let disabled=false;

    if(action === "attack"){

      disabled =
        p.reloading ||
        p.attackTimer > 0;

    }

    else if(action === "skill1"){

      disabled =
        p.skill1Timer > 0;

    }

    else if(action === "skill2"){

      disabled =
        p.skill2Timer > 0;

    }

    else if(action === "ult"){

      disabled =
        p.ultCharge < 100;

    }

    btn.classList.toggle(
      "disabled",
      disabled
    );

  });
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(now){

  if(!running) return;

  let dt =
    (now-lastFrame)/1000;

  lastFrame = now;

  /*
    기기 프레임이 갑자기 떨어져도
    게임이 한 번에 너무 많이 진행되지 않도록 제한
  */

  dt = Math.min(dt,.05);

  gameTime -= dt;

  if(gameTime <= 0){

    gameTime = 0;

    finishByTime();

    return;
  }

  updatePlayers(dt);
  updateBullets(dt);
  updateEffects(dt);

  drawArena();
  drawPlayers();
  drawBullets();
  drawEffects();

  updateHUD();
  updateButtons();

  requestAnimationFrame(gameLoop);
}


/* =========================================================
   END GAME
========================================================= */

function finishByTime(){

  if(!running) return;

  const p1 = players[0];
  const p2 = players[1];

  let winner;

  if(p1.hp > p2.hp){

    winner = "P1";

  }
  else if(p2.hp > p1.hp){

    winner = "P2";

  }
  else{

    winner = "DRAW";
  }

  finishGame(winner);
}


function finishGame(winner){

  if(!running) return;

  running = false;

  if(winner === "DRAW"){

    document.getElementById("resultTitle").textContent =
      "DRAW";

    document.getElementById("resultText").textContent =
      "무승부";

  }
  else{

    document.getElementById("resultTitle").textContent =
      winner + " 승리";

    document.getElementById("resultText").textContent =
      winner === "P1"
      ? "P1이 전투에서 승리했습니다."
      : "P2가 전투에서 승리했습니다.";
  }

  showScreen("result");
}


/* =========================================================
   ACTION BUTTONS
========================================================= */

document.querySelectorAll(
  ".actionBtn"
).forEach(btn=>{

  mobileButton(btn,()=>{

    if(!running) return;

    const playerIndex =
      Number(btn.dataset.player);

    const action =
      btn.dataset.action;

    const p =
      players[playerIndex];

    if(!p || !p.alive) return;

    if(action === "attack"){

      normalAttack(p);

    }
    else if(action === "skill1"){

      useSkill1(p);

    }
    else if(action === "skill2"){

      useSkill2(p);

    }
    else if(action === "ult"){

      useUltimate(p);

    }

  });

});


/* =========================================================
   START / PICK / RESULT
========================================================= */

mobileButton(
  document.getElementById("startBtn"),
  ()=>{

    selectedP1 = null;
    selectedP2 = null;

    pickCards.forEach(card=>{
      card.classList.remove(
        "selectedP1",
        "selectedP2"
      );
    });

    pickSub.textContent =
      "P1이 영웅을 선택하세요";

    pickStatus.textContent =
      "P1 선택 대기";

    showScreen("pick");

    setTimeout(drawPreviews,50);
  }
);


mobileButton(
  document.getElementById("pickGo"),
  ()=>{

    if(!selectedP1 || !selectedP2){

      pickStatus.textContent =
        "P1과 P2 모두 영웅을 선택하세요";

      return;
    }

    startGame();
  }
);


mobileButton(
  document.getElementById("restartBtn"),
  ()=>{

    startGame();
  }
);


mobileButton(
  document.getElementById("menuBtn"),
  ()=>{

    running = false;

    showScreen("start");
  }
);


/* =========================================================
   GLOBAL MOBILE SAFETY
========================================================= */

document.addEventListener(
  "gesturestart",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gesturechange",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gestureend",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "contextmenu",
  e=>e.preventDefault()
);

document.addEventListener(
  "dblclick",
  e=>e.preventDefault(),
  {passive:false}
);


/*
  게임 영역에서 화면 스크롤 방지
*/

document.addEventListener(
  "touchmove",
  e=>{

    if(
      e.target.closest(
        "#game,#start,#pick,#result"
      )
    ){

      e.preventDefault();
    }

  },
  {passive:false}
);


/* 초기화 */

resizeCanvas();

drawPreviews();

</script>

</body>
</html>
