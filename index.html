<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">

<title>Overwatch Style 2D Battle</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

button{
  border:0;
  outline:0;
  font-family:inherit;
  touch-action:none;
}

.screen{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#151515;
}

.hidden{
  display:none!important;
}

/* =========================
   START
========================= */

#startScreen{
  flex-direction:column;
  color:white;
}

#startScreen h1{
  font-size:42px;
  margin:0 0 12px;
}

#startScreen p{
  color:#aaa;
  margin-bottom:35px;
}

.startBtn{
  width:230px;
  height:65px;
  border-radius:14px;
  background:#f5c400;
  font-size:24px;
  font-weight:bold;
}

/* =========================
   PICK
========================= */

#pickScreen{
  flex-direction:column;
  background:#202020;
  color:white;
}

.pickTitle{
  font-size:32px;
  margin-bottom:18px;
}

.pickPlayers{
  display:flex;
  gap:35px;
  margin-bottom:20px;
}

.pickPlayer{
  font-size:19px;
  color:#ddd;
}

.pickPlayer.active{
  color:#ffd000;
  font-weight:bold;
}

.heroList{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  justify-content:center;
}

.heroCard{
  width:145px;
  height:190px;
  background:#343434;
  border:3px solid transparent;
  border-radius:15px;
  padding:12px;
  color:white;
}

.heroCard.selectedP1{
  border-color:#4aa8ff;
}

.heroCard.selectedP2{
  border-color:#ff5c5c;
}

.heroIcon{
  width:80px;
  height:80px;
  margin:auto;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:36px;
  background:#555;
}

.heroCard h3{
  margin:10px 0 5px;
}

.heroCard small{
  color:#bbb;
}

#pickStart{
  margin-top:20px;
  width:220px;
  height:58px;
  background:#f5c400;
  border-radius:12px;
  font-size:21px;
  font-weight:bold;
}

/* =========================
   GAME
========================= */

#gameScreen{
  background:#000;
}

#game{
  position:relative;
  width:min(100vw,1000px);
  height:min(100vh,620px);
  overflow:hidden;

  background:
    linear-gradient(#d6b37b 0 12%,#c79d67 12% 88%,#b98755 88% 100%);
}

/* stone walls */

.wall{
  position:absolute;
  left:0;
  width:100%;
  height:55px;
  background:
    repeating-linear-gradient(
      90deg,
      #76685a 0 70px,
      #887969 70px 140px
    );
  border-bottom:6px solid #51483f;
}

.wall.top{
  top:0;
}

.wall.bottom{
  bottom:0;
  border-top:6px solid #51483f;
  border-bottom:0;
}

/* center line */

.centerLine{
  position:absolute;
  top:50%;
  left:0;
  width:100%;
  height:4px;
  background:#5e4935;
  opacity:.75;
}

/* =========================
   HUD
========================= */

.hud{
  position:absolute;
  top:62px;
  left:50%;
  transform:translateX(-50%);
  width:72%;
  z-index:20;
}

.hpRow{
  display:flex;
  align-items:center;
  gap:10px;
}

.heroName{
  width:80px;
  color:white;
  font-weight:bold;
  text-shadow:1px 1px #000;
}

.hpOuter{
  flex:1;
  height:18px;
  background:#333;
  border:2px solid #111;
  border-radius:8px;
  overflow:hidden;
}

.hpBar{
  height:100%;
  width:100%;
  background:#e34a4a;
  transition:width .15s;
}

.hpBar.p2{
  background:#4b9cff;
}

.hpText{
  width:55px;
  color:white;
  font-size:13px;
  text-align:right;
}

.ultRow{
  margin-top:4px;
  display:flex;
  align-items:center;
  gap:8px;
}

.ultLabel{
  width:80px;
  color:#ffd400;
  font-size:12px;
}

.ultOuter{
  flex:1;
  height:9px;
  background:#222;
  border:1px solid #111;
  border-radius:5px;
  overflow:hidden;
}

.ultBar{
  height:100%;
  width:0%;
  background:#ffd000;
  transition:width .12s;
}

.ultPercent{
  width:55px;
  color:#ffd000;
  font-size:12px;
  text-align:right;
}

.timer{
  text-align:center;
  color:white;
  font-size:25px;
  font-weight:bold;
  margin:5px 0;
  text-shadow:2px 2px #000;
}

/* =========================
   PLAYERS
========================= */

.player{
  position:absolute;
  width:64px;
  height:64px;
  border-radius:15px;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:30px;
  font-weight:bold;

  z-index:8;
  border:3px solid #222;
  box-shadow:0 5px 12px #0006;

  transition:transform .08s;
}

.player.p1{
  background:#438edb;
  left:14%;
}

.player.p2{
  background:#db5050;
  right:14%;
}

.player.hit{
  transform:scale(1.13);
}

/* =========================
   EFFECTS
========================= */

.projectile{
  position:absolute;
  width:14px;
  height:14px;
  border-radius:50%;
  z-index:6;
  pointer-events:none;
}

.note{
  width:12px;
  height:12px;
  background:#62e9ff;
  box-shadow:0 0 10px #62e9ff;
}

.bullet{
  background:#eee;
}

.shell{
  width:20px;
  height:20px;
  background:#444;
  border:2px solid #222;
}

.missile{
  background:#ffd32a;
  box-shadow:0 0 12px #ff8c00;
}

.explosion{
  position:absolute;
  width:80px;
  height:80px;
  border-radius:50%;
  border:5px solid #ffd000;
  background:#ff8c0038;
  transform:translate(-50%,-50%);
  animation:explode .35s forwards;
  pointer-events:none;
  z-index:15;
}

.wave{
  position:absolute;
  width:100px;
  height:100px;
  border-radius:50%;
  border:5px solid #75eaff;
  transform:translate(-50%,-50%);
  animation:wave .3s forwards;
  pointer-events:none;
  z-index:15;
}

@keyframes explode{
  from{
    transform:translate(-50%,-50%) scale(.3);
    opacity:1;
  }
  to{
    transform:translate(-50%,-50%) scale(1.6);
    opacity:0;
  }
}

@keyframes wave{
  from{
    transform:translate(-50%,-50%) scale(.2);
    opacity:1;
  }
  to{
    transform:translate(-50%,-50%) scale(1.5);
    opacity:0;
  }
}

/* =========================
   CONTROLS
========================= */

.control{
  position:absolute;
  bottom:18px;
  z-index:30;
}

.p1Control{
  right:18px;
}

.p2Control{
  left:18px;
}

.actionPad{
  display:grid;
  grid-template-columns:repeat(2,78px);
  grid-template-rows:repeat(2,78px);
  gap:10px;
}

.actionBtn{
  width:78px;
  height:78px;
  border-radius:14px;

  font-size:13px;
  font-weight:bold;

  border:3px solid #222;
  box-shadow:0 5px 0 #333;
}

.actionBtn:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #333;
}

.attackBtn{
  background:#eee;
  color:#222;
}

.skill1Btn{
  background:#43c76a;
  color:#fff;
}

.skill2Btn{
  background:#3186e8;
  color:#fff;
}

.ultBtn{
  background:#ffd21a;
  color:#222;
}

.actionBtn.cooling{
  opacity:.45;
}

.actionBtn.reloading{
  background:#777;
  color:white;
}

/* ammo */

.ammoBox{
  position:absolute;
  bottom:112px;
  right:20px;
  min-width:160px;
  padding:8px 12px;

  color:white;
  background:#151515dd;
  border:2px solid #333;
  border-radius:10px;

  text-align:center;
  font-size:14px;
  z-index:31;
}

.p2Ammo{
  left:20px;
  right:auto;
}

/* result */

#resultScreen{
  flex-direction:column;
  color:white;
}

#resultText{
  font-size:45px;
  margin-bottom:30px;
}

#restartBtn{
  width:220px;
  height:60px;
  background:#f5c400;
  border-radius:12px;
  font-size:22px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  #game{
    width:100vw;
    height:100vh;
  }

  .hud{
    width:94%;
    top:50px;
  }

  .heroName{
    width:52px;
    font-size:12px;
  }

  .ultLabel{
    width:52px;
    font-size:10px;
  }

  .actionPad{
    grid-template-columns:repeat(2,68px);
    grid-template-rows:repeat(2,68px);
    gap:8px;
  }

  .actionBtn{
    width:68px;
    height:68px;
    font-size:11px;
  }

  .ammoBox{
    bottom:170px;
    font-size:12px;
    min-width:135px;
  }

  .p1Control{
    right:10px;
    bottom:12px;
  }

  .p2Control{
    left:10px;
    bottom:12px;
  }
}
</style>
</head>

<body>

<!-- =========================
     START
========================= -->

<div id="startScreen" class="screen">
  <h1>2D HERO BATTLE</h1>
  <p>1 VS 1 HERO BATTLE</p>
  <button id="startBtn" class="startBtn">게임 시작</button>
</div>

<!-- =========================
     PICK
========================= -->

<div id="pickScreen" class="screen hidden">

  <div class="pickTitle">영웅 선택</div>

  <div class="pickPlayers">
    <div id="pickP1" class="pickPlayer active">P1 선택</div>
    <div id="pickP2" class="pickPlayer">P2 선택</div>
  </div>

  <div class="heroList">

    <button class="heroCard" data-hero="lucio">
      <div class="heroIcon">♪</div>
      <h3>루시우</h3>
      <small>지원 / 기동</small>
    </button>

    <button class="heroCard" data-hero="bastion">
      <div class="heroIcon">▣</div>
      <h3>바스티온</h3>
      <small>화력 / 변신</small>
    </button>

    <button class="heroCard" data-hero="dva">
      <div class="heroIcon">◆</div>
      <h3>D.Va</h3>
      <small>기동 / 방어</small>
    </button>

  </div>

  <button id="pickStart">전투 시작</button>
</div>

<!-- =========================
     GAME
========================= -->

<div id="gameScreen" class="screen hidden">

  <div id="game">

    <div class="wall top"></div>
    <div class="wall bottom"></div>

    <div class="centerLine"></div>

    <!-- HUD -->

    <div class="hud">

      <div class="hpRow">
        <div id="name1" class="heroName">P1</div>

        <div class="hpOuter">
          <div id="hp1" class="hpBar"></div>
        </div>

        <div id="hpText1" class="hpText">100</div>
      </div>

      <div class="ultRow">
        <div class="ultLabel">ULT</div>

        <div class="ultOuter">
          <div id="ult1" class="ultBar"></div>
        </div>

        <div id="ultText1" class="ultPercent">0%</div>
      </div>

      <div id="timer" class="timer">60</div>

      <div class="hpRow">
        <div id="name2" class="heroName">P2</div>

        <div class="hpOuter">
          <div id="hp2" class="hpBar p2"></div>
        </div>

        <div id="hpText2" class="hpText">100</div>
      </div>

      <div class="ultRow">
        <div class="ultLabel">ULT</div>

        <div class="ultOuter">
          <div id="ult2" class="ultBar"></div>
        </div>

        <div id="ultText2" class="ultPercent">0%</div>
      </div>

    </div>

    <!-- PLAYERS -->

    <div id="player1" class="player p1">1</div>
    <div id="player2" class="player p2">2</div>

    <!-- P1 ACTION -->

    <div class="control p1Control">

      <div class="actionPad">

        <button
          id="attack1"
          class="actionBtn attackBtn">
          평타
        </button>

        <button
          id="skill11"
          class="actionBtn skill1Btn">
          스킬 1
        </button>

        <button
          id="skill21"
          class="actionBtn skill2Btn">
          스킬 2
        </button>

        <button
          id="ultButton1"
          class="actionBtn ultBtn">
          궁극기
        </button>

      </div>

    </div>

    <!-- P2 ACTION -->

    <div class="control p2Control">

      <div class="actionPad">

        <button
          id="attack2"
          class="actionBtn attackBtn">
          평타
        </button>

        <button
          id="skill12"
          class="actionBtn skill1Btn">
          스킬 1
        </button>

        <button
          id="skill22"
          class="actionBtn skill2Btn">
          스킬 2
        </button>

        <button
          id="ultButton2"
          class="actionBtn ultBtn">
          궁극기
        </button>

      </div>

    </div>

    <!-- AMMO -->

    <div id="ammo1" class="ammoBox">
      탄약 0 / 0
    </div>

    <div id="ammo2" class="ammoBox p2Ammo">
      탄약 0 / 0
    </div>

  </div>
</div>

<!-- =========================
     RESULT
========================= -->

<div id="resultScreen" class="screen hidden">

  <div id="resultText">P1 승리!</div>

  <button id="restartBtn">
    다시하기
  </button>

</div>


<script>

/* =====================================================
   HERO DATA

   OW1의 영웅 개성을 참고하되
   현재 게임에 맞게 1vs1용으로 재설계
===================================================== */

const heroes = {

  lucio:{
    name:"루시우",

    attackName:"음파 증폭기",
    skill1Name:"볼륨을 높여라!",
    skill2Name:"음파 방출",
    ultName:"소리 방벽",

    hp:100,

    ammoMax:20,
    reloadTime:850,

    /* 평타 탄환 속도 */
    projectileSpeed:650,

    fireDelay:130,

    attackDamage:4,

    skill1Cooldown:6500,
    skill2Cooldown:4200,

    ultDamage:0
  },

  bastion:{
    name:"바스티온",

    attackName:"강습",
    skill1Name:"설정 전환",
    skill2Name:"전술 포탄",
    ultName:"포격",

    hp:110,

    ammoMax:25,
    reloadTime:1050,

    projectileSpeed:760,

    fireDelay:105,

    attackDamage:5,

    skill1Cooldown:5000,
    skill2Cooldown:4200,

    ultDamage:28
  },

  dva:{
    name:"D.Va",

    attackName:"융합포",
    skill1Name:"부스터",
    skill2Name:"방어 매트릭스",
    ultName:"자폭",

    hp:115,

    ammoMax:18,
    reloadTime:1000,

    projectileSpeed:560,

    fireDelay:155,

    attackDamage:7,

    skill1Cooldown:5500,
    skill2Cooldown:5000,

    ultDamage:45
  }

};


/* =====================================================
   GAME STATE
===================================================== */

let selectedHero1="lucio";
let selectedHero2="bastion";

let gameRunning=false;

let hp1=100;
let hp2=100;

let ult1=0;
let ult2=0;

let timeLeft=60;

let lastTime=0;

let player1={
  x:0,
  y:250,
  dir:1,

  ammo:20,
  reloading:false,
  reloadEnd:0,
  lastAttack:0,

  skill1Ready:true,
  skill2Ready:true,

  blocking:false,
  speedBoost:false,
  transformed:false
};

let player2={
  x:0,
  y:350,
  dir:-1,

  ammo:20,
  reloading:false,
  reloadEnd:0,
  lastAttack:0,

  skill1Ready:true,
  skill2Ready:true,

  blocking:false,
  speedBoost:false,
  transformed:false
};

let projectiles=[];


/* =====================================================
   ELEMENTS
===================================================== */

const game=
document.getElementById("game");

const playerEls=[
  document.getElementById("player1"),
  document.getElementById("player2")
];

const hpBars=[
  document.getElementById("hp1"),
  document.getElementById("hp2")
];

const hpTexts=[
  document.getElementById("hpText1"),
  document.getElementById("hpText2")
];

const ultBars=[
  document.getElementById("ult1"),
  document.getElementById("ult2")
];

const ultTexts=[
  document.getElementById("ultText1"),
  document.getElementById("ultText2")
];

const ammoEls=[
  document.getElementById("ammo1"),
  document.getElementById("ammo2")
];

const attackButtons=[
  document.getElementById("attack1"),
  document.getElementById("attack2")
];

const skill1Buttons=[
  document.getElementById("skill11"),
  document.getElementById("skill12")
];

const skill2Buttons=[
  document.getElementById("skill21"),
  document.getElementById("skill22")
];

const ultButtons=[
  document.getElementById("ultButton1"),
  document.getElementById("ultButton2")
];


/* =====================================================
   START / PICK
===================================================== */

document
.getElementById("startBtn")
.addEventListener("pointerdown",e=>{
  e.preventDefault();

  document
  .getElementById("startScreen")
  .classList.add("hidden");

  document
  .getElementById("pickScreen")
  .classList.remove("hidden");
});


let pickingPlayer=1;

document
.querySelectorAll(".heroCard")
.forEach(card=>{

  card.addEventListener("pointerdown",e=>{

    e.preventDefault();

    const hero=card.dataset.hero;

    if(pickingPlayer===1){

      selectedHero1=hero;

      document
      .querySelectorAll(".heroCard")
      .forEach(c=>c.classList.remove("selectedP1"));

      card.classList.add("selectedP1");

      pickingPlayer=2;

      document
      .getElementById("pickP1")
      .classList.remove("active");

      document
      .getElementById("pickP2")
      .classList.add("active");

    }else{

      selectedHero2=hero;

      document
      .querySelectorAll(".heroCard")
      .forEach(c=>c.classList.remove("selectedP2"));

      card.classList.add("selectedP2");

      pickingPlayer=1;

      document
      .getElementById("pickP2")
      .classList.remove("active");

      document
      .getElementById("pickP1")
      .classList.add("active");
    }

  });

});


document
.getElementById("pickStart")
.addEventListener("pointerdown",e=>{

  e.preventDefault();

  startGame();

});


/* =====================================================
   START GAME
===================================================== */

function startGame(){

  const h1=heroes[selectedHero1];
  const h2=heroes[selectedHero2];

  hp1=h1.hp;
  hp2=h2.hp;

  ult1=0;
  ult2=0;

  timeLeft=60;

  player1={
    x:game.clientWidth*0.14,
    y:game.clientHeight*0.38,
    dir:1,

    ammo:h1.ammoMax,
    reloading:false,
    reloadEnd:0,
    lastAttack:0,

    skill1Ready:true,
    skill2Ready:true,

    blocking:false,
    speedBoost:false,
    transformed:false
  };

  player2={
    x:game.clientWidth*0.86,
    y:game.clientHeight*0.62,
    dir:-1,

    ammo:h2.ammoMax,
    reloading:false,
    reloadEnd:0,
    lastAttack:0,

    skill1Ready:true,
    skill2Ready:true,

    blocking:false,
    speedBoost:false,
    transformed:false
  };

  projectiles=[];

  document.getElementById("name1").textContent=h1.name;
  document.getElementById("name2").textContent=h2.name;

  document
  .getElementById("pickScreen")
  .classList.add("hidden");

  document
  .getElementById("gameScreen")
  .classList.remove("hidden");

  gameRunning=true;

  lastTime=performance.now();

  requestAnimationFrame(gameLoop);
}


/* =====================================================
   RELOAD SYSTEM
===================================================== */

function startReload(id){

  const p=id===1?player1:player2;
  const hero=id===1?heroes[selectedHero1]:heroes[selectedHero2];
  const button=attackButtons[id-1];

  if(p.reloading) return;

  if(p.ammo>=hero.ammoMax) return;

  p.reloading=true;

  p.reloadEnd=performance.now()+hero.reloadTime;

  button.classList.add("reloading");
  button.textContent="재장전";

}


function updateReload(id){

  const p=id===1?player1:player2;
  const hero=id===1?heroes[selectedHero1]:heroes[selectedHero2];
  const button=attackButtons[id-1];

  if(!p.reloading) return;

  if(performance.now()>=p.reloadEnd){

    p.reloading=false;

    p.ammo=hero.ammoMax;

    button.classList.remove("reloading");
    button.textContent="평타";
  }

}


/* =====================================================
   NORMAL ATTACK
===================================================== */

function normalAttack(id){

  const p=id===1?player1:player2;
  const enemy=id===1?player2:player1;

  const hero=id===1?heroes[selectedHero1]:heroes[selectedHero2];

  const button=attackButtons[id-1];

  /* 재장전 중 */

  if(p.reloading) return;

  /* 탄약이 없으면 재장전 */

  if(p.ammo<=0){

    startReload(id);
    return;
  }

  /* 공격 속도 */

  const now=performance.now();

  if(now-p.lastAttack<hero.fireDelay) return;

  p.lastAttack=now;

  p.ammo--;

  /*
    영웅별 평타
  */

  if(
    (id===1?selectedHero1:selectedHero2)==="lucio"
  ){

    /*
      루시우는 한 번에 음파 4개를 발사
    */

    for(let i=0;i<4;i++){

      createProjectile(
        id,
        p.x,
        p.y+(i-1.5)*9,
        hero.projectileSpeed,
        hero.attackDamage,
        "note"
      );

    }

  }else if(
    (id===1?selectedHero1:selectedHero2)==="dva"
  ){

    /*
      D.Va 융합포 느낌의 짧은 산탄
    */

    for(let i=0;i<3;i++){

      createProjectile(
        id,
        p.x,
        p.y+(Math.random()-0.5)*22,
        hero.projectileSpeed,
        hero.attackDamage,
        "bullet"
      );

    }

  }else{

    /*
      바스티온은 빠른 연속 사격
    */

    createProjectile(
      id,
      p.x,
      p.y,
      hero.projectileSpeed,
      hero.attackDamage,
      "bullet"
    );

  }

  if(p.ammo<=0){

    setTimeout(()=>{
      if(gameRunning && !p.reloading){
        startReload(id);
      }
    },250);

  }

}


/* =====================================================
   PROJECTILE
===================================================== */

function createProjectile(
  owner,
  x,
  y,
  speed,
  damage,
  type
){

  projectiles.push({

    owner,
    x,
    y,

    vx:
      owner===1
      ? speed
      : -speed,

    damage,
    type,

    alive:true

  });

}


function updateProjectiles(dt){

  for(let i=projectiles.length-1;i>=0;i--){

    const p=projectiles[i];

    p.x += p.vx*dt;

    const target=
      p.owner===1
      ? player2
      : player1;

    /*
      방어 매트릭스
    */

    if(
      (p.owner===1 && player2.blocking) ||
      (p.owner===2 && player1.blocking)
    ){

      if(
        Math.abs(p.x-target.x)<35 &&
        Math.abs(p.y-target.y)<55
      ){

        createBlockEffect(target.x,target.y);

        projectiles.splice(i,1);

        continue;
      }

    }

    if(
      Math.abs(p.x-target.x)<38 &&
      Math.abs(p.y-target.y)<45
    ){

      damageTarget(
        p.owner,
        p.damage
      );

      projectiles.splice(i,1);

      continue;
    }

    if(
      p.x<-100 ||
      p.x>game.clientWidth+100
    ){

      projectiles.splice(i,1);

    }

  }

}


/* =====================================================
   DAMAGE
===================================================== */

function damageTarget(attacker,damage){

  const target=
    attacker===1
    ? player2
    : player1;

  if(target.blocking){

    createBlockEffect(
      target.x,
      target.y
    );

    return;
  }

  if(attacker===1){

    hp2=Math.max(0,hp2-damage);

    /*
      궁극기 충전
      단, 궁극기 자체 피해는 충전하지 않음
    */

    ult1=Math.min(
      100,
      ult1+damage*0.8
    );

  }else{

    hp1=Math.max(0,hp1-damage);

    ult2=Math.min(
      100,
      ult2+damage*0.8
    );

  }

  const targetEl=
    playerEls[target===player1?0:1];

  targetEl.classList.add("hit");

  setTimeout(()=>{
    targetEl.classList.remove("hit");
  },100);

  updateHUD();

  if(hp1<=0 || hp2<=0){

    endGame();

  }

}


/* =====================================================
   SKILLS
===================================================== */

function skill(id){

  const p=id===1?player1:player2;

  const heroKey=
    id===1
    ?selectedHero1
    :selectedHero2;

  const hero=heroes[heroKey];

  if(!p.skill1Ready) return;

  p.skill1Ready=false;

  skill1Buttons[id-1].classList.add("cooling");

  let cooldown=hero.skill1Cooldown;

  /* -------------------------
     LUCIO
  ------------------------- */

  if(heroKey==="lucio"){

    /*
      볼륨을 높여라
      일정 시간 공격 속도 + 이동 속도 증가
    */

    p.speedBoost=true;

    p.attackBoost=true;

    setTimeout(()=>{

      p.speedBoost=false;
      p.attackBoost=false;

    },3000);

  }

  /* -------------------------
     BASTION
  ------------------------- */

  else if(heroKey==="bastion"){

    /*
      설정 전환

      일반 모드:
      빠른 공격

      강습 모드:
      느리지만 강한 공격
    */

    p.transformed=!p.transformed;

    if(p.transformed){

      hero.fireDelay=220;

    }

  }

  /* -------------------------
     D.VA
  ------------------------- */

  else if(heroKey==="dva"){

    /*
      부스터:
      순간적으로 앞으로 돌진
    */

    p.x +=
      id===1
      ? 120
      : -120;

    p.x=Math.max(
      80,
      Math.min(
        game.clientWidth-80,
        p.x
      )
    );

    createDashEffect(
      p.x,
      p.y
    );

  }

  setTimeout(()=>{

    p.skill1Ready=true;

    skill1Buttons[id-1]
    .classList.remove("cooling");

  },cooldown);

}


/* =====================================================
   SKILL 2
===================================================== */

function skill2(id){

  const p=id===1?player1:player2;

  const enemy=id===1?player2:player1;

  const heroKey=
    id===1
    ?selectedHero1
    :selectedHero2;

  const hero=heroes[heroKey];

  if(!p.skill2Ready) return;

  p.skill2Ready=false;

  skill2Buttons[id-1].classList.add("cooling");


  /* -------------------------
     LUCIO
  ------------------------- */

  if(heroKey==="lucio"){

    /*
      음파 방출

      원작의 근거리 파동 개념을
      이 게임에서는 수평 파동으로 표현
    */

    createWave(
      p.x,
      p.y
    );

    const distance=Math.hypot(
      p.x-enemy.x,
      p.y-enemy.y
    );

    if(distance<180){

      damageTarget(
        id,
        12
      );

      /*
        상대를 살짝 밀어냄
      */

      enemy.x +=
        id===1
        ? 45
        : -45;

    }

  }


  /* -------------------------
     BASTION
  ------------------------- */

  else if(heroKey==="bastion"){

    /*
      A-36 전술 포탄

      일반 탄보다 느린 폭발성 투사체
    */

    createProjectile(
      id,
      p.x,
      p.y,
      400,
      20,
      "shell"
    );

  }


  /* -------------------------
     D.VA
  ------------------------- */

  else if(heroKey==="dva"){

    /*
      방어 매트릭스

      일정 시간 투사체 차단
    */

    p.blocking=true;

    setTimeout(()=>{

      p.blocking=false;

    },2200);

  }


  setTimeout(()=>{

    p.skill2Ready=true;

    skill2Buttons[id-1]
    .classList.remove("cooling");

  },hero.skill2Cooldown);

}


/* =====================================================
   ULTIMATE
===================================================== */

function ultimate(id){

  const p=id===1?player1:player2;

  const enemy=id===1?player2:player1;

  const heroKey=
    id===1
    ?selectedHero1
    :selectedHero2;

  if(
    (id===1?ult1:ult2)<100
  ) return;


  /*
    궁극기 게이지 먼저 0
  */

  if(id===1){

    ult1=0;

  }else{

    ult2=0;

  }

  updateHUD();


  /* =========================
     LUCIO
  ========================= */

  if(heroKey==="lucio"){

    /*
      소리 방벽

      1대1에서는 자신의 HP를
      임시 추가 방어력으로 올림
    */

    const shield=30;

    if(id===1){

      hp1=Math.min(
        heroes[selectedHero1].hp+shield,
        hp1+shield
      );

    }else{

      hp2=Math.min(
        heroes[selectedHero2].hp+shield,
        hp2+shield
      );

    }

    createUltEffect(
      p.x,
      p.y
    );

  }


  /* =========================
     BASTION
  ========================= */

  else if(heroKey==="bastion"){

    /*
      포격

      즉시 한 번에 끝내지 않고
      3발을 순서대로 발사
    */

    for(let i=0;i<3;i++){

      setTimeout(()=>{

        if(!gameRunning) return;

        createUltEffect(
          enemy.x,
          enemy.y
        );

        /*
          궁극기 자체 피해는
          다시 궁 게이지를 만들지 않음
        */

        if(enemy.blocking){

          createBlockEffect(
            enemy.x,
            enemy.y
          );

        }else{

          if(id===1){

            hp2=Math.max(
              0,
              hp2-28
            );

          }else{

            hp1=Math.max(
              0,
              hp1-28
            );

          }

          updateHUD();

          if(hp1<=0 || hp2<=0){

            endGame();

          }

        }

      },i*450);

    }

  }


  /* =========================
     D.VA
  ========================= */

  else if(heroKey==="dva"){

    /*
      자폭

      약간의 시간 후 폭발
    */

    const exX= p.x;
    const exY= p.y;

    createWarning(
      exX,
      exY
    );

    setTimeout(()=>{

      if(!gameRunning) return;

      createExplosion(
        exX,
        exY
      );

      const distance=Math.hypot(
        enemy.x-exX,
        enemy.y-exY
      );

      if(distance<230){

        if(enemy.blocking){

          createBlockEffect(
            enemy.x,
            enemy.y
          );

        }else{

          if(id===1){

            hp2=Math.max(
              0,
              hp2-45
            );

          }else{

            hp1=Math.max(
              0,
              hp1-45
            );

          }

          updateHUD();

        }

      }

      if(hp1<=0 || hp2<=0){

        endGame();

      }

    },1000);

  }

}


/* =====================================================
   EFFECTS
===================================================== */

function createBlockEffect(x,y){

  const el=document.createElement("div");

  el.className="wave";

  el.style.left=x+"px";
  el.style.top=y+"px";

  game.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },300);

}


function createWave(x,y){

  const el=document.createElement("div");

  el.className="wave";

  el.style.left=x+"px";
  el.style.top=y+"px";

  game.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },300);

}


function createExplosion(x,y){

  const el=document.createElement("div");

  el.className="explosion";

  el.style.left=x+"px";
  el.style.top=y+"px";

  game.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },400);

}


function createUltEffect(x,y){

  const el=document.createElement("div");

  el.className="explosion";

  el.style.left=x+"px";
  el.style.top=y+"px";

  game.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },400);

}


function createDashEffect(x,y){

  const el=document.createElement("div");

  el.className="wave";

  el.style.left=x+"px";
  el.style.top=y+"px";

  game.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },250);

}


function createWarning(x,y){

  const el=document.createElement("div");

  el.className="explosion";

  el.style.left=x+"px";
  el.style.top=y+"px";

  el.style.opacity=".45";

  game.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },900);

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

  const h1=heroes[selectedHero1];
  const h2=heroes[selectedHero2];

  hpBars[0].style.width=
    (hp1/h1.hp*100)+"%";

  hpBars[1].style.width=
    (hp2/h2.hp*100)+"%";

  hpTexts[0].textContent=
    Math.ceil(hp1);

  hpTexts[1].textContent=
    Math.ceil(hp2);

  ultBars[0].style.width=
    ult1+"%";

  ultBars[1].style.width=
    ult2+"%";

  ultTexts[0].textContent=
    Math.floor(ult1)+"%";

  ultTexts[1].textContent=
    Math.floor(ult2)+"%";

  ammoEls[0].textContent=
    player1.reloading
    ? "재장전 중..."
    : `탄약 ${player1.ammo} / ${h1.ammoMax}`;

  ammoEls[1].textContent=
    player2.reloading
    ? "재장전 중..."
    : `탄약 ${player2.ammo} / ${h2.ammoMax}`;

  ultButtons[0].style.opacity=
    ult1>=100 ? "1" : ".45";

  ultButtons[1].style.opacity=
    ult2>=100 ? "1" : ".45";
}


/* =====================================================
   RENDER
===================================================== */

function renderPlayers(){

  playerEls[0].style.left=
    player1.x+"px";

  playerEls[0].style.top=
    player1.y+"px";

  playerEls[1].style.left=
    player2.x+"px";

  playerEls[1].style.top=
    player2.y+"px";


  playerEls[0].textContent=
    selectedHero1==="lucio"
    ? "♪"
    : selectedHero1==="bastion"
    ? "▣"
    : "◆";

  playerEls[1].textContent=
    selectedHero2==="lucio"
    ? "♪"
    : selectedHero2==="bastion"
    ? "▣"
    : "◆";

}


/* =====================================================
   RENDER PROJECTILES
===================================================== */

function renderProjectiles(){

  /*
    기존 projectile DOM 제거
  */

  document
  .querySelectorAll(".projectile")
  .forEach(e=>e.remove());


  projectiles.forEach(p=>{

    const el=document.createElement("div");

    el.className=
      "projectile "+p.type;

    el.style.left=
      p.x+"px";

    el.style.top=
      p.y+"px";

    game.appendChild(el);

  });

}


/* =====================================================
   AUTO VERTICAL MOVEMENT
===================================================== */

function updateMovement(dt){

  const top=130;
  const bottom=game.clientHeight-125;

  let speed1=
    player1.speedBoost
    ? 125
    : 65;

  let speed2=
    player2.speedBoost
    ? 125
    : 65;


  player1.y +=
    player1.dir*speed1*dt;

  player2.y +=
    player2.dir*speed2*dt;


  if(
    player1.y<=top ||
    player1.y>=bottom
  ){

    player1.dir*=-1;

  }


  if(
    player2.y<=top ||
    player2.y>=bottom
  ){

    player2.dir*=-1;

  }

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(now){

  if(!gameRunning) return;

  const dt=
    Math.min(
      (now-lastTime)/1000,
      .05
    );

  lastTime=now;

  updateMovement(dt);

  updateProjectiles(dt);

  updateReload(1);
  updateReload(2);

  renderPlayers();

  renderProjectiles();

  updateHUD();

  requestAnimationFrame(gameLoop);

}


/* =====================================================
   TIMER
===================================================== */

setInterval(()=>{

  if(!gameRunning) return;

  timeLeft--;

  document
  .getElementById("timer")
  .textContent=timeLeft;

  if(timeLeft<=0){

    endGame();

  }

},1000);


/* =====================================================
   BUTTON BINDING
===================================================== */

function bindButton(button,callback){

  button.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      callback();

    }
  );

}


/* P1 */

bindButton(
  attackButtons[0],
  ()=>normalAttack(1)
);

bindButton(
  skill1Buttons[0],
  ()=>skill(1)
);

bindButton(
  skill2Buttons[0],
  ()=>skill2(1)
);

bindButton(
  ultButtons[0],
  ()=>ultimate(1)
);


/* P2 */

bindButton(
  attackButtons[1],
  ()=>normalAttack(2)
);

bindButton(
  skill1Buttons[1],
  ()=>skill(2)
);

bindButton(
  skill2Buttons[1],
  ()=>skill2(2)
);

bindButton(
  ultButtons[1],
  ()=>ultimate(2)
);


/* =====================================================
   RESULT
===================================================== */

function endGame(){

  if(!gameRunning) return;

  gameRunning=false;

  let result;

  if(hp1>hp2){

    result="P1 승리!";

  }else if(hp2>hp1){

    result="P2 승리!";

  }else{

    result="무승부!";

  }

  document
  .getElementById("resultText")
  .textContent=result;

  document
  .getElementById("gameScreen")
  .classList.add("hidden");

  document
  .getElementById("resultScreen")
  .classList.remove("hidden");

}


/* =====================================================
   RESTART
===================================================== */

document
.getElementById("restartBtn")
.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    document
    .getElementById("resultScreen")
    .classList.add("hidden");

    document
    .getElementById("pickScreen")
    .classList.remove("hidden");

    pickingPlayer=1;

    document
    .getElementById("pickP1")
    .classList.add("active");

    document
    .getElementById("pickP2")
    .classList.remove("active");

  }
);


/* =====================================================
   INITIAL HUD
===================================================== */

updateHUD();

</script>
