<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Overduel 2D</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  max-width:1100px;
  overflow:hidden;
  background:#111;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

.screen{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:#171717;
  color:white;
  z-index:20;
}

.hidden{
  display:none!important;
}

.title{
  font-size:clamp(38px,8vw,76px);
  font-weight:900;
  letter-spacing:3px;
  text-shadow:5px 5px #000;
  margin-bottom:12px;
}

.subtitle{
  font-size:clamp(14px,3vw,22px);
  color:#bbb;
  margin-bottom:30px;
}

button{
  border:0;
  outline:0;
  font-weight:900;
  cursor:pointer;
  touch-action:none;
}

.mainBtn{
  min-width:220px;
  padding:17px 30px;
  margin:8px;
  border:4px solid #111;
  border-radius:12px;
  background:#f4f0df;
  box-shadow:0 6px 0 #000;
  font-size:20px;
}

.mainBtn:active{
  transform:translateY(5px);
  box-shadow:0 1px 0 #000;
}

#pickScreen{
  justify-content:flex-start;
  padding-top:5vh;
}

.pickTitle{
  font-size:clamp(25px,5vw,42px);
  margin-bottom:20px;
}

.pickArea{
  display:flex;
  gap:15px;
  width:min(94vw,800px);
  justify-content:center;
  flex-wrap:wrap;
}

.heroCard{
  width:clamp(100px,25vw,190px);
  min-height:190px;
  border:4px solid #111;
  border-radius:14px;
  background:#e7ddc2;
  color:#111;
  box-shadow:0 7px 0 #000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:12px;
}

.heroCard:active{
  transform:translateY(5px);
  box-shadow:0 2px 0 #000;
}

.heroPreview{
  width:90px;
  height:90px;
  margin-bottom:8px;
}

.heroName{
  font-size:20px;
  font-weight:900;
}

.heroDesc{
  font-size:11px;
  text-align:center;
  margin-top:5px;
  color:#444;
}

#gameUI{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
}

#hud{
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  width:min(94vw,1000px);
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.hudSide{
  width:39%;
}

.hudName{
  font-size:clamp(11px,2vw,16px);
  font-weight:900;
  color:white;
  text-shadow:2px 2px #000;
  margin-bottom:3px;
}

.hpOuter,.ultOuter{
  width:100%;
  height:15px;
  border:3px solid #111;
  background:#555;
  overflow:hidden;
}

.hpOuter{
  border-radius:4px;
}

.hpFill{
  height:100%;
  width:100%;
  background:#e84848;
}

#p2Hp{
  background:#4e9be8;
}

.ultOuter{
  height:9px;
  margin-top:4px;
  border-radius:5px;
}

.ultFill{
  width:0%;
  height:100%;
  background:#ffd52f;
}

#timer{
  width:90px;
  text-align:center;
  font-size:clamp(25px,5vw,42px);
  font-weight:900;
  color:white;
  text-shadow:3px 3px #000;
}

#status{
  position:absolute;
  top:95px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  font-size:clamp(11px,2vw,15px);
  font-weight:900;
  text-shadow:2px 2px #000;
  text-align:center;
}

#controls{
  position:absolute;
  bottom:12px;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  padding:0 18px;
  pointer-events:auto;
}

.controlSide{
  display:grid;
  grid-template-columns:repeat(2,clamp(58px,14vw,82px));
  grid-template-rows:repeat(2,clamp(58px,14vw,82px));
  gap:8px;
}

.skillBtn{
  border:4px solid #111;
  border-radius:14px;
  box-shadow:0 5px 0 #000;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-size:clamp(10px,2.2vw,14px);
  position:relative;
  overflow:hidden;
}

.skillBtn:active,
.skillBtn.pressed{
  transform:translateY(4px);
  box-shadow:0 1px 0 #000;
}

.basic{
  background:#fff;
}

.skill1{
  background:#55d66b;
}

.skill2{
  background:#4d9ce8;
}

.ultimate{
  background:#ffd83d;
}

.skillIcon{
  font-size:clamp(19px,5vw,30px);
  line-height:1;
  margin-bottom:3px;
}

.cooldown{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:22px;
  font-weight:900;
}

#message{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  color:white;
  font-size:clamp(30px,8vw,70px);
  font-weight:900;
  text-shadow:5px 5px #000;
  pointer-events:none;
  z-index:10;
  text-align:center;
}

#resultScreen h1{
  font-size:clamp(45px,10vw,80px);
  margin:0 0 20px;
  text-shadow:5px 5px #000;
}

#resultText{
  font-size:clamp(17px,4vw,28px);
  margin-bottom:25px;
}

@media(max-height:600px){
  #controls{
    bottom:7px;
  }

  .controlSide{
    grid-template-columns:repeat(2,56px);
    grid-template-rows:repeat(2,56px);
    gap:5px;
  }

  #status{
    top:75px;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="startScreen" class="screen">
  <div class="title">OVERDUEL 2D</div>
  <div class="subtitle">1 VS 1 PIXEL BATTLE</div>
  <button id="startBtn" class="mainBtn">GAME START</button>
</div>

<div id="pickScreen" class="screen hidden">
  <div class="pickTitle" id="pickTitle">PLAYER 1 SELECT</div>
  <div class="pickArea">

    <button class="heroCard" data-hero="lucio">
      <canvas class="heroPreview" id="previewLucio"></canvas>
      <div class="heroName">LUCIO</div>
      <div class="heroDesc">음악 장판 / 음파 / 소리 방벽</div>
    </button>

    <button class="heroCard" data-hero="bastion">
      <canvas class="heroPreview" id="previewBastion"></canvas>
      <div class="heroName">BASTION</div>
      <div class="heroDesc">자가 수리 / 전차 모드 / 포격</div>
    </button>

    <button class="heroCard" data-hero="dva">
      <canvas class="heroPreview" id="previewDva"></canvas>
      <div class="heroName">D.VA</div>
      <div class="heroDesc">부스터 / 방어 / 메카 투척</div>
    </button>

  </div>
</div>

<div id="gameUI" class="hidden">

  <div id="hud">

    <div class="hudSide">
      <div class="hudName" id="p1Name">P1</div>
      <div class="hpOuter">
        <div class="hpFill" id="p1Hp"></div>
      </div>
      <div class="ultOuter">
        <div class="ultFill" id="p1Ult"></div>
      </div>
    </div>

    <div id="timer">90</div>

    <div class="hudSide">
      <div class="hudName" id="p2Name" style="text-align:right">P2</div>
      <div class="hpOuter">
        <div class="hpFill" id="p2Hp"></div>
      </div>
      <div class="ultOuter">
        <div class="ultFill" id="p2Ult"></div>
      </div>
    </div>

  </div>

  <div id="status"></div>

  <div id="controls">

    <div class="controlSide">
      <button id="p1Attack" class="skillBtn basic">
        <div class="skillIcon">●</div>
        <div>ATTACK</div>
      </button>

      <button id="p1Skill1" class="skillBtn skill1">
        <div class="skillIcon">①</div>
        <div>SKILL 1</div>
        <div class="cooldown hidden"></div>
      </button>

      <button id="p1Skill2" class="skillBtn skill2">
        <div class="skillIcon">②</div>
        <div>SKILL 2</div>
        <div class="cooldown hidden"></div>
      </button>

      <button id="p1Ult" class="skillBtn ultimate">
        <div class="skillIcon">★</div>
        <div>ULT</div>
        <div class="cooldown hidden"></div>
      </button>
    </div>

    <div class="controlSide">
      <button id="p2Attack" class="skillBtn basic">
        <div class="skillIcon">●</div>
        <div>ATTACK</div>
      </button>

      <button id="p2Skill1" class="skillBtn skill1">
        <div class="skillIcon">①</div>
        <div>SKILL 1</div>
        <div class="cooldown hidden"></div>
      </button>

      <button id="p2Skill2" class="skillBtn skill2">
        <div class="skillIcon">②</div>
        <div>SKILL 2</div>
        <div class="cooldown hidden"></div>
      </button>

      <button id="p2Ult" class="skillBtn ultimate">
        <div class="skillIcon">★</div>
        <div>ULT</div>
        <div class="cooldown hidden"></div>
      </button>
    </div>

  </div>

</div>

<div id="message"></div>

<div id="resultScreen" class="screen hidden">
  <h1 id="resultTitle">WIN!</h1>
  <div id="resultText"></div>
  <button id="restartBtn" class="mainBtn">REMATCH</button>
  <button id="menuBtn" class="mainBtn">MENU</button>
</div>

</div>

<script>
"use strict";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W=0,H=0,dpr=1;

const startScreen=document.getElementById("startScreen");
const pickScreen=document.getElementById("pickScreen");
const gameUI=document.getElementById("gameUI");
const resultScreen=document.getElementById("resultScreen");
const pickTitle=document.getElementById("pickTitle");
const message=document.getElementById("message");
const statusEl=document.getElementById("status");

let selectingPlayer=1;
let p1Hero=null;
let p2Hero=null;
let running=false;
let lastTime=0;
let gameTime=90;

const bullets=[];
const effects=[];
const particles=[];

let players=[];

const HERO={
  lucio:{
    name:"LUCIO",
    maxHp:100,
    speed:105,
    radius:27,
    ammoMax:8,
    attackDamage:9,
    attackCooldown:.5,
    skill1Cooldown:5,
    skill2Cooldown:5,
    ultCost:100
  },

  bastion:{
    name:"BASTION",
    maxHp:120,
    speed:75,
    radius:29,
    ammoMax:6,
    attackDamage:13,
    attackCooldown:.5,
    skill1Cooldown:8,
    skill2Cooldown:4,
    ultCost:100
  },

  dva:{
    name:"D.VA",
    maxHp:125,
    speed:90,
    radius:30,
    ammoMax:12,
    attackDamage:6,
    attackCooldown:.5,
    skill1Cooldown:6,
    skill2Cooldown:8,
    ultCost:100
  }
};

function resize(){
  W=window.innerWidth;
  H=window.innerHeight;

  dpr=Math.min(window.devicePixelRatio||1,2);

  canvas.width=Math.floor(W*dpr);
  canvas.height=Math.floor(H*dpr);
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);

  if(players.length){
    for(const p of players){
      p.x=Math.max(45,Math.min(W-45,p.x));
      p.y=Math.max(145,Math.min(H-145,p.y));
    }
  }
}

window.addEventListener("resize",resize);
window.addEventListener("orientationchange",()=>setTimeout(resize,150));
resize();

function mobileButton(el,callback){
  let touched=false;

  el.addEventListener("touchstart",e=>{
    e.preventDefault();
    touched=true;
    el.classList.add("pressed");
    callback();
  },{passive:false});

  el.addEventListener("touchend",e=>{
    e.preventDefault();
    el.classList.remove("pressed");
    setTimeout(()=>touched=false,350);
  },{passive:false});

  el.addEventListener("touchcancel",()=>{
    el.classList.remove("pressed");
    setTimeout(()=>touched=false,350);
  });

  el.addEventListener("click",e=>{
    e.preventDefault();
    if(touched)return;
    callback();
  });
}

function rand(a,b){
  return a+Math.random()*(b-a);
}

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function dist(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function makePlayer(id,hero,x,y){
  const h=HERO[hero];

  return {
    id,
    hero,
    x,
    y,
    vx:0,
    vy:0,
    dir:id===1?1:-1,

    hp:h.maxHp,
    maxHp:h.maxHp,

    ammo:h.ammoMax,
    ammoMax:h.ammoMax,

    ult:0,

    attackTimer:0,
    skill1Timer:0,
    skill2Timer:0,

    speed:h.speed,
    baseSpeed:h.speed,

    invuln:0,

    blocking:false,
    blockTimer:0,

    healing:false,
    healTimer:0,

    tank:false,

    lucioMode:"speed",
    auraPulse:0,

    dvaMech:true,
    dvaRecall:false,
    dvaRecallTimer:0,
    dvaRecalled:false,
    dvaPilotTime:0,

    dashTimer:0,
    dashVX:0,

    name:h.name
  };
}

function startGame(){
  selectingPlayer=1;
  p1Hero=null;
  p2Hero=null;

  startScreen.classList.add("hidden");
  resultScreen.classList.add("hidden");
  gameUI.classList.add("hidden");
  pickScreen.classList.remove("hidden");

  pickTitle.textContent="PLAYER 1 SELECT";
}

function selectHero(hero){
  if(selectingPlayer===1){
    p1Hero=hero;
    selectingPlayer=2;
    pickTitle.textContent="PLAYER 2 SELECT";
    return;
  }

  p2Hero=hero;
  beginBattle();
}

function beginBattle(){
  pickScreen.classList.add("hidden");
  gameUI.classList.remove("hidden");

  players=[
    makePlayer(1,p1Hero,W*.25,H*.47),
    makePlayer(2,p2Hero,W*.75,H*.53)
  ];

  gameTime=90;
  bullets.length=0;
  effects.length=0;
  particles.length=0;

  message.textContent="";
  running=true;
  lastTime=performance.now();

  updateHUD();
  requestAnimationFrame(loop);
}

function finishGame(reason){
  if(!running)return;

  running=false;

  let winner=null;

  if(reason==="timeout"){
    if(players[0].hp>players[1].hp) winner=1;
    else if(players[1].hp>players[0].hp) winner=2;
  }else{
    winner=players[0].hp<=0?2:1;
  }

  setTimeout(()=>{
    gameUI.classList.add("hidden");
    resultScreen.classList.remove("hidden");

    const title=document.getElementById("resultTitle");
    const text=document.getElementById("resultText");

    if(winner===null){
      title.textContent="DRAW";
      text.textContent="TIME OUT";
    }else{
      title.textContent=`PLAYER ${winner} WIN!`;
      text.textContent=`${players[winner-1].name} VICTORY`;
    }
  },400);
}

function damage(target,amount,source){
  if(!running || target.hp<=0)return;

  if(target.invuln>0)return;

  if(target.blocking){
    spawnText(target.x,target.y-45,"BLOCK");
    return;
  }

  if(target.healing){
    target.healing=false;
    target.healTimer=0;
  }

  amount=Math.max(0,amount);

  target.hp-=amount;
  target.hp=clamp(target.hp,0,target.maxHp);

  if(source && source!==target){
    source.ult=clamp(source.ult+amount*.85,0,100);
  }

  spawnHit(target.x,target.y);

  if(target.hp<=0){
    finishGame("ko");
  }
}

function normalAttack(p){
  if(!running)return;
  if(p.hp<=0)return;

  if(p.dvaRecall)return;

  if(p.attackTimer>0)return;

  if(p.ammo<=0){
    reload(p);
    return;
  }

  const target=players[p.id===1?1:0];

  p.attackTimer=p.tank?.17:.5;

  p.ammo--;

  if(p.hero==="lucio"){
    fireBullet(p,target,9,720,6,2);
  }

  else if(p.hero==="bastion"){
    if(p.tank){
      fireBullet(p,target,4,880,5,1);
    }else{
      fireBullet(p,target,13,700,7,1);
    }
  }

  else if(p.hero==="dva"){
    for(let i=-1;i<=1;i++){
      fireBullet(p,target,6,760,5,1,i*.08);
    }
  }

  if(p.ammo<=0){
    setTimeout(()=>{
      if(p.hp>0 && p.ammo<=0 && running) reload(p);
    },180);
  }
}

function reload(p){
  if(p.hp<=0)return;

  p.ammo=p.ammoMax;

  if(p.hero==="bastion"){
    p.tank=false;
  }

  spawnText(p.x,p.y-42,"RELOAD");
}

function fireBullet(p,target,damageValue,speed,radius,count=1,spread=0){
  const base=Math.atan2(target.y-p.y,target.x-p.x);

  for(let i=0;i<count;i++){
    let angle=base;

    if(count>1){
      angle+=spread*(i-(count-1)/2);
    }

    bullets.push({
      owner:p.id,
      x:p.x+p.dir*20,
      y:p.y,
      px:p.x+p.dir*20,
      py:p.y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      radius,
      damage:damageValue,
      life:2
    });
  }
}

function fireSpecialBullet(p,damageValue,speed,radius){
  const target=players[p.id===1?1:0];

  const angle=Math.atan2(target.y-p.y,target.x-p.x);

  bullets.push({
    owner:p.id,
    x:p.x+p.dir*25,
    y:p.y,
    px:p.x+p.dir*25,
    py:p.y,
    vx:Math.cos(angle)*speed,
    vy:Math.sin(angle)*speed,
    radius,
    damage:damageValue,
    life:1.5,
    special:true,
    knockback:35
  });
}

function useSkill1(p){
  if(!running || p.hp<=0)return;
  if(p.skill1Timer>0)return;

  if(p.hero==="lucio"){
    p.skill1Timer=HERO.lucio.skill1Cooldown;

    // 장판 자체는 항상 존재하고,
    // 스킬 1은 장판 효과만 변경한다.
    p.lucioMode=p.lucioMode==="speed"?"heal":"speed";

    spawnRing(p.x,p.y,58,p.lucioMode==="speed"?"speed":"heal");
    spawnText(
      p.x,
      p.y-55,
      p.lucioMode==="speed"?"SPEED":"HEAL"
    );
  }

  else if(p.hero==="bastion"){
    p.skill1Timer=HERO.bastion.skill1Cooldown;

    if(p.tank)return;

    p.healing=true;
    p.healTimer=1;

    spawnRing(p.x,p.y,38,"heal");
    spawnText(p.x,p.y-48,"REPAIR");
  }

  else if(p.hero==="dva"){
    if(!p.dvaMech || p.dvaRecall)return;

    p.skill1Timer=HERO.dva.skill1Cooldown;

    p.dashTimer=.35;

    const target=players[p.id===1?1:0];

    const angle=Math.atan2(target.y-p.y,target.x-p.x);

    p.dashVX=Math.cos(angle)*330;

    effects.push({
      type:"dash",
      x:p.x,
      y:p.y,
      life:.35,
      max:.35,
      owner:p.id
    });
  }
}

function useSkill2(p){
  if(!running || p.hp<=0)return;
  if(p.skill2Timer>0)return;

  if(p.hero==="lucio"){
    p.skill2Timer=HERO.lucio.skill2Cooldown;

    fireSpecialBullet(p,20,850,13);

    spawnRing(p.x+p.dir*20,p.y,25,"wave");
  }

  else if(p.hero==="bastion"){
    p.skill2Timer=HERO.bastion.skill2Cooldown;

    if(p.tank)return;

    p.tank=true;

    spawnRing(p.x,p.y,45,"tank");
    spawnText(p.x,p.y-50,"TANK MODE");
  }

  else if(p.hero==="dva"){
    if(!p.dvaMech || p.dvaRecall)return;

    p.skill2Timer=HERO.dva.skill2Cooldown;

    p.blocking=true;
    p.blockTimer=1.3;

    spawnRing(p.x,p.y,35,"block");
    spawnText(p.x,p.y-50,"DEFENSE");
  }
}

function useUltimate(p){
  if(!running || p.hp<=0)return;
  if(p.ult<100)return;

  if(p.hero==="lucio"){
    p.ult=0;

    p.invuln=.25;

    p.hp=clamp(p.hp+40,0,p.maxHp);

    effects.push({
      type:"soundbarrier",
      x:p.x,
      y:p.y,
      life:1.2,
      max:1.2,
      owner:p.id
    });

    spawnText(p.x,p.y-55,"SOUND BARRIER");
  }

  else if(p.hero==="bastion"){
    p.ult=0;

    const target=players[p.id===1?1:0];

    for(let i=0;i<3;i++){
      const tx=target.x+rand(-90,90);
      const ty=target.y+rand(-70,70);

      effects.push({
        type:"artillery",
        x:tx,
        y:ty,
        life:.9+i*.25,
        max:.9+i*.25,
        owner:p.id,
        done:false
      });
    }

    spawnText(p.x,p.y-55,"ARTILLERY");
  }

  else if(p.hero==="dva"){
    if(!p.dvaMech || p.dvaRecall)return;

    p.ult=0;

    throwDvaMech(p);
  }
}

function throwDvaMech(p){
  p.dvaMech=false;
  p.dvaRecall=false;
  p.dvaRecalled=false;

  p.dvaPilotTime=0;

  const target=players[p.id===1?1:0];

  const angle=Math.atan2(target.y-p.y,target.x-p.x);

  const distance=Math.min(430,Math.hypot(target.x-p.x,target.y-p.y));

  effects.push({
    type:"dvaMech",
    x:p.x,
    y:p.y,
    sx:p.x,
    sy:p.y,
    tx:p.x+Math.cos(angle)*distance,
    ty:p.y+Math.sin(angle)*distance,
    life:.85,
    max:.85,
    owner:p.id,
    phase:"fly",
    exploded:false
  });

  spawnText(p.x,p.y-55,"MECH THROW!");
}

function startDvaRecall(p){
  if(p.dvaMech)return;
  if(p.dvaRecall)return;
  if(p.ult<100)return;

  p.dvaRecall=true;
  p.dvaRecallTimer=1.2;

  effects.push({
    type:"recall",
    x:p.x,
    y:p.y,
    life:1.2,
    max:1.2,
    owner:p.id
  });

  spawnText(p.x,p.y-55,"MECH INCOMING");
}

function updatePlayer(p,dt){
  p.attackTimer=Math.max(0,p.attackTimer-dt);
  p.skill1Timer=Math.max(0,p.skill1Timer-dt);
  p.skill2Timer=Math.max(0,p.skill2Timer-dt);
  p.invuln=Math.max(0,p.invuln-dt);

  if(p.hero==="dva" && !p.dvaMech){
    // 메카가 없는 동안 궁극기 게이지 자동 충전
    p.ult=clamp(p.ult+dt*30,0,100);

    p.dvaPilotTime+=dt;

    if(p.dvaRecall){
      p.dvaRecallTimer-=dt;

      if(p.dvaRecallTimer<=0){
        p.dvaRecall=false;
        p.dvaMech=true;
        p.dvaRecalled=true;
        p.hp=clamp(p.hp+15,0,p.maxHp);

        spawnRing(p.x,p.y,55,"recall");
        spawnText(p.x,p.y-50,"MECH READY");
      }
    }
  }

  if(p.blocking){
    p.blockTimer-=dt;

    if(p.blockTimer<=0){
      p.blocking=false;
    }
  }

  if(p.healing){
    const healAmount=25*dt;

    p.hp=clamp(p.hp+healAmount,0,p.maxHp);

    p.healTimer-=dt;

    if(p.healTimer<=0){
      p.healing=false;
    }
  }

  if(p.dashTimer>0){
    p.dashTimer-=dt;

    p.x+=p.dashVX*dt;

    const target=players[p.id===1?1:0];

    if(dist(p,target)<p.radius+target.radius+12){
      damage(target,10,p);

      target.x+=Math.sign(p.dashVX||p.dir)*30;
    }
  }else{
    automaticMovement(p,dt);
  }

  p.x=clamp(p.x,45,W-45);
  p.y=clamp(p.y,140,H-145);

  if(p.hero==="lucio"){
    p.auraPulse+=dt*2.5;

    updateLucioAura(p);
  }
}

function automaticMovement(p,dt){
  const enemy=players[p.id===1?1:0];

  let base=p.baseSpeed;

  if(p.hero==="bastion" && p.tank){
    base*=.8;
  }

  if(p.hero==="lucio" && p.lucioMode==="speed"){
    base*=1.35;
  }

  const wave=Math.sin(performance.now()/700+p.id*2.5);

  const desiredY=H*.5+wave*(H*.28);

  let dy=desiredY-p.y;

  if(Math.abs(dy)>5){
    dy=Math.sign(dy)*Math.min(Math.abs(dy),base*dt);
    p.y+=dy;
  }

  const horizontalBias=(enemy.x-p.x)*.03;

  p.x+=clamp(horizontalBias,-12,12)*dt;
}

function updateLucioAura(p){
  const auraRadius=92;

  // 장판 안에 있는 적/자신에게 효과가 적용될 수 있도록
  // 현재 게임에서는 루시우 자신에게 효과를 적용.
  // 속도 모드는 automaticMovement에서 적용.
  // 회복 모드는 장판이 유지되는 동안 지속 회복.
  if(p.lucioMode==="heal"){
    p.hp=clamp(p.hp+3*0.016,0,p.maxHp);
  }
}

function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];

    b.life-=dt;

    if(b.life<=0){
      bullets.splice(i,1);
      continue;
    }

    b.px=b.x;
    b.py=b.y;

    b.x+=b.vx*dt;
    b.y+=b.vy*dt;

    if(b.x<-50 || b.x>W+50 || b.y<-50 || b.y>H+50){
      bullets.splice(i,1);
      continue;
    }

    const target=players[b.owner===1?1:0];

    if(target.hp<=0)continue;

    const hit=segmentCircleHit(
      b.px,b.py,
      b.x,b.y,
      target.x,target.y,
      target.radius+b.radius
    );

    if(hit){
      damage(target,b.damage,players[b.owner-1]);

      if(b.knockback){
        target.x+=Math.sign(b.vx)*b.knockback;
      }

      spawnHit(b.x,b.y);
      bullets.splice(i,1);
    }
  }
}

function segmentCircleHit(x1,y1,x2,y2,cx,cy,r){
  const dx=x2-x1;
  const dy=y2-y1;

  const len2=dx*dx+dy*dy;

  let t=0;

  if(len2>0){
    t=((cx-x1)*dx+(cy-y1)*dy)/len2;
    t=clamp(t,0,1);
  }

  const px=x1+t*dx;
  const py=y1+t*dy;

  return Math.hypot(cx-px,cy-py)<=r;
}

function updateEffects(dt){
  for(let i=effects.length-1;i>=0;i--){
    const e=effects[i];

    e.life-=dt;

    if(e.type==="artillery"){
      if(!e.done && e.life<=0){
        e.done=true;

        for(const p of players){
          if(p.id!==e.owner && Math.hypot(p.x-e.x,p.y-e.y)<100){
            damage(p,20,players[e.owner-1]);
          }
        }

        spawnExplosion(e.x,e.y);
      }
    }

    else if(e.type==="dvaMech"){
      if(e.phase==="fly"){
        const progress=1-(e.life/e.max);

        e.x=e.sx+(e.tx-e.sx)*progress;
        e.y=e.sy+(e.ty-e.sy)*progress;

        if(e.life<=0){
          e.phase="explode";
          e.life=.9;
          e.max=.9;

          spawnText(e.x,e.y-65,"!");
        }
      }

      else if(e.phase==="explode"){
        if(!e.exploded && e.life<=.38){
          e.exploded=true;

          const owner=players[e.owner-1];

          for(const p of players){
            if(p.id!==e.owner){
              const d=Math.hypot(p.x-e.x,p.y-e.y);

              if(d<155){
                const ratio=1-d/155;
                damage(p,Math.round(48*ratio+8),owner);

                const push=Math.max(0,1-d/155)*45;
                p.x+=Math.sign(p.x-e.x||owner.dir)*push;
              }
            }
          }

          spawnExplosion(e.x,e.y,155);
        }
      }
    }

    else if(e.type==="recall"){
      // 메카 호출 중 시각 효과만 유지
    }

    if(e.life<=0){
      effects.splice(i,1);
    }
  }

  updateParticles(dt);
}

function spawnExplosion(x,y,r=80){
  effects.push({
    type:"explosion",
    x,y,
    life:.45,
    max:.45,
    radius:r
  });

  for(let i=0;i<24;i++){
    const a=Math.random()*Math.PI*2;
    const s=50+Math.random()*180;

    particles.push({
      x,
      y,
      vx:Math.cos(a)*s,
      vy:Math.sin(a)*s,
      life:.45+Math.random()*.4,
      max:.85
    });
  }
}

function spawnHit(x,y){
  for(let i=0;i<7;i++){
    const a=Math.random()*Math.PI*2;
    const s=30+Math.random()*80;

    particles.push({
      x,
      y,
      vx:Math.cos(a)*s,
      vy:Math.sin(a)*s,
      life:.25+Math.random()*.25,
      max:.5
    });
  }
}

function spawnText(x,y,text){
  effects.push({
    type:"text",
    x,y,
    text,
    life:.8,
    max:.8
  });
}

function spawnRing(x,y,r,type){
  effects.push({
    type:"ring",
    x,y,
    radius:r,
    life:.55,
    max:.55,
    ringType:type
  });
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];

    p.life-=dt;

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vx*=.96;
    p.vy*=.96;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }
}

function drawArena(){
  ctx.fillStyle="#191919";
  ctx.fillRect(0,0,W,H);

  const top=120;
  const bottom=H-125;

  ctx.fillStyle="#d4bd86";
  ctx.fillRect(0,top,W,bottom-top);

  // 위/아래 돌벽
  ctx.fillStyle="#777064";

  for(let x=0;x<W;x+=45){
    ctx.fillRect(x,top-15,40,15);
    ctx.fillRect(x,bottom,40,15);
  }

  // 모래 패턴
  ctx.strokeStyle="rgba(100,80,45,.15)";
  ctx.lineWidth=1;

  for(let x=10;x<W;x+=70){
    const y=145+(x*17%Math.max(1,bottom-top-20));
    ctx.beginPath();
    ctx.arc(x,y,3,0,Math.PI*2);
    ctx.stroke();
  }

  // 중앙 강
  const riverY=H*.5;

  ctx.fillStyle="#5e93a5";
  ctx.fillRect(0,riverY-9,W,18);

  ctx.fillStyle="rgba(255,255,255,.25)";

  for(let x=0;x<W;x+=55){
    ctx.fillRect(x,riverY-2,25,2);
  }

  ctx.fillStyle="rgba(0,0,0,.13)";
  ctx.fillRect(0,riverY-10,W,2);
  ctx.fillRect(0,riverY+8,W,2);
}

function drawLucioAura(p){
  const r=92;
  const pulse=(Math.sin(p.auraPulse)+1)/2;

  ctx.save();

  ctx.globalAlpha=.12+.05*pulse;

  if(p.lucioMode==="speed"){
    ctx.fillStyle="#45e56a";
  }else{
    ctx.fillStyle="#53d7ff";
  }

  ctx.beginPath();
  ctx.arc(p.x,p.y,r,0,Math.PI*2);
  ctx.fill();

  ctx.globalAlpha=.7;

  ctx.strokeStyle=p.lucioMode==="speed"?"#55ef77":"#55dfff";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.arc(p.x,p.y,r+Math.sin(p.auraPulse)*4,0,Math.PI*2);
  ctx.stroke();

  ctx.globalAlpha=.3;

  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.arc(p.x,p.y,r-10,0,Math.PI*2);
  ctx.stroke();

  ctx.restore();
}

function drawPlayer(p){

}

function drawBullets(){
  for(const b of bullets){
    ctx.save();

    ctx.translate(b.x,b.y);
    ctx.rotate(Math.atan2(b.vy,b.vx));

    if(b.special){
      ctx.strokeStyle="#75eaff";
      ctx.lineWidth=6;
      ctx.globalAlpha=.8;
      ctx.beginPath();
      ctx.moveTo(-18,0);
      ctx.lineTo(18,0);
      ctx.stroke();

      ctx.lineWidth=2;
      ctx.globalAlpha=1;
      ctx.beginPath();
      ctx.moveTo(-10,-7);
      ctx.lineTo(10,0);
      ctx.lineTo(-10,7);
      ctx.stroke();
    }else{
      ctx.fillStyle=b.owner===1?"#ffe86a":"#79caff";
      ctx.beginPath();
      ctx.arc(0,0,b.radius,0,Math.PI*2);
      ctx.fill();
    }

    ctx.restore();
  }
}

function drawEffects(){
  for(const e of effects){

    if(e.type==="ring"){
      const progress=1-e.life/e.max;

      ctx.save();
      ctx.globalAlpha=1-progress;

      let color="#fff";

      if(e.ringType==="speed")color="#55ef77";
      if(e.ringType==="heal")color="#55dfff";
      if(e.ringType==="wave")color="#6deaff";
      if(e.ringType==="tank")color="#d7e2d0";
      if(e.ringType==="block")color="#6eb7ff";
      if(e.ringType==="recall")color="#ff80ae";

      ctx.strokeStyle=color;
      ctx.lineWidth=4;

      ctx.beginPath();
      ctx.arc(e.x,e.y,e.radius*(.7+progress*.5),0,Math.PI*2);
      ctx.stroke();

      ctx.restore();
    }

    else if(e.type==="explosion"){
      const progress=1-e.life/e.max;

      ctx.save();

      ctx.globalAlpha=1-progress;

      ctx.fillStyle="#ffb52e";
      ctx.beginPath();
      ctx.arc(e.x,e.y,e.radius*progress,0,Math.PI*2);
      ctx.fill();

      ctx.strokeStyle="#fff";
      ctx.lineWidth=5;

      ctx.beginPath();
      ctx.arc(e.x,e.y,e.radius*progress,0,Math.PI*2);
      ctx.stroke();

      ctx.restore();
    }

    else if(e.type==="artillery"){
      const pulse=Math.sin(performance.now()/80)*3;

      ctx.save();

      ctx.globalAlpha=.75;
      ctx.strokeStyle="#ffdb35";
      ctx.lineWidth=4;

      ctx.beginPath();
      ctx.arc(e.x,e.y,70+pulse,0,Math.PI*2);
      ctx.stroke();

      ctx.fillStyle="#ffdf4b";
      ctx.globalAlpha=.15;
      ctx.fill();

      ctx.restore();
    }

    else if(e.type==="dvaMech"){
      drawThrownMech(e);
    }

    else if(e.type==="recall"){
      const p=players[e.owner-1];

      ctx.save();

      ctx.globalAlpha=.55;
      ctx.strokeStyle="#ff78aa";
      ctx.lineWidth=4;

      ctx.beginPath();
      ctx.arc(
        p.x,
        p.y,
        45+Math.sin(performance.now()/100)*8,
        0,
        Math.PI*2
      );
      ctx.stroke();

      ctx.restore();
    }

    else if(e.type==="soundbarrier"){
      const progress=1-e.life/e.max;

      ctx.save();
      ctx.globalAlpha=.8*(1-progress);

      ctx.strokeStyle="#5ce6ff";
      ctx.lineWidth=7;

      ctx.beginPath();
      ctx.arc(e.x,e.y,50+progress*70,0,Math.PI*2);
      ctx.stroke();

      ctx.restore();
    }

    else if(e.type==="text"){
      const progress=1-e.life/e.max;

      ctx.save();

      ctx.globalAlpha=1-progress;
      ctx.fillStyle="white";
      ctx.font="900 18px Arial";
      ctx.textAlign="center";
      ctx.strokeStyle="#111";
      ctx.lineWidth=4;

      ctx.strokeText(e.text,e.x,e.y-progress*35);
      ctx.fillText(e.text,e.x,e.y-progress*35);

      ctx.restore();
    }

    else if(e.type==="dash"){
      ctx.save();

      ctx.globalAlpha=e.life/e.max;
      ctx.strokeStyle="#ff77a5";
      ctx.lineWidth=8;

      ctx.beginPath();
      ctx.arc(e.x,e.y,32,0,Math.PI*2);
      ctx.stroke();

      ctx.restore();
    }
  }

  for(const p of particles){
    ctx.save();

    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle="#fff";

    ctx.fillRect(p.x-2,p.y-2,4,4);

    ctx.restore();
  }
}

function drawThrownMech(e){
  ctx.save();

  const angle=Math.atan2(e.ty-e.sy,e.tx-e.sx);

  ctx.translate(e.x,e.y);
  ctx.rotate(angle);

  if(e.phase==="explode"){
    const pulse=Math.sin(performance.now()/70)*5;

    ctx.globalAlpha=.8;

    ctx.fillStyle="#ffb632";
    ctx.beginPath();
    ctx.arc(0,0,28+pulse,0,Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle="#e884a9";
  ctx.fillRect(-22,-15,44,30);

  ctx.fillStyle="#6d91b8";
  ctx.fillRect(-16,-11,32,20);

  ctx.fillStyle="#dca4b6";
  ctx.fillRect(-14,-27,28,15);

  ctx.fillStyle="#6ce3ee";
  ctx.fillRect(-8,-22,16,5);

  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);

  drawArena();

  for(const p of players){
    if(p.hero==="lucio"){
      drawLucioAura(p);
    }
  }

  drawBullets();

  for(const p of players){
    drawPlayer(p);
  }

  drawEffects();
}

function updateHUD(){
  if(!players.length)return;

  const p1=players[0];
  const p2=players[1];

  document.getElementById("p1Name").textContent=
    `P1 ${p1.name}  ${Math.ceil(p1.hp)}/${p1.maxHp}`;

  document.getElementById("p2Name").textContent=
    `P2 ${p2.name}  ${Math.ceil(p2.hp)}/${p2.maxHp}`;

  document.getElementById("p1Hp").style.width=
    `${clamp(p1.hp/p1.maxHp*100,0,100)}%`;

  document.getElementById("p2Hp").style.width=
    `${clamp(p2.hp/p2.maxHp*100,0,100)}%`;

  const p1UltBar=document.getElementById("p1Ult");
  const p2UltBar=document.getElementById("p2Ult");

  p1UltBar.style.width=`${p1.ult}%`;
  p2UltBar.style.width=`${p2.ult}%`;

  document.getElementById("timer").textContent=
    Math.ceil(gameTime);

  updateCooldownButton(
    document.getElementById("p1Skill1"),
    p1.skill1Timer
  );

  updateCooldownButton(
    document.getElementById("p1Skill2"),
    p1.skill2Timer
  );

  updateCooldownButton(
    document.getElementById("p2Skill1"),
    p2.skill1Timer
  );

  updateCooldownButton(
    document.getElementById("p2Skill2"),
    p2.skill2Timer
  );

  updateUltButton(document.getElementById("p1Ult"),p1);
  updateUltButton(document.getElementById("p2Ult"),p2);

  let s1="";

  if(p1.hero==="lucio"){
    s1+=`P1 ${p1.lucioMode==="speed"?"🟢 SPEED":"🔵 HEAL"}`;
  }

  if(p2.hero==="lucio"){
    s1+=`   P2 ${p2.lucioMode==="speed"?"🟢 SPEED":"🔵 HEAL"}`;
  }

  if(p1.hero==="bastion" && p1.tank)s1+="  P1 TANK";
  if(p2.hero==="bastion" && p2.tank)s1+="  P2 TANK";

  if(p1.hero==="dva" && !p1.dvaMech){
    s1+=p1.dvaRecall?"  P1 MECH INCOMING":"  P1 PILOT";
  }

  if(p2.hero==="dva" && !p2.dvaMech){
    s1+=p2.dvaRecall?"  P2 MECH INCOMING":"  P2 PILOT";
  }

  statusEl.textContent=s1;
}

function updateCooldownButton(btn,time){
  const cd=btn.querySelector(".cooldown");

  if(time>0){
    cd.classList.remove("hidden");
    cd.textContent=time.toFixed(1);
  }else{
    cd.classList.add("hidden");
  }
}

function updateUltButton(btn,p){
  const cd=btn.querySelector(".cooldown");

  if(p.hero==="dva" && !p.dvaMech){
    if(p.dvaRecall){
      cd.classList.remove("hidden");
      cd.textContent="CALL";
    }else if(p.ult<100){
      cd.classList.remove("hidden");
      cd.textContent=Math.ceil(p.ult)+"%";
    }else{
      cd.classList.remove("hidden");
      cd.textContent="MECH";
    }

    return;
  }

  if(p.ult>=100){
    cd.classList.add("hidden");
  }else{
    cd.classList.remove("hidden");
    cd.textContent=Math.floor(p.ult)+"%";
  }
}

function loop(now){
  if(!running)return;

  const dt=Math.min(.033,(now-lastTime)/1000);
  lastTime=now;

  gameTime-=dt;

  for(const p of players){
    updatePlayer(p,dt);
  }

  updateBullets(dt);
  updateEffects(dt);

  updateHUD();
  draw();

  if(gameTime<=0){
    gameTime=0;
    finishGame("timeout");
    return;
  }

  requestAnimationFrame(loop);
}

function drawPreview(canvasEl,hero){
  const c=canvasEl.getContext("2d");
  const w=canvasEl.width;
  const h=canvasEl.height;

  c.clearRect(0,0,w,h);

  c.fillStyle="#cdbb91";
  c.fillRect(0,0,w,h);

  const p={
    x:w/2,
    y:h/2+8,
    dir:1,
    hero,
    tank:hero==="bastion"
  };

  if(hero==="lucio")drawLucioPreview(c,p);
  if(hero==="bastion")drawBastionPreview(c,p);
  if(hero==="dva")drawDvaPreview(c,p);
}

function drawLucioPreview(c,p){
  c.fillStyle="#45b96d";
  c.fillRect(p.x-22,p.y-8,44,30);

  c.fillStyle="#8c593e";
  c.beginPath();
  c.arc(p.x,p.y-24,16,0,Math.PI*2);
  c.fill();

  c.fillStyle="#e6d447";
  c.fillRect(p.x-15,p.y-41,30,9);

  c.fillStyle="#62e8ff";
  c.fillRect(p.x-14,p.y-28,11,7);
  c.fillRect(p.x+3,p.y-28,11,7);

  c.fillStyle="#202c34";
  c.fillRect(p.x-17,p.y+17,10,17);
  c.fillRect(p.x+7,p.y+17,10,17);
}

function drawBastionPreview(c,p){
  c.fillStyle="#727d72";
  c.fillRect(p.x-24,p.y-18,48,42);

  c.fillStyle="#929d90";
  c.fillRect(p.x-20,p.y-39,40,24);

  c.fillStyle="#d6dfce";
  c.fillRect(p.x+8,p.y-32,6,6);

  c.fillStyle="#303530";
  c.fillRect(p.x+20,p.y-5,25,9);
}

function drawDvaPreview(c,p){
  c.fillStyle="#e884a9";
  c.fillRect(p.x-31,p.y-22,62,49);

  c.fillStyle="#6d91b8";
  c.fillRect(p.x-24,p.y-15,48,32);

  c.fillStyle="#dca4b6";
  c.fillRect(p.x-23,p.y-41,46,24);

  c.fillStyle="#6ce3ee";
  c.fillRect(p.x-12,p.y-33,24,7);

  c.fillStyle="#353b43";
  c.fillRect(p.x+28,p.y-4,25,9);
}

drawPreview(document.getElementById("previewLucio"),"lucio");
drawPreview(document.getElementById("previewBastion"),"bastion");
drawPreview(document.getElementById("previewDva"),"dva");

setInterval(()=>{
  if(!running || players.length<2)return;

  for(const p of players){
    if(p.hero==="dva" && !p.dvaMech && p.ult>=100 && !p.dvaRecall){
      // 자동으로 메카 재호출
      startDvaRecall(p);
    }
  }
},100);
