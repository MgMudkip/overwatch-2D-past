<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>River Battle</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111827;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#c9b48d;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* -------------------------
   HP
------------------------- */

.hp{
    position:absolute;
    width:30%;
    height:48px;
    padding:6px 9px;

    background:#202b3d;
    border:3px solid #596b86;
    border-radius:10px;

    color:white;
    z-index:10;
}

#hp1{
    top:2%;
    left:2%;
}

#hp2{
    right:2%;
    bottom:2%;
}

.hp-name{
    display:flex;
    justify-content:space-between;
    font:bold 14px Arial;
    margin-bottom:4px;
}

.hp-bg{
    height:15px;
    background:#343d4e;
    border-radius:4px;
    overflow:hidden;
}

.hp-value{
    height:100%;
    width:100%;
}

#hp1 .hp-value{
    background:#35d477;
}

#hp2 .hp-value{
    background:#ed5666;
}

/* -------------------------
   조작
------------------------- */

.controls{
    position:absolute;
    display:flex;
    gap:7px;
    z-index:20;
}

#controls1{
    left:2%;
    top:11%;
}

#controls2{
    right:2%;
    bottom:11%;
}

button{
    width:62px;
    height:48px;

    border:3px solid #64748b;
    border-radius:11px;

    background:#263248;
    color:white;

    font-weight:bold;
    font-size:13px;

    box-shadow:0 4px #111827;
}

button:active{
    transform:translateY(4px);
    box-shadow:0 0 #111827;
}

.attack{
    background:#35445d;
}

.skill{
    background:#583b73;
    border-color:#9870bd;
}

.skill.cooldown{
    background:#383d48;
    color:#aaa;
}

/* -------------------------
   상태
------------------------- */

#status{
    position:absolute;
    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    color:white;
    font:bold 23px Arial;

    text-shadow:
        2px 2px #172033,
        -1px -1px #172033;

    z-index:30;
}

/* -------------------------
   다시하기
------------------------- */

#restart{
    display:none;

    position:absolute;
    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:150px;
    height:52px;

    background:#202c40;
    border:3px solid #73839c;

    font-size:17px;

    z-index:50;
}

/* -------------------------
   시작
------------------------- */

#start{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:rgba(12,20,31,.82);

    z-index:100;
}

#start h1{
    color:white;
    font:bold 38px Arial;
    letter-spacing:4px;
    margin-bottom:25px;
}

#start button{
    width:180px;
    height:58px;
    font-size:18px;
    background:#304d7c;
}

@media(max-width:700px){

    .hp{
        width:34%;
        height:44px;
    }

    .hp-name{
        font-size:11px;
    }

    .hp-bg{
        height:13px;
    }

    button{
        width:54px;
        height:44px;
        font-size:11px;
    }

    #start h1{
        font-size:27px;
    }

    #status{
        font-size:18px;
    }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<!-- 1P HP -->
<div class="hp" id="hp1">
    <div class="hp-name">
        <span>1P</span>
        <span id="hpText1">100 / 100</span>
    </div>

    <div class="hp-bg">
        <div class="hp-value" id="bar1"></div>
    </div>
</div>


<!-- 2P HP -->
<div class="hp" id="hp2">
    <div class="hp-name">
        <span>2P</span>
        <span id="hpText2">100 / 100</span>
    </div>

    <div class="hp-bg">
        <div class="hp-value" id="bar2"></div>
    </div>
</div>


<!-- 1P 조작 -->
<div class="controls" id="controls1">

    <button data-player="1" data-key="left">◀</button>
    <button data-player="1" data-key="right">▶</button>

    <button class="attack" data-player="1">
        평타
    </button>

    <button class="skill" id="skill1">
        스킬
    </button>

</div>


<!-- 2P 조작 -->
<div class="controls" id="controls2">

    <button data-player="2" data-key="left">◀</button>
    <button data-player="2" data-key="right">▶</button>

    <button class="attack" data-player="2">
        평타
    </button>

    <button class="skill" id="skill2">
        스킬
    </button>

</div>


<div id="status">READY</div>


<button id="restart">
    ↻ 다시하기
</button>


<div id="start">

    <h1>RIVER BATTLE</h1>

    <button id="startButton">
        GAME START
    </button>

</div>

</div>


<script>

/* ==================================================
   CANVAS
================================================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let W = 0;
let H = 0;


function resize(){

    W = canvas.width =
        window.innerWidth *
        devicePixelRatio;

    H = canvas.height =
        window.innerHeight *
        devicePixelRatio;

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* ==================================================
   게임 상태
================================================== */

const p1 = {
    x:0.50,
    y:0.30,
    hp:100,
    left:false,
    right:false,
    skill:0,
    attackTimer:0
};

const p2 = {
    x:0.50,
    y:0.70,
    hp:100,
    left:false,
    right:false,
    skill:0,
    attackTimer:0
};


let started = false;
let gameOver = false;


/* ==================================================
   설정
================================================== */

const MOVE_SPEED = 0.00055;

const NORMAL_DAMAGE = 10;
const SKILL_DAMAGE = 25;

const SKILL_COOLDOWN = 3;

const projectiles = [];


/* ==================================================
   그리기
================================================== */

function drawBackground(){

    const w = window.innerWidth;
    const h = window.innerHeight;

    /* 땅 */

    ctx.fillStyle="#cbb892";
    ctx.fillRect(0,0,w,h);


    /* 위쪽 약간의 풀 */

    ctx.fillStyle="#b0c494";

    for(let i=0;i<25;i++){

        const x =
            (i*137)%w;

        const y =
            60+(i*73)%(h*0.40);

        ctx.fillRect(
            x,
            y,
            13,
            4
        );
    }


    /* 아래쪽 풀 */

    ctx.fillStyle="#a9bf8b";

    for(let i=0;i<25;i++){

        const x =
            (i*191)%w;

        const y =
            h*0.58+
            (i*51)%(h*0.35);

        ctx.fillRect(
            x,
            y,
            13,
            4
        );
    }


    /* 돌 */

    ctx.fillStyle="#858575";

    for(let i=0;i<10;i++){

        const x =
            (i*271)%w;

        const y =
            100+(i*113)%(h-200);

        ctx.beginPath();

        ctx.ellipse(
            x,
            y,
            13,
            8,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /* =========================
       강
    ========================= */

    const riverY = h*0.495;
    const riverH = h*0.045;


    ctx.fillStyle="#4caee8";

    ctx.fillRect(
        0,
        riverY,
        w,
        riverH
    );


    /* 강 위 선 */

    ctx.strokeStyle="#287fc0";
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(
        0,
        riverY+2
    );

    ctx.lineTo(
        w,
        riverY+2
    );

    ctx.stroke();


    /* 강 아래 선 */

    ctx.beginPath();

    ctx.moveTo(
        0,
        riverY+riverH-2
    );

    ctx.lineTo(
        w,
        riverY+riverH-2
    );

    ctx.stroke();


    /* 물결 */

    ctx.strokeStyle="#9bdcff";
    ctx.lineWidth=2;

    for(let x=0;x<w;x+=90){

        ctx.beginPath();

        ctx.moveTo(
            x,
            riverY+riverH/2
        );

        ctx.lineTo(
            x+35,
            riverY+riverH/2
        );

        ctx.stroke();
    }
}


/* ==================================================
   캐릭터
================================================== */

function drawPlayer(p, color, number){

    const w = window.innerWidth;
    const h = window.innerHeight;

    const x = p.x*w;
    const y = p.y*h;

    const s =
        Math.min(w,h)/650;


    /* 그림자 */

    ctx.fillStyle="rgba(0,0,0,.18)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+31*s,
        23*s,
        8*s,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* 다리 */

    ctx.fillStyle="#30394e";

    ctx.fillRect(
        x-12*s,
        y+14*s,
        9*s,
        20*s
    );

    ctx.fillRect(
        x+3*s,
        y+14*s,
        9*s,
        20*s
    );


    /* 몸 */

    ctx.fillStyle=color;

    ctx.fillRect(
        x-16*s,
        y-16*s,
        32*s,
        34*s
    );


    ctx.strokeStyle="#182033";
    ctx.lineWidth=4*s;

    ctx.strokeRect(
        x-16*s,
        y-16*s,
        32*s,
        34*s
    );


    /* 머리 */

    ctx.fillStyle="#ffd0a8";

    ctx.fillRect(
        x-17*s,
        y-42*s,
        34*s,
        26*s
    );


    ctx.strokeStyle="#182033";

    ctx.strokeRect(
        x-17*s,
        y-42*s,
        34*s,
        26*s
    );


    /* 머리카락 */

    ctx.fillStyle=
        number===1
        ? "#2874dc"
        : "#d84259";

    ctx.fillRect(
        x-17*s,
        y-43*s,
        34*s,
        9*s
    );


    /* 팔 */

    ctx.fillStyle="#ffd0a8";

    ctx.fillRect(
        x-27*s,
        y-10*s,
        12*s,
        8*s
    );

    ctx.fillRect(
        x+15*s,
        y-10*s,
        12*s,
        8*s
    );


    /* 플레이어 표시 */

    ctx.fillStyle=color;

    ctx.font=
        "bold "+
        Math.max(12,18*s)+
        "px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        number+"P",
        x,
        y-52*s
    );
}


/* ==================================================
   발사체
================================================== */

function drawProjectile(p){

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;

    const x =
        p.x*w;

    const y =
        p.y*h;


    ctx.save();

    ctx.shadowBlur =
        p.skill ? 20 : 12;

    ctx.shadowColor =
        p.player===1
        ? "#3caeff"
        : "#ff4d65";


    ctx.fillStyle =
        p.player===1
        ? "#49b8ff"
        : "#ff5368";


    if(p.skill){

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            12,
            0,
            Math.PI*2
        );

        ctx.fill();

    }else{

        ctx.fillRect(
            x-5,
            y-14,
            10,
            28
        );

    }

    ctx.restore();
}


/* ==================================================
   공격
================================================== */

function shoot(player, skill){

    const p =
        player===1 ? p1 : p2;


    projectiles.push({

        player:player,

        x:p.x,

        y:p.y,

        direction:
            player===1
            ? 1
            : -1,

        speed:
            skill
            ? 0.012
            : 0.018,

        damage:
            skill
            ? SKILL_DAMAGE
            : NORMAL_DAMAGE,

        skill:skill

    });
}


/* ==================================================
   투사체 업데이트
================================================== */

function updateProjectiles(dt){

    for(
        let i=projectiles.length-1;
        i>=0;
        i--
    ){

        const b =
            projectiles[i];


        b.y +=
            b.direction *
            b.speed *
            dt;


        const target =
            b.player===1
            ? p2
            : p1;


        /*
           상대 캐릭터에 도착
        */

        if(
            Math.abs(b.y-target.y)
            <0.025 &&

            Math.abs(b.x-target.x)
            <0.055
        ){

            target.hp =
                Math.max(
                    0,
                    target.hp-b.damage
                );


            showHit(
                target.x,
                target.y
            );


            projectiles.splice(
                i,
                1
            );


            if(target.hp<=0){

                endGame(
                    b.player===1
                    ? "1P"
                    : "2P"
                );
            }


            continue;
        }


        /* 화면 밖 */

        if(
            b.y<0 ||
            b.y>1
        ){

            projectiles.splice(
                i,
                1
            );
        }
    }
}


/* ==================================================
   피격 효과
================================================== */

const hits=[];


function showHit(x,y){

    hits.push({
        x:x,
        y:y,
        life:1
    });
}


function updateHits(dt){

    for(
        let i=hits.length-1;
        i>=0;
        i--
    ){

        hits[i].life -=
            dt/250;

        if(hits[i].life<=0){
            hits.splice(i,1);
        }
    }
}


function drawHits(){

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;


    for(const hit of hits){

        const x =
            hit.x*w;

        const y =
            hit.y*h;


        ctx.strokeStyle=
            "#fff27b";

        ctx.lineWidth=4;

        ctx.globalAlpha=
            hit.life;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            30*(1-hit.life)+10,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.globalAlpha=1;
    }
}


/* ==================================================
   HP
================================================== */

function updateHP(){

    document
        .getElementById("bar1")
        .style.width =
        p1.hp+"%";

    document
        .getElementById("bar2")
        .style.width =
        p2.hp+"%";


    document
        .getElementById("hpText1")
        .textContent =
        p1.hp+" / 100";


    document
        .getElementById("hpText2")
        .textContent =
        p2.hp+" / 100";
}


/* ==================================================
   이동
================================================== */

function updatePlayers(dt){

    if(!started || gameOver)
        return;


    if(p1.left)
        p1.x -= MOVE_SPEED*dt;

    if(p1.right)
        p1.x += MOVE_SPEED*dt;


    if(p2.left)
        p2.x -= MOVE_SPEED*dt;

    if(p2.right)
        p2.x += MOVE_SPEED*dt;


    /* 좌우 범위 */

    p1.x =
        Math.max(
            0.20,
            Math.min(
                0.80,
                p1.x
            )
        );


    p2.x =
        Math.max(
            0.20,
            Math.min(
                0.80,
                p2.x
            )
        );
}


/* ==================================================
   스킬 쿨타임
================================================== */

function updateCooldown(dt){

    if(p1.skill>0)
        p1.skill=
            Math.max(
                0,
                p1.skill-dt/1000
            );


    if(p2.skill>0)
        p2.skill=
            Math.max(
                0,
                p2.skill-dt/1000
            );


    updateSkillButton(
        "skill1",
        p1.skill
    );


    updateSkillButton(
        "skill2",
        p2.skill
    );
}


function updateSkillButton(id,time){

    const button =
        document.getElementById(id);


    if(time>0){

        button.classList
            .add("cooldown");

        button.innerHTML =
            "스킬<br>"+
            time.toFixed(1);

    }else{

        button.classList
            .remove("cooldown");

        button.innerHTML =
            "스킬";
    }
}


/* ==================================================
   버튼 공격
================================================== */

document
.querySelectorAll(".attack")
.forEach(button=>{

    button.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            if(
                !started ||
                gameOver
            )
                return;


            const player =
                Number(
                    button.dataset.player
                );


            shoot(
                player,
                false
            );
        }
    );
});


/* ==================================================
   스킬 버튼
================================================== */

document
.getElementById("skill1")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        if(
            !started ||
            gameOver ||
            p1.skill>0
        )
            return;


        p1.skill=
            SKILL_COOLDOWN;

        shoot(1,true);
    }
);


document
.getElementById("skill2")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        if(
            !started ||
            gameOver ||
            p2.skill>0
        )
            return;


        p2.skill=
            SKILL_COOLDOWN;

        shoot(2,true);
    }
);


/* ==================================================
   이동 버튼
================================================== */

document
.querySelectorAll("[data-key]")
.forEach(button=>{

    const player =
        Number(button.dataset.player);

    const key =
        button.dataset.key;


    function startMove(e){

        e.preventDefault();

        if(!started || gameOver)
            return;


        const p =
            player===1 ? p1 : p2;


        if(key==="left")
            p.left=true;

        if(key==="right")
            p.right=true;
    }


    function stopMove(e){

        e.preventDefault();

        const p =
            player===1 ? p1 : p2;


        if(key==="left")
            p.left=false;

        if(key==="right")
            p.right=false;
    }


    button.addEventListener(
        "pointerdown",
        startMove
    );

    button.addEventListener(
        "pointerup",
        stopMove
    );

    button.addEventListener(
        "pointercancel",
        stopMove
    );

});


/* ==================================================
   시작
================================================== */

document
.getElementById("startButton")
.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        document
            .getElementById("start")
            .style.display="none";

        started=true;

        gameOver=false;

        document
            .getElementById("status")
            .textContent="FIGHT!";
    }
);


/* ==================================================
   게임 종료
================================================== */

function endGame(winner){

    gameOver=true;

    document
        .getElementById("status")
        .textContent =
        winner+" WIN!";

    document
        .getElementById("restart")
        .style.display="block";
}


/* ==================================================
   다시하기
================================================== */

document
.getElementById("restart")
.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        resetGame();
    }
);


function resetGame(){

    p1.x=0.50;
    p1.y=0.30;
    p1.hp=100;
    p1.left=false;
    p1.right=false;
    p1.skill=0;


    p2.x=0.50;
    p2.y=0.70;
    p2.hp=100;
    p2.left=false;
    p2.right=false;
    p2.skill=0;


    projectiles.length=0;
    hits.length=0;


    gameOver=false;
    started=true;


    document
        .getElementById("status")
        .textContent="FIGHT!";


    document
        .getElementById("restart")
        .style.display="none";


    updateHP();
}


/* ==================================================
   메인 루프
================================================== */

let lastTime =
    performance.now();


function loop(now){

    const dt =
        Math.min(
            32,
            now-lastTime
        );

    lastTime=now;


    const w =
        window.innerWidth;

    const h =
        window.innerHeight;


    ctx.clearRect(
        0,
        0,
        w,
        h
    );


    drawBackground();


    updatePlayers(dt);

    updateProjectiles(dt);

    updateHits(dt);

    updateCooldown(dt);


    drawPlayer(
        p1,
        "#357bdd",
        1
    );


    drawPlayer(
        p2,
        "#df465b",
        2
    );


    for(
        const projectile
        of projectiles
    ){

        drawProjectile(
            projectile
        );
    }


    drawHits();


    updateHP();


    requestAnimationFrame(loop);
}


requestAnimationFrame(loop);

</script>

</body>
</html>
