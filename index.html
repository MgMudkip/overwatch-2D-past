<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>2D HERO BATTLE</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#090909;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

button{
  font-family:inherit;
  border:0;
  outline:0;
  touch-action:none;
}

.hidden{
  display:none!important;
}

.screen{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
}

/* =====================================================
   START
===================================================== */

#startScreen{
  flex-direction:column;
  color:white;
}

#startScreen h1{
  margin:0;
  font-size:42px;
  letter-spacing:2px;
}

#startScreen p{
  color:#aaa;
  margin:12px 0 35px;
}

.mainBtn{
  width:230px;
  height:64px;
  border-radius:14px;
  background:#ffd21a;
  color:#222;
  font-size:22px;
  font-weight:bold;
  box-shadow:0 5px 0 #8c7200;
}

.mainBtn:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #8c7200;
}

/* =====================================================
   PICK
===================================================== */

#pickScreen{
  flex-direction:column;
  color:white;
  background:
    radial-gradient(circle at center,#343434,#141414);
}

.pickTitle{
  font-size:34px;
  font-weight:bold;
  margin-bottom:18px;
}

.pickTurn{
  display:flex;
  gap:30px;
  margin-bottom:18px;
}

.pickTurn span{
  padding:7px 18px;
  border-radius:20px;
  background:#333;
  color:#aaa;
}

.pickTurn .active{
  background:#ffd21a;
  color:#222;
  font-weight:bold;
}

.heroList{
  display:flex;
  gap:18px;
  justify-content:center;
  flex-wrap:wrap;
}

.heroCard{
  width:145px;
  height:205px;
  border:3px solid #444;
  border-radius:15px;
  background:#292929;
  color:white;
  padding:12px;
  box-shadow:0 5px 0 #111;
}

.heroCard:active{
  transform:translateY(3px);
}

.heroCard.p1Selected{
  border-color:#4da3ff;
}

.heroCard.p2Selected{
  border-color:#ff5b5b;
}

.heroIcon{
  width:82px;
  height:82px;
  margin:2px auto 10px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  font-weight:bold;
  background:#555;
}

.heroCard:nth-child(1) .heroIcon{
  background:#37a9bd;
}

.heroCard:nth-child(2) .heroIcon{
  background:#687078;
}

.heroCard:nth-child(3) .heroIcon{
  background:#e45b78;
}

.heroCard h3{
  margin:5px 0;
  font-size:19px;
}

.heroCard small{
  color:#aaa;
}

.pickStart{
  margin-top:25px;
  width:220px;
  height:56px;
  border-radius:12px;
  background:#ffd21a;
  font-size:20px;
  font-weight:bold;
}

/* =====================================================
   GAME
===================================================== */

#gameScreen{
  background:#000;
}

#game{
  position:relative;
  width:min(100vw,1100px);
  height:min(100vh,680px);
  overflow:hidden;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.05) 50%,
      rgba(255,255,255,.03) 50%
    ),
    #c7a16d;
}

/* stone walls */

.wall{
  position:absolute;
  left:0;
  width:100%;
  height:58px;

  background:
    repeating-linear-gradient(
      90deg,
      #75695d 0 65px,
      #86786a 65px 130px,
      #6d6257 130px 195px
    );

  z-index:1;
}

.wall.top{
  top:0;
  border-bottom:6px solid #51483e;
}

.wall.bottom{
  bottom:0;
  border-top:6px solid #51483e;
}

/* arena */

.arenaLine{
  position:absolute;
  top:50%;
  left:0;
  width:100%;
  height:4px;
  background:#76583a;
  opacity:.75;
  z-index:2;
}

.arenaDecoration{
  position:absolute;
  left:50%;
  top:50%;
  width:120px;
  height:120px;
  border:4px solid rgba(90,65,40,.3);
  border-radius:50%;
  transform:translate(-50%,-50%);
  z-index:2;
}

/* =====================================================
   HUD
===================================================== */

.hud{
  position:absolute;
  top:70px;
  left:50%;
  width:min(760px,72%);
  transform:translateX(-50%);
  z-index:20;
}

.hpRow{
  display:flex;
  align-items:center;
  gap:9px;
}

.name{
  width:65px;
  color:#fff;
  font-weight:bold;
  text-shadow:2px 2px #000;
}

.hpOuter{
  flex:1;
  height:18px;
  border-radius:8px;
  background:#252525;
  border:2px solid #161616;
  overflow:hidden;
}

.hpBar{
  width:100%;
  height:100%;
  background:#e05454;
  transition:width .12s;
}

.hpBar.p2{
  background:#5799ec;
}

.hpNumber{
  width:48px;
  color:#fff;
  font-size:13px;
  text-shadow:1px 1px #000;
}

.ultRow{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:4px;
  margin-bottom:5px;
}

.ultLabel{
  width:65px;
  color:#ffd21a;
  font-size:12px;
  font-weight:bold;
}

.ultOuter{
  flex:1;
  height:9px;
  border-radius:5px;
  background:#222;
  border:1px solid #111;
  overflow:hidden;
}

.ultBar{
  width:0%;
  height:100%;
  background:#ffd21a;
  transition:width .12s;
}

.ultNumber{
  width:48px;
  color:#ffd21a;
  font-size:12px;
}

.timer{
  text-align:center;
  color:#fff;
  font-size:27px;
  font-weight:bold;
  text-shadow:2px 2px #000;
  margin:3px 0;
}

/* =====================================================
   PLAYERS
===================================================== */

.player{
  position:absolute;
  width:66px;
  height:66px;

  border:3px solid #222;
  border-radius:16px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:31px;
  font-weight:bold;

  box-shadow:
    0 6px 12px rgba(0,0,0,.4);

  z-index:10;

  transition:
    transform .08s,
    filter .08s;
}

.player.p1{
  background:#478fd8;
}

.player.p2{
  background:#db5555;
}

.player.hit{
  transform:scale(1.15);
  filter:brightness(1.5);
}

.player.guard{
  box-shadow:
    0 0 0 5px #63dfff,
    0 0 20px #63dfff;
}

.player.boost{
  box-shadow:
    0 0 0 4px #54edff,
    0 0 25px #54edff;
}

/* =====================================================
   PROJECTILES
===================================================== */

.projectile{
  position:absolute;
  z-index:8;
  pointer-events:none;
}

.note{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#66eaff;
  box-shadow:0 0 12px #66eaff;
}

.bullet{
  width:13px;
  height:7px;
  border-radius:8px;
  background:#f3f3f3;
  box-shadow:0 0 5px #fff;
}

.bastionBullet{
  width:16px;
  height:8px;
  border-radius:5px;
  background:#d5d5d5;
}

.shell{
  width:20px;
  height:20px;
  border-radius:50%;
  background:#515151;
  border:2px solid #222;
}

.dvaShot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#f8e6a0;
}

.wave{
  position:absolute;
  width:95px;
  height:95px;
  border:5px solid #6deaff;
  border-radius:50%;
  transform:translate(-50%,-50%);
  animation:wave .35s forwards;
  z-index:14;
  pointer-events:none;
}

.explosion{
  position:absolute;
  width:85px;
  height:85px;
  border-radius:50%;
  border:5px solid #ffd21a;
  background:rgba(255,150,0,.2);
  transform:translate(-50%,-50%);
  animation:explode .4s forwards;
  z-index:15;
  pointer-events:none;
}

.blockEffect{
  position:absolute;
  width:60px;
  height:60px;
  border:4px solid #6deaff;
  border-radius:50%;
  transform:translate(-50%,-50%);
  animation:block .3s forwards;
  z-index:15;
  pointer-events:none;
}

.warning{
  position:absolute;
  width:100px;
  height:100px;
  border:4px dashed #ffd21a;
  border-radius:50%;
  transform:translate(-50%,-50%);
  animation:warning .9s infinite;
  z-index:12;
  pointer-events:none;
}

@keyframes wave{
  from{
    transform:translate(-50%,-50%) scale(.2);
    opacity:1;
  }
  to{
    transform:translate(-50%,-50%) scale(1.5);
    opacity:0;
  }
}

@keyframes explode{
  from{
    transform:translate(-50%,-50%) scale(.25);
    opacity:1;
  }
  to{
    transform:translate(-50%,-50%) scale(1.7);
    opacity:0;
  }
}

@keyframes block{
  from{
    transform:translate(-50%,-50%) scale(.3);
    opacity:1;
  }
  to{
    transform:translate(-50%,-50%) scale(1.4);
    opacity:0;
  }
}

@keyframes warning{
  50%{
    opacity:.25;
    transform:translate(-50%,-50%) scale(1.1);
  }
}

/* =====================================================
   CONTROLS
===================================================== */

.controls{
  position:absolute;
  bottom:20px;
  z-index:30;
}

.controls.p1{
  right:24px;
}

.controls.p2{
  left:24px;
}

.actionPad{
  display:grid;
  grid-template-columns:82px 82px;
  grid-template-rows:82px 82px;
  gap:10px;
}

.actionBtn{
  width:82px;
  height:82px;

  border-radius:15px;
  border:3px solid #292929;

  font-size:14px;
  font-weight:bold;

  box-shadow:0 5px 0 #353535;

  transition:
    transform .05s,
    opacity .1s,
    filter .1s;
}

.actionBtn:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #353535;
}

.attack{
  background:#f0f0f0;
  color:#222;
}

.skill1{
  background:#54c96a;
  color:white;
}

.skill2{
  background:#4289df;
  color:white;
}

.ult{
  background:#ffd21a;
  color:#222;
}

.actionBtn.disabled{
  opacity:.38;
  filter:grayscale(.6);
}

.actionBtn.readyUlt{
  box-shadow:
    0 0 15px #ffd21a,
    0 5px 0 #856f00;
}

/* =====================================================
   AMMO
===================================================== */

.ammo{
  position:absolute;
  bottom:205px;

  min-width:115px;
  padding:6px 11px;

  border-radius:9px;

  background:rgba(20,20,20,.85);
  color:#fff;

  text-align:center;
  font-size:13px;

  z-index:32;
}

.ammo.p1{
  right:35px;
}

.ammo.p2{
  left:35px;
}

.reloadText{
  color:#ffd21a;
  font-weight:bold;
}

/* =====================================================
   COOLDOWN TEXT
===================================================== */

.cooldown{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:17px;
  color:#fff;
  text-shadow:2px 2px #000;
  pointer-events:none;
}

/* =====================================================
   RESULT
===================================================== */

#resultScreen{
  flex-direction:column;
  color:#fff;
}

#resultText{
  font-size:44px;
  font-weight:bold;
  margin-bottom:30px;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  #game{
    width:100vw;
    height:100vh;
  }

  .hud{
    top:48px;
    width:91%;
  }

  .name{
    width:52px;
    font-size:12px;
  }

  .ultLabel{
    width:52px;
  }

  .controls{
    bottom:12px;
  }

  .controls.p1{
    right:10px;
  }

  .controls.p2{
    left:10px;
  }

  .actionPad{
    grid-template-columns:70px 70px;
    grid-template-rows:70px 70px;
    gap:8px;
  }

  .actionBtn{
    width:70px;
    height:70px;
    font-size:11px;
  }

  .ammo{
    bottom:166px;
    font-size:11px;
  }

  .ammo.p1{
    right:10px;
  }

  .ammo.p2{
    left:10px;
  }

  .player{
    width:58px;
    height:58px;
  }
}
</style>
</head>

<body>

<!-- =====================================================
     START
===================================================== -->

<div id="startScreen" class="screen">

  <h1>2D HERO BATTLE</h1>

  <p>자동 이동 1 VS 1 HERO BATTLE</p>

  <button id="startBtn" class="mainBtn">
    게임 시작
  </button>

</div>


<!-- =====================================================
     PICK
===================================================== -->

<div id="pickScreen" class="screen hidden">

  <div class="pickTitle">영웅 선택</div>

  <div class="pickTurn">
    <span id="p1Turn" class="active">P1 선택</span>
    <span id="p2Turn">P2 선택</span>
  </div>

  <div class="heroList">

    <button class="heroCard" data-hero="lucio">

      <div class="heroIcon">♪</div>

      <h3>루시우</h3>

      <small>
        기동 / 지원
      </small>

    </button>


    <button class="heroCard" data-hero="bastion">

      <div class="heroIcon">▣</div>

      <h3>바스티온</h3>

      <small>
        화력 / 변신
      </small>

    </button>


    <button class="heroCard" data-hero="dva">

      <div class="heroIcon">◆</div>

      <h3>D.Va</h3>

      <small>
        기동 / 방어
      </small>

    </button>

  </div>

  <button id="pickStart" class="pickStart">
    전투 시작
  </button>

</div>


<!-- =====================================================
     GAME
===================================================== -->

<div id="gameScreen" class="screen hidden">

  <div id="game">

    <div class="wall top"></div>
    <div class="wall bottom"></div>

    <div class="arenaLine"></div>
    <div class="arenaDecoration"></div>


    <!-- HUD -->

    <div class="hud">

      <!-- P1 -->

      <div class="hpRow">

        <div id="name1" class="name">
          P1
        </div>

        <div class="hpOuter">
          <div id="hp1" class="hpBar"></div>
        </div>

        <div id="hpNumber1" class="hpNumber">
          100
        </div>

      </div>

      <div class="ultRow">

        <div class="ultLabel">
          ULT
        </div>

        <div class="ultOuter">
          <div id="ult1" class="ultBar"></div>
        </div>

        <div id="ultNumber1" class="ultNumber">
          0%
        </div>

      </div>


      <div id="timer" class="timer">
        60
      </div>


      <!-- P2 -->

      <div class="hpRow">

        <div id="name2" class="name">
          P2
        </div>

        <div class="hpOuter">
          <div id="hp2" class="hpBar p2"></div>
        </div>

        <div id="hpNumber2" class="hpNumber">
          100
        </div>

      </div>

      <div class="ultRow">

        <div class="ultLabel">
          ULT
        </div>

        <div class="ultOuter">
          <div id="ult2" class="ultBar"></div>
        </div>

        <div id="ultNumber2" class="ultNumber">
          0%
        </div>

      </div>

    </div>


    <!-- PLAYERS -->

    <div id="player1" class="player p1">
      ♪
    </div>

    <div id="player2" class="player p2">
      ◆
    </div>


    <!-- P1 AMMO -->

    <div id="ammo1" class="ammo p1">
      탄약 0 / 0
    </div>


    <!-- P2 AMMO -->

    <div id="ammo2" class="ammo p2">
      탄약 0 / 0
    </div>


    <!-- P1 BUTTONS -->

    <div class="controls p1">

      <div class="actionPad">

        <button id="attack1"
                class="actionBtn attack">
          평타
        </button>

        <button id="skill11"
                class="actionBtn skill1">
          스킬 1
        </button>

        <button id="skill21"
                class="actionBtn skill2">
          스킬 2
        </button>

        <button id="ult1Button"
                class="actionBtn ult">
          궁극기
        </button>

      </div>

    </div>


    <!-- P2 BUTTONS -->

    <div class="controls p2">

      <div class="actionPad">

        <button id="attack2"
                class="actionBtn attack">
          평타
        </button>

        <button id="skill12"
                class="actionBtn skill1">
          스킬 1
        </button>

        <button id="skill22"
                class="actionBtn skill2">
          스킬 2
        </button>

        <button id="ult2Button"
                class="actionBtn ult">
          궁극기
        </button>

      </div>

    </div>

  </div>

</div>


<!-- =====================================================
     RESULT
===================================================== -->

<div id="resultScreen" class="screen hidden">

  <div id="resultText">
    P1 승리!
  </div>

  <button id="restartBtn" class="mainBtn">
    다시하기
  </button>

</div>


<script>

/* =====================================================
   HERO DATA
===================================================== */

const HEROES = {

  lucio:{
    name:"루시우",
    icon:"♪",

    maxHp:100,

    ammo:20,
    reload:850,

    projectileSpeed:680,
    fireRate:145,

    attackDamage:4,

    skill1Cooldown:6500,
    skill2Cooldown:4200
  },

  bastion:{
    name:"바스티온",
    icon:"▣",

    maxHp:110,

    ammo:25,
    reload:1050,

    projectileSpeed:760,
    fireRate:105,

    attackDamage:5,

    skill1Cooldown:5500,
    skill2Cooldown:4300
  },

  dva:{
    name:"D.Va",
    icon:"◆",

    maxHp:115,

    ammo:18,
    reload:1000,

    projectileSpeed:590,
    fireRate:170,

    attackDamage:6,

    skill1Cooldown:5500,
    skill2Cooldown:5000
  }

};


/* =====================================================
   GAME STATE
===================================================== */

let selectedHero1="lucio";
let selectedHero2="bastion";

let pickingPlayer=1;

let running=false;

let hp1=100;
let hp2=100;

let ult1=0;
let ult2=0;

let timeLeft=60;

let lastFrame=0;

let projectiles=[];

let effects=[];


/* =====================================================
   PLAYER STATE
===================================================== */

function createPlayer(heroKey,id){

  const hero=HEROES[heroKey];

  return {

    id,

    x:0,
    y:0,

    direction:
      id===1
      ?1
      :-1,

    baseSpeed:
      id===1
      ?58
      :64,

    speedMultiplier:1,

    ammo:hero.ammo,

    reloading:false,
    reloadUntil:0,

    lastAttack:0,

    skill1Ready:true,
    skill2Ready:true,

    blocking:false,

    transformed:false,

    boostUntil:0,

    /* 바스티온 변신용 */
    heavyMode:false
  };
}

let player1=createPlayer("lucio",1);
let player2=createPlayer("bastion",2);


/* =====================================================
   ELEMENTS
===================================================== */

const startScreen=
document.getElementById("startScreen");

const pickScreen=
document.getElementById("pickScreen");

const gameScreen=
document.getElementById("gameScreen");

const resultScreen=
document.getElementById("resultScreen");

const game=
document.getElementById("game");

const playerEls=[
  document.getElementById("player1"),
  document.getElementById("player2")
];

const hpBars=[
  document.getElementById("hp1"),
  document.getElementById("hp2")
];

const hpNumbers=[
  document.getElementById("hpNumber1"),
  document.getElementById("hpNumber2")
];

const ultBars=[
  document.getElementById("ult1"),
  document.getElementById("ult2")
];

const ultNumbers=[
  document.getElementById("ultNumber1"),
  document.getElementById("ultNumber2")
];

const ammoEls=[
  document.getElementById("ammo1"),
  document.getElementById("ammo2")
];

const attackButtons=[
  document.getElementById("attack1"),
  document.getElementById("attack2")
];

const skill1Buttons=[
  document.getElementById("skill11"),
  document.getElementById("skill12")
];

const skill2Buttons=[
  document.getElementById("skill21"),
  document.getElementById("skill22")
];

const ultButtons=[
  document.getElementById("ult1Button"),
  document.getElementById("ult2Button")
];


/* =====================================================
   UTILS
===================================================== */

function clamp(value,min,max){
  return Math.max(min,Math.min(max,value));
}

function getPlayer(id){
  return id===1 ? player1 : player2;
}

function getEnemy(id){
  return id===1 ? player2 : player1;
}

function getHero(id){
  return HEROES[
    id===1
    ?selectedHero1
    :selectedHero2
  ];
}

function getHeroKey(id){
  return id===1
    ?selectedHero1
    :selectedHero2;
}


/* =====================================================
   TOUCH BUTTON
===================================================== */

function bindButton(button,callback){

  button.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      callback();

    },
    {passive:false}
  );

  button.addEventListener(
    "touchstart",
    function(e){

      e.preventDefault();

    },
    {passive:false}
  );
}


/* =====================================================
   START
===================================================== */

bindButton(
  document.getElementById("startBtn"),
  ()=>{
    startScreen.classList.add("hidden");
    pickScreen.classList.remove("hidden");

/* =====================================================
   RELOAD
===================================================== */

function startReload(id){

  const p=getPlayer(id);
  const hero=getHero(id);

  if(p.reloading) return;

  if(p.ammo>=hero.ammo) return;

  p.reloading=true;

  p.reloadUntil=
    performance.now()+hero.reload;

  attackButtons[id-1]
  .classList.add("disabled");

}


function updateReload(id){

  const p=getPlayer(id);
  const hero=getHero(id);

  if(!p.reloading) return;

  if(performance.now()>=p.reloadUntil){

    p.reloading=false;

    p.ammo=hero.ammo;

    attackButtons[id-1]
    .classList.remove("disabled");

  }

}


/* =====================================================
   NORMAL ATTACK
===================================================== */

function normalAttack(id){

  if(!running) return;

  const p=getPlayer(id);
  const hero=getHero(id);
  const key=getHeroKey(id);

  if(p.reloading) return;

  if(p.ammo<=0){

    startReload(id);
    return;

  }

  const now=performance.now();

  let fireRate=hero.fireRate;

  /*
    바스티온 강습 설정:
    느려지는 대신 강한 탄환
  */

  if(
    key==="bastion" &&
    p.heavyMode
  ){
    fireRate=230;
  }

  if(
    now-p.lastAttack<fireRate
  ){
    return;
  }

  p.lastAttack=now;

  p.ammo--;

  /*
    루시우
    한 번의 공격에서 음파 4발
  */

  if(key==="lucio"){

    for(let i=0;i<4;i++){

      createProjectile({
        owner:id,

        x:p.x,
        y:p.y+(i-1.5)*8,

        vx:
          id===1
          ?hero.projectileSpeed
          :-hero.projectileSpeed,

        damage:hero.attackDamage,

        type:"note"
      });

    }

  }

  /*
    D.Va
    짧은 산탄
  */

  else if(key==="dva"){

    for(let i=0;i<4;i++){

      createProjectile({
        owner:id,

        x:p.x,
        y:p.y+(Math.random()-.5)*28,

        vx:
          id===1
          ?hero.projectileSpeed
          :-hero.projectileSpeed,

        damage:hero.attackDamage,

        type:"dvaShot"
      });

    }

  }

  /*
    바스티온
  */

  else{

    createProjectile({

      owner:id,

      x:p.x,
      y:p.y,

      vx:
        id===1
        ?hero.projectileSpeed
        :-hero.projectileSpeed,

      damage:
        p.heavyMode
        ?9
        :hero.attackDamage,

      type:
        p.heavyMode
        ?"bastionBullet"
        :"bullet"

    });

  }

  if(p.ammo<=0){

    setTimeout(()=>{

      if(
        running &&
        !p.reloading
      ){
        startReload(id);
      }

    },180);

  }

}


/* =====================================================
   PROJECTILE
===================================================== */

function createProjectile(data){

  projectiles.push({

    owner:data.owner,

    x:data.x,
    y:data.y,

    vx:data.vx,

    damage:data.damage,

    type:data.type,

    alive:true
  });

}


function updateProjectiles(dt){

  for(
    let i=projectiles.length-1;
    i>=0;
    i--
  ){

    const shot=projectiles[i];

    shot.x += shot.vx*dt;

    const target=
      getEnemy(shot.owner);

    /*
      방어 중이면 투사체 제거
    */

    if(
      target.blocking &&
      Math.abs(shot.x-target.x)<48 &&
      Math.abs(shot.y-target.y)<55
    ){

      createBlockEffect(
        target.x,
        target.y
      );

      projectiles.splice(i,1);

      continue;
    }

    /*
      충돌
    */

    if(
      Math.abs(shot.x-target.x)<38 &&
      Math.abs(shot.y-target.y)<42
    ){

      /*
        포탄은 작은 범위 효과
      */

      if(shot.type==="shell"){

        createExplosion(
          shot.x,
          shot.y,
          55
        );

        const distance=Math.hypot(
          target.x-shot.x,
          target.y-shot.y
        );

        if(distance<75){

          dealDamage(
            shot.owner,
            shot.damage,
            false
          );

        }

      }else{

        dealDamage(
          shot.owner,
          shot.damage,
          true
        );

      }

      projectiles.splice(i,1);

      continue;
    }

    if(
      shot.x<-100 ||
      shot.x>game.clientWidth+100
    ){

      projectiles.splice(i,1);

    }

  }

}


/* =====================================================
   DAMAGE
===================================================== */

function dealDamage(
  attacker,
  damage,
  givesUlt=true
){

  const target=getEnemy(attacker);

  if(target.blocking){

    createBlockEffect(
      target.x,
      target.y
    );

    return;
  }

  if(attacker===1){

    hp2=Math.max(
      0,
      hp2-damage
    );

    if(givesUlt){

      ult1=clamp(
        ult1+damage*.75,
        0,
        100
      );

    }

  }else{

    hp1=Math.max(
      0,
      hp1-damage
    );

    if(givesUlt){

      ult2=clamp(
        ult2+damage*.75,
        0,
        100
      );

    }

  }

  const targetEl=
    attacker===1
    ?playerEls[1]
    :playerEls[0];

  targetEl.classList.add("hit");

  setTimeout(()=>{
    targetEl.classList.remove("hit");
  },100);

  updateHUD();

  if(
    hp1<=0 ||
    hp2<=0
  ){

    endGame();

  }

}

/* =====================================================
   ULTIMATE
===================================================== */

function ultimate(id){

  if(!running) return;

  const p=getPlayer(id);
  const enemy=getEnemy(id);
  const key=getHeroKey(id);

  const currentUlt=
    id===1
    ?ult1
    :ult2;

  if(currentUlt<100){

    return;

  }

  /*
    먼저 0으로 만든다.
    궁극기 피해는 궁 게이지를 충전하지 않는다.
  */

  if(id===1){

    ult1=0;

  }else{

    ult2=0;

  }

  updateHUD();


  /*
    루시우:
    소리 방벽
  */

  if(key==="lucio"){

    const shield=35;

    if(id===1){

      hp1=Math.min(
        HEROES[selectedHero1].maxHp+shield,
        hp1+shield
      );

    }else{

      hp2=Math.min(
        HEROES[selectedHero2].maxHp+shield,
        hp2+shield
      );

    }

    createWave(
      p.x,
      p.y
    );

    updateHUD();

  }


  /*
    바스티온:
    3발 포격
  */

  else if(key==="bastion"){

    for(let i=0;i<3;i++){

      setTimeout(()=>{

        if(!running) return;

        const target=getEnemy(id);

        const offset=
          (i-1)*55;

        const targetX=
          target.x+offset;

        const targetY=
          target.y;

        createExplosion(
          targetX,
          targetY,
          70
        );

        if(
          target.blocking
        ){

          createBlockEffect(
            target.x,
            target.y
          );

        }else{

          const distance=Math.hypot(
            target.x-targetX,
            target.y-targetY
          );

          if(distance<90){

            /*
              궁극기 자체 피해는
              궁 게이지를 만들지 않음
            */

            dealDamage(
              id,
              28,
              false
            );

          }

        }

      },i*450);

    }

  }


  /*
    D.Va:
    자폭
  */

  else if(key==="dva"){

    const x=p.x;
    const y=p.y;

    const warning=
      document.createElement("div");

    warning.className="warning";

    warning.style.left=x+"px";
    warning.style.top=y+"px";

    game.appendChild(warning);

    setTimeout(()=>{

      warning.remove();

      if(!running) return;

      createExplosion(
        x,
        y,
        120
      );

      const target=getEnemy(id);

      const distance=Math.hypot(
        target.x-x,
        target.y-y
      );

      if(distance<230){

        if(target.blocking){

          createBlockEffect(
            target.x,
            target.y
          );

        }else{

          dealDamage(
            id,
            45,
            false
          );

        }

      }

    },900);

  }

}

/* =====================================================
   AUTOMATIC MOVEMENT
===================================================== */

function updateMovement(dt){

  const topLimit=145;

  const bottomLimit=
    game.clientHeight-150;


  for(
    const p of [player1,player2]
  ){

    let speed=
      p.baseSpeed*
      p.speedMultiplier;

    p.y +=
      p.direction*
      speed*
      dt;


    if(
      p.y<=topLimit
    ){

      p.y=topLimit;

      p.direction=1;

    }


    if(
      p.y>=bottomLimit
    ){

      p.y=bottomLimit;

      p.direction=-1;

    }


    /*
      부스터 종료
    */

    if(
      p.boostUntil>0 &&
      performance.now()>=p.boostUntil
    ){

      p.speedMultiplier=1;

      p.boostUntil=0;

      playerEls[p.id-1]
      .classList.remove("boost");

    }

  }

}

  }else{

  if(player2.reloading){

    ammoEls[1].innerHTML=

  }else{

    ammoEls[1].textContent=
      `탄약 ${player2.ammo} / ${h2.ammo}`;

  }


  /*
    궁극기 버튼
  */

  if(ult1>=100){

    ultButtons[0]
    .classList.add("readyUlt");

  }else{

    ultButtons[0]
    .classList.remove("readyUlt");

  }


  if(ult2>=100){

    ultButtons[1]
    .classList.add("readyUlt");

  }else{

    ultButtons[1]
    .classList.remove("readyUlt");

  }


  /*
    스킬 상태
  */

  skill1Buttons[0]
  .classList.toggle(
    "disabled",
    !player1.skill1Ready
  );

  skill2Buttons[0]
  .classList.toggle(
    "disabled",
    !player1.skill2Ready
  );

  skill1Buttons[1]
  .classList.toggle(
    "disabled",
    !player2.skill1Ready
  );

  skill2Buttons[1]
  .classList.toggle(
    "disabled",
    !player2.skill2Ready
  );

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(now){

  if(!running) return;

  const dt=
    Math.min(
      (now-lastFrame)/1000,
      .04
    );

  lastFrame=now;


  updateMovement(dt);

  updateProjectiles(dt);

  updateReload(1);
  updateReload(2);

  renderPlayers();

  renderProjectiles();

  updateHUD();


  requestAnimationFrame(
    gameLoop
  );

}

  e=>{

    const now=Date.now();

    if(now-lastTouch<=300){

      e.preventDefault();

    }

    lastTouch=now;

  },
  {passive:false}
);
