<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>OVERDUEL 2D</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

body{
  font-family:Arial,sans-serif;
  color:white;
}

.screen{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:none;
  overflow:hidden;
}

#start{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:
    radial-gradient(circle at center,#5d5140 0,#302b25 45%,#111 100%);
}

.logo{
  font-size:clamp(42px,10vw,90px);
  font-weight:900;
  letter-spacing:5px;
  text-shadow:5px 5px 0 #111;
  margin-bottom:35px;
}

.sub{
  font-size:16px;
  opacity:.7;
  margin-bottom:25px;
}

.startBtn,
.bigBtn{
  border:4px solid #111;
  background:#eee;
  color:#111;
  font-size:22px;
  font-weight:900;
  padding:16px 42px;
  border-radius:12px;
  box-shadow:0 6px 0 #111;
  touch-action:none;
}

.startBtn:active,
.bigBtn:active{
  transform:translateY(5px);
  box-shadow:0 1px 0 #111;
}

#pick{
  background:#201d19;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.title{
  font-size:clamp(25px,5vw,45px);
  font-weight:900;
  margin-bottom:20px;
}

.cards{
  display:flex;
  gap:15px;
  width:min(950px,95vw);
  justify-content:center;
}

.card{
  flex:1;
  min-width:0;
  max-width:280px;
  background:#d8c19b;
  color:#111;
  border:5px solid #111;
  border-radius:14px;
  padding:12px;
  text-align:center;
  touch-action:none;
}

.card.selected1{
  border-color:#55d9ff;
  box-shadow:0 0 0 4px #55d9ff;
}

.card.selected2{
  border-color:#ff7676;
  box-shadow:0 0 0 4px #ff7676;
}

.preview{
  width:100%;
  height:170px;
  background:#a98e68;
  border-radius:8px;
}

.card h2{
  margin:7px 0 4px;
}

.card p{
  margin:3px 0;
  font-size:13px;
}

#pickBtn{
  margin-top:22px;
}

#game{
  background:#171717;
  align-items:center;
  justify-content:center;
}

.gameWrap{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

#canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

.hud{
  position:absolute;
  top:7px;
  left:50%;
  transform:translateX(-50%);
  width:min(96vw,1100px);
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
}

.playerHud{
  width:40%;
}

.playerHud.right{
  text-align:right;
}

.name{
  font-weight:900;
  font-size:14px;
  margin-bottom:3px;
}

.hpOuter,
.ultOuter{
  width:100%;
  height:15px;
  background:#222;
  border:2px solid #111;
  border-radius:5px;
  overflow:hidden;
}

.hp{
  height:100%;
  background:#53d65a;
  width:100%;
}

.hp.red{
  background:#ff5c5c;
}

.ultOuter{
  height:8px;
  margin-top:3px;
}

.ult{
  height:100%;
  background:#f4d64f;
  width:0%;
}

.timer{
  position:absolute;
  top:7px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  border:3px solid #d8c19b;
  padding:3px 13px;
  border-radius:6px;
  font-weight:900;
  font-size:20px;
}

.ammo{
  margin-top:3px;
  font-size:12px;
  font-weight:bold;
}

.controls{
  position:absolute;
  bottom:8px;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 12px;
  pointer-events:none;
}

.controlSide{
  display:flex;
  gap:7px;
  pointer-events:auto;
}

.action{
  width:clamp(54px,10vw,78px);
  height:clamp(54px,10vw,78px);
  border:4px solid #111;
  border-radius:14px;
  color:#111;
  font-weight:900;
  font-size:12px;
  touch-action:none;
}

.basic{background:#fff;}
.skill1{background:#59d16b;}
.skill2{background:#5fa8ff;}
.ultBtn{background:#f2d34f;}

.action:active{
  transform:scale(.94);
}

#result{
  background:#211f1b;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.resultTitle{
  font-size:clamp(40px,10vw,80px);
  font-weight:900;
  margin-bottom:10px;
}

.resultText{
  font-size:22px;
  margin-bottom:30px;
}

.hint{
  margin-top:18px;
  opacity:.55;
  font-size:12px;
}

@media(max-width:700px){
  .cards{
    gap:7px;
  }

  .card{
    padding:7px;
  }

  .preview{
    height:125px;
  }

  .card p{
    font-size:10px;
  }

  .controls{
    padding:0 5px;
  }

  .controlSide{
    gap:4px;
  }
}
</style>
</head>

<body>

<!-- 시작 화면 -->
<section id="start" class="screen">
  <div class="logo">OVERDUEL</div>
  <div class="sub">2D HERO DUEL</div>
  <button id="startBtn" class="startBtn">게임 시작</button>
  <div class="hint">iPad 터치 조작 지원</div>
</section>

<!-- 영웅 선택 -->
<section id="pick" class="screen">

  <div class="title" id="pickTitle">P1 영웅 선택</div>

  <div class="cards">

    <div class="card" data-hero="lucio">
      <canvas class="preview" id="previewLucio"></canvas>
      <h2>루시우</h2>
      <p>속도와 음파를 사용하는 지원형</p>
    </div>

    <div class="card" data-hero="bastion">
      <canvas class="preview" id="previewBastion"></canvas>
      <h2>바스티온</h2>
      <p>강력한 화력과 전차 모드</p>
    </div>

    <div class="card" data-hero="dva">
      <canvas class="preview" id="previewDva"></canvas>
      <h2>D.Va</h2>
      <p>부스터와 방어 능력을 가진 영웅</p>
    </div>

  </div>

  <button id="pickBtn" class="bigBtn">선택 완료</button>

</section>

<!-- 게임 -->
<section id="game" class="screen">

  <div class="gameWrap">

    <canvas id="canvas"></canvas>

    <div class="hud">

      <div class="playerHud">
        <div class="name" id="p1Name">P1</div>

        <div class="hpOuter">
          <div class="hp" id="p1Hp"></div>
        </div>

        <div class="ultOuter">
          <div class="ult" id="p1Ult"></div>
        </div>

        <div class="ammo" id="p1Ammo"></div>
      </div>

      <div class="playerHud right">
        <div class="name" id="p2Name">P2</div>

        <div class="hpOuter">
          <div class="hp red" id="p2Hp"></div>
        </div>

        <div class="ultOuter">
          <div class="ult" id="p2Ult"></div>
        </div>

        <div class="ammo" id="p2Ammo"></div>
      </div>

    </div>

    <div class="timer" id="timer">60</div>

    <div class="controls">

      <div class="controlSide">
        <button class="action basic" id="p1Basic">평타</button>
        <button class="action skill1" id="p1Skill1">스킬1</button>
        <button class="action skill2" id="p1Skill2">스킬2</button>
        <button class="action ultBtn" id="p1UltBtn">궁극기</button>
      </div>

      <div class="controlSide">
        <button class="action basic" id="p2Basic">평타</button>
        <button class="action skill1" id="p2Skill1">스킬1</button>
        <button class="action skill2" id="p2Skill2">스킬2</button>
        <button class="action ultBtn" id="p2UltBtn">궁극기</button>
      </div>

    </div>

  </div>

</section>

<!-- 결과 -->
<section id="result" class="screen">

  <div class="resultTitle" id="resultTitle">P1 승리!</div>
  <div class="resultText" id="resultText"></div>

  <button class="bigBtn" id="restartBtn">다시 하기</button>
  <button class="bigBtn" id="menuBtn" style="margin-top:12px;">메인 메뉴</button>

</section>

<script>
"use strict";

/* =========================================================
   기본 요소
========================================================= */

const startScreen = document.getElementById("start");
const pickScreen = document.getElementById("pick");
const gameScreen = document.getElementById("game");
const resultScreen = document.getElementById("result");

const startBtn = document.getElementById("startBtn");
const pickBtn = document.getElementById("pickBtn");
const restartBtn = document.getElementById("restartBtn");
const menuBtn = document.getElementById("menuBtn");

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 1000;
let H = 600;

let selecting = 1;
let selectedP1 = null;
let selectedP2 = null;

let players = [];
let bullets = [];
let effects = [];

let running = false;
let gameStartTime = 0;
let gameDuration = 60000;

let lastFrame = performance.now();

/* =========================================================
   iPad 입력 안정화
   pointerdown은 터치/마우스/펜을 하나의 방식으로 처리한다.
========================================================= */

document.addEventListener(
  "contextmenu",
  e => e.preventDefault()
);

function bindTap(element, callback){

  if(!element) return;

  element.style.touchAction = "none";

  let lastTap = 0;

  element.addEventListener(
    "pointerdown",
    function(e){

      if(e.pointerType === "mouse" && e.button !== 0){
        return;
      }

      e.preventDefault();
      e.stopPropagation();

      const now = performance.now();

      if(now - lastTap < 250){
        return;
      }

      lastTap = now;

      callback(e);
    },
    {
      passive:false
    }
  );
}

/* =========================================================
   화면 전환
========================================================= */

function showScreen(screen){

  startScreen.style.display = "none";
  pickScreen.style.display = "none";
  gameScreen.style.display = "none";
  resultScreen.style.display = "none";

  screen.style.display = "flex";
}

/* =========================================================
   시작 버튼
========================================================= */

bindTap(startBtn, () => {

  selectedP1 = null;
  selectedP2 = null;
  selecting = 1;

  document.querySelectorAll(".card").forEach(card=>{
    card.classList.remove("selected1","selected2");
  });

  document.getElementById("pickTitle").textContent =
    "P1 영웅 선택";

  showScreen(pickScreen);

  requestAnimationFrame(drawPreviews);
});

/* =========================================================
   영웅 데이터
========================================================= */

const HERO = {

  lucio:{
    name:"루시우",
    maxHp:100,
    speed:1.25,
    ammo:12,
    reload:1100
  },

  bastion:{
    name:"바스티온",
    maxHp:125,
    speed:.78,
    ammo:20,
    reload:1300
  },

  dva:{
    name:"D.Va",
    maxHp:115,
    speed:1.05,
    ammo:18,
    reload:1200
  }

};

/* =========================================================
   영웅 선택
========================================================= */

document.querySelectorAll(".card").forEach(card => {

  bindTap(card, () => {

    const hero = card.dataset.hero;

    if(selecting === 1){

      selectedP1 = hero;

      document.querySelectorAll(".card").forEach(c=>{
        c.classList.remove("selected1");
      });

      card.classList.add("selected1");

    }else{

      selectedP2 = hero;

      document.querySelectorAll(".card").forEach(c=>{
        c.classList.remove("selected2");
      });

      card.classList.add("selected2");
    }
  });

});

/* =========================================================
   선택 완료
========================================================= */

bindTap(pickBtn, () => {

  if(selecting === 1){

    if(!selectedP1){
      document.getElementById("pickTitle").textContent =
        "먼저 P1 영웅을 선택하세요";
      return;
    }

    selecting = 2;

    document.getElementById("pickTitle").textContent =
      "P2 영웅 선택";

    return;
  }

  if(!selectedP2){
    document.getElementById("pickTitle").textContent =
      "먼저 P2 영웅을 선택하세요";
    return;
  }

  startGame();
});

/* =========================================================
   플레이어 생성
========================================================= */

function createPlayer(id, hero, side){

  const data = HERO[hero];

  return {

    id,
    hero,
    side,

    x: side === 1 ? W*.25 : W*.75,
    baseX: side === 1 ? W*.25 : W*.75,

    y: side === 1 ? H*.30 : H*.70,

    dir: side === 1 ? 1 : -1,

    hp:data.maxHp,
    maxHp:data.maxHp,

    shield:0,

    speed:data.speed,

    ammo:data.ammo,
    maxAmmo:data.ammo,

    reloading:false,
    reloadTimer:0,

    lastAttack:0,

    skill1Ready:0,
    skill2Ready:0,

    ult:0,

    boosted:0,

    healing:false,
    healTimer:0,
    healStartHp:0,

    tankMode:false,

    blocking:false,
    blockTimer:0,

    dashTimer:0,

    invincible:0
  };
}

/* =========================================================
   게임 시작
========================================================= */

function startGame(){

  resizeCanvas();

  players = [
    createPlayer(1,selectedP1,1),
    createPlayer(2,selectedP2,2)
  ];

  bullets = [];
  effects = [];

  gameStartTime = performance.now();
  lastFrame = performance.now();

  running = true;

  document.getElementById("p1Name").textContent =
    "P1 " + HERO[selectedP1].name;

  document.getElementById("p2Name").textContent =
    "P2 " + HERO[selectedP2].name;

  showScreen(gameScreen);

  requestAnimationFrame(gameLoop);
}

/* =========================================================
   Canvas 크기
========================================================= */

function resizeCanvas(){

  const dpr = Math.min(window.devicePixelRatio || 1,2);

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = Math.floor(W*dpr);
  canvas.height = Math.floor(H*dpr);

  canvas.style.width = W+"px";
  canvas.style.height = H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resizeCanvas);

/* =========================================================
   게임 루프
========================================================= */

function gameLoop(now){

  if(!running) return;

  const dt = Math.min((now-lastFrame)/1000,.05);

  lastFrame = now;

  update(dt);
  draw();

  requestAnimationFrame(gameLoop);
}

/* =========================================================
   업데이트
========================================================= */

function update(dt){

  const elapsed = performance.now()-gameStartTime;
  const remain = Math.max(0,gameDuration-elapsed);

  document.getElementById("timer").textContent =
    Math.ceil(remain/1000);

  updatePlayers(dt);
  updateBullets(dt);
  updateEffects(dt);
  updateHUD();

  if(players[0].hp <= 0 || players[1].hp <= 0){

    finishGame();

    return;
  }

  if(remain <= 0){

    finishByTime();

    return;
  }
}

/* =========================================================
   자동 상하 이동
========================================================= */

function updatePlayers(dt){

  players.forEach((p,index)=>{

    const t = performance.now()/1000;

    const direction = index === 0 ? 1 : -1;

    const center =
      index === 0 ? H*.30 : H*.70;

    const amplitude =
      Math.min(H*.16,100);

    let move =
      Math.sin(t*1.25 + index*2.5) *
      amplitude;

    p.y = center + move;

    const minY = 100;
    const maxY = H-115;

    p.y = Math.max(minY,Math.min(maxY,p.y));

    if(p.boosted > 0){
      p.boosted -= dt;
    }

    if(p.invincible > 0){
      p.invincible -= dt;
    }

    if(p.dashTimer > 0){
      p.dashTimer -= dt;
    }

    if(p.blocking){

      p.blockTimer -= dt;

      if(p.blockTimer <= 0){
        p.blocking = false;
      }
    }

    /* 바스티온 회복 */
    if(p.healing){

      p.healTimer -= dt;

      const progress =
        Math.max(0,Math.min(1,
        1-p.healTimer/1));

      p.hp =
        Math.min(
          p.maxHp,
          p.healStartHp + 25*progress
        );

      if(p.healTimer <= 0){
        p.healing = false;
      }
    }

    /* 재장전 */
    if(p.reloading){

      p.reloadTimer -= dt;

      if(p.reloadTimer <= 0){

        p.reloading = false;
        p.ammo = p.maxAmmo;
      }
    }
  });
}

/* =========================================================
   총알
========================================================= */

function updateBullets(dt){

  for(let i=bullets.length-1;i>=0;i--){

    const b = bullets[i];

    b.x += b.vx*dt;
    b.y += b.vy*dt;
    b.life -= dt;

    const target =
      players[b.owner === 1 ? 1 : 0];

    if(
      target &&
      Math.hypot(b.x-target.x,b.y-target.y)
      < target.radius + b.radius
    ){

      damage(
        target,
        b.damage,
        b.owner,
        true
      );

      effects.push({
        type:"hit",
        x:b.x,
        y:b.y,
        life:.22
      });

      bullets.splice(i,1);
      continue;
    }

    if(
      b.life <= 0 ||
      b.x < -50 ||
      b.x > W+50 ||
      b.y < -50 ||
      b.y > H+50
    ){
      bullets.splice(i,1);
    }
  }
}

/* =========================================================
   효과
========================================================= */

function updateEffects(dt){

  for(let i=effects.length-1;i>=0;i--){

    effects[i].life -= dt;

    if(effects[i].life <= 0){
      effects.splice(i,1);
    }
  }
}

/* =========================================================
   평타
   모든 영웅 기본 쿨타임 0.5초
========================================================= */

function normalAttack(p){

  if(!running || p.reloading) return;

  const now = performance.now();

  let cooldown = 500;

  let damageValue = 10;

  if(
    p.hero === "bastion" &&
    p.tankMode
  ){
    cooldown = 170;
    damageValue = 4;
  }

  if(now-p.lastAttack < cooldown) return;

  if(p.ammo <= 0){

    reload(p);
    return;
  }

  p.lastAttack = now;
  p.ammo--;

  if(p.hero === "lucio"){

    fireProjectile(
      p,
      12,
      0,
      damageValue
    );

    fireProjectile(
      p,
      12,
      -10,
      damageValue
    );

  }else if(p.hero === "dva"){

    fireProjectile(p,15,-13,7);
    fireProjectile(p,15,0,7);
    fireProjectile(p,15,13,7);

  }else{

    fireProjectile(
      p,
      16,
      0,
      damageValue
    );
  }
}

/* =========================================================
   투사체
========================================================= */

function fireProjectile(
  p,
  speed,
  yOffset,
  damageValue
){

  bullets.push({

    x:p.x + p.dir*28,

    y:p.y + yOffset,

    vx:p.dir*speed,

    vy:0,

    owner:p.id,

    damage:damageValue,

    radius:7,

    life:2,

    color:
      p.hero==="lucio" ? "#63eaff" :
      p.hero==="bastion" ? "#d7d7d7" :
      "#ff8a9a"
  });
}

/* =========================================================
   재장전
========================================================= */

function reload(p){

  if(p.reloading) return;

  p.reloading = true;

  p.reloadTimer =
    HERO[p.hero].reload;

  /* 바스티온 전차 모드 종료 */
  if(p.hero === "bastion"){
    p.tankMode = false;
  }
}

/* =========================================================
   스킬1
========================================================= */

function skill1(p){

  const now = performance.now();

  if(now < p.skill1Ready) return;
  if(p.reloading) return;

  p.skill1Ready =
    now +
    (p.hero === "bastion" ? 7000 :
     p.hero === "dva" ? 6000 :
     8000);

  /* 루시우 - 속도 증가 */
  if(p.hero === "lucio"){

    p.boosted = 3;

    effects.push({
      type:"boost",
      owner:p.id,
      life:3
    });
  }

  /* 바스티온 - 1초 회복 */
  else if(p.hero === "bastion"){

    p.healing = true;
    p.healTimer = 1;
    p.healStartHp = p.hp;

  }

  /* D.Va - 부스터 */
  else if(p.hero === "dva"){

    p.x += p.dir*130;

    p.x =
      Math.max(
        W*.12,
        Math.min(W*.88,p.x)
      );

    p.boosted = .8;
    p.dashTimer = .8;

    effects.push({
      type:"dash",
      x:p.x,
      y:p.y,
      life:.5
    });
  }
}

/* =========================================================
   스킬2
========================================================= */

function skill2(p){

  const now = performance.now();

  if(now < p.skill2Ready) return;
  if(p.reloading) return;

  p.skill2Ready =
    now +
    (p.hero === "bastion" ? 9000 :
     p.hero === "dva" ? 7000 :
     7000);

  /* 루시우 - 음파 */
  if(p.hero === "lucio"){

    fireProjectile(
      p,
      9,
      0,
      17
    );

    effects.push({
      type:"wave",
      x:p.x+p.dir*30,
      y:p.y,
      life:.4,
      dir:p.dir
    });
  }

  /* 바스티온 - 전차 모드 ON/OFF */
  else if(p.hero === "bastion"){

    p.tankMode = !p.tankMode;

    effects.push({
      type:"tank",
      x:p.x,
      y:p.y,
      life:.6
    });
  }

  /* D.Va - 방어 */
  else if(p.hero === "dva"){

    p.blocking = true;
    p.blockTimer = 1.3;

    effects.push({
      type:"block",
      owner:p.id,
      life:1.3
    });
  }
}

/* =========================================================
   궁극기
========================================================= */

function ultimate(p){

  if(p.ult < 100) return;

  p.ult = 0;

  if(p.hero === "lucio"){

    /* 별도 보호막 */
    p.shield += 40;

    effects.push({
      type:"barrier",
      owner:p.id,
      life:3
    });

  }else if(p.hero === "bastion"){

    for(let i=0;i<3;i++){

      effects.push({
        type:"artillery",
        owner:p.id,
        x:
          players[p.id===1?1:0].x +
          (Math.random()-.5)*160,
        y:
          players[p.id===1?1:0].y +
          (Math.random()-.5)*160,
        delay:.5+i*.55,
        life:2.5
      });
    }

  }else if(p.hero === "dva"){

    const target =
      players[p.id===1?1:0];

    effects.push({
      type:"bomb",
      owner:p.id,
      x:target.x,
      y:target.y,
      delay:1.5,
      life:1.7
    });
  }
}

/* =========================================================
   피해 처리
========================================================= */

function damage(target,amount,attackerId,chargeUlt){

  if(!target) return;

  if(target.invincible > 0){
    return;
  }

  /* D.Va 방어 */
  if(target.blocking){

    effects.push({
      type:"blocked",
      x:target.x,
      y:target.y,
      life:.25
    });

    return;
  }

  /* 보호막 */
  if(target.shield > 0){

    const absorbed =
      Math.min(target.shield,amount);

    target.shield -= absorbed;
    amount -= absorbed;
  }

  if(amount <= 0) return;

  target.hp -= amount;

  if(target.hp < 0){
    target.hp = 0;
  }

  /* 궁극기 충전 */
  if(chargeUlt){

    const attacker =
      players.find(p=>p.id===attackerId);

    if(attacker){

      attacker.ult =
        Math.min(
          100,
          attacker.ult + amount*.65
        );
    }
  }
}

/* =========================================================
   효과 처리
========================================================= */

function processSpecialEffects(){

  for(let i=effects.length-1;i>=0;i--){

    const e = effects[i];

    if(e.type === "artillery"){

      if(e.delay > 0){

        e.delay -= .016;
        continue;
      }

      if(!e.done){

        e.done = true;

        const target =
          players.find(
            p=>p.id !== e.owner
          );

        if(target &&
          Math.hypot(
            target.x-e.x,
            target.y-e.y
          ) < 100
        ){

          damage(
            target,
            20,
            e.owner,
            false
          );
        }

        e.life = .3;
      }
    }

    if(e.type === "bomb"){

      if(e.delay > 0){

        e.delay -= .016;
        continue;
      }

      if(!e.done){

        e.done = true;

        const target =
          players.find(
            p=>p.id !== e.owner
          );

        if(target &&
          Math.hypot(
            target.x-e.x,
            target.y-e.y
          ) < 170
        ){

          damage(
            target,
            42,
            e.owner,
            false
          );
        }

        e.life = .5;
      }
    }
  }
}

/* 기존 update에 특수 효과 처리 추가 */
const originalUpdateEffects = updateEffects;

updateEffects = function(dt){

  originalUpdateEffects(dt);

  processSpecialEffects();
};

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  players.forEach(p=>{

    const hpPercent =
      Math.max(
        0,
        Math.min(
          100,
          p.hp/p.maxHp*100
        )
      );

    const shieldPercent =
      Math.max(
        0,
        Math.min(
          40,
          p.shield
        )
      );

    const hpElement =
      document.getElementById(
        p.id===1 ? "p1Hp" : "p2Hp"
      );

    hpElement.style.width =
      hpPercent+"%";

    const ultElement =
      document.getElementById(
        p.id===1 ? "p1Ult" : "p2Ult"
      );

    ultElement.style.width =
      p.ult+"%";

    const ammoElement =
      document.getElementById(
        p.id===1 ? "p1Ammo" : "p2Ammo"
      );

    ammoElement.textContent =
      p.reloading
      ? "재장전..."
      : "탄약 "+p.ammo+"/"+p.maxAmmo+
        (p.shield>0 ? "  보호막 "+p.shield : "");
  });
}

/* =========================================================
   그리기
========================================================= */

function draw(){

  ctx.clearRect(0,0,W,H);

  drawArena();
  drawBullets();
  drawPlayers();
  drawEffects();
}

/* =========================================================
   경기장
========================================================= */

function drawArena(){

  ctx.fillStyle="#b99a68";
  ctx.fillRect(0,0,W,H);

  /* 벽 */
  ctx.fillStyle="#282522";

  ctx.fillRect(0,0,W,60);
  ctx.fillRect(0,H-80,W,80);

  /* 중앙 강 */
  ctx.fillStyle="#6b9ca5";
  ctx.fillRect(0,H*.49,W,H*.045);

  /* 강 하이라이트 */
  ctx.strokeStyle="#8fc0c5";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(0,H*.51);
  ctx.lineTo(W,H*.51);
  ctx.stroke();

  /* 바닥 타일 */
  ctx.strokeStyle="rgba(60,45,30,.25)";
  ctx.lineWidth=2;

  for(let x=0;x<W;x+=45){

    ctx.beginPath();
    ctx.moveTo(x,80);
    ctx.lineTo(x,H-90);
    ctx.stroke();
  }

  for(let y=85;y<H-80;y+=45){

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }

  /* 중앙선 */
  ctx.strokeStyle="rgba(255,255,255,.25)";
  ctx.setLineDash([8,8]);

  ctx.beginPath();
  ctx.moveTo(0,H*.512);
  ctx.lineTo(W,H*.512);
  ctx.stroke();

  ctx.setLineDash([]);
}

/* =========================================================
   플레이어
========================================================= */

function drawPlayers(){

  players.forEach(p=>{

    if(p.hero==="lucio"){
      drawLucio(p);
    }

    if(p.hero==="bastion"){
      drawBastion(p);
    }

    if(p.hero==="dva"){
      drawDva(p);
    }

    /* 보호막 */
    if(p.shield > 0){

      ctx.strokeStyle="rgba(90,220,255,.9)";
      ctx.lineWidth=4;

      ctx.beginPath();
      ctx.arc(
        p.x,
        p.y,
        34,
        0,
        Math.PI*2
      );
      ctx.stroke();
    }

    /* 방어 */
    if(p.blocking){

      ctx.strokeStyle="#65aaff";
      ctx.lineWidth=5;

      ctx.beginPath();
      ctx.arc(
        p.x+p.dir*18,
        p.y,
        30,
        -Math.PI*.65,
        Math.PI*.65
      );
      ctx.stroke();
    }
  });
}

/* =========================================================
   루시우
========================================================= */

function drawLucio(p){

  ctx.save();

  ctx.translate(p.x,p.y);

  ctx.scale(p.dir,1);

  /* 그림자 */
  ctx.fillStyle="rgba(0,0,0,.3)";
  ctx.beginPath();
  ctx.ellipse(0,22,24,7,0,0,Math.PI*2);
  ctx.fill();

  /* 다리 */
  ctx.fillStyle="#252525";
  ctx.fillRect(-13,8,9,17);
  ctx.fillRect(5,8,9,17);

  /* 몸 */
  ctx.fillStyle="#2fcf73";
  ctx.fillRect(-18,-10,36,23);

  /* 머리 */
  ctx.fillStyle="#70482f";
  ctx.beginPath();
  ctx.arc(0,-23,17,0,Math.PI*2);
  ctx.fill();

  /* 머리카락 */
  ctx.fillStyle="#39d878";

  for(let i=0;i<5;i++){
    ctx.fillRect(-17+i*8,-43-(i%2)*4,7,12);
  }

  /* 고글 */
  ctx.fillStyle="#111";
  ctx.fillRect(-14,-29,28,8);

  /* 눈 */
  ctx.fillStyle="#8ff";
  ctx.fillRect(-9,-28,6,4);
  ctx.fillRect(4,-28,6,4);

  ctx.restore();
}

/* =========================================================
   바스티온
========================================================= */

function drawBastion(p){

  ctx.save();

  ctx.translate(p.x,p.y);

  ctx.scale(p.dir,1);

  /* 그림자 */
  ctx.fillStyle="rgba(0,0,0,.3)";
  ctx.beginPath();
  ctx.ellipse(0,24,28,8,0,0,Math.PI*2);
  ctx.fill();

  /* 몸 */
  ctx.fillStyle=
    p.tankMode ? "#6c6f65" : "#77796f";

  ctx.fillRect(-23,-20,46,45);

  /* 머리 */
  ctx.fillStyle="#96998c";
  ctx.fillRect(-17,-40,34,24);

  /* 눈 */
  ctx.fillStyle="#ff6c50";
  ctx.fillRect(5,-32,9,6);

  /* 포신 */
  ctx.fillStyle="#333";
  ctx.fillRect(15,-5,32,9);

  /* 다리 */
  ctx.fillStyle="#4d5049";
  ctx.fillRect(-19,21,12,15);
  ctx.fillRect(7,21,12,15);

  if(p.tankMode){

    ctx.strokeStyle="#e3cf58";
    ctx.lineWidth=3;

    ctx.strokeRect(-28,-45,56,78);
  }

  ctx.restore();
}

/* =========================================================
   D.Va
========================================================= */

function drawDva(p){

  ctx.save();

  ctx.translate(p.x,p.y);

  ctx.scale(p.dir,1);

  /* 그림자 */
  ctx.fillStyle="rgba(0,0,0,.3)";
  ctx.beginPath();
  ctx.ellipse(0,25,28,8,0,0,Math.PI*2);
  ctx.fill();

  /* 메카 */
  ctx.fillStyle="#d98ca8";
  ctx.fillRect(-24,-15,48,43);

  /* 어두운 부분 */
  ctx.fillStyle="#4b4b52";
  ctx.fillRect(-18,-4,36,25);

  /* 머리 */
  ctx.fillStyle="#f0b39c";
  ctx.beginPath();
  ctx.arc(0,-30,14,0,Math.PI*2);
  ctx.fill();

  /* 머리카락 */
  ctx.fillStyle="#5b3151";
  ctx.fillRect(-16,-43,32,8);

  /* 눈 */
  ctx.fillStyle="#111";
  ctx.fillRect(4,-31,4,4);

  /* 기체 장식 */
  ctx.fillStyle="#f2a8bf";
  ctx.fillRect(-29,-5,7,19);
  ctx.fillRect(22,-5,7,19);

  /* 총 */
  ctx.fillStyle="#292929";
  ctx.fillRect(19,4,26,8);

  ctx.restore();
}

/* =========================================================
   총알 그리기
========================================================= */

function drawBullets(){

  bullets.forEach(b=>{

    ctx.fillStyle=b.color;

    ctx.beginPath();
    ctx.arc(
      b.x,
      b.y,
      b.radius,
      0,
      Math.PI*2
    );
    ctx.fill();

    ctx.globalAlpha=.25;

    ctx.beginPath();
    ctx.arc(
      b.x-b.vx*.04,
      b.y-b.vy*.04,
      b.radius*1.8,
      0,
      Math.PI*2
    );
    ctx.fill();

    ctx.globalAlpha=1;
  });
}

/* =========================================================
   효과 그리기
========================================================= */

function drawEffects(){

  effects.forEach(e=>{

    const alpha =
      Math.max(0,Math.min(1,e.life));

    if(e.type==="hit"){

      ctx.globalAlpha=alpha;

      ctx.strokeStyle="#fff";
      ctx.lineWidth=3;

      ctx.beginPath();
      ctx.arc(
        e.x,
        e.y,
        15+(1-alpha)*20,
        0,
        Math.PI*2
      );
      ctx.stroke();

      ctx.globalAlpha=1;
    }

    if(e.type==="wave"){

      ctx.globalAlpha=alpha;

      ctx.strokeStyle="#72efff";
      ctx.lineWidth=5;

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        12+(1-alpha)*70,
        -Math.PI*.5,
        Math.PI*.5
      );

      ctx.stroke();

      ctx.globalAlpha=1;
    }

    if(e.type==="boost"){

      const p =
        players.find(p=>p.id===e.owner);

      if(p){

        ctx.globalAlpha=.4;

        ctx.strokeStyle="#5eeeff";
        ctx.lineWidth=5;

        ctx.beginPath();
        ctx.arc(
          p.x,
          p.y,
          38,
          0,
          Math.PI*2
        );
        ctx.stroke();

        ctx.globalAlpha=1;
      }
    }

    if(e.type==="dash"){

      ctx.globalAlpha=alpha;

      ctx.fillStyle="#ff8bb0";

      ctx.beginPath();
      ctx.arc(
        e.x,
        e.y,
        25+(1-alpha)*20,
        0,
        Math.PI*2
      );
      ctx.fill();

      ctx.globalAlpha=1;
    }

    if(e.type==="tank"){

      ctx.globalAlpha=alpha;

      ctx.strokeStyle="#e4d35d";
      ctx.lineWidth=5;

      ctx.beginPath();
      ctx.arc(
        e.x,
        e.y,
        40+(1-alpha)*20,
        0,
        Math.PI*2
      );
      ctx.stroke();

      ctx.globalAlpha=1;
    }

    if(e.type==="block"){

      const p =
        players.find(p=>p.id===e.owner);

      if(p){

        ctx.globalAlpha=.6;

        ctx.strokeStyle="#66aaff";
        ctx.lineWidth=6;

        ctx.beginPath();
        ctx.arc(
          p.x+p.dir*18,
          p.y,
          38,
          -Math.PI*.65,
          Math.PI*.65
        );
        ctx.stroke();

        ctx.globalAlpha=1;
      }
    }

    if(e.type==="barrier"){

      const p =
        players.find(p=>p.id===e.owner);

      if(p){

        ctx.globalAlpha=.35;

        ctx.fillStyle="#5eeeff";

        ctx.beginPath();
        ctx.arc(
          p.x,
          p.y,
          46,
          0,
          Math.PI*2
        );
        ctx.fill();

        ctx.globalAlpha=1;
      }
    }

    if(e.type==="blocked"){

      ctx.globalAlpha=alpha;

      ctx.fillStyle="#8ecbff";
      ctx.font="bold 15px Arial";
      ctx.textAlign="center";

      ctx.fillText(
        "BLOCK",
        e.x,
        e.y-40
      );

      ctx.globalAlpha=1;
    }

    if(e.type==="artillery"){

      ctx.globalAlpha=.6;

      ctx.strokeStyle="#e9cf57";
      ctx.lineWidth=4;

      ctx.beginPath();
      ctx.arc(
        e.x,
        e.y,
        35,
        0,
        Math.PI*2
      );
      ctx.stroke();

      ctx.globalAlpha=1;
    }

    if(e.type==="bomb"){

      ctx.globalAlpha=.7;

      ctx.strokeStyle="#ff8a65";
      ctx.lineWidth=5;

      ctx.beginPath();
      ctx.arc(
        e.x,
        e.y,
        50+(1-alpha)*100,
        0,
        Math.PI*2
      );
      ctx.stroke();

      ctx.globalAlpha=1;
    }
  });
}

/* =========================================================
   시간 종료
========================================================= */

function finishByTime(){

  if(!running) return;

  running = false;

  const p1 = players[0];
  const p2 = players[1];

  let title = "무승부!";
  let text = "두 영웅의 체력이 같습니다.";

  if(p1.hp > p2.hp){

    title = "P1 승리!";
    text = HERO[p1.hero].name+"의 체력이 더 높습니다.";

  }else if(p2.hp > p1.hp){

    title = "P2 승리!";
    text = HERO[p2.hero].name+"의 체력이 더 높습니다.";
  }

  showResult(title,text);
}

/* =========================================================
   사망 종료
========================================================= */

function finishGame(){

  if(!running) return;

  running = false;

  const p1 = players[0];
  const p2 = players[1];

  let title;
  let text;

  if(p1.hp <= 0 && p2.hp <= 0){

    title = "무승부!";
    text = "동시에 체력이 모두 소진되었습니다.";

  }else if(p1.hp <= 0){

    title = "P2 승리!";
    text = HERO[p2.hero].name+" 승리";

  }else{

    title = "P1 승리!";
    text = HERO[p1.hero].name+" 승리";
  }

  showResult(title,text);
}

/* =========================================================
   결과 화면
========================================================= */

function showResult(title,text){

  document.getElementById("resultTitle").textContent =
    title;

  document.getElementById("resultText").textContent =
    text;

  showScreen(resultScreen);
}

function drawPreview(c,hero){

  const cctx = c.getContext("2d");

  const w = c.clientWidth;
  const h = c.clientHeight;

  c.width = w*2;
  c.height = h*2;

  cctx.setTransform(2,0,0,2,0,0);

  cctx.fillStyle="#a98e68";
  cctx.fillRect(0,0,w,h);

  cctx.strokeStyle="rgba(60,45,30,.2)";

  for(let x=0;x<w;x+=35){

    cctx.beginPath();
    cctx.moveTo(x,0);
    cctx.lineTo(x,h);
    cctx.stroke();
  }

  for(let y=0;y<h;y+=35){

    cctx.beginPath();
    cctx.moveTo(0,y);
    cctx.lineTo(w,y);
    cctx.stroke();
  }

  const fake = {
    x:w/2,
    y:h/2+10,
    dir:1,
    hero,
    tankMode:false
  };

  if(hero==="lucio"){
    drawLucioPreview(cctx,fake);
  }

  if(hero==="bastion"){
    drawBastionPreview(cctx,fake);
  }

  if(hero==="dva"){
    drawDvaPreview(cctx,fake);
  }
}

}
